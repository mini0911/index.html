<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校安介紹 A5 橫式小卡網頁版生成器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Zen Maru Gothic -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        maru: ['Zen Maru Gothic', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            800: '#1e3e62',
                            900: '#142a43',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        /* A5 橫式卡片比例容器 (210mm x 148mm 比例) */
        .a5-card {
            width: 840px;
            height: 592px;
            box-sizing: border-box;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* 列印專用 A5 橫式設定 */
        @media print {
            @page {
                size: A5 landscape;
                margin: 0;
            }
            body {
                background: white;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .no-print {
                display: none !important;
            }
            .a5-card {
                box-shadow: none !important;
                border: none !important;
                width: 210mm !important;
                height: 148mm !important;
                page-break-inside: avoid;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center justify-start">

    <!-- 頂部頁籤與說明 (非列印區域) -->
    <header class="w-full max-w-[1150px] mb-6 no-print flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-sky-500 text-white flex items-center justify-center text-2xl shadow-md">
                <i class="fa-solid fa-id-card"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-slate-800 font-maru">校安介紹 A5 橫式小卡生成器</h1>
                <p class="text-xs text-slate-500">自由編輯姓名、科別、照片與各區塊字體大小，並可直接輸出 A5 橫式列印</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="resetDefaults()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> 重置預設值
            </button>
            <button onclick="window.print()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg hover:shadow-sky-200 transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-print"></i> 列印 / 輸出 A5 卡片
            </button>
        </div>
    </header>

    <!-- 主內容區：左側編輯表單 + 右側卡片即時預覽 -->
    <main class="w-full max-w-[1150px] grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- ================= 編輯控制面板 (5 欄寬) ================= -->
        <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-md border border-slate-200 no-print space-y-5">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center gap-2 font-maru">
                <i class="fa-solid fa-sliders text-sky-500"></i> 卡片內容與字體調節
            </h2>

            <!-- 1. 校安姓名與職稱 -->
            <div class="space-y-3">
                <label class="block text-sm font-bold text-slate-700">1. 校安姓名與職稱</label>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <span class="text-xs text-slate-500 mb-1 block">姓名</span>
                        <input type="text" id="inputName" value="" placeholder="請輸入姓名" oninput="updateCard()" 
                               class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition">
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 mb-1 block">職稱</span>
                        <input type="text" id="inputTitle" value="校安" oninput="updateCard()" 
                               class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition">
                    </div>
                </div>
            </div>

            <!-- 2. 輔導科別（含自由開關） -->
            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-bold text-slate-700">2. 輔導科別</label>
                    <label class="inline-flex items-center cursor-pointer gap-2">
                        <span class="text-xs text-slate-500 font-bold" id="deptToggleText">顯示科別</span>
                        <input type="checkbox" id="toggleDept" checked onchange="toggleDeptVisibility()" class="sr-only peer">
                        <div class="relative w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-sky-500"></div>
                    </label>
                </div>
                <div id="deptInputGroup">
                    <p class="text-xs text-slate-400 mb-1.5">可輸入多個科別，請用逗號、頓號或空格分隔（例如：電子科, 門市科）</p>
                    <input type="text" id="inputDept" value="" placeholder="例如：電子科, 門市科" oninput="updateCard()" 
                           class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition">
                </div>
            </div>

            <!-- 3. 左側照片上傳 -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">3. 左側個人照片上傳</label>
                <p class="text-xs text-slate-400 mb-2">建議使用全身或半身去背 PNG 或清晰直式 JPG</p>
                
                <div class="flex items-center gap-3">
                    <label class="flex-1 cursor-pointer bg-sky-50 border-2 border-dashed border-sky-300 hover:bg-sky-100/70 text-sky-700 rounded-xl p-3 text-center transition flex items-center justify-center gap-2 text-sm font-bold">
                        <i class="fa-solid fa-cloud-arrow-up text-lg"></i> 選擇圖片
                        <input type="file" id="imageUploader" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                    </label>
                    <button onclick="removeImage()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-3 rounded-xl text-sm font-bold transition" title="移除圖片">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- 4. 自訂字體大小控制區 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200/80 space-y-3.5">
                <label class="block text-sm font-black text-slate-700 font-maru flex items-center gap-1.5">
                    <i class="fa-solid fa-text-height text-sky-500"></i> 自訂字體大小 (px)
                </label>
                
                <!-- 姓名大小 -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs font-bold text-slate-600">
                        <span>姓名大小</span>
                        <span id="nameSizeVal" class="text-sky-600 font-mono">56px</span>
                    </div>
                    <input type="range" id="sizeName" min="28" max="80" value="56" oninput="updateCard()" 
                           class="w-full accent-sky-500 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
                </div>

                <!-- 職稱大小 -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs font-bold text-slate-600">
                        <span>職稱大小</span>
                        <span id="titleSizeVal" class="text-sky-600 font-mono">36px</span>
                    </div>
                    <input type="range" id="sizeTitle" min="18" max="50" value="36" oninput="updateCard()" 
                           class="w-full accent-sky-500 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
                </div>

                <!-- 輔導科別標題大小 -->
                <div id="sizeDeptLabelWrapper" class="space-y-1 transition-opacity duration-200">
                    <div class="flex justify-between text-xs font-bold text-slate-600">
                        <span>「輔導科別」標題大小</span>
                        <span id="deptLabelSizeVal" class="text-sky-600 font-mono">26px</span>
                    </div>
                    <input type="range" id="sizeDeptLabel" min="16" max="40" value="26" oninput="updateCard()" 
                           class="w-full accent-sky-500 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
                </div>

                <!-- 科別項目文字大小 -->
                <div id="sizeDeptItemWrapper" class="space-y-1 transition-opacity duration-200">
                    <div class="flex justify-between text-xs font-bold text-slate-600">
                        <span>科別名稱大小</span>
                        <span id="deptItemSizeVal" class="text-sky-600 font-mono">34px</span>
                    </div>
                    <input type="range" id="sizeDeptItem" min="18" max="54" value="34" oninput="updateCard()" 
                           class="w-full accent-sky-500 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
                </div>
            </div>
        </section>

        <!-- ================= 右側卡片預覽區 (7 欄寬) ================= -->
        <section class="lg:col-span-7 flex flex-col items-center w-full">
            <div class="no-print w-full flex justify-between items-center mb-3 px-1">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    A5 橫式即時卡片預覽 (210 x 148 mm)
                </span>
                <span class="text-xs text-slate-400">左右佈局獨立互不壓迫</span>
            </div>

            <!-- A5 橫式介紹小卡主體 -->
            <div id="a5Card" class="a5-card bg-white rounded-3xl shadow-2xl overflow-hidden p-6 relative flex gap-6 border border-slate-200 shrink-0">
                
                <!-- ================= 左半邊區塊 (固定寬度 320px、不收縮、溢出隱藏) ================= -->
                <div class="w-[320px] shrink-0 h-full bg-gradient-to-b from-sky-50/90 to-sky-100/60 rounded-2xl relative flex items-center justify-center border-l-8 border-amber-400 overflow-hidden shadow-inner p-3">
                    <img id="cardImage" src="" alt="校安照片" class="max-h-[500px] max-w-[290px] w-auto h-auto object-contain drop-shadow-md z-10 hidden">
                    <div id="cardImagePlaceholder" class="text-sky-300 flex flex-col items-center justify-center gap-3">
                        <div class="w-20 h-20 rounded-full bg-sky-100 flex items-center justify-center text-sky-400 text-4xl shadow-inner">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <span class="text-sm font-bold text-sky-500 font-maru">尚未上傳照片</span>
                    </div>
                </div>

                <!-- ================= 右半邊區塊 (彈性滿版 flex-1、獨立 min-w-0) ================= -->
                <div class="flex-1 min-w-0 h-full flex flex-col justify-between py-5 px-6 bg-slate-50/70 rounded-2xl border border-slate-100 overflow-hidden">
                    
                    <div class="space-y-6 w-full">
                        <!-- 1. 頂部標章 -->
                        <div>
                            <div class="inline-flex items-center gap-2 bg-sky-100 text-sky-800 px-4 py-1.5 rounded-full font-maru font-bold text-sm tracking-wide">
                                <i class="fa-solid fa-shield-halved text-sky-600"></i>
                                <span>校園安全守護者</span>
                            </div>
                        </div>

                        <!-- 2. 姓名與職稱（自動換行且不外溢） -->
                        <div class="flex items-baseline flex-wrap gap-x-4 gap-y-2 border-b-2 border-sky-100 pb-4 w-full">
                            <h2 id="cardName" class="font-black text-slate-900 tracking-tight font-maru leading-tight break-words"></h2>
                            <span id="cardTitle" class="font-black text-sky-600 font-maru tracking-wide shrink-0">校安</span>
                        </div>

                        <!-- 3. 輔導科別區塊（可切換顯示/隱藏） -->
                        <div id="cardDeptSection" class="space-y-3.5 w-full">
                            <p id="cardDeptLabel" class="font-black text-slate-800 font-maru flex items-center gap-2.5">
                                <i class="fa-solid fa-bookmark text-amber-500 text-lg"></i> 輔導科別
                            </p>
                            
                            <!-- 輔導科別標籤展示區 -->
                            <div id="deptContainer" class="w-full">
                                <!-- 動態生成放大滿版科別標籤 -->
                            </div>
                        </div>
                    </div>

                    <!-- 底部標語 -->
                    <div class="pt-4 border-t border-slate-200 flex justify-between items-center text-sm md:text-base font-maru font-bold text-slate-500 w-full">
                        <span class="flex items-center gap-2 text-sky-700 truncate">
                            <i class="fa-solid fa-heart text-rose-500 shrink-0"></i> 用心關懷 ‧ 守護校園
                        </span>
                        <span class="text-slate-600 shrink-0">學務處 學安室</span>
                    </div>

                </div>

            </div>
        </section>
    </main>

    <!-- JavaScript 核心功能 -->
    <script>
        // 預設資料
        const DEFAULT_DATA = {
            name: "",
            title: "校安",
            departments: ", ",
            showDept: true,
            image: "",
            sizeName: 56,
            sizeTitle: 36,
            sizeDeptLabel: 26,
            sizeDeptItem: 34
        };

        let currentImage = "";

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            updateCard();
        });

        // 輔導科別顯示開關切換
        function toggleDeptVisibility() {
            const isChecked = document.getElementById('toggleDept').checked;
            const deptInputGroup = document.getElementById('deptInputGroup');
            const sizeDeptLabelWrapper = document.getElementById('sizeDeptLabelWrapper');
            const sizeDeptItemWrapper = document.getElementById('sizeDeptItemWrapper');
            const inputDept = document.getElementById('inputDept');
            const sizeDeptLabel = document.getElementById('sizeDeptLabel');
            const sizeDeptItem = document.getElementById('sizeDeptItem');

            if (isChecked) {
                deptInputGroup.classList.remove('opacity-40', 'pointer-events-none');
                sizeDeptLabelWrapper.classList.remove('opacity-40', 'pointer-events-none');
                sizeDeptItemWrapper.classList.remove('opacity-40', 'pointer-events-none');
                inputDept.disabled = false;
                sizeDeptLabel.disabled = false;
                sizeDeptItem.disabled = false;
            } else {
                deptInputGroup.classList.add('opacity-40', 'pointer-events-none');
                sizeDeptLabelWrapper.classList.add('opacity-40', 'pointer-events-none');
                sizeDeptItemWrapper.classList.add('opacity-40', 'pointer-events-none');
                inputDept.disabled = true;
                sizeDeptLabel.disabled = true;
                sizeDeptItem.disabled = true;
            }

            updateCard();
        }

        // 即時更新整張卡片
        function updateCard() {
            // 讀取自訂字體大小
            const sizeName = document.getElementById('sizeName').value;
            const sizeTitle = document.getElementById('sizeTitle').value;
            const sizeDeptLabel = document.getElementById('sizeDeptLabel').value;
            const sizeDeptItem = document.getElementById('sizeDeptItem').value;

            // 更新數值顯示
            document.getElementById('nameSizeVal').textContent = sizeName + 'px';
            document.getElementById('titleSizeVal').textContent = sizeTitle + 'px';
            document.getElementById('deptLabelSizeVal').textContent = sizeDeptLabel + 'px';
            document.getElementById('deptItemSizeVal').textContent = sizeDeptItem + 'px';

            // 更新姓名與職稱（套用自訂字體）
            const name = document.getElementById('inputName').value.trim() || "";
            const title = document.getElementById('inputTitle').value.trim() || "校安";
            
            const cardName = document.getElementById('cardName');
            const cardTitle = document.getElementById('cardTitle');
            const cardDeptLabel = document.getElementById('cardDeptLabel');
            const cardDeptSection = document.getElementById('cardDeptSection');

            cardName.textContent = name;
            cardName.style.fontSize = sizeName + 'px';

            cardTitle.textContent = title;
            cardTitle.style.fontSize = sizeTitle + 'px';

            cardDeptLabel.style.fontSize = sizeDeptLabel + 'px';

            // 判斷是否顯示科別區塊
            const isDeptVisible = document.getElementById('toggleDept').checked;
            if (isDeptVisible) {
                cardDeptSection.classList.remove('hidden');

                // 更新科別標籤（套用自訂字體與滿版 Grid）
                const deptInput = document.getElementById('inputDept').value.trim() || ", ";
                const deptContainer = document.getElementById('deptContainer');
                deptContainer.innerHTML = '';
                
                const depts = deptInput.split(/[,，、\s]+/).filter(Boolean);
                if (depts.length === 0) {
                    deptContainer.innerHTML = '<div class="w-full text-center py-3.5 bg-white/70 rounded-2xl border border-dashed border-slate-300 text-base text-slate-400 font-bold font-maru">尚未填寫科別</div>';
                } else {
                    const gridClass = depts.length === 1 ? 'grid grid-cols-1 gap-3 w-full' : 'grid grid-cols-2 gap-3 w-full';
                    const wrapper = document.createElement('div');
                    wrapper.className = gridClass;

                    depts.forEach(dept => {
                        const tag = document.createElement('div');
                        tag.className = 'w-full bg-white border-2 border-sky-400/90 text-sky-950 font-black py-3 px-2 rounded-2xl shadow-sm font-maru tracking-wider flex items-center justify-center text-center truncate';
                        tag.textContent = dept;
                        tag.style.fontSize = sizeDeptItem + 'px';
                        wrapper.appendChild(tag);
                    });

                    deptContainer.appendChild(wrapper);
                }
            } else {
                cardDeptSection.classList.add('hidden');
            }

            // 更新照片展示
            const cardImg = document.getElementById('cardImage');
            const placeholder = document.getElementById('cardImagePlaceholder');
            if (currentImage) {
                cardImg.src = currentImage;
                cardImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                cardImg.src = '';
                cardImg.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        // 圖片上傳處理
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImage = e.target.result;
                    updateCard();
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImage = "";
            document.getElementById('imageUploader').value = "";
            updateCard();
        }

        // 重置為預設值
        function resetDefaults() {
            document.getElementById('inputName').value = DEFAULT_DATA.name;
            document.getElementById('inputTitle').value = DEFAULT_DATA.title;
            document.getElementById('inputDept').value = DEFAULT_DATA.departments;
            document.getElementById('toggleDept').checked = DEFAULT_DATA.showDept;
            
            document.getElementById('sizeName').value = DEFAULT_DATA.sizeName;
            document.getElementById('sizeTitle').value = DEFAULT_DATA.sizeTitle;
            document.getElementById('sizeDeptLabel').value = DEFAULT_DATA.sizeDeptLabel;
            document.getElementById('sizeDeptItem').value = DEFAULT_DATA.sizeDeptItem;

            currentImage = "";
            document.getElementById('imageUploader').value = "";
            toggleDeptVisibility();
        }
    </script>
</body>
</html>
