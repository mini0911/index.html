<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校安介紹 A5 橫式小卡網頁版生成器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Zen Maru Gothic -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        maru: ['Zen Maru Gothic', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            800: '#1e3e62',
                            900: '#142a43',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }

        /* A5 橫式卡片比例容器 (210mm x 148mm 比例) */
        .a5-card {
            width: 840px;
            height: 592px;
            box-sizing: border-box;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* 列印專用 A5 橫式設定 */
        @media print {
            @page {
                size: A5 landscape;
                margin: 0;
            }
            body {
                background: white;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .no-print {
                display: none !important;
            }
            .a5-card {
                box-shadow: none !important;
                border: none !important;
                width: 210mm !important;
                height: 148mm !important;
                page-break-inside: avoid;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center justify-start">

    <!-- 頂部頁籤與說明 (非列印區域) -->
    <header class="w-full max-w-[1100px] mb-6 no-print flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-sky-500 text-white flex items-center justify-center text-2xl shadow-md">
                <i class="fa-solid fa-id-card"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-slate-800 font-maru">校安介紹 A5 橫式小卡生成器</h1>
                <p class="text-xs text-slate-500">自由編輯校安姓名、輔導科別、主要業務與上傳照片，並可直接輸出列印</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="resetDefaults()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> 重置預設值
            </button>
            <button onclick="window.print()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg hover:shadow-sky-200 transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-print"></i> 列印 / 輸出 A5 卡片
            </button>
        </div>
    </header>

    <!-- 主內容區：左側編輯表單 + 右側卡片即時預覽 -->
    <main class="w-full max-w-[1100px] grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- ================= 編輯控制面板 (5 欄寬) ================= -->
        <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-md border border-slate-200 no-print space-y-5">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center gap-2 font-maru">
                <i class="fa-solid fa-sliders text-sky-500"></i> 卡片內容自由編輯
            </h2>

            <!-- 1. 校安姓名與職稱 -->
            <div class="space-y-3">
                <label class="block text-sm font-bold text-slate-700">1. 校安姓名與職稱</label>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <span class="text-xs text-slate-500 mb-1 block">姓名</span>
                        <input type="text" id="inputName" value="陳琇眞" oninput="updateCard()" 
                               class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition">
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 mb-1 block">職稱</span>
                        <input type="text" id="inputTitle" value="校安" oninput="updateCard()" 
                               class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition">
                    </div>
                </div>
            </div>

            <!-- 2. 輔導科別 -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">2. 輔導科別</label>
                <p class="text-xs text-slate-400 mb-1.5">可輸入多個科別，請用逗號或頓號分隔（例如：電子科, 門市科）</p>
                <input type="text" id="inputDept" value="電子科, 門市科" oninput="updateCard()" 
                       class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition">
            </div>

            <!-- 3. 照片上傳 (輔導科別下方顯示) -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">3. 輔導科別下方照片上傳</label>
                <p class="text-xs text-slate-400 mb-2">可上傳個人照片或 Q 版形象圖（支援去背 PNG 或一般 JPG）</p>
                
                <div class="flex items-center gap-3">
                    <label class="flex-1 cursor-pointer bg-sky-50 border-2 border-dashed border-sky-300 hover:bg-sky-100/70 text-sky-700 rounded-xl p-3 text-center transition flex items-center justify-center gap-2 text-sm font-bold">
                        <i class="fa-solid fa-cloud-arrow-up text-lg"></i> 選擇/拖曳圖片檔案
                        <input type="file" id="imageUploader" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                    </label>
                    <button onclick="removeImage()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-3 rounded-xl text-sm font-bold transition" title="移除圖片">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- 4. 主要負責業務自由動態清單 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-slate-700">4. 主要負責業務</label>
                    <button onclick="addBusinessItem()" class="text-xs bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 新增項目
                    </button>
                </div>
                
                <!-- 動態清單列表容器 -->
                <div id="businessListInputs" class="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                    <!-- JavaScript 將在此動態生成輸入框 -->
                </div>
            </div>
        </section>

        <!-- ================= 右側卡片預覽區 (7 欄寬) ================= -->
        <section class="lg:col-span-7 flex flex-col items-center w-full">
            <div class="no-print w-full flex justify-between items-center mb-3 px-1">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    A5 橫式即時卡片預覽 (210 x 148 mm)
                </span>
                <span class="text-xs text-slate-400">滑鼠停留在圖片可直接點擊更換</span>
            </div>

            <!-- A5 橫式介紹小卡主體 -->
            <div id="a5Card" class="a5-card bg-white rounded-3xl shadow-2xl overflow-hidden p-6 relative flex gap-5 border border-slate-200 shrink-0">
                
                <!-- ================= 左半邊區塊 (40% 寬度) ================= -->
                <div class="w-[40%] bg-gradient-to-b from-sky-50/90 to-sky-100/60 rounded-2xl p-5 relative flex flex-col justify-between border-l-8 border-amber-400 overflow-hidden shadow-inner">
                    
                    <!-- 左側文字資料區塊 (靠上對齊) -->
                    <div class="z-10 flex flex-col justify-start pr-1">
                        <!-- 1. 校安姓名與職稱 (放大呈現) -->
                        <div class="mb-4">
                            <div class="flex flex-col items-start gap-1">
                                <h2 id="cardName" class="text-5xl md:text-6xl font-black text-slate-900 tracking-tight font-maru leading-none">陳琇眞</h2>
                                <span id="cardTitle" class="text-2xl font-bold text-sky-600 font-maru mt-1.5">校安</span>
                            </div>
                            <p class="text-sm font-bold text-slate-500 mt-3 font-maru flex items-center gap-1.5">
                                <i class="fa-solid fa-bookmark text-amber-500 text-xs"></i> 輔導科別
                            </p>
                        </div>

                        <!-- 2. 輔導科別 (平均分配寬度，獨立於照片上方) -->
                        <div id="deptContainer" class="grid grid-cols-2 gap-2 mb-3">
                            <!-- 動態生成科別標籤 -->
                        </div>
                    </div>

                    <!-- 3. 照片展示區域 -->
                    <div class="relative z-10 w-full flex-1 min-h-[160px] flex items-center justify-center overflow-hidden rounded-xl bg-white/60 border border-sky-200/50 mt-2">
                        <img id="cardImage" src="" alt="校安照片" class="max-h-full max-w-full object-contain drop-shadow-md hidden">
                        <div id="cardImagePlaceholder" class="text-sky-300 flex flex-col items-center justify-center gap-2">
                            <i class="fa-regular fa-image text-4xl"></i>
                            <span class="text-xs text-sky-400 font-maru">尚未上傳照片</span>
                        </div>
                    </div>
                </div>

                <!-- ================= 右半邊區塊 (60% 寬度) ================= -->
                <div class="w-[60%] flex flex-col justify-between p-4 bg-slate-50/70 rounded-2xl border border-slate-100">
                    <div>
                        <!-- 右側標題 -->
                        <div class="flex items-center gap-2.5 border-b-2 border-sky-500/20 pb-3 mb-4">
                            <div class="w-8 h-8 rounded-lg bg-sky-500 text-white flex items-center justify-center text-base shadow-sm">
                                <i class="fa-solid fa-clipboard-check"></i>
                            </div>
                            <h3 class="text-xl font-black text-slate-800 font-maru tracking-wide">主要負責業務</h3>
                        </div>

                        <!-- 業務列表 -->
                        <div id="cardBusinessList" class="space-y-2.5">
                            <!-- 動態生成業務項目 -->
                        </div>
                    </div>

                    <!-- 底部標語 / 裝飾 -->
                    <div class="pt-3 border-t border-slate-200/80 flex justify-between items-center text-xs text-slate-400 font-maru">
                        <span class="flex items-center gap-1.5 text-sky-700 font-bold">
                            <i class="fa-solid fa-shield-halved text-sky-500"></i> 校園安全 ‧ 全心守護
                        </span>
                        <span class="text-slate-400 font-medium">學務處 學安室</span>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- JavaScript 核心功能 -->
    <script>
        // 預設資料
        const DEFAULT_DATA = {
            name: "",
            title: "校安",
            departments: ", ",
            business: [
                "學生校內外生活輔導與關懷",
                "校園安全維護及防制霸凌業務",
                "學生偶發及緊急突發事件通報應變",
                "交通安全宣導與交通糾察隊管理",
                "全民國防教育宣導與相關行政業務"
            ],
            image: ""
        };

        let currentBusiness = [...DEFAULT_DATA.business];
        let currentImage = "";

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderBusinessInputs();
            updateCard();
        });

        // 渲染編輯區的業務輸入欄位
        function renderBusinessInputs() {
            const container = document.getElementById('businessListInputs');
            container.innerHTML = '';
            
            currentBusiness.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2';
                row.innerHTML = `
                    <span class="text-xs font-bold text-slate-400 w-4 text-center">${index + 1}</span>
                    <input type="text" value="${escapeHtml(item)}" oninput="updateBusinessItem(${index}, this.value)"
                           class="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-sky-400 outline-none">
                    <button onclick="removeBusinessItem(${index})" class="text-slate-400 hover:text-rose-500 p-1.5 transition" title="刪除">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        // 即時更新整張卡片
        function updateCard() {
            // 更新姓名與職稱
            const name = document.getElementById('inputName').value.trim() || "姓名";
            const title = document.getElementById('inputTitle').value.trim() || "職稱";
            document.getElementById('cardName').textContent = name;
            document.getElementById('cardTitle').textContent = title;

            // 更新科別標籤
            const deptInput = document.getElementById('inputDept').value;
            const deptContainer = document.getElementById('deptContainer');
            deptContainer.innerHTML = '';
            
            const depts = deptInput.split(/[,，、\s]+/).filter(Boolean);
            if (depts.length === 0) {
                deptContainer.innerHTML = '<span class="col-span-2 text-xs text-slate-400">尚未填寫科別</span>';
            } else {
                depts.forEach(dept => {
                    const tag = document.createElement('div');
                    tag.className = 'bg-white/90 border border-sky-200 text-sky-800 text-xs font-bold px-2.5 py-1.5 rounded-lg text-center shadow-sm font-maru truncate';
                    tag.textContent = dept;
                    deptContainer.appendChild(tag);
                });
            }

            // 更新業務清單
            const cardBusinessList = document.getElementById('cardBusinessList');
            cardBusinessList.innerHTML = '';
            currentBusiness.forEach(item => {
                if (!item.trim()) return;
                const div = document.createElement('div');
                div.className = 'flex items-start gap-2.5 text-sm text-slate-700 bg-white p-2.5 rounded-xl border border-slate-200/70 shadow-sm';
                div.innerHTML = `
                    <i class="fa-solid fa-circle-check text-sky-500 mt-1 text-xs shrink-0"></i>
                    <span class="font-medium leading-relaxed">${escapeHtml(item)}</span>
                `;
                cardBusinessList.appendChild(div);
            });

            // 更新照片
            const cardImg = document.getElementById('cardImage');
            const placeholder = document.getElementById('cardImagePlaceholder');
            if (currentImage) {
                cardImg.src = currentImage;
                cardImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                cardImg.src = '';
                cardImg.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        // 業務清單操作
        function addBusinessItem() {
            currentBusiness.push("新增業務項目");
            renderBusinessInputs();
            updateCard();
        }

        function updateBusinessItem(index, value) {
            currentBusiness[index] = value;
            updateCard();
        }

        function removeBusinessItem(index) {
            currentBusiness.splice(index, 1);
            renderBusinessInputs();
            updateCard();
        }

        // 圖片上傳處理
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImage = e.target.result;
                    updateCard();
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImage = "";
            document.getElementById('imageUploader').value = "";
            updateCard();
        }

        // 重置為預設值
        function resetDefaults() {
            document.getElementById('inputName').value = DEFAULT_DATA.name;
            document.getElementById('inputTitle').value = DEFAULT_DATA.title;
            document.getElementById('inputDept').value = DEFAULT_DATA.departments;
            currentBusiness = [...DEFAULT_DATA.business];
            currentImage = "";
            document.getElementById('imageUploader').value = "";
            renderBusinessInputs();
            updateCard();
        }

        // XSS 安全防護
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
