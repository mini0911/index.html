<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜密室】第一人稱 3D 連鎖驚悚逃脫</title>

<!-- Three.js 3D 核心庫 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #000; color: #eee; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #game-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
  #three-canvas { width: 100%; height: 100%; display: block; }

  /* 驚悚 VHS 掃描線與手電筒暗角遮罩 */
  .vignette-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,0.85) 75%, rgba(0,0,0,0.98) 100%),
                repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0, 20, 10, 0.15) 3px, rgba(0,0,0,0) 4px);
    pointer-events: none; z-index: 10;
  }

  /* 準心 */
  .crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 8px; background: rgba(255, 255, 255, 0.6); border-radius: 50%;
    pointer-events: none; z-index: 20; transition: all 0.2s;
  }
  .crosshair.interactable {
    width: 24px; height: 24px; background: transparent; border: 2px solid #ff4444;
    box-shadow: 0 0 10px #ff0000;
  }

  /* 互動提示文字 (浮在準心下方) */
  #interact-hint {
    position: absolute; top: 56%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; font-weight: bold; color: #ff5555; text-shadow: 0 0 8px #000;
    pointer-events: none; z-index: 25; display: none; letter-spacing: 1px;
  }

  /* 頂部 HUD */
  .hud-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 56px;
    background: linear-gradient(180deg, rgba(5,6,8,0.95) 0%, transparent 100%);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; z-index: 100; pointer-events: none;
  }
  .stage-tag {
    color: #ff4444; font-size: 14px; font-weight: bold; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: #ff2222; border-radius: 50%;
    box-shadow: 0 0 8px #ff0000; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  .inventory-bar {
    background: rgba(22, 27, 34, 0.85); border: 1px solid #444;
    padding: 5px 12px; border-radius: 4px; font-size: 12px; color: #e3b341;
  }

  /* 行動裝置走動按鈕 (支援手機觸控) */
  .touch-controls {
    position: absolute; bottom: 20px; left: 20px; z-index: 150;
    display: grid; grid-template-columns: repeat(3, 46px); gap: 6px;
  }
  .touch-btn {
    width: 46px; height: 46px; background: rgba(20, 24, 30, 0.75);
    border: 1px solid #58a6ff; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
  }
  .touch-btn:active { background: #ff4444; }

  /* 底部對講機提示 */
  .bottom-radio {
    position: absolute; bottom: 18px; left: 180px; right: 20px;
    background: rgba(13, 17, 23, 0.92); border: 1px solid #30363d;
    border-left: 4px solid #ff4444; padding: 10px 14px;
    z-index: 100; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .radio-text { font-size: 12px; color: #c9d1d9; line-height: 1.4; }

  /* ==================== 彈窗 1：調查線索紙條 ==================== */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.88); z-index: 2000;
    display: none; justify-content: center; align-items: center; padding: 20px;
  }
  .clue-paper {
    background: #ebdcc0; color: #231a11; width: 100%; max-width: 380px;
    border-radius: 6px; padding: 24px; box-shadow: 0 0 35px rgba(255,200,100,0.25);
    border: 2px solid #bba377; font-family: serif; animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .clue-title { font-size: 16px; font-weight: bold; color: #7a1515; border-bottom: 1px dashed #7a664d; padding-bottom: 8px; margin-bottom: 14px; }
  .clue-body { font-size: 13px; line-height: 1.8; margin-bottom: 20px; white-space: pre-line; }
  .btn-close { width: 100%; background: #7a1515; color: #fff; border: none; padding: 10px 0; font-size: 13px; font-weight: bold; border-radius: 3px; cursor: pointer; }

  /* ==================== 彈窗 2：鐵門密碼鎖盤 (Keypad) ==================== */
  .keypad-box {
    background: #161b22; border: 2px solid #ff4444; border-radius: 8px;
    width: 280px; padding: 22px; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 0 35px rgba(255, 0, 0, 0.45); animation: popIn 0.2s ease;
  }
  .keypad-display {
    width: 100%; height: 44px; background: #000; border: 1px solid #30363d;
    border-radius: 4px; color: #ff3333; font-size: 24px; font-family: monospace;
    display: flex; justify-content: center; align-items: center; letter-spacing: 8px; margin-bottom: 16px;
  }
  .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 16px; }
  .num-btn {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 12px 0; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }
  .num-btn:active { background: #ff4444; color: #fff; }

  /* 開場視窗 */
  #start-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #050608; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #start-modal h1 { color: #ff4444; font-size: 24px; margin-bottom: 14px; letter-spacing: 2px; }
  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.8; margin-bottom: 24px; max-width: 400px; }
  .btn-start {
    background: #b62324; border: none; color: #fff; padding: 14px 38px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
  }
</style>
</head>
<body>

<div id="game-viewport">
  <div class="vignette-overlay"></div>
  <div class="crosshair" id="crosshair"></div>
  <div id="interact-hint">[ 點擊滑鼠 / 螢幕 進行調查 ]</div>

  <!-- 頂部 HUD -->
  <div class="hud-top">
    <div class="stage-tag">
      <div class="pulse-dot"></div>
      <span id="stage-title">第 1 間密室：廢棄停屍間・冰櫃銘牌</span>
    </div>
    <div class="inventory-bar" id="inv-display">道具包: 空</div>
  </div>

  <!-- 3D 第一人稱畫布 -->
  <div id="canvas-container" style="width: 100%; height: 100%;"></div>

  <!-- 行動裝置虛擬行走方向鍵 (左下角) -->
  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" onpointerdown="keys.KeyW=true" onpointerup="keys.KeyW=false">▲</button>
    <div></div>
    <button class="touch-btn" onpointerdown="keys.KeyA=true" onpointerup="keys.KeyA=false">◄</button>
    <button class="touch-btn" onpointerdown="keys.KeyS=true" onpointerup="keys.KeyS=false">▼</button>
    <button class="touch-btn" onpointerdown="keys.KeyD=true" onpointerup="keys.KeyD=false">►</button>
  </div>

  <!-- 底部任務提示 -->
  <div class="bottom-radio">
    <div class="radio-text" id="radio-instruction">
      「你被反鎖在陰暗的密室中……走動搜查房間，找到帶有光暈的證物，再前往鐵門解鎖！」
    </div>
  </div>

  <!-- 調查檔案彈窗 -->
  <div class="modal-overlay" id="clue-modal">
    <div class="clue-paper">
      <div class="clue-title" id="clue-title">調查證物</div>
      <div class="clue-body" id="clue-body">內容載入中...</div>
      <button class="btn-close" onclick="closeClueModal()">放回並繼續搜查</button>
    </div>
  </div>

  <!-- 鐵門密碼鎖彈窗 -->
  <div class="modal-overlay" id="keypad-modal">
    <div class="keypad-box">
      <div style="color: #ff5555; font-size: 12px; margin-bottom: 8px;">逃生門禁終端</div>
      <div class="keypad-display" id="keypad-code">----</div>
      <div class="keypad-grid">
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn" onclick="clearKeypad()">C</button>
        <button class="num-btn" onclick="pressKey('0')">0</button>
        <button class="num-btn" onclick="submitPasscode()" style="background:#8b1111; color:#fff;">✓</button>
      </div>
      <button class="btn-close" style="background:#30363d;" onclick="closeKeypad()">放棄返回</button>
    </div>
  </div>

  <!-- 開場視窗 -->
  <div id="start-modal">
    <h1>寂靜密室：第一人稱實境版</h1>
    <p>
      <b>徹底擺脫外部地圖與 GPS：</b><br>
      化身調查員身歷其境走入 3D 密室！<br>
      使用鍵盤 <b>W / A / S / D</b>（或左下角按鈕）走動，滑鼠拖曳視角環顧搜查，找出密碼破門逃脫！
    </p>
    <button class="btn-start" onclick="startGame()">點擊踏入密室</button>
  </div>
</div>

<script>
/* ==================== 5 大連鎖驚悚密室關卡庫 ==================== */
const ESCAPE_STAGES = [
  {
    level: 1,
    title: "第 1 間密室：廢棄停屍間・冰櫃銘牌",
    wallColor: 0x11161d, floorColor: 0x0a0c10,
    clueName: "浸血的解剖台病歷",
    cluePos: { x: -7, y: 1.5, z: -5 },
    doorPos: { x: 0, y: 3, z: -11.8 },
    passcode: "404",
    diary: "『……祂們在天花板上爬行。\n4 號冰櫃已被拉出，遺留著號碼牌 4-0-4。\n輸入 404 解開鐵捲門，千萬別回頭！』"
  },
  {
    level: 2,
    title: "第 2 間密室：血色祈禱室・倒十字架",
    wallColor: 0x221111, floorColor: 0x140a0a,
    clueName: "燒焦的聖經殘頁",
    cluePos: { x: 7, y: 1.5, z: 2 },
    doorPos: { x: 0, y: 3, z: -11.8 },
    passcode: "666",
    diary: "『血字在牆面蔓延……聖經第 66 卷啟示錄第七封印。\n輸入三重逆十字凶數 666 破除結界！』"
  },
  {
    level: 3,
    title: "第 3 間密室：拘禁地下牢房・生鏽手銬",
    wallColor: 0x181814, floorColor: 0x0f0f0c,
    clueName: "獄卒遺落的記事本",
    cluePos: { x: -6, y: 1.5, z: 6 },
    doorPos: { x: 0, y: 3, z: -11.8 },
    passcode: "911",
    diary: "『獄卒在日記本的最後一頁寫著：\n緊急呼救訊號 9-1-1 是生還門禁的覆寫代碼……』"
  },
  {
    level: 4,
    title: "第 4 間密室：廢棄手術室・消毒壓力閥",
    wallColor: 0x111c18, floorColor: 0x0a1410,
    clueName: "化學消毒器儀表紀錄",
    cluePos: { x: 6, y: 1.5, z: -4 },
    doorPos: { x: 0, y: 3, z: -11.8 },
    passcode: "728",
    diary: "『生鏽的手術托盤刻著三道壓力數值：\n甲閥 7、乙閥 2、丙閥 8。\n輸入 7-2-8 洩壓開啟氣密門！』"
  },
  {
    level: 5,
    title: "第 5 間密室：生化禁區・最終逃生門",
    wallColor: 0x1a1522, floorColor: 0x100c14,
    clueName: "院長的主控密碼卡",
    cluePos: { x: -2, y: 1.5, z: 8 },
    doorPos: { x: 0, y: 3, z: -11.8 },
    passcode: "2026",
    diary: "『最後一道安全協議……\n基地封閉年份為 2026 年。\n輸入 2026 解除封鎖，重見天日！』"
  }
];

let currentStageIdx = 0;
let inventory = [];
let passcodeBuffer = "";

/* ==================== 音效引擎 ==================== */
class HorrorAudio {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(55, this.ctx.currentTime);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.06);
  }
  click() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(800, this.ctx.currentTime);
    g.gain.setValueAtTime(0.12, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  doorOpen() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(100, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.6);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.6);
  }
}
const sfx = new HorrorAudio();

/* ==================== Three.js 第一人稱 3D 空間 ==================== */
let scene, camera, renderer, flashlight;
let roomMeshGroup = null, clueObject = null, doorObject = null;
let yaw = 0, pitch = 0; // 第一視角旋轉
let playerPos = { x: 0, y: 1.8, z: 8 }; // 玩家眼高 1.8 米
let keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
let isInteractingLook = false, lastTouchX = 0, lastTouchY = 0;
let headBob = 0;

function startGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThreeEngine();
  loadStageRoom(0);
}

function initThreeEngine() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  // 第一視角專屬手電筒 (聚光燈綁在攝影機正前方)
  flashlight = new THREE.SpotLight(0xfffaed, 2.5, 25, Math.PI / 4.5, 0.4, 1.2);
  camera.add(flashlight);
  flashlight.position.set(0, 0, 0.2);
  flashlight.target = camera;
  scene.add(camera);

  // 微弱幽暗環境光
  scene.add(new THREE.AmbientLight(0x111116));

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // 鍵盤移動監聽
  window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

  // 滑鼠拖曳環顧視角
  container.addEventListener('pointerdown', (e) => {
    isInteractingLook = true;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  });
  window.addEventListener('pointermove', (e) => {
    if (isInteractingLook) {
      const dx = e.clientX - lastTouchX;
      const dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;

      yaw -= dx * 0.0035;
      pitch -= dy * 0.0035;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
    }
  });
  window.addEventListener('pointerup', () => { isInteractingLook = false; });

  // 點擊調查互動
  container.addEventListener('click', checkRaycastInteract);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

/* ==================== 建立實體 3D 密室結構 ==================== */
function loadStageRoom(idx) {
  currentStageIdx = idx;
  const stage = ESCAPE_STAGES[idx];

  document.getElementById('stage-title').innerText = stage.title;
  document.getElementById('radio-instruction').innerText =
    `「進入【${stage.title}】！走動尋找散落的證物，再前往盡頭的鐵門輸入密碼！」`;

  // 重置玩家起點
  playerPos = { x: 0, y: 1.8, z: 8 };
  yaw = 0; pitch = 0;

  if (roomMeshGroup) scene.remove(roomMeshGroup);
  roomMeshGroup = new THREE.Group();

  // 1. 密室房間牆面 (寬 18m, 高 6m, 深 24m)
  const roomGeom = new THREE.BoxGeometry(18, 6, 24);
  const wallMat = new THREE.MeshStandardMaterial({
    color: stage.wallColor, roughness: 0.9, side: THREE.BackSide
  });
  const roomMesh = new THREE.Mesh(roomGeom, wallMat);
  roomMesh.position.y = 3;
  roomMeshGroup.add(roomMesh);

  // 2. 地板與天花板
  const floorMat = new THREE.MeshStandardMaterial({ color: stage.floorColor, roughness: 0.8 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(18, 24), floorMat);
  floor.rotation.x = -Math.PI / 2;
  roomMeshGroup.add(floor);

  // 3. 散落證物台 (帶有發光金光)
  const deskGeom = new THREE.BoxGeometry(2, 1.2, 1.5);
  const deskMesh = new THREE.Mesh(deskGeom, new THREE.MeshStandardMaterial({ color: 0x332211 }));
  deskMesh.position.set(stage.cluePos.x, 0.6, stage.cluePos.z);
  roomMeshGroup.add(deskMesh);

  // 發光金黃線索本
  const bookGeom = new THREE.BoxGeometry(0.8, 0.2, 1);
  const bookMat = new THREE.MeshBasicMaterial({ color: 0xffdd66 });
  clueObject = new THREE.Mesh(bookGeom, bookMat);
  clueObject.position.set(stage.cluePos.x, 1.3, stage.cluePos.z);
  clueObject.userData = { type: "clue", data: stage };
  roomMeshGroup.add(clueObject);

  // 4. 正前方逃生鐵門 (帶有紅燈)
  const doorGeom = new THREE.BoxGeometry(3.5, 5, 0.4);
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x1f1111, metalness: 0.8, roughness: 0.3 });
  doorObject = new THREE.Mesh(doorGeom, doorMat);
  doorObject.position.set(stage.doorPos.x, 2.5, stage.doorPos.z);
  doorObject.userData = { type: "door", data: stage };
  roomMeshGroup.add(doorObject);

  // 門上的紅色密碼鎖光標
  const lockPlate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  lockPlate.position.set(1.2, 0, 0.3);
  doorObject.add(lockPlate);

  scene.add(roomMeshGroup);
}

/* ==================== 第一人稱走動與碰撞判定 ==================== */
function updateMovement() {
  const moveSpeed = 0.12;
  let moveX = 0, moveZ = 0;

  if (keys.KeyW) moveZ -= 1;
  if (keys.KeyS) moveZ += 1;
  if (keys.KeyA) moveX -= 1;
  if (keys.KeyD) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    // 規一化速度向量
    const len = Math.hypot(moveX, moveZ);
    moveX = (moveX / len) * moveSpeed;
    moveZ = (moveZ / len) * moveSpeed;

    // 根據視角旋轉計算真實前進方向
    const sinYaw = Math.sin(yaw);
    const cosYaw = Math.cos(yaw);

    playerPos.x += moveX * cosYaw + moveZ * sinYaw;
    playerPos.z += -moveX * sinYaw + moveZ * cosYaw;

    // 限制在房間邊界內 (防止穿牆)
    playerPos.x = Math.max(-8, Math.min(8, playerPos.x));
    playerPos.z = Math.max(-10.5, Math.min(10.5, playerPos.z));

    // 頭部晃動模擬真實腳步
    headBob += 0.18;
    camera.position.y = playerPos.y + Math.sin(headBob) * 0.05;

    // 定期發出腳步聲
    if (Math.sin(headBob) < -0.95 && !updateMovement.stepped) {
      sfx.step();
      updateMovement.stepped = true;
    } else if (Math.sin(headBob) > 0) {
      updateMovement.stepped = false;
    }
  }

  camera.position.x = playerPos.x;
  camera.position.z = playerPos.z;

  // 旋轉攝影機視角
  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);
}

/* ==================== 準心視線射線判定 ==================== */
function checkRaycastInteract() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length > 0) {
    let hitObj = hits[0].object;
    while (hitObj.parent && !hitObj.userData.type) hitObj = hitObj.parent;

    const dist = camera.position.distanceTo(hits[0].point);
    if (dist <= 4.5) { // 必須走近至 4.5 米內才能調查
      if (hitObj.userData.type === "clue") {
        openClueDialog(hitObj.userData.data);
      } else if (hitObj.userData.type === "door") {
        openKeypadDialog();
      }
    }
  }
}

// 實時更新準心變色與提示
function updateInteractHint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);
  const cross = document.getElementById('crosshair');
  const hint = document.getElementById('interact-hint');

  if (hits.length > 0 && hits[0].distance <= 4.5) {
    cross.classList.add('interactable');
    hint.style.display = 'block';
  } else {
    cross.classList.remove('interactable');
    hint.style.display = 'none';
  }
}

/* ==================== 密室彈窗解謎邏輯 ==================== */
function openClueDialog(data) {
  sfx.click();
  document.getElementById('clue-title').innerText = `【${data.clueName}】`;
  document.getElementById('clue-body').innerText = data.diary;
  document.getElementById('clue-modal').style.display = 'flex';

  if (!inventory.includes(data.clueName)) {
    inventory.push(data.clueName);
    document.getElementById('inv-display').innerText = `道具包: ${inventory.join(', ')}`;
  }
}
function closeClueModal() {
  document.getElementById('clue-modal').style.display = 'none';
}

function openKeypadDialog() {
  sfx.click();
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('keypad-modal').style.display = 'flex';
}
function closeKeypad() {
  document.getElementById('keypad-modal').style.display = 'none';
}

function pressKey(n) {
  sfx.click();
  if (passcodeBuffer.length < 4) {
    passcodeBuffer += n;
    document.getElementById('keypad-code').innerText = passcodeBuffer.padEnd(4, '-');
  }
}
function clearKeypad() {
  sfx.click();
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
}

function submitPasscode() {
  const currentStage = ESCAPE_STAGES[currentStageIdx];
  if (passcodeBuffer === currentStage.passcode) {
    sfx.doorOpen();
    closeKeypad();
    alert(`🎉【密室解鎖成功！】\n鐵門嘎吱作響開啟！成功逃出【${currentStage.title}】！`);

    // 前往下一間密室
    if (currentStageIdx + 1 < ESCAPE_STAGES.length) {
      loadStageRoom(currentStageIdx + 1);
    } else {
      alert("🏆【大逃殺完全生還！】你已成功連續解開全部 5 間驚悚密室，逃出生天！");
    }
  } else {
    alert("【密碼錯誤！】門禁系統紅燈閃爍，請走回證物台仔細閱讀線索！");
    clearKeypad();
  }
}

/* ==================== 主動畫循環 ==================== */
function animate() {
  requestAnimationFrame(animate);

  updateMovement();
  updateInteractHint();

  // 證物金黃光暈呼吸微幅旋轉
  if (clueObject) {
    clueObject.rotation.y += 0.02;
    clueObject.position.y = 1.3 + Math.sin(Date.now() * 0.005) * 0.05;
  }

  renderer.render(scene, camera);
}
</script>
