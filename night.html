<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>今天也要平安下班！校安問答手遊版 (超可愛版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: #ffedd5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: #fef3c7;
      border: 4px solid #fbbf24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
    }
    canvas {
      display: block;
      width: 100%;
      height: 52%;
      background: #fffbeb;
    }

    /* 頂部狀態列 */
    #top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 160px;
    }
    .bar-container {
      background: #fef08a;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      height: 20px;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
      border-radius: 10px;
    }
    #san-bar { background: #f87171; }
    #sta-bar { background: #4ade80; }
    .bar-label {
      position: absolute;
      top: 0;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      line-height: 18px;
      color: #78350f;
    }
    .top-right-group {
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    #sound-toggle {
      background: #fff;
      border: 2px solid #f97316;
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 #fdba74;
    }
    #clock-box {
      background: #ffffff;
      border: 3px solid #fb923c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 16px;
      font-weight: 900;
      color: #ea580c;
      text-align: center;
      box-shadow: 0 2px 0 #fdba74;
    }

    /* 對話視窗 */
    #dialog-box {
      position: absolute;
      bottom: 125px;
      left: 10px;
      right: 10px;
      background: #ffffff;
      border: 4px solid #f97316;
      border-radius: 20px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 6px 0 #fed7aa;
      z-index: 10;
      max-height: 40%;
      overflow-y: auto;
    }
    #dialog-title {
      font-size: 12px;
      font-weight: 900;
      color: #ea580c;
      background: #ffedd5;
      padding: 3px 10px;
      border-radius: 10px;
      align-self: flex-start;
    }
    #dialog-text {
      font-size: 14px;
      font-weight: bold;
      color: #1e293b;
      line-height: 1.4;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .option-btn {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      color: #78350f;
      cursor: pointer;
      text-align: left;
    }
    .option-btn:active {
      background: #fde047;
      transform: scale(0.98);
    }

    /* 控制面板 */
    #touch-controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 15px);
      left: 0;
      right: 0;
      height: 95px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 8;
    }
    .d-pad {
      display: flex;
      gap: 14px;
    }
    .ctrl-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #fed7aa;
      border: 3px solid #ea580c;
      box-shadow: 0 4px 0 #c2410c;
      font-size: 24px;
      font-weight: 900;
      color: #7c2d12;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c2410c;
      background: #fdba74;
    }
    #action-btn {
      width: 75px;
      height: 75px;
      background: #f97316;
      border: 3px solid #7c2d12;
      box-shadow: 0 4px 0 #7c2d12;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
    }
    #action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7c2d12;
      background: #ea580c;
    }

    /* 彈出層 */
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(254, 243, 199, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    #modal h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ea580c;
    }
    #modal p {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #7c2d12;
      line-height: 1.6;
    }
    .cute-btn {
      padding: 12px 30px;
      font-size: 17px;
      font-weight: 900;
      background: #f97316;
      color: #ffffff;
      border: 3px solid #7c2d12;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #7c2d12;
    }
  </style>
</head>
<body>

  <div id="mobile-frame">
    <div id="top-bar">
      <div class="status-group">
        <div class="bar-container">
          <div id="san-bar" class="bar-fill"></div>
          <span class="bar-label">❤️ 理智 (SAN)</span>
        </div>
        <div class="bar-container">
          <div id="sta-bar" class="bar-fill"></div>
          <span class="bar-label">👟 耐力 (STA)</span>
        </div>
      </div>
      <div class="top-right-group">
        <button id="sound-toggle" onclick="toggleAudio()">🔊</button>
        <div id="clock-box">
          <span style="font-size: 9px; color: #f97316; display: block;">目標 17:00</span>
          <span id="time-display">16:30</span>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas" width="400" height="420"></canvas>

    <div id="dialog-box">
      <div id="dialog-title">💬 學生來請教你了！</div>
      <div id="dialog-text">老師，校門口有奇怪的人一直看我，怎麼辦？</div>
      <div class="options-list" id="options-container"></div>
    </div>

    <div id="touch-controls">
      <div class="d-pad">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
      </div>
      <button class="ctrl-btn" id="action-btn">💬 對話</button>
    </div>

    <div id="modal">
      <h1 id="modal-title">校安生存戰 🎒</h1>
      <p id="modal-desc">
        你是學務處最親切的 Q 版校安老師！<br>
        在 17:00 前利用下方按鈕巡視校園，<br>
        點擊【對話】解答冒問號學生的疑難雜症，<br>
        守住你的理智值平安下班！
      </p>
      <button class="cute-btn" id="start-btn" onclick="startGame()">開始值勤 ⏰</button>
    </div>
  </div>

  <script>
    /* 音訊引擎 */
    let audioCtx = null;
    let bgmInterval = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudio() {
      initAudio();
      isMuted = !isMuted;
      document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🔊';
      if (isMuted) stopBGM();
      else if (isPlaying) startBGM();
    }

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (!audioCtx || isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    function playCorrectSound() {
      initAudio();
      if (isMuted) return;
      playTone(523.25, 'triangle', 0.1, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.12, 0.15), 80);
      setTimeout(() => playTone(783.99, 'triangle', 0.2, 0.2), 160);
    }

    function playWrongSound() {
      initAudio();
      if (isMuted) return;
      playTone(260, 'sawtooth', 0.15, 0.12);
      setTimeout(() => playTone(180, 'sawtooth', 0.25, 0.15), 100);
    }

    function playPopSound() {
      initAudio();
      if (isMuted) return;
      playTone(440, 'sine', 0.08, 0.1);
    }

    const melody = [
      { f: 392.00, d: 200 },
      { f: 440.00, d: 200 },
      { f: 523.25, d: 350 },
      { f: 440.00, d: 200 },
      { f: 523.25, d: 200 },
      { f: 587.33, d: 400 },
      { f: 523.25, d: 200 },
      { f: 392.00, d: 400 },
    ];
    let melodyIndex = 0;

    function startBGM() {
      if (bgmInterval || isMuted) return;
      melodyIndex = 0;
      bgmInterval = setInterval(() => {
        if (!isPlaying || isMuted) return;
        const note = melody[melodyIndex];
        playTone(note.f, 'sine', note.d / 1000, 0.04);
        melodyIndex = (melodyIndex + 1) % melody.length;
      }, 300);
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function triggerHaptic(type) {
      if (!('vibrate' in navigator)) return;
      if (type === 'success') navigator.vibrate([40, 60, 50]);
      else if (type === 'warning') navigator.vibrate(180);
      else if (type === 'click') navigator.vibrate(20);
    }

    /* 遊戲核心 */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const sanBar = document.getElementById('san-bar');
    const staBar = document.getElementById('sta-bar');
    const timeDisplay = document.getElementById('time-display');
    const dialogBox = document.getElementById('dialog-box');
    const dialogText = document.getElementById('dialog-text');
    const optionsContainer = document.getElementById('options-container');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let gameTime = 16.5 * 60;
    const targetTime = 17.0 * 60;
    const timeScale = 0.55;

    const player = {
      x: 80,
      y: 270,
      speed: 3.5,
      san: 100,
      maxSan: 100,
      sta: 100,
      maxSta: 100,
      facing: 'right',
      walkFrame: 0
    };

    let students = [];
    let activeStudent = null;
    let feedbackText = "";
    let feedbackTimer = 0;

    let moveLeft = false;
    let moveRight = false;

    const questionBank = [
      {
        text: "老師！我的腳踏車鑰匙掉在車棚，而且門口好像有怪人，我該怎麼辦？",
        options: [
          { text: "別怕！我陪你一起去車棚找，順便巡邏門口。(SAN +10)", san: 10, sta: -5 },
          { text: "先留在辦公室，我立刻去大門口巡查並調閱監視器。(STA -15)", san: 0, sta: -15 },
          { text: "去生輔組問失物招領，自己走路小心點啦。(SAN -15)", san: -15, sta: 0 }
        ]
      },
      {
        text: "老師，隔壁班同學放學要找人在校門口堵我，我不敢回家...",
        options: [
          { text: "這很危險！我聯絡生輔組跟導師，放學陪你走到校門！(STA -10)", san: 5, sta: -10 },
          { text: "先去會談室坐坐，我請雙方導師過來協調。(SAN -5)", san: -5, sta: -5 },
          { text: "你們平常不要去惹人家就沒事了嘛。(SAN -20)", san: -20, sta: 0 }
        ]
      },
      {
        text: "老師，我不小心在走廊打翻了泡麵，油油的怕大家滑倒...",
        options: [
          { text: "主動承認很棒！拿警示錐擋著，我們一起去拿拖把拖乾淨！(SAN +10)", san: 10, sta: -5 },
          { text: "去請衛生股長拿拖把，快點處理好。(SAN -5)", san: -5, sta: 0 },
          { text: "怎麼在走廊吃泡麵！罰你寫自白書！(SAN -20)", san: -20, sta: 0 }
        ]
      },
      {
        text: "老師，我的健保卡放在家裡，但胃痛到站不起來了...",
        options: [
          { text: "身體最要緊！不用管卡片，我背你去健康中心躺著！(STA -15)", san: 5, sta: -15 },
          { text: "我通知家長並幫你聯絡護理師拿急救箱。(SAN +5)", san: 5, sta: -5 },
          { text: "先喝點溫水，撐到放學再回家看醫生。(SAN -15)", san: -15, sta: 0 }
        ]
      }
    ];

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const actionBtn = document.getElementById('action-btn');

    const bindTouch = (elem, onPress, onRelease) => {
      elem.addEventListener('touchstart', (e) => { e.preventDefault(); triggerHaptic('click'); onPress(); });
      elem.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
      elem.addEventListener('mousedown', () => { triggerHaptic('click'); onPress(); });
      elem.addEventListener('mouseup', onRelease);
    };

    bindTouch(btnLeft, () => { moveLeft = true; player.facing = 'left'; }, () => { moveLeft = false; });
    bindTouch(btnRight, () => { moveRight = true; player.facing = 'right'; }, () => { moveRight = false; });

    actionBtn.addEventListener('click', () => {
      if (activeStudent && dialogBox.style.display === 'none') {
        playPopSound();
        triggerHaptic('click');
        openQuestion();
      }
    });

    function spawnStudent() {
      if (!isPlaying || students.length >= 2) return;
      students.push({
        x: 180 + Math.random() * 140,
        y: 285,
        hasQuestion: true,
        type: Math.floor(Math.random() * 2), // 0: 雙馬尾女生, 1: 呆毛男生
        bounce: Math.random() * Math.PI
      });
    }

    function openQuestion() {
      if (!activeStudent) return;
      const currentQuestion = questionBank[Math.floor(Math.random() * questionBank.length)];
      dialogText.innerText = currentQuestion.text;
      optionsContainer.innerHTML = '';

      currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt.text}`;
        btn.onclick = () => answerQuestion(opt);
        optionsContainer.appendChild(btn);
      });

      dialogBox.style.display = 'flex';
    }

    function answerQuestion(opt) {
      player.san = Math.max(0, Math.min(player.maxSan, player.san + opt.san));
      player.sta = Math.max(0, Math.min(player.maxSta, player.sta + opt.sta));

      if (opt.san >= 0) {
        playCorrectSound();
        triggerHaptic('success');
      } else {
        playWrongSound();
        triggerHaptic('warning');
      }

      let sign = opt.san >= 0 ? "+" : "";
      feedbackText = `回覆完成！ 理智 ${sign}${opt.san}`;
      feedbackTimer = 70;

      dialogBox.style.display = 'none';

      if (activeStudent) {
        activeStudent.hasQuestion = false;
        setTimeout(() => {
          students = students.filter(s => s !== activeStudent);
          activeStudent = null;
        }, 800);
      }

      if (player.san <= 0) {
        gameOver(false);
      }
    }

    function startGame() {
      initAudio();
      startBGM();
      modal.style.display = 'none';
      isPlaying = true;
      gameTime = 16.5 * 60;
      player.san = 100;
      player.sta = 100;
      player.x = 80;
      students = [];
      activeStudent = null;
      dialogBox.style.display = 'none';
      feedbackText = "";
      spawnStudent();
    }

    function gameOver(win) {
      isPlaying = false;
      stopBGM();
      modal.style.display = 'flex';
      dialogBox.style.display = 'none';

      if (win) {
        playCorrectSound();
        triggerHaptic('success');
        modalTitle.innerText = "🎉 順利平安下班！";
        modalTitle.style.color = "#10b981";
        modalDesc.innerHTML = "17:00 打卡鐘響起！ ⏰<br>你用滿滿的愛與耐心回答了所有孩子的問題！<br>守住了理智值，今天又是平安的一天！";
        startBtn.innerText = "明天再戰";
      } else {
        playWrongSound();
        triggerHaptic('warning');
        modalTitle.innerText = "💦 理智斷線加班中...";
        modalTitle.style.color = "#ef4444";
        modalDesc.innerHTML = "SAN 值歸零了！ 🥺<br>面對連環突發狀況與求助，精神徹底被榨乾，<br>今天只好多留下來喝杯奶茶寫報告了。";
        startBtn.innerText = "重新振作";
      }
    }

    let spawnTimer = 0;

    function update() {
      if (!isPlaying) return;

      gameTime += (1 / 60) * timeScale;
      let hours = Math.floor(gameTime / 60);
      let minutes = Math.floor(gameTime % 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

      if (gameTime >= targetTime) {
        gameOver(true);
        return;
      }

      let isMoving = false;
      if (dialogBox.style.display === 'none') {
        if (moveLeft) { player.x -= player.speed; isMoving = true; }
        if (moveRight) { player.x += player.speed; isMoving = true; }
      }

      if (isMoving) player.walkFrame += 0.2;
      else player.walkFrame = 0;

      player.x = Math.max(30, Math.min(canvas.width - 70, player.x));

      activeStudent = null;
      students.forEach(st => {
        let dist = Math.abs((player.x + 25) - (st.x + 20));
        if (dist < 55 && st.hasQuestion) {
          activeStudent = st;
        }
      });

      if (activeStudent && dialogBox.style.display === 'none') {
        actionBtn.style.background = "#fbbf24";
        actionBtn.style.color = "#7c2d12";
      } else {
        actionBtn.style.background = "#f97316";
        actionBtn.style.color = "#ffffff";
      }

      spawnTimer++;
      if (spawnTimer > 280) {
        spawnStudent();
        spawnTimer = 0;
      }

      sanBar.style.width = `${(player.san / player.maxSan) * 100}%`;
      staBar.style.width = `${(player.sta / player.maxSta) * 100}%`;

      if (feedbackTimer > 0) feedbackTimer--;
    }

    /* ========================================================
       超可愛手繪日系 Q 版角色繪製
       ======================================================== */

    // 繪製水汪汪大眼睛
    function drawCuteEye(x, y, radius, lookDir = 0) {
      ctx.save();
      // 外眼白
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 黑色眼珠
      ctx.fillStyle = '#2c1810';
      ctx.beginPath();
      ctx.arc(x + lookDir, y, radius * 0.75, 0, Math.PI * 2);
      ctx.fill();

      // 大高光
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x + lookDir - 1.5, y - 1.5, radius * 0.35, 0, Math.PI * 2);
      ctx.fill();

      // 小高光
      ctx.beginPath();
      ctx.arc(x + lookDir + 1.5, y + 1.5, radius * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 繪製可愛校安老師
    function drawCuteTeacher(x, y, facing, walkFrame) {
      ctx.save();
      ctx.translate(x, y);

      let bobY = Math.sin(walkFrame) * 3; // 走路上下彈跳
      let dir = facing === 'right' ? 1 : -1;

      // 影子
      ctx.fillStyle = 'rgba(120, 53, 15, 0.15)';
      ctx.beginPath();
      ctx.ellipse(25, 75, 20, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 腳
      let legOffset = Math.sin(walkFrame) * 5;
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.ellipse(18 + legOffset, 72, 5, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(32 - legOffset, 72, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // 身體 (小胖圓圓的便服)
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(10, 36 + bobY, 30, 32, 12);
      ctx.fill();
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 反光背心 (黃色小背心 + 綠條)
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.roundRect(11, 40 + bobY, 28, 22, 6);
      ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.fillRect(11, 48 + bobY, 28, 4);

      // 手持巡邏文件夾板
      ctx.fillStyle = '#d97706';
      ctx.fillRect(dir > 0 ? 32 : 6, 46 + bobY, 8, 12);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(dir > 0 ? 33 : 7, 47 + bobY, 6, 10);

      // Q版大頭 (圓滾滾臉頰)
      ctx.fillStyle = '#ffedd5'; // 溫暖膚色
      ctx.beginPath();
      ctx.arc(25, 22 + bobY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 可愛頭髮 (深咖啡色短髮)
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(25, 14 + bobY, 20, Math.PI, Math.PI * 2);
      ctx.fill();
      // 劉海小弧度
      ctx.beginPath();
      ctx.arc(18, 12 + bobY, 8, 0, Math.PI);
      ctx.arc(30, 12 + bobY, 9, 0, Math.PI);
      ctx.fill();

      // 校安小警帽
      ctx.fillStyle = '#1e3a8a';
      ctx.beginPath();
      ctx.ellipse(25, 5 + bobY, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f59e0b'; // 金色小帽徽
      ctx.beginPath();
      ctx.arc(25, 4 + bobY, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 大眼睛
      let lookOffset = dir * 1.5;
      drawCuteEye(19, 21 + bobY, 4, lookOffset);
      drawCuteEye(31, 21 + bobY, 4, lookOffset);

      // 粉嫩腮紅
      ctx.fillStyle = 'rgba(251, 113, 133, 0.5)';
      ctx.beginPath();
      ctx.arc(14, 26 + bobY, 3.5, 0, Math.PI * 2);
      ctx.arc(36, 26 + bobY, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // 溫柔微笑
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(25, 25 + bobY, 3, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    // 繪製可愛提問學生 (男生/女生兩種超萌外觀)
    function drawCuteStudent(st) {
      ctx.save();
      ctx.translate(st.x, st.y);

      st.bounce += 0.05;
      let bob = Math.sin(st.bounce) * 2.5;

      // 影子
      ctx.fillStyle = 'rgba(120, 53, 15, 0.15)';
      ctx.beginPath();
      ctx.ellipse(20, 68, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 小鞋子
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.ellipse(14, 65, 4, 3, 0, 0, Math.PI * 2);
      ctx.ellipse(26, 65, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 身體/校服
      if (st.type === 0) {
        // 女生：水手服短裙
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(9, 32 + bob, 22, 18, 5);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 深藍百褶裙
        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.moveTo(8, 48 + bob);
        ctx.lineTo(32, 48 + bob);
        ctx.lineTo(34, 58 + bob);
        ctx.lineTo(6, 58 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 紅色領結
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(20, 38 + bob, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 男生：白襯衫 + 小吊帶褲
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(9, 32 + bob, 22, 18, 5);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 咖啡色短褲
        ctx.fillStyle = '#854d0e';
        ctx.fillRect(10, 48 + bob, 20, 10);
        ctx.strokeRect(10, 48 + bob, 20, 10);
      }

      // Q 版大頭
      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(20, 20 + bob, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // 髮型
      if (st.type === 0) {
        // 雙馬尾小女孩
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.arc(20, 14 + bob, 17, Math.PI, Math.PI * 2);
        ctx.fill();
        // 瀏海
        ctx.beginPath();
        ctx.arc(15, 12 + bob, 6, 0, Math.PI);
        ctx.arc(25, 12 + bob, 6, 0, Math.PI);
        ctx.fill();
        // 兩側可愛小馬尾
        ctx.beginPath();
        ctx.arc(1, 18 + bob, 6, 0, Math.PI * 2);
        ctx.arc(39, 18 + bob, 6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 翹呆毛小正太
        ctx.fillStyle = '#374151';
        ctx.beginPath();
        ctx.arc(20, 14 + bob, 17, Math.PI, Math.PI * 2);
        ctx.fill();
        // 呆毛
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(20, 2 + bob);
        ctx.quadraticCurveTo(24, -8 + bob, 28, -2 + bob);
        ctx.stroke();
      }

      // 學生可愛大眼睛 (稍呈無辜圓形)
      drawCuteEye(15, 20 + bob, 3.5, 0);
      drawCuteEye(25, 20 + bob, 3.5, 0);

      // 腮紅
      ctx.fillStyle = 'rgba(254, 202, 202, 0.7)';
      ctx.beginPath();
      ctx.arc(11, 24 + bob, 3, 0, Math.PI * 2);
      ctx.arc(29, 24 + bob, 3, 0, Math.PI * 2);
      ctx.fill();

      // 小巧困惑的小嘴巴 (小圓點或嘟嘴)
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(20, 26 + bob, 2, 0, Math.PI * 2);
      ctx.fill();

      // 問號氣泡浮動 [❓]
      if (st.hasQuestion) {
        let qBob = Math.sin(st.bounce * 1.5) * 4;
        ctx.font = 'bold 22px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
        ctx.fillText("❓", 10, -5 + qBob);
      }

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 溫馨奶油黃學務處背景
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 地板
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(0, 340, canvas.width, canvas.height - 340);
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 340);
      ctx.lineTo(canvas.width, 340);
      ctx.stroke();

      // 窗戶與可愛藍天白雲
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.roundRect(240, 45, 120, 75, 10);
      ctx.fill();
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 窗外小雲朵
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(270, 75, 12, 0, Math.PI * 2);
      ctx.arc(285, 70, 15, 0, Math.PI * 2);
      ctx.arc(300, 75, 11, 0, Math.PI * 2);
      ctx.fill();

      // 佈告欄
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.roundRect(30, 70, 140, 85, 10);
      ctx.fill();
      ctx.strokeStyle = '#c2410c';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 可愛便條
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(45, 85, 30, 35);
      ctx.fillStyle = '#fbcfe8';
      ctx.fillRect(90, 95, 40, 30);

      // 海報字
      ctx.fillStyle = '#7c2d12';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText("平安下班", 245, 145);
      ctx.font = '12px sans-serif';
      ctx.fillText("溫馨校園 守護成長 💕", 225, 165);

      // 繪製學生
      students.forEach(st => drawCuteStudent(st));

      // 繪製校安老師
      drawCuteTeacher(player.x, player.y, player.facing, player.walkFrame);

      // 互動氣泡提示
      if (activeStudent && dialogBox.style.display === 'none') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(player.x - 15, player.y - 35, 80, 24, 8);
        ctx.fill();
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText("點擊 [對話] 💬", player.x - 9, player.y - 19);
      }

      // 飄字回饋
      if (feedbackTimer > 0) {
        ctx.fillStyle = '#059669';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(feedbackText, player.x - 20, player.y - 50);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
