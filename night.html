<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校安生存戰：今天也要平安下班！（可愛問答版）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #ffedd5;
      color: #475569;
      font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 500px;
      border: 6px solid #fbbf24;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
      background: #fef3c7;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 220px;
    }
    .bar-container {
      background: #fef08a;
      border: 3px solid #f59e0b;
      border-radius: 15px;
      height: 26px;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
      border-radius: 12px;
    }
    #san-bar { background: #f87171; }
    #sta-bar { background: #4ade80; }
    .bar-label {
      position: absolute;
      top: 1px;
      left: 10px;
      font-size: 13px;
      font-weight: 900;
      color: #78350f;
    }
    #clock-box {
      background: #ffffff;
      border: 4px solid #fb923c;
      border-radius: 15px;
      padding: 6px 16px;
      font-size: 20px;
      font-weight: 900;
      color: #ea580c;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 0 #fdba74;
    }
    #dialog-box {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #ffffff;
      border: 5px solid #f97316;
      border-radius: 20px;
      padding: 15px 20px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 0 #fed7aa;
      z-index: 5;
    }
    #dialog-title {
      font-size: 14px;
      font-weight: 900;
      color: #ea580c;
      background: #ffedd5;
      padding: 2px 10px;
      border-radius: 10px;
      align-self: flex-start;
    }
    #dialog-text {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
      line-height: 1.4;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-btn {
      background: #fef3c7;
      border: 3px solid #f59e0b;
      border-radius: 12px;
      padding: 8px 15px;
      font-size: 14px;
      font-weight: bold;
      color: #78350f;
      cursor: pointer;
      text-align: left;
      transition: all 0.1s ease;
    }
    .option-btn:hover {
      background: #fde047;
      transform: scale(1.01);
    }
    #controls-hint {
      position: absolute;
      top: 90px;
      left: 15px;
      font-size: 12px;
      font-weight: bold;
      color: #b45309;
      background: rgba(254, 243, 199, 0.8);
      padding: 4px 8px;
      border-radius: 8px;
      pointer-events: none;
    }
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(254, 243, 199, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #modal h1 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #ea580c;
      text-shadow: 2px 2px 0 #fed7aa;
    }
    #modal p {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 24px;
      color: #7c2d12;
      text-align: center;
      line-height: 1.6;
    }
    .cute-btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: 900;
      background: #f97316;
      color: #ffffff;
      border: 4px solid #7c2d12;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7c2d12;
      transition: all 0.1s ease;
    }
    .cute-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #7c2d12;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="ui-overlay">
      <div class="status-group">
        <div class="bar-container">
          <div id="san-bar" class="bar-fill"></div>
          <span class="bar-label">❤️ 理智值 (SAN)</span>
        </div>
        <div class="bar-container">
          <div id="sta-bar" class="bar-fill"></div>
          <span class="bar-label">👟 耐力值 (STA)</span>
        </div>
      </div>

      <div id="clock-box">
        <span style="font-size: 11px; color: #f97316; font-weight: bold;">離下班還剩</span>
        <span id="time-display">16:30</span>
      </div>
    </div>

    <div id="controls-hint">
      [A/D] 左右移動 | 靠近冒問號 [❓] 的同學按 [Space 空白鍵] 回答問題！
    </div>

    <!-- 學生問答對話框 -->
    <div id="dialog-box">
      <div id="dialog-title">💬 學生來問問題了！</div>
      <div id="dialog-text">老師，我剛剛在走廊奔跑，不小心撞倒了走廊的盆栽...怎麼辦？</div>
      <div class="options-list" id="options-container">
        <!-- 動態生成選項 -->
      </div>
    </div>

    <!-- 遊戲開始/結束 彈出視窗 -->
    <div id="modal">
      <h1 id="modal-title">今天也要平安下班！</h1>
      <p id="modal-desc">
        你是學務處最親切的校安老師！ 💖<br>
        在 17:00 下班前，到處巡視並回答同學們的各種疑難雜症。<br>
        做出正確的暖心回覆，保護你的理智，平安撐到打卡！
      </p>
      <button class="cute-btn" id="start-btn" onclick="startGame()">開始值勤 🎒</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const sanBar = document.getElementById('san-bar');
    const staBar = document.getElementById('sta-bar');
    const timeDisplay = document.getElementById('time-display');
    const dialogBox = document.getElementById('dialog-box');
    const dialogText = document.getElementById('dialog-text');
    const optionsContainer = document.getElementById('options-container');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let gameTime = 16.5 * 60; // 16:30 starts
    const targetTime = 17.0 * 60; // 17:00 ends
    const timeScale = 0.5; // 遊戲速度：30分鐘大約1分鐘真實時間

    // 玩家狀態 (Q版校安)
    const player = {
      x: 150,
      y: 350,
      width: 45,
      height: 70,
      speed: 4,
      san: 100,
      maxSan: 100,
      sta: 100,
      maxSta: 100,
      facing: 'right'
    };

    let students = [];
    let activeStudent = null; // 當前對話的學生
    let currentQuestion = null;
    let feedbackText = "";
    let feedbackTimer = 0;

    const keys = {};

    // 題庫設計
    const questionBank = [
      {
        text: "老師！我的車鑰匙掉在車棚，而且校門口有奇怪的人在看我，我該怎麼辦？",
        options: [
          { text: "別慌！我陪你一起去車棚找，並通知門口守衛留意。 (SAN +10)", san: 10, sta: -5 },
          { text: "你先留在辦公室，我立刻去大門口巡查，並幫你調閱監視器。 (STA -20)", san: 0, sta: -20 },
          { text: "鑰匙去生輔組問，門口的人可能是家長，自己小心喔。 (SAN -15)", san: -15, sta: 0 }
        ]
      },
      {
        text: "老師，我和隔壁班小強吵架了，他威脅放學要找人在校門口堵我...",
        options: [
          { text: "這很嚴重！我來聯絡雙方導師，放學時我也會去校門口站崗保護你。 (STA -15)", san: 5, sta: -15 },
          { text: "冷靜點，我們去諮商室談談，我來幫你們協調。 (SAN -5)", san: -5, sta: -5 },
          { text: "不要理他就好了啊，有事直接打電話報警。 (SAN -20)", san: -20, sta: 0 }
        ]
      },
      {
        text: "老師...我剛剛不小心把飲水機旁的垃圾桶撞倒了，垃圾掉了一地...",
        options: [
          { text: "沒關係，我們一起去拿掃把掃乾淨，下次小心點就好！ (SAN +10)", san: 10, sta: -5 },
          { text: "去跟班級導師拿工具，自己處理好。 (SAN -5)", san: -5, sta: 0 },
          { text: "怎麼這麼不小心！去罰站 10 分鐘！ (SAN -20)", san: -20, sta: 0 }
        ]
      },
      {
        text: "老師，我肚子好痛，但我的健保卡放在教室，可以直接去健康中心嗎？",
        options: [
          { text: "人命關天！不用管健保卡，我立刻扶你過去。 (STA -10)", san: 5, sta: -10 },
          { text: "我打電話請你們班導師把卡片拿下來，你先坐著休息。 (SAN +5)", san: 5, sta: -5 },
          { text: "自己走去健康中心，健保卡晚點再補啦。 (SAN -10)", san: -10, sta: 0 }
        ]
      }
    ];

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key.toLowerCase() === 'spacebar') {
        if (activeStudent && dialogBox.style.display === 'none') {
          openQuestion();
        }
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    function spawnStudent() {
      if (!isPlaying || students.length >= 3) return;
      students.push({
        x: 300 + Math.random() * 400,
        y: 350,
        width: 40,
        height: 60,
        hasQuestion: true,
        color: `hsl(${Math.random() * 360}, 70%, 70%)`
      });
    }

    function openQuestion() {
      if (!activeStudent) return;
      currentQuestion = questionBank[Math.floor(Math.random() * questionBank.length)];
      dialogText.innerText = currentQuestion.text;
      optionsContainer.innerHTML = '';

      currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt.text}`;
        btn.onclick = () => answerQuestion(opt);
        optionsContainer.appendChild(btn);
      });

      dialogBox.style.display = 'flex';
    }

    function answerQuestion(opt) {
      player.san = Math.max(0, Math.min(player.maxSan, player.san + opt.san));
      player.sta = Math.max(0, Math.min(player.maxSta, player.sta + opt.sta));

      // 產生回饋文字漂浮
      let effectSign = opt.san >= 0 ? "+" : "";
      feedbackText = `回覆完成！ 理智 ${effectSign}${opt.san} / 耐力 ${opt.sta}`;
      feedbackTimer = 90;

      dialogBox.style.display = 'none';

      // 移除該學生的問題
      if (activeStudent) {
        activeStudent.hasQuestion = false;
        // 讓學生走掉
        setTimeout(() => {
          students = students.filter(s => s !== activeStudent);
          activeStudent = null;
        }, 1000);
      }

      if (player.san <= 0) {
        gameOver(false);
      }
    }

    function startGame() {
      modal.style.display = 'none';
      isPlaying = true;
      gameTime = 16.5 * 60;
      player.san = 100;
      player.sta = 100;
      player.x = 150;
      students = [];
      activeStudent = null;
      dialogBox.style.display = 'none';
      feedbackText = "";

      // 預生一兩個學生
      spawnStudent();
      spawnStudent();
    }

    function gameOver(win) {
      isPlaying = false;
      modal.style.display = 'flex';
      dialogBox.style.display = 'none';
      if (win) {
        modalTitle.innerText = "🎉 平安下班！(可愛大勝利)";
        modalTitle.style.color = "#10b981";
        modalDesc.innerHTML = "17:00 打卡鐘聲響起！ ⏰<br>你用滿滿的愛與耐心回答了所有孩子的問題！<br>今天又是守護校園和平的一天，快回家休息吧！";
        startBtn.innerText = "再值勤一次";
      } else {
        modalTitle.innerText = "💦 理智線斷裂啦！";
        modalTitle.style.color = "#ef4444";
        modalDesc.innerHTML = "不...你的理智值（SAN）歸零了！ 🥺<br>面對孩子們的狂轟猛炸，今天需要多喝一杯珍奶才能平復了。<br>重新振作，再試一次吧！";
        startBtn.innerText = "再挑戰一次";
      }
    }

    let spawnTimer = 0;

    function update() {
      if (!isPlaying) return;

      // 時間推進
      gameTime += (1 / 60) * timeScale;
      let hours = Math.floor(gameTime / 60);
      let minutes = Math.floor(gameTime % 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

      if (gameTime >= targetTime) {
        gameOver(true);
        return;
      }

      // 左右移動 (對話時不允許移動)
      if (dialogBox.style.display === 'none') {
        if (keys['a'] || keys['arrowleft']) {
          player.x -= player.speed;
          player.facing = 'left';
        }
        if (keys['d'] || keys['arrowright']) {
          player.x += player.speed;
          player.facing = 'right';
        }
      }

      // 邊界限制
      player.x = Math.max(50, Math.min(canvas.width - 100, player.x));

      // 檢測與學生的距離
      activeStudent = null;
      students.forEach(st => {
        let dist = Math.abs((player.x + player.width/2) - (st.x + st.width/2));
        if (dist < 60 && st.hasQuestion) {
          activeStudent = st;
        }
      });

      // 隨機生成新學生
      spawnTimer++;
      if (spawnTimer > 300) {
        spawnStudent();
        spawnTimer = 0;
      }

      // 更新 UI
      sanBar.style.width = `${(player.san / player.maxSan) * 100}%`;
      staBar.style.width = `${(player.sta / player.maxSta) * 100}%`;

      if (feedbackTimer > 0) feedbackTimer--;
    }

    function render() {
      // 繪製溫馨背景（學務處）
      ctx.fillStyle = '#fef3c7'; // 鵝黃色背景
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 地板 (粉橘色)
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(0, 380, canvas.width, canvas.height - 380);
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 380);
      ctx.lineTo(canvas.width, 380);
      ctx.stroke();

      // 繪製背景裝飾（公佈欄、海報）
      ctx.fillStyle = '#fb923c';
      ctx.fillRect(80, 80, 200, 120); // 佈告欄
      ctx.strokeStyle = '#7c2d12';
      ctx.strokeRect(80, 80, 200, 120);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(100, 100, 40, 50); // 便條紙
      ctx.fillRect(160, 110, 50, 40);

      // 可愛插圖文字
      ctx.fillStyle = '#7c2d12';
      ctx.font = 'bold 20px "PingFang TC"';
      ctx.fillText("平安下班", 450, 100);
      ctx.font = '14px "PingFang TC"';
      ctx.fillText("安全第一", 450, 130);

      // 桌椅
      ctx.fillStyle = '#b45309';
      ctx.fillRect(50, 280, 110, 100); // 辦公桌

      // 繪製學生們
      students.forEach(st => {
        ctx.fillStyle = st.color;
        ctx.beginPath();
        // 身體 (圓角矩形)
        ctx.roundRect(st.x, st.y, st.width, st.height, 12);
        ctx.fill();
        ctx.strokeStyle = '#7c2d12';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 眼睛
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(st.x + 12, st.y + 20, 3, 0, Math.PI * 2);
        ctx.arc(st.x + 28, st.y + 20, 3, 0, Math.PI * 2);
        ctx.fill();

        // 紅暈
        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.arc(st.x + 8, st.y + 26, 3, 0, Math.PI * 2);
        ctx.arc(st.x + 32, st.y + 26, 3, 0, Math.PI * 2);
        ctx.fill();

        // [❓] 問號提示
        if (st.hasQuestion) {
          ctx.font = 'bold 24px Arial';
          ctx.fillStyle = '#ea580c';
          ctx.fillText("❓", st.x + 10, st.y - 10);
        }
      });

      // 繪製 Q 版玩家
      ctx.fillStyle = '#60a5fa'; // 藍色便服
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.width, player.height, 15);
      ctx.fill();
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 安全背心
      ctx.fillStyle = '#fde047';
      ctx.fillRect(player.x + 2, player.y + 25, player.width - 4, 25);
      ctx.fillStyle = '#10b981'; // 綠色反光條
      ctx.fillRect(player.x + 2, player.y + 35, player.width - 4, 4);

      // 五官 face
      ctx.fillStyle = '#000000';
      let eyeOffset = player.facing === 'right' ? 8 : -4;
      ctx.beginPath();
      ctx.arc(player.x + 20 + eyeOffset, player.y + 15, 3, 0, Math.PI * 2);
      ctx.arc(player.x + 32 + eyeOffset, player.y + 15, 3, 0, Math.PI * 2);
      ctx.fill();

      // 微笑
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.x + 26 + eyeOffset, player.y + 22, 4, 0, Math.PI);
      ctx.stroke();

      // 靠近提示
      if (activeStudent && dialogBox.style.display === 'none') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(player.x - 20, player.y - 40, 100, 26);
        ctx.strokeStyle = '#f97316';
        ctx.strokeRect(player.x - 20, player.y - 40, 100, 26);

        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 12px "PingFang TC"';
        ctx.fillText("按 [Space] 互動", player.x - 12, player.y - 23);
      }

      // 漂浮回饋文字
      if (feedbackTimer > 0) {
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 18px "PingFang TC"';
        ctx.fillText(feedbackText, player.x - 30, player.y - 60);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
