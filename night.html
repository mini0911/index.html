    let audioCtx = null;
    let bgmInterval = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudio() {
      initAudio();
      isMuted = !isMuted;
      document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🔊';
      if (isMuted) stopBGM();
      else if (isPlaying) startBGM();
    }

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (!audioCtx || isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    function playCorrectSound() {
      initAudio();
      if (isMuted) return;
      playTone(523.25, 'triangle', 0.1, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.12, 0.15), 80);
      setTimeout(() => playTone(783.99, 'triangle', 0.2, 0.2), 160);
    }

    function playWrongSound() {
      initAudio();
      if (isMuted) return;
      playTone(260, 'sawtooth', 0.15, 0.12);
      setTimeout(() => playTone(180, 'sawtooth', 0.25, 0.15), 100);
    }

    function playPopSound() {
      initAudio();
      if (isMuted) return;
      playTone(440, 'sine', 0.08, 0.1);
    }

      { f: 392.00, d: 200 },

      { f: 440.00, d: 200 },
      { f: 523.25, d: 200 },
      { f: 587.33, d: 400 },
      { f: 523.25, d: 200 },
      { f: 392.00, d: 400 },
    ];
    let melodyIndex = 0;

    function startBGM() {
      if (bgmInterval || isMuted) return;
      melodyIndex = 0;
      bgmInterval = setInterval(() => {
        if (!isPlaying || isMuted) return;
        const note = melody[melodyIndex];
        playTone(note.f, 'sine', note.d / 1000, 0.04);
        melodyIndex = (melodyIndex + 1) % melody.length;
      }, 300);
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

      if (!('vibrate' in navigator)) return;
      if (type === 'success') navigator.vibrate([40, 60, 50]);
      else if (type === 'warning') navigator.vibrate(180);
      else if (type === 'click') navigator.vibrate(20);

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const actionBtn = document.getElementById('action-btn');

    const bindTouch = (elem, onPress, onRelease) => {
      elem.addEventListener('touchstart', (e) => { e.preventDefault(); triggerHaptic('click'); onPress(); });
      elem.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
      elem.addEventListener('mousedown', () => { triggerHaptic('click'); onPress(); });
      elem.addEventListener('mouseup', onRelease);
    };

    bindTouch(btnLeft, () => { moveLeft = true; player.facing = 'left'; }, () => { moveLeft = false; });
    bindTouch(btnRight, () => { moveRight = true; player.facing = 'right'; }, () => { moveRight = false; });

    actionBtn.addEventListener('click', () => {
      if (activeStudent && dialogBox.style.display === 'none') {
        playPopSound();
        triggerHaptic('click');
        openQuestion();
      }
    });

    function spawnStudent() {
      if (!isPlaying || students.length >= 4) return;
      const slotX = 130 + Math.random() * 200;

      students.push({
        x: 420,
        y: 280,
        targetX: slotX,
        state: 'entering',
        type: Math.floor(Math.random() * 3), // 0: 雙馬尾妹妹, 1: 呆毛弟弟, 2: 圓眼鏡班長
        facing: 'left',
        walkFrame: 0,
        bounce: Math.random() * Math.PI,
        hasQuestion: false,
        mood: null,
        blinkTimer: 60 + Math.random() * 80
      });
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function openQuestion() {
      if (!activeStudent || activeStudent.state !== 'waiting') return;
      const currentQuestion = questionBank[Math.floor(Math.random() * questionBank.length)];
      dialogText.innerText = currentQuestion.text;
      optionsContainer.innerHTML = '';

      const shuffledOptions = shuffleArray(currentQuestion.options);

      shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt.text}`;
        btn.onclick = () => answerQuestion(opt);
        optionsContainer.appendChild(btn);
      });

      dialogBox.style.display = 'flex';
    }

    function answerQuestion(opt) {
      player.san = Math.max(0, Math.min(player.maxSan, player.san + opt.san));
      player.sta = Math.max(0, Math.min(player.maxSta, player.sta + opt.sta));

      if (opt.san >= 0) {
        playCorrectSound();
        triggerHaptic('success');
        feedbackText = "處置得宜，學生放心離開！ ❤️";
      } else {
        playWrongSound();
        triggerHaptic('warning');
        feedbackText = "處置不當，學生委屈離開... 💦";
      }

      feedbackTimer = 70;
      dialogBox.style.display = 'none';

      if (activeStudent) {
        activeStudent.state = 'leaving';
        activeStudent.hasQuestion = false;
        activeStudent.facing = 'right';
        activeStudent.mood = opt.san >= 0 ? 'happy' : 'sad';
        activeStudent = null;
      }

      if (player.san <= 0) {
        gameOver(false);
      }
    }

    function startGame() {
      initAudio();
      startBGM();
      modal.style.display = 'none';
      isPlaying = true;
      gameTime = 16.5 * 60;
      player.san = 100;
      player.sta = 100;
      player.x = 60;
      students = [];
      activeStudent = null;
      dialogBox.style.display = 'none';
      feedbackText = "";

      spawnStudent();
      setTimeout(spawnStudent, 800);
    }

    function gameOver(win) {
      isPlaying = false;
      stopBGM();
      modal.style.display = 'flex';
      dialogBox.style.display = 'none';

      if (win) {
        playCorrectSound();
        triggerHaptic('success');
        modalTitle.innerText = "🎉 順利平安下班！";
        modalTitle.style.color = "#10b981";
        modalDesc.innerHTML = "17:00 打卡鐘響起！ ⏰<br>你用滿滿的愛與專業解答了孩子們的煩惱！<br>守住了理智值，今天又是平安的一天！";
        startBtn.innerText = "明天再戰";
      } else {
        playWrongSound();
        triggerHaptic('warning');
        modalTitle.innerText = "💦 理智斷線加班中...";
        modalTitle.style.color = "#ef4444";
        modalDesc.innerHTML = "SAN 值歸零了！ 🥺<br>面對連環湧入的諮詢與問題，精神徹底被榨乾，<br>今天只好多留下來喝杯奶茶寫檢討報告了。";
        startBtn.innerText = "重新振作";
      }
    }

    let spawnTimer = 0;

    function update() {
      if (!isPlaying) return;

      gameTime += (1 / 60) * timeScale;
      let hours = Math.floor(gameTime / 60);
      let minutes = Math.floor(gameTime % 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

      if (gameTime >= targetTime) {
        gameOver(true);
        return;
      }

      /* 主角眨眼倒數 */
      player.blinkTimer--;
      if (player.blinkTimer <= 0) {
        player.blinkTimer = 100 + Math.random() * 80;
      }

      let isMoving = false;
      if (dialogBox.style.display === 'none') {
        if (moveLeft) { player.x -= player.speed; isMoving = true; }
        if (moveRight) { player.x += player.speed; isMoving = true; }
      }

      if (isMoving) player.walkFrame += 0.22;
      else player.walkFrame = 0;

      player.x = Math.max(20, Math.min(canvas.width - 70, player.x));

      for (let i = students.length - 1; i >= 0; i--) {
        const st = students[i];

        st.blinkTimer--;
        if (st.blinkTimer <= 0) {
          st.blinkTimer = 90 + Math.random() * 70;
        }

        if (st.state === 'entering') {
          st.x -= 2;
          st.facing = 'left';
          st.walkFrame += 0.22;
          if (st.x <= st.targetX) {
            st.state = 'waiting';
            st.hasQuestion = true;
            st.walkFrame = 0;
          }
        } else if (st.state === 'waiting') {
          st.bounce += 0.05;
        } else if (st.state === 'leaving') {
          st.x += 3.2;
          st.facing = 'right';
          st.walkFrame += 0.25;
          if (st.x > 440) {
            students.splice(i, 1);
            continue;
          }
        }
      }

      activeStudent = null;
      let minDistance = 55;
      students.forEach(st => {
        if (st.state === 'waiting' && st.hasQuestion) {
          let dist = Math.abs((player.x + 25) - (st.x + 20));
          if (dist < minDistance) {
            activeStudent = st;
            minDistance = dist;
          }
        }
      });

      if (activeStudent && dialogBox.style.display === 'none') {
        actionBtn.style.background = "#fbbf24";
        actionBtn.style.color = "#7c2d12";
      } else {
        actionBtn.style.background = "#f97316";
        actionBtn.style.color = "#ffffff";
      }

      spawnTimer++;
      if (spawnTimer > 130) {
        spawnStudent();
        spawnTimer = 0;
      }

      sanBar.style.width = `${(player.san / player.maxSan) * 100}%`;
      staBar.style.width = `${(player.sta / player.maxSta) * 100}%`;

      if (feedbackTimer > 0) feedbackTimer--;
    }

    /* ==========================================================
       全新超萌「二頭身（Chibi）」Q 版人物繪製引擎
       ========================================================== */

    // 超萌果凍感大眼（支援眨眼閉眼狀態）
    function drawChibiEye(x, y, radius, isBlinking = false, lookDir = 0) {
      ctx.save();
      if (isBlinking) {
        // 萌萌閉眼弧線 ( ^ )
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(x, y + 1, radius * 0.9, 1.1 * Math.PI, 1.9 * Math.PI);
        ctx.stroke();
      } else {
        // 圓滾滾大眼白
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        // 雙色果凍黑棕眼珠
        ctx.fillStyle = '#2c1810';
        ctx.beginPath();
        ctx.arc(x + lookDir, y, radius * 0.76, 0, Math.PI * 2);
        ctx.fill();

        // 瞳孔底部淡色光感
        ctx.fillStyle = '#6d4c41';
        ctx.beginPath();
        ctx.arc(x + lookDir, y + 1.2, radius * 0.45, 0, Math.PI);
        ctx.fill();

        // 大高光
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x + lookDir - 1.8, y - 1.6, radius * 0.38, 0, Math.PI * 2);
        ctx.fill();

        // 小反光
        ctx.beginPath();
        ctx.arc(x + lookDir + 1.5, y + 1.5, radius * 0.18, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 繪製【超萌二頭身校安老師】
    function drawCuteTeacher(x, y, facing, walkFrame, blinkTimer) {
      ctx.save();
      ctx.translate(x, y);

      let isBlinking = (blinkTimer > 0 && blinkTimer <= 6);
      let dir = facing === 'right' ? 1 : -1;

      // 走路企鵝小碎步左右微傾角 (Waddle)
      let tilt = (walkFrame !== 0) ? Math.sin(walkFrame) * 0.08 : 0;
      let bobY = (walkFrame !== 0) ? Math.abs(Math.sin(walkFrame)) * 3 : 0;

      ctx.rotate(tilt);

      // 地面小陰影
      ctx.fillStyle = 'rgba(120, 53, 15, 0.16)';
      ctx.beginPath();
      ctx.ellipse(25, 76, 18, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 小短腿 (饅頭腳)
      let legOffset = (walkFrame !== 0) ? Math.sin(walkFrame) * 4 : 0;
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.ellipse(19 + legOffset, 72, 4.5, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(31 - legOffset, 72, 4.5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // 二頭身小圓身 (深藍西服)
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(14, 40 + bobY, 22, 26, 9);
      ctx.fill();
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // 迷你黃色反光背心
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.roundRect(15, 44 + bobY, 20, 16, 5);
      ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.fillRect(15, 50 + bobY, 20, 3.5);

      // 抱在手上的迷你小板夾
      ctx.fillStyle = '#d97706';
      let boardX = dir > 0 ? 30 : 10;
      ctx.fillRect(boardX, 48 + bobY, 7, 10);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(boardX + 1, 49 + bobY, 5, 8);

      // 【超萌大圓臉】(半徑 22，極致二頭身肉肉臉)
      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(25, 23 + bobY, 21, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      // 澎澎圓短髮
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(25, 15 + bobY, 21, Math.PI, Math.PI * 2);
      ctx.fill();
      // 圓潤短瀏海
      ctx.beginPath();
      ctx.arc(17, 13 + bobY, 8.5, 0, Math.PI);
      ctx.arc(31, 13 + bobY, 9.5, 0, Math.PI);
      ctx.fill();

      // 校安小圓帽 (帶金色小警徽)
      ctx.fillStyle = '#1e3a8a';
      ctx.beginPath();
      ctx.ellipse(25, 5 + bobY, 17, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(25, 4 + bobY, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 超萌果凍大眼睛
      let lookOffset = dir * 1.5;
      drawChibiEye(18, 22 + bobY, 4.2, isBlinking, lookOffset);
      drawChibiEye(32, 22 + bobY, 4.2, isBlinking, lookOffset);

      // 軟萌粉紅心形感腮紅
      ctx.fillStyle = 'rgba(251, 113, 133, 0.55)';
      ctx.beginPath();
      ctx.ellipse(13, 27 + bobY, 3.8, 2.5, 0, 0, Math.PI * 2);
      ctx.ellipse(37, 27 + bobY, 3.8, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 溫柔微笑
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(25, 27 + bobY, 2.8, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    // 繪製【超萌二頭身學生（三款外觀）】
    function drawCuteStudent(st) {
      ctx.save();
      ctx.translate(st.x, st.y);

      let isBlinking = (st.blinkTimer > 0 && st.blinkTimer <= 6);
      let dir = st.facing === 'right' ? 1 : -1;
      let bob = (st.state === 'waiting') ? Math.sin(st.bounce) * 2.5 : Math.sin(st.walkFrame) * 2.8;
      let tilt = (st.state !== 'waiting') ? Math.sin(st.walkFrame) * 0.08 : 0;

      ctx.rotate(tilt);

      // 地面小陰影
      ctx.fillStyle = 'rgba(120, 53, 15, 0.16)';
      ctx.beginPath();
      ctx.ellipse(20, 68, 15, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 小短腳
      let legOffset = (st.state !== 'waiting') ? Math.sin(st.walkFrame) * 3.5 : 0;
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.ellipse(15 + legOffset, 65, 3.8, 3, 0, 0, Math.PI * 2);
      ctx.ellipse(25 - legOffset, 65, 3.8, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 背上的可愛小書包
      ctx.fillStyle = '#ef4444';
      let bagX = dir > 0 ? 5 : 27;
      ctx.beginPath();
      ctx.roundRect(bagX, 36 + bob, 7, 12, 3);
      ctx.fill();

      // 身體服裝 (二頭身小身型)
      if (st.type === 0) {
        // 0號：水手服短裙雙馬尾妹妹
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(11, 35 + bob, 18, 14, 4);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.moveTo(9, 48 + bob);
        ctx.lineTo(31, 48 + bob);
        ctx.lineTo(33, 56 + bob);
        ctx.lineTo(7, 56 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 粉紅大領結
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(20, 39 + bob, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (st.type === 1) {
        // 1號：吊帶短褲小正太
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(11, 35 + bob, 18, 14, 4);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = '#b45309';
        ctx.fillRect(12, 48 + bob, 16, 9);
        ctx.strokeRect(12, 48 + bob, 16, 9);
      } else {
        // 2號：抱著書的班長
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.roundRect(11, 35 + bob, 18, 16, 4);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // 抱在胸前的小字典
        ctx.fillStyle = '#10b981';
        ctx.fillRect(16, 42 + bob, 8, 10);
      }

      // 【二頭身大圓頭】(半徑 18.5)
      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(20, 20 + bob, 18.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 2.0;
      ctx.stroke();

      // 各式 Q 版髮型
      if (st.type === 0) {
        // 萌萌雙馬尾
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.arc(20, 13 + bob, 18.5, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(14, 11 + bob, 6.5, 0, Math.PI);
        ctx.arc(26, 11 + bob, 6.5, 0, Math.PI);
        ctx.fill();
        // 蓬鬆側馬尾
        ctx.beginPath();
        ctx.arc(0, 17 + bob, 6.5, 0, Math.PI * 2);
        ctx.arc(40, 17 + bob, 6.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (st.type === 1) {
        // 俏皮呆毛短髮
        ctx.fillStyle = '#374151';
        ctx.beginPath();
        ctx.arc(20, 13 + bob, 18.5, Math.PI, Math.PI * 2);
        ctx.fill();
        // 搖擺呆毛
        let hairSway = Math.sin(st.bounce * 2) * 2;
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(20, 1 + bob);
        ctx.quadraticCurveTo(24 + hairSway, -8 + bob, 29 + hairSway, -2 + bob);
        ctx.stroke();
      } else {
        // 乖巧齊瀏海
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(20, 13 + bob, 18.5, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(8, 9 + bob, 24, 7);
      }

      // 果凍大眼睛
      let eyeDir = dir * 1.5;
      drawChibiEye(15, 21 + bob, 3.8, isBlinking, eyeDir);
      drawChibiEye(26, 21 + bob, 3.8, isBlinking, eyeDir);

      // 班長的圓圓黑框眼鏡
      if (st.type === 2 && !isBlinking) {
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(15, 21 + bob, 4.5, 0, Math.PI * 2);
        ctx.arc(26, 21 + bob, 4.5, 0, Math.PI * 2);
        ctx.moveTo(19.5, 21 + bob);
        ctx.lineTo(21.5, 21 + bob);
        ctx.stroke();

      // 萌萌腮紅
      ctx.fillStyle = 'rgba(254, 202, 202, 0.75)';
      ctx.beginPath();
      ctx.arc(11, 26 + bob, 3.2, 0, Math.PI * 2);
      ctx.arc(30, 26 + bob, 3.2, 0, Math.PI * 2);
      ctx.fill();

      // 小巧困惑的小嘟嘴
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(20.5, 27 + bob, 2, 0, Math.PI * 2);
      ctx.fill();

      // 頭頂問號浮動
      if (st.hasQuestion && st.state === 'waiting') {
        let qBob = Math.sin(st.bounce * 1.6) * 4;
        ctx.font = 'bold 22px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
        ctx.fillText("❓", 10, -5 + qBob);
      }

      // 離開時心情特效
      if (st.state === 'leaving') {
        ctx.font = 'bold 18px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
        if (st.mood === 'happy') {
          ctx.fillText("💖", 12, -4);
        } else {
          ctx.fillText("💦", 12, -4);
        }
      }

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 溫馨木質地板
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(0, 340, canvas.width, canvas.height - 340);
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 340);
      ctx.lineTo(canvas.width, 340);
      ctx.stroke();

      // 出入大門
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(360, 180, 40, 160);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      ctx.strokeRect(360, 180, 40, 160);
      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText("大門", 368, 205);

      // 窗戶與藍天小雲朵
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.roundRect(170, 45, 120, 75, 10);
      ctx.fill();
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(200, 75, 12, 0, Math.PI * 2);
      ctx.arc(215, 70, 15, 0, Math.PI * 2);
      ctx.arc(230, 75, 11, 0, Math.PI * 2);
      ctx.fill();

      // 佈告欄
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.roundRect(20, 70, 120, 85, 10);
      ctx.fill();
      ctx.strokeStyle = '#c2410c';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#fef08a';
      ctx.fillRect(32, 85, 25, 30);
      ctx.fillStyle = '#fbcfe8';
      ctx.fillRect(70, 95, 35, 25);

      ctx.fillStyle = '#7c2d12';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText("平安下班", 310, 100);
      ctx.font = '11px sans-serif';
      ctx.fillText("愛心守護", 315, 120);

      // 繪製 Q 版學生群
      students.forEach(st => drawCuteStudent(st));

      // 繪製 Q 版校安老師
      drawCuteTeacher(player.x, player.y, player.facing, player.walkFrame, player.blinkTimer);

      // 提示氣泡
      if (activeStudent && dialogBox.style.display === 'none') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(player.x - 15, player.y - 35, 80, 24, 8);
        ctx.fill();
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText("點擊 [對話] 💬", player.x - 9, player.y - 19);
      }

      // 飄字
      if (feedbackTimer > 0) {
        ctx.fillStyle = feedbackText.includes("放心") ? '#059669' : '#dc2626';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(feedbackText, player.x - 45, player.y - 50);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
