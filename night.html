<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】Mapillary 實境恐怖生還戰</title>

<!-- 開源雷達地圖 Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 開源街景引擎 MapillaryJS -->
<link href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" rel="stylesheet" />
<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }

  #viewport-rig {
    position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
  }

  /* Mapillary 街景畫布容器 */
  #mly-container {
    flex: 1; width: 100%; height: 100%; position: relative; background: #080808;
    /* 恐怖夜視濾鏡：黑夜反轉、去飽和、深暗高對比 */
    filter: invert(90%) hue-rotate(180deg) contrast(140%) saturate(15%) brightness(65%);
  }
  .mapillary-attribution-container, .mapillary-sequence-container {
    opacity: 0.15 !important;
  }

  /* 恐怖 VHS 掃描線與暗紅暗角 */
  .vhs-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(20, 0, 0, 0.6) 80%, rgba(0, 0, 0, 0.95) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
    background-size: 100% 100%, 100% 4px;
    pointer-events: none; z-index: 50;
  }

  /* 準心 */
  .center-crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 48px; height: 48px; border: 2px dashed rgba(255, 60, 60, 0.7);
    border-radius: 50%; pointer-events: none; z-index: 60;
  }

  /* 釘在真實道路街景上的惡靈實體 */
  #ghost-anchor {
    position: absolute; width: 130px; height: 190px;
    transform: translate(-50%, -50%); pointer-events: auto;
    cursor: pointer; display: none; z-index: 70;
  }
  .ghost-shadow {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 35%, rgba(255, 0, 0, 0.95) 0%, rgba(50, 0, 0, 0.8) 55%, transparent 80%);
    filter: blur(4px); animation: ghostBreathe 1s infinite alternate;
  }
  .ghost-eyes {
    position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 22px;
  }
  .ghost-eye {
    width: 12px; height: 18px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 12px #ff0000;
  }
  @keyframes ghostBreathe {
    0% { transform: scale(0.95); opacity: 0.8; }
    100% { transform: scale(1.06); opacity: 1; }
  }

  /* 怪物逼近危險邊框閃爍 */
  #danger-border {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    box-shadow: inset 0 0 0px rgba(255, 0, 0, 0);
    pointer-events: none; z-index: 80; transition: box-shadow 0.2s;
  }
  .danger-pulse {
    animation: dangerGlow 0.6s infinite alternate !important;
  }
  @keyframes dangerGlow {
    0% { box-shadow: inset 0 0 25px rgba(255, 0, 0, 0.4); }
    100% { box-shadow: inset 0 0 70px rgba(255, 0, 0, 0.95); }
  }

  /* 頂部 HUD */
  .hud-header {
    height: 48px; background: rgba(13, 17, 23, 0.9);
    border-bottom: 2px solid #30363d; display: flex;
    justify-content: space-between; align-items: center;
    padding: 0 16px; z-index: 1000; position: absolute; top: 0; left: 0; width: 100%;
  }
  .hud-title {
    font-size: 13px; letter-spacing: 2px; color: #ff5555; font-weight: bold;
    display: flex; align-items: center; gap: 8px;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: #ff2222; border-radius: 50%;
    box-shadow: 0 0 8px #ff0000; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  .status-badges { display: flex; gap: 6px; }
  .badge {
    font-size: 11px; color: #8b949e; background: #161b22;
    padding: 3px 6px; border-radius: 4px; border: 1px solid #30363d;
  }
  .badge.hp { color: #ff4444; border-color: #772222; font-weight: bold; }
  .badge.stalker { color: #ff9900; border-color: #774400; font-weight: bold; }

  /* 左下角小地圖 (Minimap) */
  #minimap-wrapper {
    position: absolute; bottom: 155px; left: 14px;
    width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid #555; overflow: hidden; z-index: 100;
    box-shadow: 0 0 15px rgba(0,0,0,0.9);
  }
  #map { width: 100%; height: 100%; }
  .leaflet-tile {
    filter: invert(100%) hue-rotate(180deg) brightness(75%) contrast(120%) !important;
  }

  /* 室內方向模擬鍵盤 */
  .sim-controls {
    position: absolute; right: 12px; bottom: 155px; z-index: 999;
    display: grid; grid-template-columns: repeat(3, 34px);
    grid-template-rows: repeat(2, 34px); gap: 4px;
  }
  .sim-btn {
    background: rgba(13, 17, 23, 0.85); border: 1px solid #30363d; color: #c9d1d9;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; border-radius: 4px; font-size: 12px;
  }

  /* 底部面板與對講機 */
  .hud-footer {
    height: 145px; background: rgba(13, 17, 23, 0.95);
    border-top: 2px solid #30363d; padding: 10px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    z-index: 1000;
  }
  .radio-channel {
    display: flex; justify-content: space-between; font-size: 11px; color: #f0883e;
  }
  .radio-bubble {
    background: #161b22; border: 1px solid #21262d; border-left: 3px solid #ff5555;
    padding: 6px 10px; font-size: 12px; color: #c9d1d9; line-height: 1.4;
    min-height: 44px; border-radius: 4px;
  }
  .controls { display: flex; justify-content: space-between; align-items: center; }
  .step-info { font-size: 12px; color: #58a6ff; line-height: 1.3; }

  .btn-action {
    background: #b62324; border: 1px solid #e05252; color: #fff;
    padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 4px;
    cursor: pointer; transition: 0.2s;
  }
  .btn-action:disabled {
    background: #21262d; border-color: #30363d; color: #484f58; cursor: not-allowed;
  }

  /* 20秒降靈戰倒數條 */
  #battle-bar {
    position: absolute; top: 54px; left: 16px; right: 16px; z-index: 100;
    display: none; flex-direction: column; gap: 4px;
  }
  .battle-timer {
    display: flex; justify-content: space-between; font-size: 12px; color: #ffff33;
    font-weight: bold; text-shadow: 0 0 6px #ffaa00;
  }
  .battle-progress {
    width: 100%; height: 6px; background: #331111; border-radius: 3px; overflow: hidden;
  }
  .battle-fill {
    height: 100%; width: 100%; background: #ff3333; transition: width 0.1s linear;
  }

  /* 開場視窗 */
  #modal-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #050508; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #modal-mask h1 { color: #ff4444; font-size: 22px; margin-bottom: 12px; }
  #modal-mask p { font-size: 13px; color: #8b949e; line-height: 1.6; margin-bottom: 22px; max-width: 380px; }
  .btn-main {
    background: #b62324; border: none; color: #fff; padding: 12px 28px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 15px rgba(255,0,0,0.4);
  }
</style>
</head>
<body>

<div id="viewport-rig">
  <div class="hud-header">
    <div class="hud-title">
      <div class="pulse-dot"></div>
      <span>MAPILLARY 實景生還戰</span>
    </div>
    <div class="status-badges">
      <div class="badge hp" id="hp-badge">HP: 100/100</div>
      <div class="badge stalker" id="monster-badge">鬼魅: 追擊中 (55m)</div>
      <div class="badge" id="step-badge">步數: 0</div>
    </div>
  </div>

  <!-- Mapillary 街景畫布 -->
  <div id="mly-container"></div>
  <div class="vhs-overlay"></div>
  <div class="center-crosshair"></div>
  <div id="danger-border"></div>

  <!-- 20 秒戰鬥倒數條 -->
  <div id="battle-bar">
    <div class="battle-timer">
      <span>⚠ 結界破裂倒數</span>
      <span id="battle-timer-text">20.0s</span>
    </div>
    <div class="battle-progress">
      <div class="battle-fill" id="battle-timer-fill"></div>
    </div>
  </div>

  <!-- 錨定於真實街景中的惡靈實體 -->
  <div id="ghost-anchor" onclick="triggerExorcism()">
    <div class="ghost-shadow"></div>
    <div class="ghost-eyes">
      <div class="ghost-eye"></div>
      <div class="ghost-eye"></div>
    </div>
  </div>

  <!-- 左下角戰術小地圖 -->
  <div id="minimap-wrapper">
    <div id="map"></div>
  </div>

  <!-- 方向模擬鍵 (室內測試) -->
  <div class="sim-controls">
    <div></div>
    <button class="sim-btn" onclick="simMove(0, 0.00015)">▲</button>
    <div></div>
    <button class="sim-btn" onclick="simMove(-0.00015, 0)">◄</button>
    <button class="sim-btn" onclick="simMove(0, -0.00015)">▼</button>
    <button class="sim-btn" onclick="simMove(0.00015, 0)">►</button>
  </div>

  <!-- 底部面板 -->
  <div class="hud-footer">
    <div class="radio-channel">
      <span>對講機 [CH-9] 隊長</span>
      <span style="color: #00ff88;">引擎: MapillaryJS (已啟用)</span>
    </div>
    <div class="radio-bubble" id="radio-msg">
      「已連線至你身旁的真實道路街景！背後有東西在用時速 11 公里追趕你！轉動畫面找出惡靈！」
    </div>
    <div class="controls">
      <div class="step-info" id="status-desc">
        距離結界: 計算中...<br>現地步數檢驗: 0 / 20 步
      </div>
      <button class="btn-action" id="interact-btn" disabled onclick="startExorcismBattle()">
        開啟 20 秒生死降靈戰
      </button>
    </div>
  </div>

  <!-- 開場視窗 -->
  <div id="modal-mask">
    <h1>靜安怪談：Mapillary 整合版</h1>
    <p>
      <b>整合真實道路全景 ＋ 實體步態防作弊 ＋ 3m/s 追逐：</b><br>
      主畫面調用真實道路實景，背後怪物持續以 3m/s 追趕。<br>
      請允許「相機」、「定位」與「動作感測」權限，拔足奔跑！
    </p>
    <button class="btn-main" onclick="initExperience()">授權感測並出發</button>
  </div>
</div>

<script>
// ⭐ 已填入你的專屬 Mapillary Client Token
const MAPILLARY_CLIENT_TOKEN = "MLY|28733254389675887|86d28fb76c4cd708f49749d1d979baf4";

// 經典備援實景 ID (台灣台北市區街景)
const BACKUP_IMAGE_ID = "498763468214164";

/* ==================== 音效引擎 ==================== */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(65, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
  }
  heartbeat() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(50, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.15);
  }
  roar() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(450, this.ctx.currentTime + 0.2);
    g.gain.setValueAtTime(0.8, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.8);
  }
  chime() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(523, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046, this.ctx.currentTime + 0.5);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.5);
  }
}
const sfx = new SoundEngine();

/* ==================== 狀態與關卡配置 ==================== */
let mlyViewer = null;
let playerHP = 100;
let totalSteps = 0, zoneSteps = 0;
const REQUIRED_STEPS = 20;

let userLat = 25.0418, userLng = 121.5436; // 預設台北核心座標
let map, userMarker;
let currentStage = 0;
let questPoints = [];

// 3.0 m/s 怪物即時追逐
let monsterLat = 0, monsterLng = 0;
let monsterMarker = null;
const MONSTER_SPEED_MPS = 3.0;
let lastFrameTime = performance.now();
let lastHeartbeatTime = 0;

// 20 秒戰鬥倒數
let isBattleActive = false;
let battleTimeLeft = 20.0;
let battleTimer = null;

const QUESTS = [
  { name: "第一結界：轉角長椅的水鬼怨氣", offset: [0.00045, 0.00035], ghostBearing: 55 },
  { name: "第二結界：巡邏員的失落制服", offset: [-0.00055, 0.00045], ghostBearing: 165 },
  { name: "終極結界：靜安核心惡靈母體", offset: [0.00065, -0.00035], ghostBearing: 295 }
];

/* ==================== 啟動與初始化 ==================== */
function initExperience() {
  document.getElementById('modal-mask').style.display = 'none';
  sfx.init();
  setupMotionDetection();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
        setupMinimap();
        searchNearbyStreetView(userLat, userLng);
      },
      () => {
        setupMinimap();
        searchNearbyStreetView(userLat, userLng);
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else {
    setupMinimap();
    searchNearbyStreetView(userLat, userLng);
  }
}

// 1. 透過經緯度向 Mapillary 搜尋最近真實街景
async function searchNearbyStreetView(lat, lng) {
  const delta = 0.0015; // 約 150m 半徑
  const bbox = `${lng - delta},${lat - delta},${lng + delta},${lat + delta}`;
  const url = `https://graph.mapillary.com/images?access_token=${MAPILLARY_CLIENT_TOKEN}&fields=id,geometry&bbox=${bbox}&limit=1`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      loadMapillary(data.data[0].id, "【已成功抓取身旁的真實道路街景！】");
    } else {
      loadMapillary(BACKUP_IMAGE_ID, "【深巷無街景車圖資，已為你載入最近的主要幹道實景！】");
    }
  } catch (err) {
    loadMapillary(BACKUP_IMAGE_ID, "【連線至備用街景實景！】");
  }
}

// 2. 建立 MapillaryJS 全景實例
function loadMapillary(imageId, hintText) {
  const { Viewer } = mapillary;

  mlyViewer = new Viewer({
    accessToken: MAPILLARY_CLIENT_TOKEN,
    container: 'mly-container',
    imageId: imageId,
    component: { cover: false, direction: false, sequence: false }
  });

  document.getElementById('radio-msg').innerText = hintText;

  // 監聽視角轉向 (POV)，同步惡靈螢幕座標
  mlyViewer.on('pov', updateGhostOverlay);
  window.addEventListener('resize', updateGhostOverlay);
  updateGhostOverlay();
}

// 3. 視角投影運算：將惡靈固定在真實街道方位角 (Heading)
function updateGhostOverlay() {
  if (!mlyViewer) return;

  mlyViewer.getPointOfView().then(pov => {
    const stage = document.getElementById('viewport-rig');
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const targetBearing = QUESTS[currentStage].ghostBearing;

    let diff = targetBearing - (pov.bearing || 0);
    while (diff < -180) diff += 360;
    while (diff > 180) diff -= 360;

    const ghostEl = document.getElementById('ghost-anchor');
    const hFov = 75; // 視野約 75 度

    if (Math.abs(diff) < hFov / 2) {
      const screenX = (w / 2) + (diff / (hFov / 2)) * (w / 2);
      ghostEl.style.display = 'block';
      ghostEl.style.left = `${screenX}px`;
      ghostEl.style.top = `${h * 0.52}px`;
    } else {
      ghostEl.style.display = 'none';
    }
  });
}

/* ==================== 小地圖與 3.0 m/s 追逐循環 ==================== */
function setupMinimap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([userLat, userLng], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  const playerIcon = L.divIcon({
    html: '<div style="width:10px;height:10px;background:#00ff88;border-radius:50%;"></div>',
    iconSize: [10, 10], iconAnchor: [5, 5]
  });
  userMarker = L.marker([userLat, userLng], { icon: playerIcon }).addTo(map);

  monsterLat = userLat - 0.00045;
  monsterLng = userLng - 0.0003;
  const monsterIcon = L.divIcon({
    html: '<div style="width:12px;height:12px;background:#ff0000;border-radius:50%;"></div>',
    iconSize: [12, 12], iconAnchor: [6, 6]
  });
  monsterMarker = L.marker([monsterLat, monsterLng], { icon: monsterIcon }).addTo(map);

  questPoints = QUESTS.map(q => {
    const qLat = userLat + q.offset[0], qLng = userLng + q.offset[1];
    return { ...q, lat: qLat, lng: qLng };
  });

  updateDistancesAndSteps();
  requestAnimationFrame(monsterChaseLoop);
}

function monsterChaseLoop(now) {
  const dt = (now - lastFrameTime) / 1000;
  lastFrameTime = now;

  if (!isBattleActive && currentStage < questPoints.length) {
    const dist = getDistanceMeters(monsterLat, monsterLng, userLat, userLng);
    document.getElementById('monster-badge').innerText = `鬼魅: 追擊中 (${dist}m)`;

    // 向量追趕 (3.0 m/s)
    if (dist > 1.5) {
      const stepDist = MONSTER_SPEED_MPS * dt;
      const ratio = Math.min(1.0, stepDist / dist);
      monsterLat += (userLat - monsterLat) * ratio;
      monsterLng += (userLng - monsterLng) * ratio;
      if (monsterMarker) monsterMarker.setLatLng([monsterLat, monsterLng]);
    }

    // 多段距離危險警示
    const dangerBorder = document.getElementById('danger-border');
    if (dist < 10) {
      dangerBorder.classList.add('danger-pulse');
      if (now - lastHeartbeatTime > 450) {
        lastHeartbeatTime = now;
        sfx.heartbeat();
        if ("vibrate" in navigator) navigator.vibrate([40, 80, 40]);
      }
    } else if (dist < 25) {
      dangerBorder.classList.remove('danger-pulse');
      dangerBorder.style.boxShadow = "inset 0 0 30px rgba(255, 100, 0, 0.4)";
    } else {
      dangerBorder.classList.remove('danger-pulse');
      dangerBorder.style.boxShadow = "none";
    }

    // 近身撕咬 (小於 4 米)
    if (dist <= 4) {
      sfx.roar();
      if ("vibrate" in navigator) navigator.vibrate([100, 50, 200, 50, 400]);
      playerHP = Math.max(0, playerHP - 30);
      document.getElementById('hp-badge').innerText = `HP: ${playerHP}/100`;
      monsterLat -= 0.00035; // 擊退給喘息機會
      alert(`【遭惡靈撲咬！】背後遭到暴擊！損失 30 HP！剩餘: ${playerHP}。快邁開腳步！`);
    }
  }

  requestAnimationFrame(monsterChaseLoop);
}

/* ==================== 步態感測與位移 ==================== */
function setupMotionDetection() {
  window.addEventListener('devicemotion', (e) => {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;
    const mag = Math.hypot(acc.x, acc.y, acc.z);
    if (Math.abs(mag - 9.8) > 3.0) registerStep();
  });
}

function registerStep() {
  totalSteps++; zoneSteps++;
  sfx.step();
  if ("vibrate" in navigator) navigator.vibrate(25);
  document.getElementById('step-badge').innerText = `步數: ${totalSteps}`;
  updateDistancesAndSteps();
}

function simMove(dLng, dLat) {
  userLat += dLat; userLng += dLng;
  userMarker.setLatLng([userLat, userLng]);
  map.panTo([userLat, userLng]);
  registerStep();
}

function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2) * Math.sin(dl/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function updateDistancesAndSteps() {
  if (currentStage >= questPoints.length) {
    document.getElementById('radio-msg').innerText = "「所有結界皆已完全封印！你甩開了惡靈，走出永夜。」";
    document.getElementById('interact-btn').disabled = true;
    return;
  }
  const q = questPoints[currentStage];
  const d = getDistanceMeters(userLat, userLng, q.lat, q.lng);
  const btn = document.getElementById('interact-btn');

  document.getElementById('status-desc').innerHTML =
    `距離結界: <b>${d}m</b><br>現地步數檢驗: <b>${zoneSteps} / ${REQUIRED_STEPS}</b> 步`;

  if (d <= 18 && zoneSteps >= REQUIRED_STEPS) {
    btn.disabled = false;
    btn.innerText = "【步數達標】開啟 20 秒生死降靈戰";
  } else {
    btn.disabled = true;
    btn.innerText = d > 18 ? `步行靠近中 (差 ${d}m)` : `現場踏步中 (差 ${REQUIRED_STEPS - zoneSteps} 步)`;
  }
}

/* ==================== 20 秒極限降靈戰 ==================== */
function startExorcismBattle() {
  isBattleActive = true;
  battleTimeLeft = 20.0;
  document.getElementById('battle-bar').style.display = 'flex';
  document.getElementById('radio-msg').innerText = "「降靈結界已開啟！轉動畫面將準星對準惡靈，並直接點擊它封印！」";

  battleTimer = setInterval(() => {
    battleTimeLeft -= 0.1;
    document.getElementById('battle-timer-text').innerText = `${battleTimeLeft.toFixed(1)}s`;
    document.getElementById('battle-timer-fill').style.width = `${(battleTimeLeft / 20.0) * 100}%`;

    if (battleTimeLeft <= 0) {
      clearInterval(battleTimer);
      sfx.roar();
      if ("vibrate" in navigator) navigator.vibrate([100, 50, 200, 50, 400]);
      playerHP = Math.max(0, playerHP - 40);
      document.getElementById('hp-badge').innerText = `HP: ${playerHP}/100`;
      document.getElementById('battle-bar').style.display = 'none';
      isBattleActive = false;
      zoneSteps = 0;
      alert(`【降靈超時失敗！】惡靈暴怒反噬！受到 40 點傷害！剩餘 HP: ${playerHP}`);
      updateDistancesAndSteps();
    }
  }, 100);
}

function triggerExorcism() {
  if (!isBattleActive) return;
  clearInterval(battleTimer);
  sfx.chime();
  document.getElementById('battle-bar').style.display = 'none';
  isBattleActive = false;

  alert(`【除靈成功！】\n在剩餘 ${battleTimeLeft.toFixed(1)} 秒內，成功將潛伏在街景中的惡靈徹底驅散！`);
  currentStage++;
  zoneSteps = 0;

  // 擊退追趕怪
  monsterLat = userLat - 0.0005;
  monsterLng = userLng - 0.0004;

  updateDistancesAndSteps();
  updateGhostOverlay();
}
</script>
