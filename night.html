<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校安生存戰：今天也要平安下班！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 4px solid #f59e0b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background: #334155;
    }
    canvas {
      display: block;
      background: #1e293b;
    }
    #ui-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 220px;
    }
    .bar-container {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #64748b;
      border-radius: 4px;
      height: 18px;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }
    #san-bar { background: #ef4444; }
    #sta-bar { background: #10b981; }
    .bar-label {
      position: absolute;
      top: 0;
      left: 6px;
      font-size: 11px;
      line-height: 18px;
      color: #fff;
    }
    #clock-box {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #f59e0b;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 20px;
      color: #fbbf24;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #controls-hint {
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
    }
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #modal h1 {
      font-size: 32px;
      margin-bottom: 12px;
      color: #f59e0b;
    }
    #modal p {
      font-size: 15px;
      margin-bottom: 24px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.6;
    }
    button {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      background: #f59e0b;
      color: #1e293b;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #fbbf24;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="ui-overlay">
      <div class="status-group">
        <div class="bar-container">
          <div id="san-bar" class="bar-fill"></div>
          <span class="bar-label">理智值 (SAN)</span>
        </div>
        <div class="bar-container">
          <div id="sta-bar" class="bar-fill"></div>
          <span class="bar-label">耐力 (STA)</span>
        </div>
      </div>

      <div id="clock-box">
        <span style="font-size: 11px; color: #94a3b8;">離下班還剩</span>
        <span id="time-display">16:30</span>
      </div>
    </div>

    <div id="controls-hint">
      [W/A/S/D 或 方向鍵] 移動 | [Shift] 衝刺 | [J 或 空白鍵] 大聲公驅散 | [K] 反光背心護盾
    </div>

    <div id="modal">
      <h1 id="modal-title">今天也要平安下班！</h1>
      <p id="modal-desc">
        你是學務處的值勤校安人員。<br>
        堅持到 17:00 準時打卡下班！<br>
        閃避學生衝突、公文追殺與投訴音波，保護你岌岌可危的理智值。
      </p>
      <button id="start-btn" onclick="startGame()">開始值勤</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const sanBar = document.getElementById('san-bar');
    const staBar = document.getElementById('sta-bar');
    const timeDisplay = document.getElementById('time-display');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let gameTime = 16.5 * 60; // 16:30 in minutes
    const targetTime = 17.0 * 60; // 17:00 in minutes
    let timeScale = 0.5; // Game speed: 30 in-game minutes takes ~60 seconds

    // Player state
    const player = {
      x: 400,
      y: 250,
      radius: 16,
      speed: 3.5,
      sprintMultiplier: 1.7,
      san: 100,
      maxSan: 100,
      sta: 100,
      maxSta: 100,
      shieldActive: false,
      shieldTimer: 0,
      shieldCooldown: 0,
      megaphoneCooldown: 0
    };

    const keys = {};
    let enemies = [];
    let waves = [];
    let floatingTexts = [];

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key.toLowerCase() === 'j') {
        useMegaphone();
      }
      if (e.key.toLowerCase() === 'k') {
        useShield();
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    function useMegaphone() {
      if (!isPlaying || player.megaphoneCooldown > 0) return;
      player.megaphoneCooldown = 90; // frames (~1.5s)
      waves.push({
        x: player.x,
        y: player.y,
        radius: 10,
        maxRadius: 130,
        color: 'rgba(56, 189, 248, 0.6)'
      });

      // Knock back & neutralize nearby enemies
      enemies.forEach(en => {
        let dx = en.x - player.x;
        let dy = en.y - player.y;
        let dist = Math.hypot(dx, dy);
        if (dist < 130) {
          en.vx = (dx / dist) * 7;
          en.vy = (dy / dist) * 7;
          en.stun = 60;
          addFloatText("大聲公喝止!", en.x, en.y, '#38bdf8');
        }
      });
    }

    function useShield() {
      if (!isPlaying || player.shieldCooldown > 0 || player.shieldActive) return;
      player.shieldActive = true;
      player.shieldTimer = 180; // 3 seconds
      player.shieldCooldown = 400; // ~6.6 seconds cooldown
      addFloatText("反光背心護盾!", player.x, player.y - 20, '#fbbf24');
    }

    function addFloatText(text, x, y, color = '#fff') {
      floatingTexts.push({ text, x, y, alpha: 1.0, color });
    }

    function spawnEnemy() {
      if (!isPlaying) return;
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * canvas.width; y = -20; }
      else if (side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
      else { x = -20; y = Math.random() * canvas.height; }

      // 3 types: 0 = 追逐奔跑學生, 1 = 突發公文夾, 2 = 陳情音波怪
      const type = Math.floor(Math.random() * 3);
      enemies.push({
        x, y,
        type,
        radius: type === 1 ? 12 : 15,
        speed: type === 0 ? 3.0 : (type === 1 ? 2.0 : 1.5),
        vx: 0,
        vy: 0,
        stun: 0
      });
    }

    function startGame() {
      modal.style.display = 'none';
      isPlaying = true;
      gameTime = 16.5 * 60;
      player.san = 100;
      player.sta = 100;
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      enemies = [];
      waves = [];
      floatingTexts = [];
    }

    function gameOver(win) {
      isPlaying = false;
      modal.style.display = 'flex';
      if (win) {
        modalTitle.innerText = "🎉 順利平安下班！";
        modalTitle.style.color = "#10b981";
        modalDesc.innerHTML = "17:00 打卡鐘聲響起！<br>你成功擋下所有突發事件，守護住了最後的理智值！";
        startBtn.innerText = "再值勤一次";
      } else {
        modalTitle.innerText = "💀 理智斷線（心力交瘁）";
        modalTitle.style.color = "#ef4444";
        modalDesc.innerHTML = "你的 SAN 值歸零了...<br>公文、咆哮與突發狀況壓垮了防線，今天被迫留在學務處加班填寫報告。";
        startBtn.innerText = "重整心情重新開始";
      }
    }

    let spawnCounter = 0;

    function update() {
      if (!isPlaying) return;

      // Time progression
      gameTime += (1 / 60) * timeScale;
      let hours = Math.floor(gameTime / 60);
      let minutes = Math.floor(gameTime % 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

      if (gameTime >= targetTime) {
        gameOver(true);
        return;
      }

      // Movement & Sprint
      let dx = 0;
      let dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      let isSprinting = (keys['shift'] && player.sta > 0 && (dx !== 0 || dy !== 0));
      let currentSpeed = player.speed * (isSprinting ? player.sprintMultiplier : 1.0);

      if (isSprinting) {
        player.sta = Math.max(0, player.sta - 0.5);
      } else {
        player.sta = Math.min(player.maxSta, player.sta + 0.25);
      }

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      player.x += dx * currentSpeed;
      player.y += dy * currentSpeed;

      // Keep in canvas
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // Cooldowns
      if (player.megaphoneCooldown > 0) player.megaphoneCooldown--;
      if (player.shieldCooldown > 0) player.shieldCooldown--;
      if (player.shieldActive) {
        player.shieldTimer--;
        if (player.shieldTimer <= 0) player.shieldActive = false;
      }

      // Spawn enemies
      spawnCounter++;
      if (spawnCounter > 70) {
        spawnEnemy();
        spawnCounter = 0;
      }

      // Update waves
      for (let i = waves.length - 1; i >= 0; i--) {
        waves[i].radius += 5;
        if (waves[i].radius > waves[i].maxRadius) {
          waves.splice(i, 1);
        }
      }

      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];

        if (en.stun > 0) {
          en.stun--;
          en.x += en.vx;
          en.y += en.vy;
          en.vx *= 0.9;
          en.vy *= 0.9;
          continue;
        }

        let ex = player.x - en.x;
        let ey = player.y - en.y;
        let dist = Math.hypot(ex, ey);

        if (dist > 0) {
          en.x += (ex / dist) * en.speed;
          en.y += (ey / dist) * en.speed;
        }

        // Collision with player
        if (dist < player.radius + en.radius) {
          if (player.shieldActive) {
            // Shield repels
            en.vx = -(ex / dist) * 8;
            en.vy = -(ey / dist) * 8;
            en.stun = 40;
            addFloatText("護盾格擋!", player.x, player.y, '#fbbf24');
          } else {
            // Take SAN damage
            let dmg = en.type === 0 ? 12 : (en.type === 1 ? 18 : 22);
            player.san = Math.max(0, player.san - dmg);
            let labels = ["違規衝突 -", "急件公文 -", "投訴咆哮 -"];
            addFloatText(`${labels[en.type]}${dmg}`, player.x, player.y - 10, '#ef4444');
            enemies.splice(i, 1);

            if (player.san <= 0) {
              gameOver(false);
              return;
            }
          }
        }
      }

      // Update UI Bars
      sanBar.style.width = `${(player.san / player.maxSan) * 100}%`;
      staBar.style.width = `${(player.sta / player.maxSta) * 100}%`;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Floor grid / Campus tiles
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Render Megaphone sound waves
      waves.forEach(w => {
        ctx.strokeStyle = w.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Render enemies
      enemies.forEach(en => {
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        if (en.type === 0) {
          ctx.fillStyle = '#f97316'; // 學生: 橘色
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '10px sans-serif';
          ctx.fillText("學生", en.x - 10, en.y + 3);
        } else if (en.type === 1) {
          ctx.fillStyle = '#ef4444'; // 公文: 紅色方塊感
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '10px sans-serif';
          ctx.fillText("公文", en.x - 10, en.y + 3);
        } else {
          ctx.fillStyle = '#a855f7'; // 家長咆哮: 紫色
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '10px sans-serif';
          ctx.fillText("投訴", en.x - 10, en.y + 3);
        }
      });

      // Render Player
      ctx.save();
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#3b82f6'; // 校安人員: 藍色
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#60a5fa';
      ctx.stroke();

      // Shield visual
      if (player.shieldActive) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2);
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();

      // Render Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.alpha;
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        ft.y -= 0.8;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
        }
      }
      ctx.globalAlpha = 1.0;
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
