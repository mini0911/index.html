<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】第一人稱實境生還戰</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html {
    width: 100%; height: 100%;
    background: #050508; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", monospace;
    overflow: hidden;
  }

  #game-rig {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; background: #000;
  }

  /* 頂部 HUD */
  .hud-header {
    height: 48px; background: rgba(13, 17, 23, 0.9);
    border-bottom: 2px solid #30363d; display: flex;
    justify-content: space-between; align-items: center;
    padding: 0 16px; z-index: 1000; position: absolute; top: 0; left: 0; width: 100%;
  }
  .hud-title {
    font-size: 13px; letter-spacing: 2px; color: #ff5555; font-weight: bold;
    display: flex; align-items: center; gap: 8px;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: #ff2222; border-radius: 50%;
    box-shadow: 0 0 8px #ff0000; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  .status-badges { display: flex; gap: 6px; }
  .badge {
    font-size: 11px; color: #8b949e; background: #161b22;
    padding: 3px 6px; border-radius: 4px; border: 1px solid #30363d;
  }
  .badge.hp { color: #ff4444; border-color: #772222; font-weight: bold; }
  .badge.stalker { color: #ff9900; border-color: #774400; font-weight: bold; }
  .badge.safe { color: #00ff88; border-color: #007744; font-weight: bold; display: none; }

  /* ==================== 第一人稱真實街道主視角 ==================== */
  #fp-viewport {
    flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden;
    background: #020202;
  }
  #street-canvas {
    width: 100%; height: 100%; display: block;
  }
  /* 街景 VHS 掃描線與手電筒光圈 */
  .vhs-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,0.7) 75%, rgba(0,0,0,0.95) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 100%, 100% 4px;
    pointer-events: none;
  }

  /* 後照鏡（瞥見身後 3m/s 追趕的怪物） */
  #rear-mirror {
    position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
    width: 180px; height: 50px; background: #0a0a0c;
    border: 2px solid #555; border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 100;
  }
  #mirror-canvas { width: 100%; height: 100%; }
  .mirror-tag {
    position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: #ff4444; letter-spacing: 1px;
  }

  /* 左下角小地圖 Minimap */
  #minimap-wrapper {
    position: absolute; bottom: 155px; left: 14px;
    width: 110px; height: 110px; border-radius: 50%;
    border: 2px solid #444; overflow: hidden; z-index: 100;
    box-shadow: 0 0 15px rgba(0,0,0,0.9);
  }
  #map { width: 100%; height: 100%; }
  .leaflet-tile {
    filter: invert(100%) hue-rotate(180deg) brightness(75%) contrast(120%) !important;
  }

  /* 底部面板與對講機 */
  .hud-footer {
    height: 145px; background: rgba(13, 17, 23, 0.95);
    border-top: 2px solid #30363d; padding: 10px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    z-index: 1000;
  }
  .radio-channel {
    display: flex; justify-content: space-between; font-size: 11px; color: #f0883e;
  }
  .radio-bubble {
    background: #161b22; border: 1px solid #21262d; border-left: 3px solid #ff5555;
    padding: 6px 10px; font-size: 12px; color: #c9d1d9; line-height: 1.4;
    min-height: 44px; border-radius: 4px;
  }
  .controls { display: flex; justify-content: space-between; align-items: center; }
  .step-info { font-size: 12px; color: #58a6ff; line-height: 1.3; }

  .btn-action {
    background: #b62324; border: 1px solid #e05252; color: #fff;
    padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 4px;
    cursor: pointer; transition: 0.2s;
  }
  .btn-action:disabled {
    background: #21262d; border-color: #30363d; color: #484f58; cursor: not-allowed;
  }

  /* 模擬走動鍵盤 (室內測試) */
  .sim-controls {
    position: absolute; right: 12px; bottom: 155px; z-index: 999;
    display: grid; grid-template-columns: repeat(3, 34px);
    grid-template-rows: repeat(2, 34px); gap: 4px;
  }
  .sim-btn {
    background: rgba(13, 17, 23, 0.85); border: 1px solid #30363d; color: #c9d1d9;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; border-radius: 4px; font-size: 12px;
  }

  /* AR 戰鬥層 (無縫覆蓋) */
  #ar-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 2000; display: none; overflow: hidden;
  }
  #ar-video { width: 100%; height: 100%; object-fit: cover; }
  .ar-header {
    position: absolute; top: 16px; left: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2100;
  }
  .ar-top-bar {
    display: flex; justify-content: space-between; align-items: center;
    color: #ff4444; font-size: 13px; font-weight: bold; text-shadow: 0 0 6px #ff0000;
  }
  .countdown-box { font-size: 20px; font-family: monospace; color: #ffff33; }
  .timer-progress { width: 100%; height: 6px; background: #331111; border-radius: 3px; overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: #ff3333; transition: width 0.1s linear; }

  #ar-ghost {
    position: absolute; width: 160px; height: 230px; transform: translate(-50%, -50%);
    cursor: pointer; display: none;
  }
  .ghost-body {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 35%, rgba(240, 20, 20, 0.95) 0%, rgba(50, 0, 0, 0.85) 55%, transparent 80%);
    filter: blur(4px);
  }
  .ghost-eyes {
    position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 26px;
  }
  .ghost-eye { width: 14px; height: 20px; background: #fff; border-radius: 50%; box-shadow: 0 0 14px #ff0000; }

  #strobe-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; pointer-events: none; z-index: 2500;
  }
  .strobe-active {
    animation: strobeFlash 0.08s infinite alternate !important;
    display: block !important;
  }
  @keyframes strobeFlash { 0% { background: rgba(255, 255, 255, 0.95); } 100% { background: rgba(255, 0, 0, 0.9); } }

  .ar-footer {
    position: absolute; bottom: 25px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2100;
  }
  .btn-exorcise {
    background: #ff2222; border: 2px solid #fff; color: #fff; font-size: 16px;
    font-weight: bold; padding: 12px 40px; border-radius: 30px; cursor: pointer; display: none;
  }

  /* 開場視窗 */
  #modal-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #050508; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #modal-mask h1 { color: #ff4444; font-size: 24px; margin-bottom: 12px; }
  #modal-mask p { font-size: 13px; color: #8b949e; line-height: 1.6; margin-bottom: 22px; max-width: 340px; }
  .btn-main {
    background: #b62324; border: none; color: #fff; padding: 12px 28px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-rig">
  <div class="hud-header">
    <div class="hud-title">
      <div class="pulse-dot"></div>
      <span>第一人稱生還視角</span>
    </div>
    <div class="status-badges">
      <div class="badge hp" id="hp-badge">HP: 100/100</div>
      <div class="badge safe" id="safe-badge">庇護中: 15.0s</div>
      <div class="badge stalker" id="monster-badge">鬼魅: 追擊中 (55m)</div>
      <div class="badge" id="step-badge">步數: 0</div>
    </div>
  </div>

  <!-- 主視角：第一人稱真實街景 -->
  <div id="fp-viewport">
    <canvas id="street-canvas" width="800" height="600"></canvas>
    <div class="vhs-overlay"></div>

    <!-- 頂部後照鏡：隨時查看身後 3m/s 怪物逼近距離 -->
    <div id="rear-mirror">
      <canvas id="mirror-canvas" width="180" height="50"></canvas>
      <div class="mirror-tag">REAR-CAM 后視鏡</div>
    </div>

    <!-- 左下角輔助雷達小地圖 -->
    <div id="minimap-wrapper">
      <div id="map"></div>
    </div>
  </div>

  <!-- 室內模擬鍵盤 -->
  <div class="sim-controls">
    <div></div>
    <button class="sim-btn" onclick="simMove(0, 0.00015)">▲</button>
    <div></div>
    <button class="sim-btn" onclick="simMove(-0.00015, 0)">◄</button>
    <button class="sim-btn" onclick="simMove(0, -0.00015)">▼</button>
    <button class="sim-btn" onclick="simMove(0.00015, 0)">►</button>
  </div>

  <!-- 底部對講機與解鎖狀態 -->
  <div class="hud-footer">
    <div class="radio-channel">
      <span>對講機 [CH-9] 隊長</span>
      <span id="cheat-alert" style="color: #00ff88;">視野狀態: 街景漫步中</span>
    </div>
    <div class="radio-bubble" id="radio-msg">
      「你正走在被封鎖的陰暗巷子裡！邁開腳步往前走，後照鏡能看到怪物緊咬在後面！快到結界點！」
    </div>
    <div class="controls">
      <div class="step-info" id="status-desc">
        距離結界: 計算中...<br>現地步數檢驗: 0 / 20 步
      </div>
      <button class="btn-action" id="interact-btn" disabled onclick="openARBattle()">
        開啟 AR 降靈戰
      </button>
    </div>
  </div>

  <!-- AR 降靈戰鬥層 -->
  <div id="ar-layer">
    <video id="ar-video" autoplay playsinline muted></video>
    <div id="strobe-screen"></div>
    <div class="ar-header">
      <div class="ar-top-bar">
        <span>⚠ 結界破裂倒數</span>
        <span class="countdown-box" id="ar-timer-text">20.0s</span>
        <span id="ar-hp-text">HP: 100</span>
      </div>
      <div class="timer-progress"><div class="timer-fill" id="ar-timer-fill"></div></div>
    </div>

    <div id="ar-ghost" onclick="triggerExorcism()">
      <div class="ghost-body"></div>
      <div class="ghost-eyes"><div class="ghost-eye"></div><div class="ghost-eye"></div></div>
    </div>

    <div class="ar-footer">
      <div style="color: #ffcccc; font-size: 13px;" id="ar-tip">調整手機將準星對準惡靈！</div>
      <button class="btn-exorcise" id="btn-exorcise" onclick="triggerExorcism()">⚡ 驅逐封印 ⚡</button>
    </div>
  </div>

  <!-- 開場授權 -->
  <div id="modal-mask">
    <h1>靜安怪談：第一人稱實境漫步</h1>
    <p>
      <b>告別純地圖！</b><br>
      你將以<b>第一人稱視角</b>漫步在封閉街道中，真實走動會帶動鏡頭晃動與街景後掠。<br>
      上方後照鏡會直接映照出身後追殺你的怪物！
    </p>
    <button class="btn-main" onclick="initExperience()">進入現場街道</button>
  </div>
</div>

<script>
/* ==================== 音效引擎 ==================== */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(70, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
  }
  roar() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(450, this.ctx.currentTime + 0.2);
    g.gain.setValueAtTime(0.8, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.8);
  }
  chime() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(523, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046, this.ctx.currentTime + 0.5);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.5);
  }
}
const sfx = new SoundEngine();

/* ==================== 第一人稱街道透視渲染器 ==================== */
const streetCanvas = document.getElementById('street-canvas');
const sCtx = streetCanvas.getContext('2d');
const mirrorCanvas = document.getElementById('mirror-canvas');
const mCtx = mirrorCanvas.getContext('2d');

let walkCycle = 0;       // 步行晃動週期
let streetZOffset = 0;   // 街道景深後退偏移量

function renderFirstPersonStreet() {
  const w = streetCanvas.width;
  const h = streetCanvas.height;

  // 1. 步行攝影機晃動 (Head Bobbing)
  const bobY = Math.sin(walkCycle) * 8;
  const bobX = Math.cos(walkCycle * 0.5) * 5;

  sCtx.fillStyle = "#050608";
  sCtx.fillRect(0, 0, w, h);

  // 地面透視 (石磚路面)
  const horizonY = h * 0.45 + bobY;
  const gradFloor = sCtx.createLinearGradient(0, horizonY, 0, h);
  gradFloor.addColorStop(0, '#0a0d10');
  gradFloor.addColorStop(1, '#1b1d22');
  sCtx.fillStyle = gradFloor;
  sCtx.beginPath();
  sCtx.moveTo(w * 0.2 + bobX, horizonY);
  sCtx.lineTo(w * 0.8 + bobX, horizonY);
  sCtx.lineTo(w, h);
  sCtx.lineTo(0, h);
  sCtx.fill();

  // 左右兩側水泥鐵捲門牆面
  sCtx.fillStyle = '#111317';
  // 左牆
  sCtx.beginPath();
  sCtx.moveTo(0, 0); sCtx.lineTo(w * 0.2 + bobX, horizonY);
  sCtx.lineTo(0, h); sCtx.fill();
  // 右牆
  sCtx.beginPath();
  sCtx.moveTo(w, 0); sCtx.lineTo(w * 0.8 + bobX, horizonY);
  sCtx.lineTo(w, h); sCtx.fill();

  // 渲染動態向後退去的鐵捲門橫條與街燈透視
  sCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  sCtx.lineWidth = 2;
  for (let z = 1; z <= 8; z++) {
    const scale = ((z * 0.12 + (streetZOffset % 0.12)) % 1);
    const lineY = horizonY + scale * (h - horizonY);
    sCtx.beginPath();
    sCtx.moveTo(0, lineY); sCtx.lineTo(w, lineY);
    sCtx.stroke();
  }

  // 遠處結界點的血光微暈
  const gradEnd = sCtx.createRadialGradient(w/2 + bobX, horizonY, 5, w/2 + bobX, horizonY, 120);
  gradEnd.addColorStop(0, 'rgba(255, 40, 40, 0.5)');
  gradEnd.addColorStop(1, 'transparent');
  sCtx.fillStyle = gradEnd;
  sCtx.fillRect(0, 0, w, h);

  // 2. 渲染後照鏡 (後方追逐的 3m/s 怪物)
  renderRearMirror();

  requestAnimationFrame(renderFirstPersonStreet);
}

function renderRearMirror() {
  const mw = mirrorCanvas.width;
  const mh = mirrorCanvas.height;
  mCtx.fillStyle = "#030303";
  mCtx.fillRect(0, 0, mw, mh);

  // 根據怪物距離計算後照鏡中的大小與逼近
  const dist = getDistanceMeters(monsterLat, monsterLng, userLat, userLng);
  const size = Math.max(8, Math.min(42, (60 / dist) * 18));

  // 怪物倒影
  mCtx.fillStyle = "rgba(220, 20, 20, 0.9)";
  mCtx.beginPath();
  mCtx.arc(mw/2, mh/2 + 4, size/2, 0, Math.PI * 2);
  mCtx.fill();

  // 血紅眼睛
  mCtx.fillStyle = "#ffffff";
  mCtx.fillRect(mw/2 - size/4, mh/2, 3, 4);
  mCtx.fillRect(mw/2 + size/4 - 3, mh/2, 3, 4);
}

/* ==================== 遊戲狀態與步態核心 ==================== */
let playerHP = 100;
let totalSteps = 0, zoneSteps = 0;
const REQUIRED_STEPS = 20;

let userLat = 25.053, userLng = 121.606;
let map, userMarker;
let currentStage = 0;
let questPoints = [];

let monsterLat = 0, monsterLng = 0;
let monsterMarker = null;
const MONSTER_SPEED_MPS = 3.0;
let lastFrameTime = performance.now();

const QUESTS = [
  { name: "第一結界：轉角長椅的水鬼怨氣", offset: [0.00045, 0.00035], targetBearing: 60 },
  { name: "第二結界：巡邏員的失落制服", offset: [-0.00055, 0.00045], targetBearing: 170 },
  { name: "終極結界：靜安核心惡靈母體", offset: [0.00065, -0.00035], targetBearing: 300 }
];

function initExperience() {
  document.getElementById('modal-mask').style.display = 'none';
  sfx.init();
  setupMotionDetection();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLat = pos.coords.latitude; userLng = pos.coords.longitude;
        setupMinimap();
      },
      () => { setupMinimap(); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else {
    setupMinimap();
  }

  renderFirstPersonStreet();
}

function setupMinimap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([userLat, userLng], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  const playerIcon = L.divIcon({
    html: '<div style="width:10px;height:10px;background:#00ff88;border-radius:50%;"></div>',
    iconSize: [10, 10], iconAnchor: [5, 5]
  });
  userMarker = L.marker([userLat, userLng], { icon: playerIcon }).addTo(map);

  monsterLat = userLat - 0.00045;
  monsterLng = userLng - 0.0003;
  const monsterIcon = L.divIcon({
    html: '<div style="width:12px;height:12px;background:#ff0000;border-radius:50%;"></div>',
    iconSize: [12, 12], iconAnchor: [6, 6]
  });
  monsterMarker = L.marker([monsterLat, monsterLng], { icon: monsterIcon }).addTo(map);

  questPoints = QUESTS.map(q => {
    const qLat = userLat + q.offset[0], qLng = userLng + q.offset[1];
    return { ...q, lat: qLat, lng: qLng };
  });

  updateDistancesAndSteps();
  requestAnimationFrame(monsterChaseLoop);
}

function registerStep() {
  totalSteps++; zoneSteps++;
  walkCycle += 0.7;
  streetZOffset += 0.035;
  sfx.step();
  document.getElementById('step-badge').innerText = `步數: ${totalSteps}`;
  updateDistancesAndSteps();
}

function setupMotionDetection() {
  window.addEventListener('devicemotion', (e) => {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;
    const mag = Math.hypot(acc.x, acc.y, acc.z);
    if (Math.abs(mag - 9.8) > 3.2) registerStep();
  });
}

function simMove(dLng, dLat) {
  userLat += dLat; userLng += dLng;
  userMarker.setLatLng([userLat, userLng]);
  map.panTo([userLat, userLng]);
  registerStep();
}

function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2) * Math.sin(dl/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function monsterChaseLoop(now) {
  const dt = (now - lastFrameTime) / 1000;
  lastFrameTime = now;

  const distToPlayer = getDistanceMeters(monsterLat, monsterLng, userLat, userLng);
  document.getElementById('monster-badge').innerText = `鬼魅: 追擊中 (${distToPlayer}m)`;

  if (distToPlayer > 1.5) {
    const stepDist = MONSTER_SPEED_MPS * dt;
    const ratio = Math.min(1.0, stepDist / distToPlayer);
    monsterLat += (userLat - monsterLat) * ratio;
    monsterLng += (userLng - monsterLng) * ratio;
    if (monsterMarker) monsterMarker.setLatLng([monsterLat, monsterLng]);
  }

  if (distToPlayer <= 3.5) {
    sfx.roar();
    playerHP = Math.max(0, playerHP - 30);
    document.getElementById('hp-badge').innerText = `HP: ${playerHP}/100`;
    monsterLat -= 0.0003; // 擊退
    alert(`【遭背後撲咬！】後照鏡中的鬼怪撲倒了你！損失 30 HP！剩餘: ${playerHP}`);
  }

  requestAnimationFrame(monsterChaseLoop);
}

function updateDistancesAndSteps() {
  if (currentStage >= questPoints.length) {
    document.getElementById('radio-msg').innerText = "「所有結界皆已完全封印！你甩開了惡靈，走出永夜。」";
    document.getElementById('interact-btn').disabled = true;
    return;
  }
  const q = questPoints[currentStage];
  const d = getDistanceMeters(userLat, userLng, q.lat, q.lng);
  const btn = document.getElementById('interact-btn');

  document.getElementById('status-desc').innerHTML =
    `距離結界: <b>${d}m</b><br>現地步數檢驗: <b>${zoneSteps} / ${REQUIRED_STEPS}</b> 步`;

  if (d <= 18 && zoneSteps >= REQUIRED_STEPS) {
    btn.disabled = false;
    btn.innerText = "【已抵達現場】開啟 AR 降靈戰";
  } else {
    btn.disabled = true;
    btn.innerText = d > 18 ? `步行靠近中 (差 ${d}m)` : `現場踏步中 (差 ${REQUIRED_STEPS - zoneSteps} 步)`;
  }
}

/* ==================== AR 戰鬥層 ==================== */
let isARActive = false, arTimer = null, arTimeLeft = 20.0;

async function openARBattle() {
  isARActive = true;
  arTimeLeft = 20.0;
  document.getElementById('ar-layer').style.display = 'block';
  document.getElementById('ar-hp-text').innerText = `HP: ${playerHP}`;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    document.getElementById('ar-video').srcObject = stream;
  } catch(e) {}

  arTimer = setInterval(() => {
    arTimeLeft -= 0.1;
    document.getElementById('ar-timer-text').innerText = `${arTimeLeft.toFixed(1)}s`;
    document.getElementById('ar-timer-fill').style.width = `${(arTimeLeft/20.0)*100}%`;
    if (arTimeLeft <= 0) {
      clearInterval(arTimer);
      sfx.roar();
      playerHP = Math.max(0, playerHP - 40);
      document.getElementById('hp-badge').innerText = `HP: ${playerHP}/100`;
      document.getElementById('ar-layer').style.display = 'none';
      isARActive = false;
      alert("【封印超時】遭惡靈反咬 40 HP！");
    }
  }, 100);

  // 顯示鬼影
  const ghost = document.getElementById('ar-ghost');
  ghost.style.display = 'block';
  ghost.style.left = '50%'; ghost.style.top = '50%';
  document.getElementById('btn-exorcise').style.display = 'block';
}

function triggerExorcism() {
  clearInterval(arTimer);
  sfx.chime();
  document.getElementById('ar-layer').style.display = 'none';
  isARActive = false;
  alert("【除靈成功！】結界順利破除！");
  currentStage++; zoneSteps = 0;
  updateDistancesAndSteps();
}
</script>
