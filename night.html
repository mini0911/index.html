<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】真實彩色街景 × 靈異夜視鏡切換版</title>

<!-- Leaflet 開源地圖 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MapillaryJS 官方庫 -->
<link href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" rel="stylesheet" />
<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #0a0a0c; color: #eee; overflow: hidden; font-family: monospace; }

  #app {
    display: flex; flex-direction: column; width: 100%; height: 100%; position: relative;
  }

  /* 頂部 HUD */
  .hud-header {
    height: 44px; background: #0d1117; border-bottom: 2px solid #30363d;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px; z-index: 1000; flex-shrink: 0;
  }
  .hud-title {
    font-size: 13px; letter-spacing: 1px; color: #ff5555; font-weight: bold;
    display: flex; align-items: center; gap: 6px;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: #ff2222; border-radius: 50%;
    box-shadow: 0 0 8px #ff0000; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  .status-badges { display: flex; gap: 6px; align-items: center; }
  .badge {
    font-size: 11px; color: #8b949e; background: #161b22;
    padding: 3px 6px; border-radius: 4px; border: 1px solid #30363d;
  }
  .badge.hp { color: #ff4444; border-color: #772222; font-weight: bold; }
  .badge.stalker { color: #ffaa00; border-color: #774400; font-weight: bold; }

  /* 🌙 夜視鏡切換按鈕 */
  .btn-nvg-toggle {
    background: #161b22; border: 1px solid #58a6ff; color: #58a6ff;
    padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
    transition: all 0.2s;
  }
  .btn-nvg-toggle.active {
    background: #003311; border-color: #00ff66; color: #00ff66;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
  }

  /* ==================== 上半部：Mapillary 街景容器 ==================== */
  #street-section {
    position: relative;
    width: 100%;
    height: 54%;
    background: #000;
    overflow: hidden;
  }

  /* 預設為真實原始全彩（無任何濾鏡） */
  #mly {
    width: 100%; height: 100%; position: absolute; top: 0; left: 0;
    filter: none;
    transition: filter 0.3s ease;
  }

  /* 啟動夜視鏡時套用的恐怖黑白負片濾鏡 */
  #mly.night-vision-on {
    filter: invert(88%) hue-rotate(180deg) contrast(140%) saturate(15%) brightness(70%);
  }

  /* 導航箭頭樣式保持清晰 */
  .mapillary-sequence-container {
    opacity: 0.85 !important;
  }

  /* 恐怖 VHS 掃描線與暗角（預設隱藏，夜視模式時顯示） */
  .vhs-scanlines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(20, 0, 0, 0.5) 80%, rgba(0, 0, 0, 0.9) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 100%, 100% 4px;
    pointer-events: none; z-index: 10;
    display: none;
  }
  .vhs-scanlines.active {
    display: block;
  }

  .crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 40px; height: 40px; border: 2px dashed rgba(255, 60, 60, 0.7);
    border-radius: 50%; pointer-events: none; z-index: 20;
  }

  /* 街景惡靈實體 */
  #ghost-entity {
    position: absolute; width: 110px; height: 160px;
    transform: translate(-50%, -50%); cursor: pointer; display: none; z-index: 30;
  }
  .ghost-shadow {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 35%, rgba(255, 0, 0, 0.95) 0%, rgba(50, 0, 0, 0.8) 55%, transparent 80%);
    filter: blur(4px); animation: ghostBlink 1s infinite alternate;
  }
  .ghost-eyes {
    position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 18px;
  }
  .ghost-eye {
    width: 10px; height: 14px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 10px #ff0000;
  }
  @keyframes ghostBlink {
    0% { transform: scale(0.95); opacity: 0.8; }
    100% { transform: scale(1.06); opacity: 1; }
  }

  /* ==================== 下半部：雷達地圖 ==================== */
  #map-section {
    position: relative;
    width: 100%;
    height: 46%;
    background: #111;
  }
  #map {
    width: 100%; height: 100%;
    background: #1a1a1a;
  }
  .leaflet-tile {
    filter: brightness(85%) contrast(105%) !important;
  }

  /* 模擬方向鍵盤 */
  .sim-controls {
    position: absolute; right: 10px; top: 10px; z-index: 999;
    display: grid; grid-template-columns: repeat(3, 34px);
    grid-template-rows: repeat(2, 34px); gap: 4px;
  }
  .sim-btn {
    background: rgba(13, 17, 23, 0.88); border: 1px solid #ff4444; color: #fff;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;
  }

  /* 底部面板 */
  .floating-footer {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    background: rgba(13, 17, 23, 0.92); border: 1px solid #30363d;
    border-left: 4px solid #ff4444; padding: 6px 10px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 1000; border-radius: 4px;
  }
  .footer-msg {
    font-size: 12px; color: #c9d1d9; line-height: 1.3; max-width: 65%;
  }
  .btn-exorcise {
    background: #b62324; border: 1px solid #ff4444; color: #fff;
    padding: 6px 12px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }

  /* 怪物逼近警示紅光 */
  #danger-glow {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1500;
  }
  .danger-on {
    animation: dangerBorder 0.5s infinite alternate !important;
  }
  @keyframes dangerBorder {
    0% { box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.4); }
    100% { box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.9); }
  }

  /* 開場視窗 */
  #modal-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #050508; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #modal-mask h1 { color: #ff4444; font-size: 22px; margin-bottom: 12px; }
  #modal-mask p { font-size: 13px; color: #8b949e; line-height: 1.6; margin-bottom: 22px; max-width: 360px; }
  .btn-main {
    background: #b62324; border: none; color: #fff; padding: 12px 28px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="app">
  <div id="danger-glow"></div>

  <div class="hud-header">
    <div class="hud-title">
      <div class="pulse-dot"></div>
      <span id="title-mode">街景模式: 原生彩色</span>
    </div>
    <div class="status-badges">
      <!-- 🌙 夜視鏡模式切換按鈕 -->
      <button class="btn-nvg-toggle" id="btn-toggle-nvg" onclick="toggleNightVision()">
        🌙 夜視鏡: 關閉
      </button>
      <div class="badge hp" id="hp-badge">HP: 100/100</div>
      <div class="badge stalker" id="monster-badge">鬼魅: 50m</div>
      <div class="badge" id="step-badge">步數: 0</div>
    </div>
  </div>

  <!-- 上半部：Mapillary 官方街景容器 -->
  <div id="street-section">
    <div id="mly"></div>
    <div class="vhs-scanlines" id="vhs-overlay"></div>
    <div class="crosshair"></div>

    <!-- 街景惡靈 -->
    <div id="ghost-entity" onclick="triggerExorcism()">
      <div class="ghost-shadow"></div>
      <div class="ghost-eyes">
        <div class="ghost-eye"></div>
        <div class="ghost-eye"></div>
      </div>
    </div>
  </div>

  <!-- 下半部：雷達地圖 -->
  <div id="map-section">
    <div id="map"></div>

    <!-- 模擬方向鍵 -->
    <div class="sim-controls">
      <div></div>
      <button class="sim-btn" onclick="simMove(0, 0.00010)">▲</button>
      <div></div>
      <button class="sim-btn" onclick="simMove(-0.00010, 0)">◄</button>
      <button class="sim-btn" onclick="simMove(0, -0.00010)">▼</button>
      <button class="sim-btn" onclick="simMove(0.00010, 0)">►</button>
    </div>

    <!-- 底部面板 -->
    <div class="floating-footer">
      <div class="footer-msg" id="footer-text">
        「畫面上方為真實全彩街景！點擊右上角【🌙 夜視鏡】可切換至恐怖黑白模式！」
      </div>
      <button class="btn-exorcise" onclick="triggerExorcism()">⚡ 封印驅魔 ⚡</button>
    </div>
  </div>

  <!-- 開場視窗 -->
  <div id="modal-mask">
    <h1>靜安怪談：全彩實景版</h1>
    <p>
      <b>真實彩色視角已就緒：</b><br>
      預設呈現 <b>真實道路原本的自然全彩色調</b>。<br>
      隨時可透過右上角按鈕啟動「恐怖夜視鏡」進行靈異搜查！
    </p>
    <button class="btn-main" onclick="initGame()">啟動街景生還戰</button>
  </div>
</div>

<script>
// ⭐ Mapillary Access Token
const MAPILLARY_ACCESS_TOKEN = "MLY|28733254389675887|c2488c852790b0d2d48083a0a2e4249c";

// 初始預設街景照片 ID
const DEFAULT_IMAGE_ID = "1933525276802129";

/* ==================== 音效引擎 ==================== */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(65, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
  }
  nvgClick() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + 0.1);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.1);
  }
  roar() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(400, this.ctx.currentTime + 0.2);
    g.gain.setValueAtTime(0.8, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.8);
  }
  chime() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(523, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046, this.ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.4);
  }
}
const sfx = new SoundEngine();

/* ==================== 狀態與變數 ==================== */
let playerHP = 100;
let totalSteps = 0;
let userLat = 25.0418, userLng = 121.5436;

// 🌙 夜視鏡開關狀態 (預設關閉：呈現真實自然彩色)
let isNightVisionActive = false;

// 15 公尺位移自動換圖記錄
let lastLoadedCoord = { lat: userLat, lng: userLng };
let isFetchingStreet = false;
const STREET_MOVE_THRESHOLD_METERS = 15;

let map = null, userMarker = null, monsterMarker = null;
let monsterLat = 0, monsterLng = 0;
const MONSTER_SPEED_MPS = 3.0;
let lastTime = performance.now();

let mlyViewer = null;
let ghostBearing = 50;

function initGame() {
  document.getElementById('modal-mask').style.display = 'none';
  sfx.init();

  initLeafletMap();
  initMapillaryViewer();

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      if (map && userMarker) {
        map.setView([userLat, userLng], 17);
        userMarker.setLatLng([userLat, userLng]);
      }
      checkAndFetchNextStreet();
    }, null, { enableHighAccuracy: true });
  }

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// ⭐ 一鍵切換真實彩色 / 恐怖夜視鏡功能
function toggleNightVision() {
  sfx.nvgClick();
  isNightVisionActive = !isNightVisionActive;

  const btn = document.getElementById('btn-toggle-nvg');
  const mlyEl = document.getElementById('mly');
  const vhsEl = document.getElementById('vhs-overlay');
  const title = document.getElementById('title-mode');

  if (isNightVisionActive) {
    // 開啟恐怖黑白夜視模式
    mlyEl.classList.add('night-vision-on');
    vhsEl.classList.add('active');
    btn.classList.add('active');
    btn.innerText = "🌙 夜視鏡: 開啟";
    title.innerText = "街景模式: 靈異夜視";
    document.getElementById('footer-text').innerText = "「已啟動靈異夜視鏡！視野轉為黑白反轉，惡靈行蹤更加清晰！」";
  } else {
    // 返回真實自然全彩模式
    mlyEl.classList.remove('night-vision-on');
    vhsEl.classList.remove('active');
    btn.classList.remove('active');
    btn.innerText = "🌙 夜視鏡: 關閉";
    title.innerText = "街景模式: 原生彩色";
    document.getElementById('footer-text').innerText = "「已切換回真實全彩街景！原汁原味呈現街道色彩！」";
  }
}

// 建立 Mapillary Viewer
function initMapillaryViewer() {
  const { Viewer } = mapillary;

  setTimeout(() => {
    try {
      mlyViewer = new Viewer({
        accessToken: MAPILLARY_ACCESS_TOKEN,
        container: 'mly',
        imageId: DEFAULT_IMAGE_ID,
        component: {
          cover: false,
          direction: true,
          sequence: true // 啟用路面導航箭頭
        }
      });

      mlyViewer.on('pov', updateGhostOverlay);

      mlyViewer.on('image', (e) => {
        mlyViewer.resize();
        updateGhostOverlay();
        if (e && e.image && e.image.geometry && e.image.geometry.coordinates) {
          const [lng, lat] = e.image.geometry.coordinates;
          userLat = lat; userLng = lng;
          lastLoadedCoord = { lat: userLat, lng: userLng };
          if (userMarker) userMarker.setLatLng([userLat, userLng]);
          if (map) map.panTo([userLat, userLng]);
        }
      });

      window.addEventListener('resize', () => {
        if (mlyViewer) {
          mlyViewer.resize();
          updateGhostOverlay();
        }
      });
    } catch (err) {
      console.error("Mapillary 初始化失敗:", err);
    }
  }, 120);
}

// 位移超過 15 米自動切換街景
async function checkAndFetchNextStreet() {
  if (isFetchingStreet || !mlyViewer) return;

  const distMoved = getDistanceMeters(lastLoadedCoord.lat, lastLoadedCoord.lng, userLat, userLng);

  if (distMoved >= STREET_MOVE_THRESHOLD_METERS) {
    isFetchingStreet = true;
    document.getElementById('footer-text').innerText = `「累積位移 ${distMoved}m！自動搜尋前方街道照片……」`;

    const delta = 0.002;
    const bbox = `${userLng - delta},${userLat - delta},${userLng + delta},${userLat + delta}`;
    const url = `https://graph.mapillary.com/images?access_token=${MAPILLARY_ACCESS_TOKEN}&fields=id,geometry&bbox=${bbox}&limit=1`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.data && data.data.length > 0) {
        await mlyViewer.moveTo(data.data[0].id);
        lastLoadedCoord = { lat: userLat, lng: userLng };
      }
    } catch (e) {
      console.warn("搜尋街景失敗:", e);
    } finally {
      isFetchingStreet = false;
    }
  }
}

// 惡靈方位投影
function updateGhostOverlay() {
  if (!mlyViewer) return;

  mlyViewer.getPointOfView().then(pov => {
    const sec = document.getElementById('street-section');
    const w = sec.clientWidth, h = sec.clientHeight;

    let diff = ghostBearing - (pov.bearing || 0);
    while (diff < -180) diff += 360;
    while (diff > 180) diff -= 360;

    const ghostEl = document.getElementById('ghost-entity');
    const hFov = 75;

    if (Math.abs(diff) < hFov / 2) {
      const screenX = (w / 2) + (diff / (hFov / 2)) * (w / 2);
      ghostEl.style.display = 'block';
      ghostEl.style.left = `${screenX}px`;
      ghostEl.style.top = `${h * 0.52}px`;
    } else {
      ghostEl.style.display = 'none';
    }
  }).catch(() => {});
}

// 下半部 Leaflet 地圖初始化
function initLeafletMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([userLat, userLng], 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  const playerIcon = L.divIcon({
    html: '<div style="width:14px;height:14px;background:#00ff88;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px #00ff88;"></div>',
    iconSize: [14, 14], iconAnchor: [7, 7]
  });
  userMarker = L.marker([userLat, userLng], { icon: playerIcon }).addTo(map);

  resetMonsterPosition();
  const monsterIcon = L.divIcon({
    html: '<div style="width:16px;height:16px;background:#ff0000;border:2px solid #fff;border-radius:50%;box-shadow:0 0 12px #ff0000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:bold;">☠</div>',
    iconSize: [16, 16], iconAnchor: [8, 8]
  });
  monsterMarker = L.marker([monsterLat, monsterLng], { icon: monsterIcon }).addTo(map);

  setTimeout(() => { map.invalidateSize(); }, 180);
}

function resetMonsterPosition() {
  monsterLat = userLat - 0.00045;
  monsterLng = userLng - 0.0003;
}

function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2) * Math.sin(dl/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// 追逐主循環
function gameLoop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  const dist = getDistanceMeters(monsterLat, monsterLng, userLat, userLng);
  document.getElementById('monster-badge').innerText = `鬼魅: ${dist}m`;

  if (dist > 1.5) {
    const stepDist = MONSTER_SPEED_MPS * dt;
    const ratio = Math.min(1.0, stepDist / dist);
    monsterLat += (userLat - monsterLat) * ratio;
    monsterLng += (userLng - monsterLng) * ratio;
    if (monsterMarker) monsterMarker.setLatLng([monsterLat, monsterLng]);
  }

  const glow = document.getElementById('danger-glow');
  if (dist < 12) {
    glow.classList.add('danger-on');
  } else {
    glow.classList.remove('danger-on');
  }

  if (dist <= 4) {
    sfx.roar();
    playerHP = Math.max(0, playerHP - 30);
    document.getElementById('hp-badge').innerText = `HP: ${playerHP}/100`;
    resetMonsterPosition();
    alert(`【遭背後撲咬！】受到 30 傷害！剩餘 HP: ${playerHP}。快邁開腳步逃跑！`);
  }

  requestAnimationFrame(gameLoop);
}

function simMove(dLng, dLat) {
  userLat += dLat; userLng += dLng;
  if (userMarker) userMarker.setLatLng([userLat, userLng]);
  if (map) map.panTo([userLat, userLng]);
  totalSteps++;
  sfx.step();
  document.getElementById('step-badge').innerText = `步數: ${totalSteps}`;

  checkAndFetchNextStreet();
}

function triggerExorcism() {
  sfx.chime();
  alert("【除靈成功！】潛伏在街道中的惡靈已被擊散！追殺怪已被震退！");
  resetMonsterPosition();
  ghostBearing = (ghostBearing + 120 + Math.random() * 60) % 360;
  updateGhostOverlay();
}
</script>
