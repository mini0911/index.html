<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flyff Web Prototype - 3D 網頁版飛飛核心雛形</title>
  <!-- 載入 Babylon.js 3D 引擎 -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; outline: none; }

    /* 左上角：玩家狀態面板 (Flyff 風格) */
    #player-hud {
      position: absolute; top: 16px; left: 16px; width: 260px;
      background: linear-gradient(180deg, rgba(25,35,60,0.9), rgba(15,20,35,0.92));
      border: 2px solid #6b8cce; border-radius: 10px; padding: 12px;
      color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .hud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
    .lv-badge { background: #f5b041; color: #111; padding: 2px 8px; border-radius: 6px; font-size: 13px; }
    .bar-row { display: flex; align-items: center; margin: 5px 0; font-size: 12px; }
    .bar-label { width: 32px; font-weight: bold; color: #cbd5e1; }
    .bar-bg { flex: 1; height: 14px; background: #1e293b; border-radius: 7px; overflow: hidden; position: relative; border: 1px solid #475569; }
    .bar-fill { height: 100%; transition: width 0.15s ease-out; }
    .hp-fill { background: linear-gradient(90deg, #dc2626, #ef4444); }
    .mp-fill { background: linear-gradient(90deg, #2563eb, #3b82f6); }
    .exp-fill { background: linear-gradient(90deg, #16a34a, #4ade80); }
    .bar-text { position: absolute; inset: 0; text-align: center; line-height: 12px; font-size: 10px; color: #fff; text-shadow: 1px 1px 2px #000; }

    /* 正上方：鎖定怪物目標血條 */
    #target-hud {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      width: 300px; background: rgba(20, 20, 30, 0.9);
      border: 2px solid #e11d48; border-radius: 10px; padding: 10px 14px;
      color: #fff; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    #target-name { text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #fda4af; }

    /* 右上角：伺服器防外掛實測面板 */
    #anticheat-panel {
      position: absolute; top: 16px; right: 16px; width: 270px;
      background: rgba(15, 23, 42, 0.88); border: 1px solid #38bdf8;
      border-radius: 10px; padding: 12px; color: #e2e8f0; font-size: 12px;
    }
    .panel-title { font-weight: bold; color: #38bdf8; margin-bottom: 8px; font-size: 13px; }
    .cheat-btn {
      width: 100%; margin-top: 6px; padding: 7px; border: 1px solid #f43f5e;
      background: rgba(244, 63, 94, 0.2); color: #fda4af; border-radius: 6px;
      cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.15s;
    }
    .cheat-btn:hover { background: rgba(244, 63, 94, 0.45); color: #fff; }

    /* 正下方：快捷技能列 (Hotbar) */
    #hotbar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9);
      padding: 8px 12px; border-radius: 12px; border: 2px solid #64748b;
    }
    .skill-slot {
      width: 58px; height: 58px; background: #1e293b; border: 2px solid #94a3b8;
      border-radius: 8px; position: relative; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; text-align: center; transition: transform 0.1s, border-color 0.15s;
    }
    .skill-slot:hover { border-color: #fbbf24; transform: translateY(-2px); }
    .skill-slot.active-flight { border-color: #38bdf8; background: rgba(56, 189, 248, 0.25); }
    .hotkey { position: absolute; top: 3px; left: 5px; font-size: 10px; color: #fbbf24; font-weight: bold; }
    .cd-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.75);
      color: #fbbf24; display: none; align-items: center; justify-content: center;
      font-weight: bold; font-size: 15px; border-radius: 6px;
    }

    /* 左下角：系統與伺服器日誌 */
    #chat-log {
      position: absolute; bottom: 20px; left: 16px; width: 350px; height: 150px;
      background: rgba(0, 0, 0, 0.65); border: 1px solid #475569; border-radius: 8px;
      padding: 8px 10px; overflow-y: auto; font-size: 12px; color: #e2e8f0;
      pointer-events: auto;
    }
    .log-item { margin-bottom: 4px; line-height: 1.4; }
    .log-sys { color: #38bdf8; }
    .log-dmg { color: #fbbf24; }
    .log-warn { color: #fb7185; font-weight: bold; }
    .log-lv { color: #4ade80; font-weight: bold; }

    /* 浮動傷害數字 (Floating Combat Text) */
    .floating-text {
      position: absolute; pointer-events: none; font-weight: 900;
      font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.85);
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      25% { transform: translate(-50%, -18px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -55px) scale(0.95); }
    }
  </style>
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <!-- 左上角玩家狀態 -->
  <div id="player-hud">
    <div class="hud-header">
      <span>初心者冒險家</span>
      <span class="lv-badge" id="ui-lv">Lv. 1</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">HP</span>
      <div class="bar-bg"><div class="bar-fill hp-fill" id="ui-hp-bar" style="width:100%"></div><div class="bar-text" id="ui-hp-text">200 / 200</div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">MP</span>
      <div class="bar-bg"><div class="bar-fill mp-fill" id="ui-mp-bar" style="width:100%"></div><div class="bar-text" id="ui-mp-text">100 / 100</div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">EXP</span>
      <div class="bar-bg"><div class="bar-fill exp-fill" id="ui-exp-bar" style="width:0%"></div><div class="bar-text" id="ui-exp-text">0%</div></div>
    </div>
  </div>

  <!-- 正上方鎖定怪物血條 -->
  <div id="target-hud">
    <div id="target-name">獨眼蝙蝠 (Lv.1)</div>
    <div class="bar-bg">
      <div class="bar-fill hp-fill" id="target-hp-bar" style="width:100%"></div>
      <div class="bar-text" id="target-hp-text">100 / 100</div>
    </div>
  </div>

  <!-- 右上角防外掛實測面板 -->
  <div id="anticheat-panel">
    <div class="panel-title">🛡️ 權威伺服器防外掛實測</div>
    <div style="color:#94a3b8; margin-bottom:6px;">
      操作：<b>WASD</b> 移動、<b>左鍵點擊怪物</b>鎖定、<b>右鍵拖曳</b>轉視角、飛行時 <b>空白鍵/Shift</b> 升降。
    </div>
    <button class="cheat-btn" onclick="triggerSpeedHack()">⚡ 測試外掛：修改記憶體瞬移</button>
    <button class="cheat-btn" onclick="triggerHpHack()">💉 測試外掛：本地竄改血量 99999</button>
  </div>

  <!-- 下方技能快捷列 -->
  <div id="hotbar">
    <div class="skill-slot" onclick="useSkill(1)">
      <span class="hotkey">1</span>
      <span>⚔️<br>普通攻擊</span>
      <div class="cd-overlay" id="cd-1"></div>
    </div>
    <div class="skill-slot" onclick="useSkill(2)">
      <span class="hotkey">2</span>
      <span>💥<br>連環重擊</span>
      <div class="cd-overlay" id="cd-2"></div>
    </div>
    <div class="skill-slot" onclick="useSkill(3)">
      <span class="hotkey">3</span>
      <span>✨<br>緊急治癒</span>
      <div class="cd-overlay" id="cd-3"></div>
    </div>
    <div class="skill-slot" id="slot-flight" onclick="useSkill(4)">
      <span class="hotkey">4</span>
      <span>🛹<br>飛行滑板</span>
      <div class="cd-overlay" id="cd-4"></div>
    </div>
  </div>

  <!-- 左下角系統日誌 -->
  <div id="chat-log"></div>

<script>
// ==========================================
// 1. 系統日誌與浮動傷害文字工具
// ==========================================
const chatLog = document.getElementById('chat-log');
function addLog(msg, type = 'log-sys') {
  const div = document.createElement('div');
  div.className = 'log-item ' + type;
  div.textContent = `[系統] ${msg}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function spawnFloatingText(worldPos, text, color = '#ffffff') {
  const screenPos = BABYLON.Vector3.Project(
    worldPos,
    BABYLON.Matrix.Identity(),
    scene.getTransformMatrix(),
    camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight())
  );
  if (screenPos.z > 1) return;
  const el = document.createElement('div');
  el.className = 'floating-text';
  el.style.left = `${screenPos.x}px`;
  el.style.top = `${screenPos.y}px`;
  el.style.color = color;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ==========================================
// 2. 初始化 Babylon.js 3D 場景與相機
// ==========================================
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.45, 0.72, 0.95, 1);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.008;
scene.fogColor = new BABYLON.Color3(0.45, 0.72, 0.95);

// 第三人稱環繞相機 (ArcRotateCamera)
const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 3, 16, BABYLON.Vector3.Zero(), scene);
camera.lowerRadiusLimit = 6;
camera.upperRadiusLimit = 35;
camera.upperBetaLimit = Math.PI / 2 - 0.05;
camera.attachControl(canvas, true);

// 光源設定
const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
hemiLight.intensity = 0.85;
const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
dirLight.position = new BABYLON.Vector3(20, 40, 20);
dirLight.intensity = 0.6;

// 帕里鎮草地地形與裝飾物
const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 120, height: 120 }, scene);
const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
groundMat.diffuseColor = new BABYLON.Color3(0.32, 0.62, 0.28);
groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
ground.material = groundMat;

// 建立樹木作為空間參照
for (let i = 0; i < 25; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 12 + Math.random() * 40;
  const tx = Math.cos(angle) * dist;
  const tz = Math.sin(angle) * dist;

  const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { height: 2.5, diameter: 0.7 }, scene);
  trunk.position.set(tx, 1.25, tz);
  const trunkMat = new BABYLON.StandardMaterial("tMat", scene);
  trunkMat.diffuseColor = new BABYLON.Color3(0.45, 0.28, 0.15);
  trunk.material = trunkMat;

  const leaves = BABYLON.MeshBuilder.CreateSphere("leaves", { diameter: 3.2, segments: 8 }, scene);
  leaves.position.set(tx, 3.2, tz);
  const leafMat = new BABYLON.StandardMaterial("lMat", scene);
  leafMat.diffuseColor = new BABYLON.Color3(0.18, 0.48, 0.22);
  leaves.material = leafMat;
}

// ==========================================
// 3. 建立玩家角色與「飛天滑板」模型
// ==========================================
const playerRoot = new BABYLON.TransformNode("playerRoot", scene);
playerRoot.position.set(0, 0, 0);

const bodyMesh = BABYLON.MeshBuilder.CreateCapsule("playerBody", { height: 1.8, radius: 0.45 }, scene);
bodyMesh.position.y = 0.9;
bodyMesh.parent = playerRoot;
const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
playerMat.diffuseColor = new BABYLON.Color3(0.2, 0.55, 0.95);
bodyMesh.material = playerMat;

// 手持武器
const sword = BABYLON.MeshBuilder.CreateBox("sword", { width: 0.12, height: 0.12, depth: 1.4 }, scene);
sword.position.set(0.55, 1.0, 0.5);
sword.parent = playerRoot;
const swordMat = new BABYLON.StandardMaterial("swordMat", scene);
swordMat.diffuseColor = new BABYLON.Color3(0.9, 0.85, 0.3);
sword.material = swordMat;

// 飛天滑板 (預設隱藏)
const hoverboard = BABYLON.MeshBuilder.CreateBox("board", { width: 0.9, height: 0.12, depth: 2.2 }, scene);
hoverboard.position.y = 0.1;
hoverboard.parent = playerRoot;
const boardMat = new BABYLON.StandardMaterial("boardMat", scene);
boardMat.diffuseColor = new BABYLON.Color3(0.1, 0.85, 0.95);
boardMat.emissiveColor = new BABYLON.Color3(0.05, 0.35, 0.45);
hoverboard.material = boardMat;
hoverboard.setEnabled(false);

// 目標鎖定紅圈 (Target Ring)
const targetRing = BABYLON.MeshBuilder.CreateTorus("ring", { diameter: 2.0, thickness: 0.12, tessellation: 32 }, scene);
const ringMat = new BABYLON.StandardMaterial("ringMat", scene);
ringMat.emissiveColor = new BABYLON.Color3(1, 0.15, 0.2);
targetRing.material = ringMat;
targetRing.setEnabled(false);

// ==========================================
// 4. 模擬「權威伺服器 (Server-Authoritative)」與玩家狀態
// ==========================================
const serverState = {
  pos: new BABYLON.Vector3(0, 0, 0),
  lv: 1,
  hp: 200, maxHp: 200,
  mp: 100, maxMp: 100,
  exp: 0, maxExp: 100,
  atk: 28,
  isFlying: false,
  maxSpeed: 0.16,
  flySpeed: 0.28
};

// 技能冷卻紀錄
const cooldowns = { 1: 0, 2: 0, 3: 0, 4: 0 };

function updatePlayerHUD() {
  document.getElementById('ui-lv').textContent = `Lv. ${serverState.lv}`;
  document.getElementById('ui-hp-bar').style.width = `${(serverState.hp / serverState.maxHp) * 100}%`;
  document.getElementById('ui-hp-text').textContent = `${Math.max(0, Math.floor(serverState.hp))} / ${serverState.maxHp}`;
  document.getElementById('ui-mp-bar').style.width = `${(serverState.mp / serverState.maxMp) * 100}%`;
  document.getElementById('ui-mp-text').textContent = `${Math.floor(serverState.mp)} / ${serverState.maxMp}`;
  const expPct = Math.min(100, Math.floor((serverState.exp / serverState.maxExp) * 100));
  document.getElementById('ui-exp-bar').style.width = `${expPct}%`;
  document.getElementById('ui-exp-text').textContent = `${expPct}%`;
}

// ==========================================
// 5. 怪物生成與 AI 狀態機 (獨眼蝙蝠 & 蘑菇怪)
// ==========================================
const monsters = [];
let selectedTarget = null;

function createMonster(id, name, lv, maxHp, color, startX, startZ) {
  const mesh = BABYLON.MeshBuilder.CreateSphere("mob_" + id, { diameter: 1.5, segments: 12 }, scene);
  mesh.position.set(startX, 0.8, startZ);
  const mat = new BABYLON.StandardMaterial("mobMat_" + id, scene);
  mat.diffuseColor = color;
  mesh.material = mat;

  const mob = {
    id, name, lv,
    hp: maxHp, maxHp,
    mesh,
    spawnPos: new BABYLON.Vector3(startX, 0.8, startZ),
    targetPos: new BABYLON.Vector3(startX, 0.8, startZ),
    dead: false,
    atkCooldown: 0
  };
  mesh.metadata = { mobRef: mob };
  monsters.push(mob);
}

// 初始化 8 隻怪物
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2;
  createMonster(i, "獨眼蝙蝠 Aibatt", 1, 90, new BABYLON.Color3(0.95, 0.45, 0.15), Math.cos(a) * 10, Math.sin(a) * 10);
}
for (let i = 5; i < 8; i++) {
  const a = ((i - 5) / 3) * Math.PI * 2;
  createMonster(i, "蘑菇怪 Mushpang", 3, 180, new BABYLON.Color3(0.85, 0.2, 0.35), Math.cos(a) * 20, Math.sin(a) * 20);
}

function updateTargetHUD() {
  const hud = document.getElementById('target-hud');
  if (!selectedTarget || selectedTarget.dead) {
    hud.style.display = 'none';
    targetRing.setEnabled(false);
    return;
  }
  hud.style.display = 'block';
  document.getElementById('target-name').textContent = `${selectedTarget.name} (Lv.${selectedTarget.lv})`;
  const pct = Math.max(0, (selectedTarget.hp / selectedTarget.maxHp) * 100);
  document.getElementById('target-hp-bar').style.width = `${pct}%`;
  document.getElementById('target-hp-text').textContent = `${Math.max(0, selectedTarget.hp)} / ${selectedTarget.maxHp}`;
}

// 點擊怪物鎖定目標
scene.onPointerDown = function (evt, pickResult) {
  if (evt.button !== 0) return; // 僅限左鍵點選
  if (pickResult.hit && pickResult.pickedMesh && pickResult.pickedMesh.metadata && pickResult.pickedMesh.metadata.mobRef) {
    const mob = pickResult.pickedMesh.metadata.mobRef;
    if (!mob.dead) {
      selectedTarget = mob;
      targetRing.setEnabled(true);
      updateTargetHUD();
      addLog(`已鎖定目標：${mob.name} (Lv.${mob.lv})`);
    }
  }
};

// ==========================================
// 6. 戰鬥技能與飛天滑板系統
// ==========================================
function setCooldown(slot, seconds) {
  cooldowns[slot] = seconds;
  const el = document.getElementById(`cd-${slot}`);
  el.style.display = 'flex';
  el.textContent = seconds.toFixed(1);
}

function dealDamageToTarget(multiplier, skillName) {
  if (!selectedTarget || selectedTarget.dead) {
    addLog("請先用滑鼠左鍵點擊場上的怪物以鎖定目標！", "log-warn");
    return false;
  }
  const dist = BABYLON.Vector3.Distance(playerRoot.position, selectedTarget.mesh.position);
  if (dist > 4.5) {
    addLog(`距離太遠（目前 ${dist.toFixed(1)}m），請靠近目標再施放 ${skillName}！`, "log-warn");
    return false;
  }

  // 面向目標
  playerRoot.lookAt(new BABYLON.Vector3(selectedTarget.mesh.position.x, playerRoot.position.y, selectedTarget.mesh.position.z));

  // 伺服器端計算暴擊與傷害
  const isCrit = Math.random() < 0.3;
  let dmg = Math.floor(serverState.atk * multiplier * (0.9 + Math.random() * 0.2));
  if (isCrit) dmg = Math.floor(dmg * 1.6);

  selectedTarget.hp -= dmg;
  spawnFloatingText(
    selectedTarget.mesh.position.add(new BABYLON.Vector3(0, 1.2, 0)),
    isCrit ? `CRIT ${dmg}!` : `-${dmg}`,
    isCrit ? '#facc15' : '#ffffff'
  );
  addLog(`使用【${skillName}】對 ${selectedTarget.name} 造成 ${dmg} 點傷害！`, "log-dmg");

  if (selectedTarget.hp <= 0) {
    killMonster(selectedTarget);
  }
  updateTargetHUD();
  return true;
}

function killMonster(mob) {
  mob.dead = true;
  mob.mesh.setEnabled(false);
  const expGain = mob.lv * 45;
  serverState.exp += expGain;
  addLog(`擊敗了 ${mob.name}！獲得 ${expGain} EXP。`, "log-lv");

  // 升級判定
  if (serverState.exp >= serverState.maxExp) {
    serverState.exp -= serverState.maxExp;
    serverState.lv += 1;
    serverState.maxExp = Math.floor(serverState.maxExp * 1.4);
    serverState.maxHp += 50;
    serverState.hp = serverState.maxHp;
    serverState.maxMp += 25;
    serverState.mp = serverState.maxMp;
    serverState.atk += 9;
    spawnFloatingText(playerRoot.position.add(new BABYLON.Vector3(0, 2.2, 0)), `LEVEL UP! Lv.${serverState.lv}`, '#4ade80');
    addLog(`🎉 恭喜升級至 Lv.${serverState.lv}！攻擊力與生命上限提升！`, "log-lv");
  }
  updatePlayerHUD();
  updateTargetHUD();

  // 5 秒後重生
  setTimeout(() => {
    mob.hp = mob.maxHp;
    mob.dead = false;
    mob.mesh.position.copyFrom(mob.spawnPos);
    mob.mesh.setEnabled(true);
  }, 5000);
}

function useSkill(slot) {
  if (cooldowns[slot] > 0) return;

  if (slot === 1) {
    if (dealDamageToTarget(1.0, "普通攻擊")) setCooldown(1, 0.8);
  } else if (slot === 2) {
    if (serverState.mp < 15) { addLog("MP 不足，無法施放連環重擊！", "log-warn"); return; }
    if (dealDamageToTarget(2.2, "連環重擊")) {
      serverState.mp -= 15;
      updatePlayerHUD();
      setCooldown(2, 2.5);
    }
  } else if (slot === 3) {
    if (serverState.mp < 20) { addLog("MP 不足，無法施放緊急治癒！", "log-warn"); return; }
    serverState.mp -= 20;
    const heal = Math.floor(serverState.maxHp * 0.35);
    serverState.hp = Math.min(serverState.maxHp, serverState.hp + heal);
    spawnFloatingText(playerRoot.position.add(new BABYLON.Vector3(0, 2.0, 0)), `+${heal} HP`, '#4ade80');
    addLog(`施放【緊急治癒】恢復了 ${heal} 點生命值。`, "log-lv");
    updatePlayerHUD();
    setCooldown(3, 4.0);
  } else if (slot === 4) {
    serverState.isFlying = !serverState.isFlying;
    hoverboard.setEnabled(serverState.isFlying);
    const slotEl = document.getElementById('slot-flight');
    if (serverState.isFlying) {
      slotEl.classList.add('active-flight');
      playerRoot.position.y = Math.max(playerRoot.position.y, 2.5);
      serverState.pos.y = playerRoot.position.y;
      addLog("🛹 已召喚【飛天滑板】！按住 空白鍵(Space) 升空、Shift 下降。");
    } else {
      slotEl.classList.remove('active-flight');
      playerRoot.position.y = 0;
      serverState.pos.y = 0;
      addLog("已收起飛天滑板，回到地面步行模式。");
    }
    setCooldown(4, 1.0);
  }
}

// ==========================================
// 7. 防外掛實測功能 (模擬竄改記憶體與伺服器校正)
// ==========================================
function triggerSpeedHack() {
  // 模擬玩家透過 Cheat Engine 將本地座標瞬間移動 35 公尺
  playerRoot.position.x += 35;
  playerRoot.position.z += 35;
  addLog("⚠️ [外掛模擬] 客戶端已強制竄改本地座標 (+35m, +35m)...", "log-warn");

  // 模擬 250ms 後伺服器收到封包並進行速度校驗
  setTimeout(() => {
    const dist = BABYLON.Vector3.Distance(playerRoot.position, serverState.pos);
    const allowedMax = serverState.isFlying ? serverState.flySpeed * 20 : serverState.maxSpeed * 20;
    if (dist > allowedMax) {
      playerRoot.position.copyFrom(serverState.pos);
      spawnFloatingText(playerRoot.position.add(new BABYLON.Vector3(0, 2, 0)), "RUBBER-BANDED!", "#fb7185");
      addLog(`🛡️ [伺服器攔截] 偵測到單一 Tick 位移異常 (${dist.toFixed(1)}m)！已拒絕封包並強制拉回伺服器權威座標。`, "log-warn");
    }
  }, 250);
}

function triggerHpHack() {
  // 模擬玩家修改瀏覽器 UI 與本地變數將血量改為 99999
  document.getElementById('ui-hp-text').textContent = "99999 / 99999";
  document.getElementById('ui-hp-bar').style.width = "100%";
  addLog("⚠️ [外掛模擬] 客戶端已將本地記憶體 HP 鎖定為 99999...", "log-warn");

  setTimeout(() => {
    updatePlayerHUD();
    spawnFloatingText(playerRoot.position.add(new BABYLON.Vector3(0, 2, 0)), "STATE SYNCED", "#38bdf8");
    addLog(`🛡️ [伺服器攔截] 戰鬥結算以伺服器端資料庫為準（真實 HP: ${serverState.hp}/${serverState.maxHp}），本地修改無效！`, "log-warn");
  }, 600);
}

// ==========================================
// 8. 鍵盤輸入與主遊戲迴圈
// ==========================================
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (['1', '2', '3', '4'].includes(e.key)) useSkill(parseInt(e.key));
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

addLog("歡迎來到 3D 網頁版《飛飛》核心原型！請用 WASD 移動，左鍵點擊怪物戰鬥，按 4 召喚飛行滑板。");

let lastTime = performance.now();
engine.runRenderLoop(() => {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // 更新技能冷卻 UI
  for (let s = 1; s <= 4; s++) {
    if (cooldowns[s] > 0) {
      cooldowns[s] = Math.max(0, cooldowns[s] - dt);
      const el = document.getElementById(`cd-${s}`);
      if (cooldowns[s] === 0) el.style.display = 'none';
      else el.textContent = cooldowns[s].toFixed(1);
    }
  }

  // 依據相機水平角度計算移動方向
  const forward = new BABYLON.Vector3(Math.cos(camera.alpha + Math.PI), 0, Math.sin(camera.alpha + Math.PI)).normalize();
  const right = new BABYLON.Vector3(forward.z, 0, -forward.x).normalize();
  let moveVec = BABYLON.Vector3.Zero();

  if (keys['w']) moveVec.addInPlace(forward);
  if (keys['s']) moveVec.subtractInPlace(forward);
  if (keys['d']) moveVec.addInPlace(right);
  if (keys['a']) moveVec.subtractInPlace(right);

  const speed = serverState.isFlying ? serverState.flySpeed : serverState.maxSpeed;
  if (moveVec.lengthSquared() > 0.001) {
    moveVec.normalize().scaleInPlace(speed);
    playerRoot.position.addInPlace(moveVec);
    playerRoot.lookAt(playerRoot.position.add(moveVec));
  }

  // 飛行模式垂直升降
  if (serverState.isFlying) {
    if (keys[' ']) playerRoot.position.y = Math.min(25, playerRoot.position.y + 0.15);
    if (keys['shift']) playerRoot.position.y = Math.max(1.2, playerRoot.position.y - 0.15);
  }

  // 正常移動下更新權威伺服器座標
  if (BABYLON.Vector3.Distance(playerRoot.position, serverState.pos) < 2.0) {
    serverState.pos.copyFrom(playerRoot.position);
  }

  // 相機跟隨玩家
  camera.target.set(playerRoot.position.x, playerRoot.position.y + 1.2, playerRoot.position.z);

  // 更新鎖定紅圈與怪物 AI
  if (selectedTarget && !selectedTarget.dead) {
    targetRing.position.set(selectedTarget.mesh.position.x, 0.08, selectedTarget.mesh.position.z);
    targetRing.rotation.y += 0.04;
  }

  monsters.forEach(mob => {
    if (mob.dead) return;
    const distToPlayer = BABYLON.Vector3.Distance(mob.mesh.position, playerRoot.position);
    // 若玩家靠近且在地面附近，怪物主動追擊並攻擊
    if (distToPlayer < 7.5 && playerRoot.position.y < 3.0) {
      const dir = playerRoot.position.subtract(mob.mesh.position);
      dir.y = 0;
      if (dir.length() > 1.8) {
        dir.normalize().scaleInPlace(0.06);
        mob.mesh.position.addInPlace(dir);
      } else {
        mob.atkCooldown -= dt;
        if (mob.atkCooldown <= 0) {
          mob.atkCooldown = 2.0;
          const mobDmg = mob.lv * 6;
          serverState.hp = Math.max(1, serverState.hp - mobDmg);
          spawnFloatingText(playerRoot.position.add(new BABYLON.Vector3(0, 1.8, 0)), `-${mobDmg}`, '#fb7185');
          updatePlayerHUD();
        }
      }
    }
  });

  scene.render();
});

window.addEventListener('resize', () => engine.resize());
</script>
