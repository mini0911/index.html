<style>

  #three-canvas { width: 100%; height: 100%; display: block; }

  /* 輕微老醫院膠卷邊角效果 (不再黑壓壓，維持清晰明亮) */

<script>
/* ==================== 實體密室連鎖狀態庫 ==================== */
let inventorySlots = [null, null, null, null];
let selectedSlotIdx = null;

let escapeProgress = {
  drawerSearched: false, // 是否已搜刮護理站抽屜 (拿剪刀)
  strapCut: false,       // 是否已剪開病床止血帶 (拿鑰匙)
  cabinetUnlocked: false,// 是否已開啟藥品鐵櫃 (拿底片)
  xrayIlluminated: false,// 是否已在觀片箱顯影 (得知密碼 3824)
  finalPasscode: "3824"
};

let passcodeBuffer = "";

/* ==================== 音效引擎 ==================== */
class HospitalAudioEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }

  step() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(45, this.ctx.currentTime);
    g.gain.setValueAtTime(0.06, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  click() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(600, this.ctx.currentTime);
    g.gain.setValueAtTime(0.12, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.06);
  }
  metalClank() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(320, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.35);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.35);
  }
  doorOpen() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(90, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.7);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.7);
  }
}
const sfx = new HospitalAudioEngine();

/* ==================== 程序化真實老醫院 PBR 貼圖 ==================== */
function createHospitalWallTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // 上半部老舊白灰牆面
  ctx.fillStyle = "#bcc6be";
  ctx.fillRect(0, 0, 512, 330);

  // 下半部經典墨綠耐磨防污漆
  ctx.fillStyle = "#1e3b2b";
  ctx.fillRect(0, 330, 512, 182);

  // 分界黑色金屬壓條
  ctx.fillStyle = "#0a140e";
  ctx.fillRect(0, 325, 512, 6);

  // 斑駁粉刷噪點
  for (let i = 0; i < 3000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? "rgba(10, 25, 18, 0.08)" : "rgba(70, 80, 75, 0.08)";
    ctx.beginPath();
    ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 1);
  return tex;
}

function createHospitalTileTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  const tileSize = 64;
  for (let y = 0; y < 512; y += tileSize) {
    for (let x = 0; x < 512; x += tileSize) {
      ctx.fillStyle = ((x + y) / tileSize) % 2 === 0 ? "#1c2b22" : "#14211a";
      ctx.fillRect(x, y, tileSize, tileSize);
      ctx.strokeStyle = "rgba(5, 12, 8, 0.8)";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, tileSize, tileSize);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  return tex;
}

/* ==================== Three.js 3D 渲染系統 ==================== */
let scene, camera, renderer;
let hospitalGroup = null;
let interactables = [];
let wallColliders = [];

let yaw = 0, pitch = 0;
let playerPos = { x: 0, y: 1.8, z: 8 };
let keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
let isInteractingLook = false, lastTouchX = 0, lastTouchY = 0;
let headBob = 0;

function startGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThreeEngine();
  buildPhotorealHospital();
}

function initThreeEngine() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 80);
  camera.position.set(playerPos.x, playerPos.y, playerPos.z);
  scene.add(camera);

  // ⭐ 全場常時明亮光照 (取消手電筒，使用均勻頂棚燈光)
  const mainAmbient = new THREE.AmbientLight(0xdde8e0, 0.85); // 高亮度清冷環境光
  scene.add(mainAmbient);

  // 頂棚長條日光燈陣列 (Diffuse Overhead Lights)
  const ceilingLight1 = new THREE.PointLight(0xf2fff8, 0.9, 22);
  ceilingLight1.position.set(0, 5.2, 4);
  scene.add(ceilingLight1);

  const ceilingLight2 = new THREE.PointLight(0xf2fff8, 0.9, 22);
  ceilingLight2.position.set(0, 5.2, -6);
  scene.add(ceilingLight2);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05; // 明亮通透曝光
  container.appendChild(renderer.domElement);

  // 鍵盤與滑鼠監聽
  window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

  container.addEventListener('pointerdown', (e) => {
    isInteractingLook = true;
    lastTouchX = e.clientX; lastTouchY = e.clientY;
  });
  window.addEventListener('pointermove', (e) => {
    if (isInteractingLook) {
      const dx = e.clientX - lastTouchX, dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX; lastTouchY = e.clientY;
      yaw -= dx * 0.0035;
      pitch -= dy * 0.0035;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
    }
  });
  window.addEventListener('pointerup', () => { isInteractingLook = false; });
  container.addEventListener('click', checkRaycastInteract);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

/* ==================== 建立寫實常亮醫院 3D 模型 ==================== */
function buildPhotorealHospital() {
  hospitalGroup = new THREE.Group();
  interactables = [];
  wallColliders = [];

  const wallTexture = createHospitalWallTexture();
  const tileTexture = createHospitalTileTexture();

  // 1. 大廳外牆 (寬 20m, 深 24m, 高 6m)
  const outerWallMat = new THREE.MeshStandardMaterial({
    map: wallTexture, roughness: 0.85, side: THREE.BackSide
  });
  const outerWall = new THREE.Mesh(new THREE.BoxGeometry(20, 6, 24), outerWallMat);
  outerWall.position.y = 3;
  hospitalGroup.add(outerWall);

  // 2. 地板 (綠白磨石子地磚)
  const floorMat = new THREE.MeshStandardMaterial({
    map: tileTexture, roughness: 0.35, metalness: 0.2
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 24), floorMat);
  floor.rotation.x = -Math.PI / 2;
  hospitalGroup.add(floor);

  // 天花板懸掛日光燈座
  buildCeilingFixtures();

  // 3. 機關 1：護理站大理石櫃檯與抽屜 (位置 X: -5.5, Z: 4)
  buildNurseStation(-5.5, 4);

  // 4. 機關 2：急診病床與纏繞止血帶 (位置 X: 5.5, Z: 1)
  buildHospitalBed(5.5, 1);

  // 5. 機關 3：老舊藥品鋼鐵櫃 (位置 X: 7.5, Z: -7)
  buildMedicineCabinet(7.5, -7);

  // 6. 機關 4：放射科發光 X 光觀片燈箱 (位置 X: -7.5, Z: -6)
  buildXRayViewBox(-7.5, -6);

  // 7. 候診排椅與點滴架裝飾
  buildWaitingBenches(0, 9);
  buildIVStand(4.2, 2.2);

  // 8. 終點：重型防護鐵門與密碼鎖盤 (位置 X: 0, Z: -11.8)
  buildExitSecurityDoor(0, -11.8);

  scene.add(hospitalGroup);
}

/* ==================== ⭐ 核心：實體密室道具鏈邏輯交互 ==================== */
function checkRaycastInteract() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const hits = raycaster.intersectObjects(interactables, true);
  if (hits.length === 0) return;

  const hitObj = hits[0].object;
  const dist = camera.position.distanceTo(hits[0].point);
  if (dist > 4.5) return;

  const targetId = hitObj.userData.id;
  const activeItem = selectedSlotIdx !== null ? inventorySlots[selectedSlotIdx] : null;

  // 1. 調查護理站抽屜
  if (targetId === "nurse_drawer") {
    if (!escapeProgress.drawerSearched) {
      sfx.metalClank();
      escapeProgress.drawerSearched = true;
      hitObj.position.z += 0.5; // 拉開動畫
      addItemToInventory("解剖剪刀", "✂️", "一把鋒利耐用的醫療手術剪刀，可用來剪斷繃帶或橡膠線纜。");
      document.getElementById('current-task').innerText = "當前任務：前往病床床頭，選中【解剖剪刀】剪開急救盒上的止血帶！";
      alert("【搜查抽屜】在散亂的病歷下，你找到了一把【解剖剪刀】！已收入底部背包欄。");
    } else {
      alert("抽屜已被搜刮空了，只剩下乾涸的紅藥水痕跡。");
    }
  }

  // 2. 調查病床床頭急救盒 (需剪刀)
  else if (targetId === "bed_box") {
    if (!escapeProgress.strapCut) {
      if (activeItem && activeItem.name === "解剖剪刀") {
        sfx.metalClank();
        escapeProgress.strapCut = true;
        hitObj.material.color.setHex(0x1a4028); // 剪開變色
        consumeSelectedItem();
        addItemToInventory("鐵櫃鑰匙", "🗝️", "一把貼著『藥品管理科』標籤的黃銅小鑰匙。");
        document.getElementById('current-task').innerText = "當前任務：走至牆角藥品鐵櫃，選中【鐵櫃鑰匙】插入解鎖！";
        alert("【剪斷止血帶！】橡膠繩斷開，急救盒彈開！你從裡面拿到了【鐵櫃鑰匙】！已收進背包！");
      } else {
        alert("金屬盒被強韌的橡膠止血帶緊緊打結纏死，徒手無法解開！（請先選中背包中的剪刀道具）");
      }
    } else {
      alert("急救盒已經被剪開打開了。");
    }
  }

  // 3. 調查藥品鐵櫃 (需鑰匙)
  else if (targetId === "med_cabinet") {
    if (!escapeProgress.cabinetUnlocked) {
      if (activeItem && activeItem.name === "鐵櫃鑰匙") {
        sfx.metalClank();
        escapeProgress.cabinetUnlocked = true;
        consumeSelectedItem();
        addItemToInventory("胸部透視片", "🩻", "一張泛黃曝光的胸腔 X 光透明底片，上面隱約有黑白骨骼光影。");
        document.getElementById('current-task').innerText = "當前任務：走至發光的 X 光觀片箱，選中【胸部透視片】放置顯影！";
        alert("【鐵櫃解鎖成功！】玻璃門彈開！你在藥品架深處發現了一張封存的【胸部透視片】！");
      } else {
        alert("藥品櫃鎖頭緊閉，內部保管著重要醫療底片，需要專用鑰匙解鎖（請選中背包裡的鑰匙）！");
      }
    } else {
      alert("藥品櫃門已打開，內部藥品早已過期發黑。");
    }
  }

  // 4. 調查 X 光燈箱 (需底片)
  else if (targetId === "xray_box") {
    if (!escapeProgress.xrayIlluminated) {
      if (activeItem && activeItem.name === "胸部透視片") {
        sfx.click();
        escapeProgress.xrayIlluminated = true;
        consumeSelectedItem();
        hitObj.material.color.setHex(0x334455); // 底片貼上變暗顯影
        document.getElementById('current-task').innerText = "當前任務：前往防護鐵門密碼盤，輸入底片顯示的密碼 3824 逃脫！";
        alert("【底片顯影透光！】\n在強烈白光穿透下，底片右下角浮現出手寫的一串紅色醫療暗號：\n『緊急撤離密碼：3 - 8 - 2 - 4』！");
      } else {
        alert("觀片燈箱強光刺眼，必須將透明底片放上去才能看清內容（請選中背包中的透視片）！");
      }
    } else {
      alert("X 光底片在燈箱上清晰透光，顯示著代碼：3 8 2 4。");
    }
  }

  // 5. 調查防護門密碼盤
  else if (targetId === "exit_keypad") {
    openKeypadDialog();
  }
}

/* ==================== 實體背包系統 ==================== */
function addItemToInventory(name, icon, desc) {
  for (let i = 0; i < 4; i++) {
    if (inventorySlots[i] === null) {
      inventorySlots[i] = { name, icon, desc };
      document.getElementById(`slot-icon-${i}`).innerText = icon;
      document.getElementById(`slot-name-${i}`).innerText = name;
      return;
    }
  }
}

function selectItem(idx) {
  if (inventorySlots[idx] === null) return;

  if (selectedSlotIdx === idx) {
    openPropModal(inventorySlots[idx]);
  } else {
    selectedSlotIdx = idx;
    for (let i = 0; i < 4; i++) {
      document.getElementById(`slot-${i}`).classList.remove('selected');
    }
    document.getElementById(`slot-${idx}`).classList.add('selected');
  }
}

function consumeSelectedItem() {
  if (selectedSlotIdx !== null) {
    inventorySlots[selectedSlotIdx] = null;
    document.getElementById(`slot-icon-${selectedSlotIdx}`).innerText = "空";
    document.getElementById(`slot-name-${selectedSlotIdx}`).innerText = "-";
    document.getElementById(`slot-${selectedSlotIdx}`).classList.remove('selected');
    selectedSlotIdx = null;
  }
}

function openPropModal(item) {
  document.getElementById('prop-title').innerText = `【道具情報：${item.name}】`;
  document.getElementById('prop-body').innerText = item.desc;
  document.getElementById('prop-modal').style.display = 'flex';
}
function closePropModal() { document.getElementById('prop-modal').style.display = 'none'; }

/* ==================== 密碼鎖盤邏輯 ==================== */
function openKeypadDialog() {
  sfx.click();
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('keypad-modal').style.display = 'flex';
}
function closeKeypad() { document.getElementById('keypad-modal').style.display = 'none'; }

function pressKey(n) {
  sfx.click();
  if (passcodeBuffer.length < 4) {
    passcodeBuffer += n;
    document.getElementById('keypad-code').innerText = passcodeBuffer.padEnd(4, '-');
  }
}
function clearKeypad() { sfx.click(); passcodeBuffer = ""; document.getElementById('keypad-code').innerText = "----"; }

function submitPasscode() {
  if (passcodeBuffer === escapeProgress.finalPasscode) {
    sfx.doorOpen();
    closeKeypad();
    alert("🎉【隔離防護鐵門解鎖成功！】\n厚重的氣密鋼門發出洩壓低鳴，緩緩向兩側滑開！\n你成功破解連鎖謎題，活著逃出了杏林綜合醫院急診室！");
  } else {
    sfx.metalClank();
    alert("【密碼錯誤！】門禁系統紅燈蜂鳴！請去 X 光燈箱確認底片上的紅色暗號！");
    clearKeypad();
  }
}

/* ==================== 走動與視角 ==================== */
function updateMovement() {
  const moveSpeed = 0.11;
  let moveX = 0, moveZ = 0;

  if (keys.KeyW) moveZ -= 1;
  if (keys.KeyS) moveZ += 1;
  if (keys.KeyA) moveX -= 1;
  if (keys.KeyD) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const len = Math.hypot(moveX, moveZ);
    moveX = (moveX / len) * moveSpeed;
    moveZ = (moveZ / len) * moveSpeed;

    const sinYaw = Math.sin(yaw), cosYaw = Math.cos(yaw);
    const nextX = playerPos.x + (moveX * cosYaw + moveZ * sinYaw);
    const nextZ = playerPos.z + (-moveX * sinYaw + moveZ * cosYaw);

    let canMoveX = true, canMoveZ = true;
    for (let box of wallColliders) {
      if (nextX >= box.minX && nextX <= box.maxX && playerPos.z >= box.minZ && playerPos.z <= box.maxZ) canMoveX = false;
      if (playerPos.x >= box.minX && playerPos.x <= box.maxX && nextZ >= box.minZ && nextZ <= box.maxZ) canMoveZ = false;
    }

    if (nextX < -9 || nextX > 9) canMoveX = false;
    if (nextZ < -11 || nextZ > 11) canMoveZ = false;

    if (canMoveX) playerPos.x = nextX;
    if (canMoveZ) playerPos.z = nextZ;

    headBob += 0.18;
    camera.position.y = playerPos.y + Math.sin(headBob) * 0.04;

    if (Math.sin(headBob) < -0.95 && !updateMovement.stepped) {
      sfx.step(); updateMovement.stepped = true;
    } else if (Math.sin(headBob) > 0) {
      updateMovement.stepped = false;
    }
  }

  camera.position.x = playerPos.x;
  camera.position.z = playerPos.z;

  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);
}

function updateInteractHint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const hits = raycaster.intersectObjects(interactables, true);
  const cross = document.getElementById('crosshair');
  const hint = document.getElementById('interact-hint');

  if (hits.length > 0 && hits[0].distance <= 4.5) {
    cross.classList.add('interactable');
    hint.style.display = 'block';
    hint.innerText = hits[0].object.userData.hint || "[ 點擊調查 ]";
  } else {
    cross.classList.remove('interactable');
    hint.style.display = 'none';
  }
}

function animate() {
  requestAnimationFrame(animate);

  updateMovement();
  updateInteractHint();

  renderer.render(scene, camera);
}
