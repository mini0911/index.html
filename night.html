<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>今天也要平安下班！校安日常版</title>
  <style>
    :root {
      --primary: #f97316;
      --primary-dark: #c2410c;
      --primary-light: #ffedd5;
      --bg-cream: #fefce8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --san-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app-container {
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      background: var(--bg-cream);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    /* 頂部導航與儀表板 */
    .dashboard {
      background: #ffffff;
      padding: 14px 16px 12px;
      border-bottom: 3px solid #fed7aa;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.06);
      z-index: 10;
    }

    .dashboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      color: var(--primary-dark);
      border: 1.5px solid #fdba74;
    }

    .time-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #0f172a;
      color: #fbbf24;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 16px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 12px;
      border: 1.5px solid #f59e0b;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .sound-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .san-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .san-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #9f1239;
    }

    .san-bar-track {
      height: 14px;
      background: #ffe4e6;
      border: 2px solid #fda4af;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .san-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f43f5e, #e11d48);
      border-radius: 8px;
      transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .case-count-box {
      font-size: 11px;
      font-weight: 800;
      color: #475569;
      background: #f8fafc;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    /* 主要卡片舞台區 */
    .stage-container {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      position: relative;
    }

    /* 訪客事件卡 */
    .visitor-card {
      background: #ffffff;
      border: 3px solid #fdba74;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 16px rgba(249, 115, 22, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .visitor-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff7ed;
      border: 2.5px solid #fb923c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
      box-shadow: 0 4px 0 #fed7aa;
    }

    .visitor-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .visitor-name {
      font-size: 16px;
      font-weight: 900;
      color: #7c2d12;
    }

    .visitor-status-tag {
      font-size: 11px;
      font-weight: 700;
      color: #ea580c;
      background: #ffedd5;
      padding: 2px 8px;
      border-radius: 6px;
      align-self: flex-start;
    }

    .speech-bubble {
      background: #fffbeb;
      border: 2px solid #fde68a;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.5;
      position: relative;
    }

    .speech-bubble::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 28px;
      border-width: 0 8px 8px 8px;
      border-style: solid;
      border-color: transparent transparent #fde68a transparent;
    }

    /* 選項按鈕組 */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }

    .option-btn {
      background: #ffffff;
      border: 2.5px solid #cbd5e1;
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.1s ease;
    }

    .option-btn:hover {
      border-color: #fb923c;
      background: #fff7ed;
      color: #9a3412;
      box-shadow: 0 4px 0 #f97316;
    }

    .option-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f97316;
    }

    .opt-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #64748b;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 900;
    }

    /* 處置結果彈窗 (Bottom Sheet) */
    .result-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 4px solid var(--primary);
      border-radius: 24px 24px 0 0;
      padding: 22px 20px env(safe-area-inset-bottom, 20px);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 25;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-tag {
      font-size: 13px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .tag-positive { background: #dcfce7; color: #15803d; }
    .tag-negative { background: #fee2e2; color: #b91c1c; }

    .stat-change {
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-gain { color: #16a34a; }
    .stat-loss { color: #dc2626; }

    .result-desc {
      font-size: 14px;
      color: #334155;
      line-height: 1.55;
      font-weight: 700;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .next-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-dark);
      transition: all 0.1s;
    }

    .next-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    /* 遊戲開始/結算全螢幕視窗 */
    .modal-fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }

    .report-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 24px;
      border: 4px solid #fdba74;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: popIn 0.35s ease-out;
    }

    .report-emoji {
      font-size: 46px;
      line-height: 1;
    }

    .report-title {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
    }

    .title-win { color: #16a34a; }
    .title-lose { color: #dc2626; }

    .report-badge {
      font-size: 13px;
      font-weight: 800;
      color: #9a3412;
      background: #ffedd5;
      padding: 6px 14px;
      border-radius: 12px;
      align-self: center;
      border: 1px dashed #ea580c;
    }

    .report-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      font-weight: 800;
      color: #475569;
    }

    .report-stats-item span {
      display: block;
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
      margin-top: 2px;
    }

    .btn-group-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .share-btn {
      padding: 12px;
      border-radius: 12px;
      background: #0284c7;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 3px 0 #0369a1;
    }

    .share-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0369a1;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header class="dashboard">
      <div class="dashboard-top">
        <div class="app-title-badge">
          <span>🎒</span>
          <span>校安值勤中</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="sound-btn" id="sound-btn" onclick="toggleAudio()">🔊</button>
          <div class="time-badge">
            <span>⏰</span>
            <span id="time-display">15:30</span>
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="san-container">
          <div class="san-meta">
            <span>❤️ 精神理智值 (SAN)</span>
            <span id="san-text">100 / 100</span>
          </div>
          <div class="san-bar-track">
            <div class="san-bar-fill" id="san-bar"></div>
          </div>
        </div>
        <div class="case-count-box">
          已排解: <span id="solved-count" style="color: var(--primary); font-weight: 900;">0</span> 件
        </div>
      </div>
    </header>

    <main class="stage-container" id="stage">
      <div class="visitor-card" id="visitor-card">
        <div class="visitor-header">
          <div class="avatar-wrapper" id="avatar-icon">🎒</div>
          <div class="visitor-info">
            <div class="visitor-name" id="visitor-name">同學走進學務處...</div>
            <div class="visitor-status-tag" id="visitor-tag">求助中</div>
          </div>
        </div>
        <div class="speech-bubble" id="speech-text">
          稍等一下，下一位同學正在敲門走進辦公室...
        </div>
      </div>

      <div class="options-group" id="options-box"></div>
    </main>

    <div class="result-sheet" id="result-sheet">
      <div class="result-header">
        <div class="result-tag" id="result-tag">處置完畢</div>
        <div class="stat-change" id="stat-change">SAN +10</div>
      </div>
      <div class="result-desc" id="result-desc">
        同學點點頭，收好東西放心地離開了學務處。
      </div>
      <button class="next-btn" onclick="nextVisitor()">接待下一位同學 ➔</button>
    </div>

    <div class="modal-fullscreen" id="start-modal">
      <div class="report-card">
        <div class="report-emoji">🏫</div>
        <h1 class="report-title">今天也要平安下班！</h1>
        <div class="report-badge">學務處校安生存日記</div>
        <p style="font-size: 13px; color: #475569; line-height: 1.6; font-weight: 700;">
          現在是 15:30，距離 17:00 準時打卡下班只剩最後一個半小時！<br><br>
          各班同學、導師與家長的棘手問題排山倒海而來，<br>
          做出正確抉擇，保護你的理智值（SAN）平安下班！
        </p>
        <button class="next-btn" onclick="startGame()">開始今日值勤 📋</button>
      </div>
    </div>

    <div class="modal-fullscreen" id="end-modal" style="display: none;">
      <div class="report-card">
        <div class="report-emoji" id="end-emoji">🎉</div>
        <h2 class="report-title" id="end-title">平安下班！</h2>
        <div class="report-badge" id="end-badge">金牌校安守護者</div>
        <p style="font-size: 13px; color: #475569; line-height: 1.5; font-weight: 700;" id="end-desc">
          鐘聲響起，你保全了最後的理智，準時打卡撤退！
        </p>

        <div class="report-stats-grid">
          <div class="report-stats-item">
            排解事件
            <span id="end-solved">0</span>
          </div>
          <div class="report-stats-item">
            剩餘理智
            <span id="end-san">100%</span>
          </div>
        </div>

        <div class="btn-group-column">
          <button class="share-btn" onclick="copyShareText()">📋 複製戰績發 Threads / IG</button>
          <button class="next-btn" onclick="restartGame()">再值勤一天 ⏰</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { }
    }

    function toggleAudio() {
      initAudio();
      isMuted = !isMuted;
      document.getElementById('sound-btn').innerText = isMuted ? '🔇' : '🔊';
    }

    function playTone(freq, type = 'sine', duration = 0.12, gainVal = 0.1) {
      if (!audioCtx || isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    function playSuccessSound() {
      playTone(523.25, 'triangle', 0.08, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.1, 0.15), 60);
      setTimeout(() => playTone(783.99, 'triangle', 0.18, 0.2), 120);
    }

    function playDamageSound() {
      playTone(220, 'sawtooth', 0.12, 0.18);
      setTimeout(() => playTone(140, 'sawtooth', 0.25, 0.18), 80);
    }

    function playBellSound() {
      playTone(659.25, 'sine', 0.3, 0.2);
      setTimeout(() => playTone(523.25, 'sine', 0.4, 0.2), 250);
      setTimeout(() => playTone(587.33, 'sine', 0.3, 0.2), 500);
      setTimeout(() => playTone(392.00, 'sine', 0.6, 0.2), 750);
    }

    function triggerHaptic(type) {
      if (!('vibrate' in navigator)) return;
      try {
        if (type === 'success') navigator.vibrate([35, 50, 40]);
        else if (type === 'wrong') navigator.vibrate(180);
      } catch (e) { }
    }

    const visitorsPool = [
      {
        name: "高二３班 陳同學",
        avatar: "📱",
        tag: "急得快哭出來",
        speech: "老師！有人把我的醜照截圖做成表情包發在 Threads 告白粉專，底下好多人在嘲笑我，我明天不想來學校了...",
        options: [
          {
            text: "截圖留存證據！我陪你找輔導老師與生輔組，發函要求平台下架並啟動校安關懷。",
            san: 10,
            feedback: "你溫和堅定地指導截圖存證並通報平台下架，同學鬆了一大口氣，感覺有了依靠！"
          },
          {
            text: "網路上的留言過兩天大家就忘了啦，把手機關掉去操場跑跑步！",
            san: -15,
            feedback: "同學覺得被輕描淡寫敷衍，委屈地紅著眼眶走出學務處...你的心裡一陣內疚。（SAN -15）"
          },
          {
            text: "叫你班上兄弟一起去貼文底下留言開戰，看誰戰力比較強！",
            san: -25,
            feedback: "兩小時後雙方在留言區爆發集體大混戰，家長氣沖沖打進學務處咆哮...（SAN -25）"
          }
        ]
      },
      {
        name: "高一１班 林同學",
        avatar: "💨",
        tag: "神神秘秘探頭",
        speech: "報告老師...三樓最底部的男廁裡面有很濃的水果甜味，好像有隔壁班同學躲在裡面偷抽電子煙...",
        options: [
          {
            text: "謝謝你機警反映！我立刻帶上生輔組老師過去巡查，並保密你的吹哨身分。",
            san: 12,
            feedback: "你神速突擊成功查獲違禁品，同時妥善保護了報信同學的身分，成就感滿滿！"
          },
          {
            text: "你現在跟我一起進去，直接當面指給我看是誰！",
            san: -15,
            feedback: "同學當場嚇得臉色發白，深怕被當成抓耙子報復，學務處信任度扣分。（SAN -15）"
          },
          {
            text: "那個煙彈很貴學生買不起啦，應該只是芳香劑的味道吧？",
            san: -20,
            feedback: "十分鐘後廁所響起煙霧警報，教務主任親自過來關切你剛才在幹嘛...（SAN -20）"
          }
        ]
      },
      {
        name: "高三５班 張同學",
        avatar: "🧋",
        tag: "手足無措",
        speech: "老師！我偷訂的 10 杯連鎖手搖飲到了，但警衛杯杯把外送員擋在校門口說要全部沒收倒掉...",
        options: [
          {
            text: "校規規定外送需集中在專區！我先幫你領回代管，放學後憑學生證來學務處領取。",
            san: 8,
            feedback: "既維持了校門安管規定，又化解了外送員與警衛的僵局，同學感動得差點跪下。"
          },
          {
            text: "警衛做得好！你現在去旁邊罰站，飲料當場依校規充公倒掉！",
            san: -12,
            feedback: "同學在走廊崩潰抗議，引來大批學生圍觀喧嘩，你的血壓瞬間升高。（SAN -12）"
          },
          {
            text: "趁警衛低頭登記，你繞去體育館圍牆偷翻過去接過來！",

    let gameTimeState = 15.5 * 60;
    const targetTimeState = 17.0 * 60;
    let san = 100;
    const maxSan = 100;
    let solvedCount = 0;
    let currentVisitor = null;
    let availableDeck = [];

    const timeDisplay = document.getElementById('time-display');
    const sanBar = document.getElementById('san-bar');
    const sanText = document.getElementById('san-text');
    const solvedText = document.getElementById('solved-count');

    const avatarIcon = document.getElementById('avatar-icon');
    const visitorName = document.getElementById('visitor-name');
    const visitorTag = document.getElementById('visitor-tag');
    const speechText = document.getElementById('speech-text');
    const optionsBox = document.getElementById('options-box');

    const resultSheet = document.getElementById('result-sheet');
    const resultTag = document.getElementById('result-tag');
    const statChange = document.getElementById('stat-change');
    const resultDesc = document.getElementById('result-desc');

    const startModal = document.getElementById('start-modal');
    const endModal = document.getElementById('end-modal');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function updateTimeDisplay() {
      const hours = Math.floor(gameTimeState / 60);
      const mins = Math.floor(gameTimeState % 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
    }

    function updateSanDisplay() {
      sanBar.style.width = `${Math.max(0, (san / maxSan) * 100)}%`;
      sanText.innerText = `${san} / ${maxSan}`;

      if (san <= 30) {
        sanBar.style.background = 'linear-gradient(90deg, #dc2626, #991b1b)';
      } else if (san <= 60) {
        sanBar.style.background = 'linear-gradient(90deg, #f59e0b, #d97706)';
      } else {
        sanBar.style.background = 'linear-gradient(90deg, #f43f5e, #e11d48)';
      }
    }

    function loadNextVisitor() {
      resultSheet.style.display = 'none';

      if (gameTimeState >= targetTimeState) {
        endGame(true);
        return;
      }

      if (availableDeck.length === 0) {
        availableDeck = shuffle(visitorsPool);
      }

      currentVisitor = availableDeck.pop();

      avatarIcon.innerText = currentVisitor.avatar;
      visitorName.innerText = currentVisitor.name;
      visitorTag.innerText = currentVisitor.tag;
      speechText.innerText = currentVisitor.speech;

      const card = document.getElementById('visitor-card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';

      optionsBox.innerHTML = '';
      const shuffledOptions = shuffle(currentVisitor.options);

      shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
          <div class="opt-number">${idx + 1}</div>
          <div>${opt.text}</div>
        `;
        btn.onclick = () => chooseOption(opt);
        optionsBox.appendChild(btn);
      });
    }

    function chooseOption(opt) {
      san = Math.max(0, Math.min(maxSan, san + opt.san));
      updateSanDisplay();

      gameTimeState += 15;
      updateTimeDisplay();

      if (opt.san >= 0) {
        playSuccessSound();
        triggerHaptic('success');
        solvedCount++;
        solvedText.innerText = solvedCount;

        resultTag.innerText = "處置合宜 🎉";
        resultTag.className = "result-tag tag-positive";
        statChange.className = "stat-change stat-gain";
        statChange.innerText = `SAN +${opt.san}`;
      } else {
        playDamageSound();
        triggerHaptic('wrong');

        resultTag.innerText = "精神耗損 💥";
        resultTag.className = "result-tag tag-negative";
        statChange.className = "stat-change stat-loss";
        statChange.innerText = `SAN ${opt.san}`;
      }

      resultDesc.innerText = opt.feedback;
      resultSheet.style.display = 'flex';

      if (san <= 0) {
        setTimeout(() => endGame(false), 900);
      }
    }

    function nextVisitor() {
      if (san <= 0) {
        endGame(false);
      } else if (gameTimeState >= targetTimeState) {
        endGame(true);
      } else {
        loadNextVisitor();
      }
    }

    function startGame() {
      initAudio();
      startModal.style.display = 'none';
      endModal.style.display = 'none';
      gameTimeState = 15.5 * 60;
      san = 100;
      solvedCount = 0;
      solvedText.innerText = '0';
      updateTimeDisplay();
      updateSanDisplay();
      availableDeck = shuffle(visitorsPool);
      loadNextVisitor();
    }

    function restartGame() {
      startGame();
    }

    function endGame(win) {
      resultSheet.style.display = 'none';
      endModal.style.display = 'flex';

      const endEmoji = document.getElementById('end-emoji');
      const endTitle = document.getElementById('end-title');
      const endBadge = document.getElementById('end-badge');
      const endDesc = document.getElementById('end-desc');
      const endSolved = document.getElementById('end-solved');
      const endSan = document.getElementById('end-san');

      endSolved.innerText = `${solvedCount} 件`;
      endSan.innerText = `${san}%`;

      if (win) {
        playBellSound();
        triggerHaptic('success');
        endEmoji.innerText = "🎉";
        endTitle.innerText = "平安下班！";
        endTitle.className = "report-title title-win";

        if (san >= 85) {
          endBadge.innerText = "🏆 金牌佛光校安神仙";
          endDesc.innerHTML = "17:00 打卡鐘聲敲響！面對排山倒海的荒唐考驗，你面帶微笑化解所有危機，理智滿格優雅離校！";
        } else if (san >= 50) {
          endBadge.innerText = "🛡️ 學務處定海神針";
          endDesc.innerHTML = "雖然被幾位天兵學生耗損了些許精力，但你依舊穩如泰山，成功在放學鐘聲下踩線撤退！";
        } else {
          endBadge.innerText = "🏃 驚險逃亡打卡戰士";
          endDesc.innerHTML = "殘血存活！差一點點理智線就要在走廊斷裂了...趁長官還沒交辦新公文，拔腿狂奔出校門！";
        }
      } else {
        playDamageSound();
        triggerHaptic('wrong');
        endEmoji.innerText = "💀";
        endTitle.innerText = "理智斷線，被迫加班！";
        endTitle.className = "report-title title-lose";
        endBadge.innerText = "🪦 走廊心力交瘁苦主";
        endDesc.innerHTML = "你的理智值（SAN）歸零了！在非理性陳情與連鎖突發事件的轟炸下，今天只好多喝杯苦茶留在學務處填寫檢討通報單了...";
      }
    }

    function copyShareText() {
      const isWin = san > 0;
      const badge = document.getElementById('end-badge').innerText;
      const text = isWin
        ? `【今天也要平安下班！校安日常版】🎒\n我今天在學務處成功平安下班了！🎉\n⏰ 值勤結算：17:00 準時打卡\n❤️ 剩餘理智：${san}%\n📋 化解危機：${solvedCount} 件\n獲得稱號：${badge}\n願天下校安人員都能準時下班！`
        : `【今天也要平安下班！校安日常版】💀\n我在下班前 10 分鐘理智斷線了...\n💔 陣亡原因：學務處日常精神污染\n📋 堅持處理了 ${solvedCount} 件校園突發事件\n今晚只能在學務處含淚加班填公文了...`;

      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          alert("戰績文字已複製到剪貼簿！可直接貼到 Threads 或 IG 分享！");
        });
      } else {
        alert("複製成功：\n" + text);
      }
    }
  </script>
