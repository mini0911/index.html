<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】PokéGO 實境恐懼生還戰</title>

<!-- Three.js 核心與動畫庫 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #050608; color: #eee; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #game-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* 3D 遊戲世界畫布 */
  #three-canvas { width: 100%; height: 100%; display: block; }

  /* 恐懼暗角與靈異掃描線 (VHS Overlay) */
  .horror-vignette {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 50%, rgba(10, 0, 0, 0.6) 80%, rgba(0, 0, 0, 0.95) 100%),
                repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0, 20, 10, 0.15) 3px, rgba(0,0,0,0) 4px);
    pointer-events: none; z-index: 10;
  }

  /* 頂部 HUD (Pokémon GO 經典玩家狀態列) */
  .poke-hud-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 60px;
    background: linear-gradient(180deg, rgba(5,6,8,0.95) 0%, transparent 100%);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; z-index: 100;
  }
  .player-card {
    display: flex; align-items: center; gap: 10px;
  }
  .player-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: #1a0808;
    border: 2px solid #ff4444; display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 10px rgba(255, 68, 68, 0.5); font-size: 18px;
  }
  .player-info { display: flex; flex-direction: column; gap: 2px; }
  .player-level { font-size: 13px; font-weight: bold; color: #ff5555; letter-spacing: 0.5px; }
  .hp-bar-outer {
    width: 110px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #444;
  }
  .hp-bar-inner { width: 70%; height: 100%; background: linear-gradient(90deg, #ff2222, #00ff88); transition: width 0.3s; }

  .status-badges { display: flex; gap: 8px; align-items: center; }
  .badge {
    background: rgba(22, 27, 34, 0.85); border: 1px solid #30363d;
    padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #8b949e;
  }
  .badge.steps { color: #00ff88; border-color: #008844; }

  /* 底部主功能球與任務面板 (Poké Ball Style Menu) */
  .poke-bottom-bar {
    position: absolute; bottom: 18px; left: 0; width: 100%;
    display: flex; justify-content: center; align-items: center; gap: 20px;
    z-index: 100; pointer-events: none;
  }
  .bottom-btn {
    pointer-events: auto; width: 56px; height: 56px; border-radius: 50%;
    background: #111; border: 2px solid #555; color: #fff; font-size: 20px;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.8); transition: all 0.2s;
  }
  .bottom-btn.main-compass {
    width: 68px; height: 68px; border-color: #ff3333; background: #220808;
    box-shadow: 0 0 20px rgba(255, 50, 50, 0.5); font-size: 26px;
  }
  .bottom-btn:active { transform: scale(0.92); }

  /* 虛擬搖桿 (支援手機與電腦走動測試) */
  .joystick-zone {
    position: absolute; bottom: 90px; right: 20px; z-index: 150;
    display: grid; grid-template-columns: repeat(3, 40px); gap: 4px;
  }
  .joy-btn {
    width: 40px; height: 40px; background: rgba(18, 22, 28, 0.85);
    border: 1px solid #444; border-radius: 6px; color: #fff; font-weight: bold;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
  }
  .joy-btn:active { background: #ff4444; border-color: #ff2222; }

  /* 靈異遭遇警報紅框 */
  #encounter-flash {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: 4px solid #ff0000; box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.8);
    pointer-events: none; z-index: 500; display: none;
    animation: flashAlert 0.4s infinite alternate;
  }
  @keyframes flashAlert { 0% { opacity: 0.3; } 100% { opacity: 1; } }

  /* 遭遇惡靈彈窗 */
  .encounter-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.88); z-index: 1000; display: none;
    flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  .ghost-portrait {
    width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, #ff2222 0%, #440000 70%, transparent 100%);
    display: flex; justify-content: center; align-items: center; font-size: 64px; margin-bottom: 16px;
    box-shadow: 0 0 35px #ff0000; animation: ghostFloat 1.2s infinite alternate;
  }
  @keyframes ghostFloat { 0% { transform: translateY(-8px); } 100% { transform: translateY(8px); } }
  .btn-exorcise {
    background: #b62324; border: 1px solid #ff4444; color: #fff; padding: 12px 32px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
  }

  /* 拾取回饋文字動畫 */
  .toast-popup {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    font-size: 24px; font-weight: bold; color: #00ff88; text-shadow: 0 0 12px #00ff88;
    pointer-events: none; z-index: 600; display: none; animation: toastUp 1s forwards;
  }
  @keyframes toastUp {
    0% { opacity: 0; transform: translate(-50%, 0); }
    30% { opacity: 1; transform: translate(-50%, -20px); }
    100% { opacity: 0; transform: translate(-50%, -50px); }
  }

  /* 開場視窗 */
  #start-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #080a0e; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #start-modal h1 { color: #ff4444; font-size: 24px; margin-bottom: 12px; letter-spacing: 2px; }
  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.7; margin-bottom: 24px; max-width: 360px; }
  .btn-start {
    background: #b62324; border: none; color: #fff; padding: 14px 36px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
  }
</style>
</head>
<body>

<div id="game-viewport">
  <div class="horror-vignette"></div>
  <div id="encounter-flash"></div>
  <div class="toast-popup" id="toast-text">+35 HP 急救包</div>

  <!-- 頂部 HUD -->
  <div class="poke-hud-top">
    <div class="player-card">
      <div class="player-avatar">🕯️</div>
      <div class="player-info">
        <span class="player-level" id="player-title">LV.1 除靈探員</span>
        <div class="hp-bar-outer">
          <div class="hp-bar-inner" id="hp-bar" style="width: 70%;"></div>
        </div>
      </div>
    </div>
    <div class="status-badges">
      <div class="badge steps" id="steps-badge">走動: 0m</div>
      <div class="badge" id="hp-badge">HP: 70/100</div>
    </div>
  </div>

  <!-- 滿版 3D 傾斜大地圖畫布 -->
  <div id="canvas-container" style="width: 100%; height: 100%;"></div>

  <!-- 虛擬走動十字搖桿 -->
  <div class="joystick-zone">
    <div></div>
    <button class="joy-btn" onclick="simMove(0, 8)">▲</button>
    <div></div>
    <button class="joy-btn" onclick="simMove(-8, 0)">◄</button>
    <button class="joy-btn" onclick="simMove(0, -8)">▼</button>
    <button class="joy-btn" onclick="simMove(8, 0)">►</button>
  </div>

  <!-- 底部經典控制面板 -->
  <div class="poke-bottom-bar">
    <button class="bottom-btn" onclick="alert('【背包】：目前持有 3 張驅邪符、1 罐聖水。')">🎒</button>
    <button class="bottom-btn main-compass" onclick="scanSurroundings()">👁️</button>
    <button class="bottom-btn" onclick="recenterPlayer()">🧭</button>
  </div>

  <!-- 惡靈正面遭遇彈窗 (Encounter Battle) -->
  <div class="encounter-modal" id="encounter-modal">
    <div class="ghost-portrait">👻</div>
    <h2 style="color:#ff4444; margin-bottom: 8px;">遭遇：地縛紅衣煞！</h2>
    <p style="font-size:13px; color:#aaa; margin-bottom: 22px; max-width: 280px;">
      祂踏入了你的 20 米除靈光圈！怨氣正在侵蝕周圍氣場！
    </p>
    <button class="btn-exorcise" onclick="resolveEncounter()">⚡ 祭出太上辟邪道符 ⚡</button>
  </div>

  <!-- 開場視窗 -->
  <div id="start-modal">
    <h1>靜安怪談：GO 實景除靈</h1>
    <p>
      <b>全螢幕 3D 恐怖大地圖：</b><br>
      化身調查員置身立體街道，周圍圍繞著 45 米雷達感應圈。<br>
      走動滿 <b>30 公尺</b> 路邊會掉落補給品；隨時提防在街角出沒的惡靈！
    </p>
    <button class="btn-start" onclick="initGame()">進入雷達世界</button>
  </div>
</div>

<script>
/* ==================== 音效引擎 ==================== */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.frequency.setValueAtTime(60, this.ctx.currentTime);
    g.gain.setValueAtTime(0.06, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.05);
  }
  ping() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(587, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
  }
  roar() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(320, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.4, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.4);
  }
}
const sfx = new SoundEngine();

/* ==================== 狀態與數值 ==================== */
let playerHP = 70;
const MAX_HP = 100;
let totalMeters = 0;
let lastSupplyMeters = 0; // 30 米物資累加器

// Three.js 核心場景
let scene, camera, renderer;
let playerGroup, radarPulseRing;
let spawnedObjects = []; // 存放地面上的急救包與惡靈

// 玩家在虛擬地圖中的位置 (X, Z 坐標)
let playerPos = { x: 0, z: 0 };
let activeEncounter = null;

function initGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThreePokeMap();

  // 若裝置有真實 GPS，同步累加走動
  if (navigator.geolocation) {
    let lastLat = null, lastLng = null;
    navigator.geolocation.watchPosition(pos => {
      if (lastLat !== null) {
        const d = getDist(lastLat, lastLng, pos.coords.latitude, pos.coords.longitude);
        if (d > 2) {
          movePlayerByMeters(d);
        }
      }
      lastLat = pos.coords.latitude;
      lastLng = pos.coords.longitude;
    }, null, { enableHighAccuracy: true });
  }
}

/* ==================== 建立 Pokémon GO 3D 立體暗黑地圖 ==================== */
function initThreePokeMap() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07090e);
  // 靈異深藍黑濃霧
  scene.fog = new THREE.FogExp2(0x07090e, 0.008);

  // 經典 Pokémon GO 45° 俯仰透視攝影機
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 1000);
  camera.position.set(0, 85, 95);
  camera.lookAt(0, 0, 0);

  // 建立陰暗立體城市地表
  buildDarkCityEnvironment();

  // 建立玩家化身與雷達圈
  buildPlayerAvatar();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // 點擊物資射線判定
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  container.addEventListener('pointerup', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const hitItems = [];
    spawnedObjects.forEach(obj => { if (obj.mesh) hitItems.push(obj.mesh); });
    const intersects = raycaster.intersectObjects(hitItems);

    if (intersects.length > 0) {
      const targetMesh = intersects[0].object;
      const data = targetMesh.userData;
      if (data && data.type === "supply") {
        collectSupply(data.objRef);
      }
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 生成開場第一隻在遠處徘徊的惡靈
  spawnRoamingGhost(30, -35);

  animateMap();
}

// 建立帶有恐怖發光網格的地表與半透明黑建築
function buildDarkCityEnvironment() {
  // 暗黑發光網格地面
  const gridHelper = new THREE.GridHelper(800, 80, 0x1f3045, 0x0f1822);
  gridHelper.position.y = -0.5;
  scene.add(gridHelper);

  // 街道血光標線 (模擬縱橫交叉道路)
  const roadMat = new THREE.MeshBasicMaterial({ color: 0x151c24 });
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x3d1214 });

  // 橫向十字主幹道
  const mainRoadX = new THREE.Mesh(new THREE.PlaneGeometry(800, 18), roadMat);
  mainRoadX.rotation.x = -Math.PI / 2;
  scene.add(mainRoadX);

  const mainRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(18, 800), roadMat);
  mainRoadZ.rotation.x = -Math.PI / 2;
  scene.add(mainRoadZ);

  // 隨機生成周圍半透明的黑色老舊建築剪影
  const buildingMat = new THREE.MeshBasicMaterial({
    color: 0x0c1017,
    wireframe: true,
    transparent: true,
    opacity: 0.35
  });

  for (let i = 0; i < 35; i++) {
    const w = 20 + Math.random() * 25;
    const h = 25 + Math.random() * 60;
    const d = 20 + Math.random() * 25;
    const bMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);

    let bx = (Math.random() - 0.5) * 450;
    let bz = (Math.random() - 0.5) * 450;
    // 避開中央十字路口
    if (Math.abs(bx) < 25) bx += 40;
    if (Math.abs(bz) < 25) bz += 40;

    bMesh.position.set(bx, h / 2, bz);
    scene.add(bMesh);
  }
}

// 建立玩家核心化身與 Pokémon GO 經典脈衝感應圈
function buildPlayerAvatar() {
  playerGroup = new THREE.Group();

  // 1. 玩家立體化身 (白光幽靈小人)
  const bodyMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
  const avatarMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.5, 6, 8), bodyMat);
  avatarMesh.position.y = 3;
  playerGroup.add(avatarMesh);

  // 頭部光球
  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(1.8, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  headMesh.position.y = 7;
  playerGroup.add(headMesh);

  // 2. 經典 45 米雷達感應圈 (圈隨時間向外擴散)
  const ringGeom = new THREE.RingGeometry(42, 43, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.4
  });
  radarPulseRing = new THREE.Mesh(ringGeom, ringMat);
  radarPulseRing.rotation.x = -Math.PI / 2;
  radarPulseRing.position.y = 0.2;
  playerGroup.add(radarPulseRing);

  scene.add(playerGroup);
}

/* ==================== 走動與 30 米物資掉落機制 ==================== */
function simMove(dx, dz) {
  sfx.step();
  playerPos.x += dx;
  playerPos.z += dz;

  const moveDist = Math.hypot(dx, dz);
  movePlayerByMeters(moveDist);
}

function movePlayerByMeters(dist) {
  totalMeters += Math.round(dist);
  lastSupplyMeters += dist;

  document.getElementById('steps-badge').innerText = `走動: ${totalMeters}m`;

  // 平滑移動玩家化身與攝影機
  playerGroup.position.set(playerPos.x, 0, playerPos.z);
  camera.position.set(playerPos.x, 85, playerPos.z + 95);
  camera.lookAt(playerPos.x, 0, playerPos.z);

  // ⭐ 每累積滿 30 公尺，在周圍馬路上動態生成急救包
  if (lastSupplyMeters >= 30) {
    lastSupplyMeters = 0;
    spawnSupplyBoxNearby();
  }

  // 檢查是否踏入惡靈感應半徑 (20 米內遭遇戰)
  checkGhostEncounters();
}

// 隨機在玩家周遭 25 米處掉落急救包
function spawnSupplyBoxNearby() {
  const angle = Math.random() * Math.PI * 2;
  const radius = 22 + Math.random() * 15;
  const sx = playerPos.x + Math.cos(angle) * radius;
  const sz = playerPos.z + Math.sin(angle) * radius;

  // 建立立體綠色醫療箱
  const boxGeom = new THREE.BoxGeometry(4, 4, 4);
  const boxMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: false });
  const mesh = new THREE.Mesh(boxGeom, boxMat);
  mesh.position.set(sx, 2.5, sz);

  const supplyData = {
    id: Date.now(),
    type: "supply",
    heal: 35,
    mesh: mesh
  };
  mesh.userData = { type: "supply", objRef: supplyData };

  scene.add(mesh);
  spawnedObjects.push(supplyData);

  sfx.ping();
  alert("【地脈共鳴！】雷達感應圈內探測到被遺棄的【急救包】！點擊地圖上的綠色方塊拾取！");
}

function collectSupply(objRef) {
  sfx.ping();
  playerHP = Math.min(MAX_HP, playerHP + objRef.heal);
  updateHPBar();

  // 彈出綠字
  const toast = document.getElementById('toast-text');
  toast.innerText = `+${objRef.heal} HP 急救包`;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 1000);

  scene.remove(objRef.mesh);
  spawnedObjects = spawnedObjects.filter(item => item !== objRef);
}

// 生成遊蕩惡靈 (血紅發光實體)
function spawnRoamingGhost(gx, gz) {
  const ghostGeom = new THREE.SphereGeometry(3.5, 12, 12);
  const ghostMat = new THREE.MeshBasicMaterial({ color: 0xff1111 });
  const ghostMesh = new THREE.Mesh(ghostGeom, ghostMat);
  ghostMesh.position.set(gx, 4, gz);

  const ghostData = {
    type: "ghost",
    mesh: ghostMesh,
    x: gx, z: gz
  };
  scene.add(ghostMesh);
  spawnedObjects.push(ghostData);
}

// 檢查是否觸發惡靈遭遇戰
function checkGhostEncounters() {
  spawnedObjects.forEach(obj => {
    if (obj.type === "ghost") {
      const dist = Math.hypot(obj.mesh.position.x - playerPos.x, obj.mesh.position.z - playerPos.z);
      if (dist < 20 && !activeEncounter) {
        triggerEncounter(obj);
      }
    }
  });
}

// 觸發 Pokémon GO 式遭遇彈窗
function triggerEncounter(ghostObj) {
  activeEncounter = ghostObj;
  sfx.roar();
  document.getElementById('encounter-flash').style.display = 'block';
  document.getElementById('encounter-modal').style.display = 'flex';
}

function resolveEncounter() {
  sfx.ping();
  document.getElementById('encounter-flash').style.display = 'none';
  document.getElementById('encounter-modal').style.display = 'none';

  if (activeEncounter) {
    scene.remove(activeEncounter.mesh);
    spawnedObjects = spawnedObjects.filter(item => item !== activeEncounter);
    activeEncounter = null;
  }

  alert("【除靈大成功！】紅衣煞已被符咒淨化驅散！獲得 100 點靈力經驗值！");

  // 在更遠處再生成下一隻惡靈
  const angle = Math.random() * Math.PI * 2;
  spawnRoamingGhost(playerPos.x + Math.cos(angle) * 60, playerPos.z + Math.sin(angle) * 60);
}

function updateHPBar() {
  document.getElementById('hp-bar').style.width = `${(playerHP / MAX_HP) * 100}%`;
  document.getElementById('hp-badge').innerText = `HP: ${playerHP}/${MAX_HP}`;
}

function scanSurroundings() {
  sfx.ping();
  // 放大雷達圈一瞬間
  radarPulseRing.scale.set(1.4, 1.4, 1);
  setTimeout(() => { radarPulseRing.scale.set(1, 1, 1); }, 400);
}

function recenterPlayer() {
  camera.position.set(playerPos.x, 85, playerPos.z + 95);
  camera.lookAt(playerPos.x, 0, playerPos.z);
}

function getDist(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2) * Math.sin(dl/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// 主渲染動畫循環
function animateMap() {
  requestAnimationFrame(animateMap);

  // 雷達感應圈脈衝呼吸動畫
  if (radarPulseRing) {
    const pulse = 1.0 + Math.sin(Date.now() * 0.004) * 0.06;
    radarPulseRing.scale.set(pulse, pulse, 1);
  }

  // 地面急救包與惡靈浮動旋轉
  spawnedObjects.forEach(obj => {
    if (obj.mesh) {
      obj.mesh.rotation.y += 0.03;
      obj.mesh.position.y = (obj.type === "ghost" ? 5 : 2.5) + Math.sin(Date.now() * 0.005) * 0.8;
    }
  });

  renderer.render(scene, camera);
}
</script>
