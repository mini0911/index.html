<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
<title>星穹遺落 - 橫向動作手遊 (Starfall Mobile ARPG)</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06090d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hud-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* 左上角角色與切換職業按鈕 */
  .player-status-badge {
    position: absolute;
    top: 10px;
    left: 14px;
    background: rgba(15, 22, 30, 0.88);
    border: 2px solid #3c4f64;
    border-radius: 28px;
    padding: 6px 12px 6px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.7);
    pointer-events: auto;
    cursor: pointer;
  }
  .avatar-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #253342;
    border: 2px solid #f6ad55;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.6rem;
  }
  .bars-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 130px;
  }
  .status-name-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    font-weight: bold;
    color: #edf2f7;
  }
  .hud-bar {
    height: 6px;
    background: #0c1218;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    border: 1px solid #233140;
  }
  .fill-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #e53e3e, #fc8181); transition: width 0.1s; }
  .fill-mp { width: 100%; height: 100%; background: linear-gradient(90deg, #3182ce, #63b3ed); transition: width 0.1s; }
  .fill-exp { width: 0%; height: 100%; background: linear-gradient(90deg, #38a169, #68d391); transition: width 0.1s; }

  /* 右上角地圖名與 MiniMap */
  .minimap-panel {
    position: absolute;
    top: 10px;
    right: 14px;
    background: rgba(15, 22, 30, 0.88);
    border: 2px solid #3c4f64;
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: auto;
  }
  .map-title {
    font-size: 0.75rem;
    font-weight: bold;
    color: #f6ad55;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #minimap-canvas {
    width: 90px;
    height: 60px;
    background: #0b1015;
    border-radius: 4px;
    border: 1px solid #2b3a4a;
  }

  /* 左下角虛擬搖桿 */
  .joystick-zone {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 140px;
    height: 140px;
    pointer-events: auto;
    touch-action: none;
  }
  .joystick-base {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 2px dashed rgba(255, 255, 255, 0.25);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .joystick-stick {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, #4299e1 0%, #2b6cb0 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 2px solid #bee3f8;
    position: absolute;
    top: 35px;
    left: 35px;
    pointer-events: none;
    transition: transform 0.04s ease-out;
  }

  /* 右下角技能按鍵 */
  .actions-cluster {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 190px;
    height: 190px;
    pointer-events: auto;
  }
  .btn-attack {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: radial-gradient(circle, #dd6b20 0%, #9c4221 100%);
    border: 3px solid #fbd38d;
    box-shadow: 0 6px 14px rgba(221, 107, 32, 0.45);
    color: #fff;
    font-size: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .btn-attack:active { transform: scale(0.92); }

  .skill-btn {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, #2b3948 0%, #17212b 100%);
    border: 2px solid #63b3ed;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 1.15rem;
    cursor: pointer;
  }
  .skill-btn:active { transform: scale(0.92); }
  .skill-btn span:last-child {
    font-size: 0.55rem;
    color: #90cdf4;
    font-weight: bold;
    margin-top: -2px;
  }

  .btn-skill-1 { top: 10px; right: 25px; border-color: #f6ad55; }
  .btn-skill-2 { top: 45px; left: 35px; border-color: #fc8181; }
  .btn-skill-3 { bottom: 20px; left: 10px; border-color: #68d391; }
  .btn-potion  { top: 0px; left: 100px; border-color: #e53e3e; width: 40px; height: 40px; font-size: 1rem; }

  /* 換職彈窗 */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    pointer-events: auto;
  }
  .modal-overlay.active { display: flex; }
  .class-box {
    background: #17212b;
    border: 2px solid #4a5d6e;
    border-radius: 12px;
    width: 90%;
    max-width: 580px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .class-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .class-card {
    background: #10171e;
    border: 1px solid #2d3b4a;
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: 0.15s;
  }
  .class-card.selected {
    border-color: #f6ad55;
    background: #1e2d3b;
  }
  .class-card h4 { font-size: 0.75rem; color: #fff; }
  .class-card p { font-size: 0.6rem; color: #a0aec0; }

  /* 地圖切換通知橫幅 */
  #map-alert-banner {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid #f6ad55;
    color: #f6ad55;
    font-size: 1rem;
    font-weight: bold;
    padding: 8px 24px;
    border-radius: 20px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  /* 橫向提示 */
  #rotate-hint {
    display: none;
    position: absolute;
    inset: 0;
    background: #0d131a;
    z-index: 9999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f6ad55;
    font-size: 1.2rem;
    text-align: center;
    padding: 20px;
  }
  @media screen and (orientation: portrait) {
    #rotate-hint { display: flex; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="canvas"></canvas>

  <div class="hud-layer">
    <div class="player-status-badge" onclick="openClassModal()">
      <div class="avatar-circle" id="hud-avatar">⚔️</div>
      <div class="bars-col">
        <div class="status-name-row">
          <span id="hud-job">破滅狂戰士 Lv.<span id="hud-lv">1</span></span>
          <span style="color:#68d391;" id="hud-hp-txt">100%</span>
        </div>
        <div class="hud-bar"><div class="fill-hp" id="hud-hp-bar"></div></div>
        <div class="hud-bar"><div class="fill-mp" id="hud-mp-bar"></div></div>
        <div class="hud-bar"><div class="fill-exp" id="hud-exp-bar"></div></div>
      </div>
    </div>

    <div class="minimap-panel">
      <div class="map-title" id="hud-map-title">📍 晨曦平原</div>
      <canvas id="minimap-canvas" width="90" height="60"></canvas>
    </div>

    <div id="map-alert-banner">已進入全新區域！</div>

    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-base">
        <div class="joystick-stick" id="joystick-stick"></div>
      </div>
    </div>

    <div class="actions-cluster">
      <div class="skill-btn btn-potion" onclick="castPotion()">
        <span>🧪</span><span id="hud-potions">x15</span>
      </div>
      <div class="skill-btn btn-skill-1" id="slot-skill-1" onclick="castSkill(1)">
        <span id="skill-1-icon">🌀</span><span id="skill-1-name">旋風</span>
      </div>
      <div class="skill-btn btn-skill-2" id="slot-skill-2" onclick="castSkill(2)">
        <span id="skill-2-icon">💥</span><span id="skill-2-name">裂地</span>
      </div>
      <div class="skill-btn btn-skill-3" id="slot-skill-3" onclick="castSkill(3)">
        <span id="skill-3-icon">🩸</span><span id="skill-3-name">飲血</span>
      </div>
      <div class="btn-attack" onclick="triggerNormalAttack()">
        <span>⚔️</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="class-modal">
    <div class="class-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:#f6ad55; font-size:1.1rem;">🏛️ 英雄神殿 - 自由切換職業專精</h3>
        <button style="background:none; border:none; color:#a0aec0; font-size:1.2rem; cursor:pointer;" onclick="closeClassModal()">✕</button>
      </div>
      <p style="font-size:0.75rem; color:#a0aec0;">切換職業將即時替換專屬技能樹、普攻型態與屬性偏向：</p>
      <div class="class-grid" id="class-grid"></div>
    </div>
  </div>

  <div id="rotate-hint">
    <div style="font-size:3rem; margin-bottom:12px;">📱 ➔ 🔄</div>
    <div>請將手機翻轉至<b>橫向模式 (Landscape)</b><br>解鎖開闊冒險視野！</div>
  </div>
</div>

let currentMapIndex = 0;
let currentMap = MAP_DATABASE[0];

let sceneDecorations = [];
let sceneLakes = [];
function generateMapObjects() {
  sceneDecorations = [];
  for (let i = 0; i < 40; i++) {
    sceneDecorations.push({
      x: Math.random() * (WORLD_WIDTH - 200) + 100,
      y: Math.random() * (WORLD_HEIGHT - 200) + 100,
      r: 28 + Math.random() * 16,
      type: currentMap.decorType
    });
  }
  sceneLakes = [
    { x: 600, y: 550, rx: 150, ry: 100 },
    { x: 1750, y: 1100, rx: 170, ry: 110 }
  ];
}
generateMapObjects();

const player = {
  x: 1000,
  y: 800,
  radius: 20,
  speed: 4.8,
  facing: 1,
  isMoving: false,
  vx: 0,
  vy: 0,
  lv: 1,
  hp: 240,
  maxHp: 240,
  mp: 100,
  maxMp: 100,
  exp: 0,
  maxExp: 100,
  zeny: 200,
  potions: 15,
  attackAnimTimer: 0
};

function getAtk() { return Math.round(currentClass.baseAtk + player.lv * 4); }
function getMatk() { return Math.round(currentClass.baseMatk + player.lv * 5); }

const monsters = [];
function populateMonsters(count = 15) {
  monsters.length = 0;
  for (let i = 0; i < count; i++) {
    let t = currentMap.mobPool[Math.floor(Math.random() * currentMap.mobPool.length)];
    monsters.push({
      x: Math.random() * (WORLD_WIDTH - 240) + 120,
      y: Math.random() * (WORLD_HEIGHT - 240) + 120,
      type: t,
      hp: t.hp,
      maxHp: t.hp,
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5,
      changeDirTimer: Math.random() * 60,
      hitFlash: 0
    });
  }
}
populateMonsters(16);

const projectiles = [];
const floatingTexts = [];

function addFloatingText(x, y, text, color = "#fff", fontSize = 18) {
  floatingTexts.push({ x, y, text, color, fontSize, alpha: 1.0, life: 36 });
}

const joystickZone = document.getElementById("joystick-zone");
const joystickStick = document.getElementById("joystick-stick");
let isDraggingJoy = false;
let joyCenter = { x: 0, y: 0 };
let joyVector = { x: 0, y: 0 };

joystickZone.addEventListener("pointerdown", (e) => {
  isDraggingJoy = true;
  const rect = joystickZone.getBoundingClientRect();
  joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  handleJoystickMove(e.clientX, e.clientY);
});
window.addEventListener("pointermove", (e) => {
  if (isDraggingJoy) handleJoystickMove(e.clientX, e.clientY);
});
window.addEventListener("pointerup", () => {
  if (isDraggingJoy) {
    isDraggingJoy = false;
    joyVector = { x: 0, y: 0 };
    joystickStick.style.transform = `translate(0px, 0px)`;
  }
});

function handleJoystickMove(clientX, clientY) {
  const dx = clientX - joyCenter.x;
  const dy = clientY - joyCenter.y;
  const dist = Math.hypot(dx, dy);
  const maxR = 45;
  if (dist === 0) {
    joyVector = { x: 0, y: 0 };
    return;
  }
  const clampedDist = Math.min(dist, maxR);
  const angle = Math.atan2(dy, dx);
  const stickX = Math.cos(angle) * clampedDist;
  const stickY = Math.sin(angle) * clampedDist;
  joystickStick.style.transform = `translate(${stickX}px, ${stickY}px)`;
  joyVector = { x: stickX / maxR, y: stickY / maxR };
}

const keys = {};
window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

function findNearestMonster(range = 380) {
  let nearest = null;
  let minDist = range;
  for (let m of monsters) {
    let d = Math.hypot(m.x - player.x, m.y - player.y);
    if (d < minDist) {
      minDist = d;
      nearest = m;
    }
  }
  return nearest;
}

function damageMonster(m, dmg, color, prefix = "") {
  m.hp -= dmg;
  m.hitFlash = 6;
  addFloatingText(m.x, m.y - 25, `${prefix ? prefix + ' ' : ''}-${dmg}`, color, 18);

  if (m.hp <= 0) {
    player.exp += m.type.exp;
    player.zeny += m.type.zeny;
    addFloatingText(m.x, m.y - 45, `+${m.type.exp} EXP`, "#68d391", 15);

    if (player.exp >= player.maxExp) {
      player.exp -= player.maxExp;
      player.lv += 1;
      player.maxExp = Math.round(player.maxExp * 1.45);
      player.maxHp = Math.round(player.maxHp * 1.15);
      player.maxMp = Math.round(player.maxMp * 1.12);
      player.hp = player.maxHp;
      player.mp = player.maxMp;
      addFloatingText(player.x, player.y - 65, "🌟 LEVEL UP! 🌟", "#f6e05e", 24);
    }

    const idx = monsters.indexOf(m);
    if (idx !== -1) monsters.splice(idx, 1);
    setTimeout(() => {
      let t = currentMap.mobPool[Math.floor(Math.random() * currentMap.mobPool.length)];
      monsters.push({
        x: Math.random() * (WORLD_WIDTH - 240) + 120,
        y: Math.random() * (WORLD_HEIGHT - 240) + 120,
        type: t,
        hp: t.hp,
        maxHp: t.hp,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        changeDirTimer: 60,
        hitFlash: 0
      });
    }, 2000);
  }
  updateHUD();
}

function triggerNormalAttack() {
  player.attackAnimTimer = 10;
  let hit = false;
  let range = currentClass.id === "ranger" || currentClass.id === "mage" ? 280 : 90;

  if (range > 100) {
    let target = findNearestMonster(range);
    if (target) {
      projectiles.push({
        x: player.x,
        y: player.y,
        tx: target.x,
        ty: target.y,
        speed: 14,
        damage: getAtk(),
        color: currentClass.id === "mage" ? "#805ad5" : "#ecc94b",
        target: target
      });
      hit = true;
    }
  } else {
    for (let m of monsters) {
      let d = Math.hypot(m.x - player.x, m.y - player.y);
      if (d < 95) {
        let isCrit = Math.random() < 0.28;
        let dmg = isCrit ? Math.round(getAtk() * 1.6) : getAtk();
        damageMonster(m, dmg, isCrit ? "#f8e71c" : "#fff", isCrit ? "CRIT!" : "");
        hit = true;
      }
    }
  }
  if (!hit) addFloatingText(player.x + player.facing * 30, player.y - 20, "唰！", "#cbd5e0", 14);
}

function castSkill(slotIdx) {
  let skill = currentClass.skills[slotIdx - 1];
  if (!skill) return;

  if (player.mp < skill.mp) {
    addFloatingText(player.x, player.y - 40, "MP不足!", "#63b3ed", 14);
    return;
  }
  player.mp -= skill.mp;
  addFloatingText(player.x, player.y - 50, `${skill.icon} ${skill.name}!!`, "#f6ad55", 18);

  if (skill.id === "whirlwind") {
    player.attackAnimTimer = 16;
    monsters.forEach(m => {
      if (Math.hypot(m.x - player.x, m.y - player.y) < 160) {
        damageMonster(m, Math.round(getAtk() * 1.8), "#f6ad55", "旋風🌪️");
      }
    });
  } else if (skill.id === "slam") {
    let t = findNearestMonster(150);
    if (t) {
      damageMonster(t, Math.round(getAtk() * 2.8), "#fc8181", "裂地💥");
      let angle = Math.atan2(t.y - player.y, t.x - player.x);
      t.x += Math.cos(angle) * 70;
      t.y += Math.sin(angle) * 70;
    }
  } else if (skill.id === "rage") {
    let heal = Math.round(player.maxHp * 0.35);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addFloatingText(player.x, player.y - 30, `+${heal} 狂暴吸血!`, "#fc8181", 18);
  } else if (skill.id === "missiles") {
    let t = findNearestMonster(400);
    if (t) {
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          if (t && t.hp > 0) {
            projectiles.push({
              x: player.x, y: player.y - 20,
              tx: t.x, ty: t.y,
              speed: 12, damage: Math.round(getMatk() * 0.8),
              color: "#9f7aea", target: t
            });
          }
        }, i * 90);
      }
    }
  } else if (skill.id === "vortex") {
    let t = findNearestMonster(350);
    if (t) {
      monsters.forEach(m => {
        if (Math.hypot(m.x - t.x, m.y - t.y) < 200) {
          m.x = t.x + (Math.random() - 0.5) * 30;
          m.y = t.y + (Math.random() - 0.5) * 30;
          damageMonster(m, Math.round(getMatk() * 1.5), "#b794f4", "重力坍縮🌀");
        }
      });
    }
  } else if (skill.id === "blink") {
    player.x += player.facing * 180;
    addFloatingText(player.x, player.y - 20, "折躍衝刺⚡", "#63b3ed", 16);
  } else if (skill.id === "rain") {
    monsters.forEach(m => {
      if (Math.hypot(m.x - (player.x + player.facing * 140), m.y - player.y) < 180) {
        damageMonster(m, Math.round(getAtk() * 2.2), "#f6e05e", "箭雨🌧️");
      }
    });
  } else if (skill.id === "snipe") {
    let t = findNearestMonster(420);
    if (t) {
      damageMonster(t, Math.round(getAtk() * 3.2), "#f6e05e", "穿刺狙擊🎯");
    }
  } else if (skill.id === "tumble") {
    player.x -= player.facing * 150;
  } else if (skill.id === "shield") {
    player.x += player.facing * 120;
    monsters.forEach(m => {
      if (Math.hypot(m.x - player.x, m.y - player.y) < 110) {
        damageMonster(m, Math.round(getAtk() * 1.8), "#63b3ed", "盾擊💥");
      }
    });
  } else if (skill.id === "hammer") {
    let t = findNearestMonster(250);
    if (t) damageMonster(t, Math.round((getAtk() + getMatk()) * 1.6), "#f6ad55", "神聖審判🔨");
  } else if (skill.id === "grace") {
    let heal = Math.round(getMatk() * 1.8 + 60);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addFloatingText(player.x, player.y - 30, `+${heal} 恩典治癒💚`, "#68d391", 20);
  } else if (skill.id === "shadowstep") {
    let t = findNearestMonster(350);
    if (t) {
      player.x = t.x - player.facing * 35;
      player.y = t.y;
      damageMonster(t, Math.round(getAtk() * 3.5), "#f8e71c", "背刺致命💥");
    }
  } else if (skill.id === "poison") {
    for (let m of monsters) {
      if (Math.hypot(m.x - player.x, m.y - player.y) < 160) {
        damageMonster(m, Math.round(getAtk() * 1.4), "#48bb78", "毒刃☠️");
      }
    }
  } else if (skill.id === "smoke") {
    addFloatingText(player.x, player.y - 30, "煙霧遁形🌫️", "#a0aec0", 16);
  }

  updateHUD();
}

function castPotion() {
  if (player.potions > 0) {
    player.potions--;
    player.hp = Math.min(player.maxHp, player.hp + 90);
    player.mp = Math.min(player.maxMp, player.mp + 40);
    addFloatingText(player.x, player.y - 40, "+90 HP / +40 MP 🧪", "#fc8181", 16);
    updateHUD();
  }
}

function checkPortals() {
  for (let p of currentMap.portals) {
    let dist = Math.hypot(p.x - player.x, p.y - player.y);
    if (dist < 50) {
      currentMapIndex = p.toMap;
      currentMap = MAP_DATABASE[currentMapIndex];
      player.x = p.toX;
      player.y = p.toY;

      generateMapObjects();
      populateMonsters(16);

      let banner = document.getElementById("map-alert-banner");
      banner.innerText = `🌌 抵達【${currentMap.name}】！`;
      banner.style.opacity = 1;
      setTimeout(() => banner.style.opacity = 0, 2200);

      document.getElementById("hud-map-title").innerText = `📍 ${currentMap.name}`;
      break;
    }
  }
}

function update() {
  let mx = joyVector.x;
  let my = joyVector.y;

  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;

  let len = Math.hypot(mx, my);
  if (len > 0) {
    player.vx = (mx / len) * player.speed;
    player.vy = (my / len) * player.speed;
    player.x += player.vx;
    player.y += player.vy;
    player.facing = player.vx > 0 ? 1 : -1;
    player.isMoving = true;
  } else {
    player.isMoving = false;
  }

  player.x = Math.max(player.radius, Math.min(WORLD_WIDTH - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(WORLD_HEIGHT - player.radius, player.y));

  checkPortals();

  camera.x = player.x - canvas.width / 2;
  camera.y = player.y - canvas.height / 2;
  camera.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, camera.y));

  for (let m of monsters) {
    if (m.hitFlash > 0) m.hitFlash--;
    m.changeDirTimer--;
    if (m.changeDirTimer <= 0) {
      m.changeDirTimer = 60 + Math.random() * 80;
      let angle = Math.random() * Math.PI * 2;
      m.vx = Math.cos(angle) * 1.4;
      m.vy = Math.sin(angle) * 1.4;
    }
    m.x += m.vx;
    m.y += m.vy;
    if (m.x < 50 || m.x > WORLD_WIDTH - 50) m.vx *= -1;
    if (m.y < 50 || m.y > WORLD_HEIGHT - 50) m.vy *= -1;
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    let dx = p.target.x - p.x;
    let dy = p.target.y - p.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 18 || p.target.hp <= 0) {
      damageMonster(p.target, p.damage, p.color);
      projectiles.splice(i, 1);
    } else {
      p.x += (dx / dist) * p.speed;
      p.y += (dy / dist) * p.speed;
    }
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y -= 1.0;
    ft.life--;
    ft.alpha = ft.life / 36;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  if (player.attackAnimTimer > 0) player.attackAnimTimer--;
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  ctx.fillStyle = currentMap.bgFloor;
  ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

  ctx.strokeStyle = currentMap.tileGrid;
  ctx.lineWidth = 1;
  const TILE = 80;
  for (let x = 0; x < WORLD_WIDTH; x += TILE) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
  }
  for (let y = 0; y < WORLD_HEIGHT; y += TILE) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
  }

  for (let l of sceneLakes) {
    ctx.fillStyle = currentMap.lakeColor;
    ctx.beginPath();
    ctx.ellipse(l.x, l.y, l.rx, l.ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  for (let p of currentMap.portals) {
    let pulse = 28 + Math.sin(Date.now() * 0.005) * 5;
    ctx.fillStyle = "rgba(159, 122, 234, 0.35)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, pulse + 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(183, 148, 244, 0.7)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#e9d8fd";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.font = "bold 13px system-ui";
    ctx.fillStyle = "#f6ad55";
    ctx.textAlign = "center";
    ctx.fillText("🌀 傳送陣", p.x, p.y - 42);
    ctx.font = "11px system-ui";
    ctx.fillStyle = "#e2e8f0";
    ctx.fillText(p.name, p.x, p.y - 26);
  }

  for (let m of monsters) {
    ctx.fillStyle = m.hitFlash > 0 ? "#ffffff" : m.type.color;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.type.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#1a202c";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.font = `${m.type.size * 1.1}px system-ui`;
    ctx.textAlign = "center";
    ctx.fillText(m.type.sprite, m.x, m.y + (m.type.size * 0.35));

    let hpW = 42;
    let r = Math.max(0, m.hp / m.maxHp);
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(m.x - hpW / 2, m.y - m.type.size - 13, hpW, 5);
    ctx.fillStyle = "#e53e3e";
    ctx.fillRect(m.x - hpW / 2, m.y - m.type.size - 13, hpW * r, 5);

    ctx.font = "11px system-ui";
    ctx.fillStyle = "#fff";
    ctx.fillText(m.type.name, m.x, m.y - m.type.size - 16);
  }

  if (player.attackAnimTimer > 0) {
    ctx.strokeStyle = "#f6e05e";
    ctx.lineWidth = 4;
    ctx.beginPath();
    let startA = player.facing > 0 ? -Math.PI / 3 : (2 * Math.PI) / 3;
    let endA = player.facing > 0 ? Math.PI / 3 : (4 * Math.PI) / 3;
    ctx.arc(player.x, player.y, 60, startA, endA);
    ctx.stroke();
  }

  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(player.x, player.y + 16, 18, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#3182ce";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#bee3f8";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = "26px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(currentClass.avatar, player.x, player.y + 8);

  ctx.font = "bold 12px system-ui";
  ctx.fillStyle = "#f6ad55";
  ctx.fillText(`${currentClass.name} (Lv.${player.lv})`, player.x, player.y - 28);

  for (let d of sceneDecorations) {
    ctx.fillStyle = currentMap.decorColor;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let p of projectiles) {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.font = `bold ${ft.fontSize}px 'Arial Black', Impact, sans-serif`;
    ctx.fillStyle = ft.color;
    ctx.textAlign = "center";
    ctx.shadowColor = "#000";
    ctx.shadowBlur = 4;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  ctx.restore();

  renderMiniMap();
}

function renderMiniMap() {
  miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
  miniCtx.fillStyle = currentMap.bgFloor;
  miniCtx.fillRect(0, 0, miniCanvas.width, miniCanvas.height);

  let scaleX = miniCanvas.width / WORLD_WIDTH;
  let scaleY = miniCanvas.height / WORLD_HEIGHT;

  for (let p of currentMap.portals) {
    miniCtx.fillStyle = "#b794f4";
    miniCtx.fillRect(p.x * scaleX - 2, p.y * scaleY - 2, 4, 4);
  }

  for (let m of monsters) {
    miniCtx.fillStyle = "#e53e3e";
    miniCtx.fillRect(m.x * scaleX - 1, m.y * scaleY - 1, 3, 3);
  }

  miniCtx.fillStyle = "#48bb78";
  miniCtx.beginPath();
  miniCtx.arc(player.x * scaleX, player.y * scaleY, 3, 0, Math.PI * 2);
  miniCtx.fill();
}

function updateHUD() {
  document.getElementById("hud-avatar").innerText = currentClass.avatar;
  document.getElementById("hud-job").innerText = `${currentClass.name} Lv.${player.lv}`;
  document.getElementById("hud-lv").innerText = player.lv;
  document.getElementById("hud-potions").innerText = `x${player.potions}`;

  let hpPct = (player.hp / player.maxHp) * 100;
  document.getElementById("hud-hp-bar").style.width = `${hpPct}%`;
  document.getElementById("hud-hp-txt").innerText = `${Math.round(hpPct)}%`;

  let mpPct = (player.mp / player.maxMp) * 100;
  document.getElementById("hud-mp-bar").style.width = `${mpPct}%`;

  let expPct = (player.exp / player.maxExp) * 100;
  document.getElementById("hud-exp-bar").style.width = `${expPct}%`;

  for (let i = 0; i < 3; i++) {
    let sk = currentClass.skills[i];
    document.getElementById(`skill-${i+1}-icon`).innerText = sk.icon;
    document.getElementById(`skill-${i+1}-name`).innerText = sk.name;
  }
}

function openClassModal() {
  const grid = document.getElementById("class-grid");
  grid.innerHTML = "";
  CLASSES.forEach(c => {
    let card = document.createElement("div");
    card.className = `class-card ${c.id === currentClass.id ? 'selected' : ''}`;
    card.onclick = () => selectClass(c.id);
    card.innerHTML = `
      <div style="font-size:1.8rem;">${c.avatar}</div>
      <h4>${c.name}</h4>
      <p>${c.desc}</p>
    `;
    grid.appendChild(card);
  });
  document.getElementById("class-modal").classList.add("active");
}

function closeClassModal() {
  document.getElementById("class-modal").classList.remove("active");
}

function selectClass(classId) {
  let target = CLASSES.find(c => c.id === classId);
  if (target) {
    currentClass = target;
    player.maxHp = Math.round(240 * target.hpMod);
    player.maxMp = Math.round(100 * target.mpMod);
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    addFloatingText(player.x, player.y - 60, `轉職為【${target.name}】！`, "#f6ad55", 22);
    updateHUD();
    closeClassModal();
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

updateHUD();
requestAnimationFrame(gameLoop);
</script>
