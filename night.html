/* ==================== 音效引擎 ==================== */
class HospitalAudioEngine {
  constructor() {
    this.ctx = null;
    this.noiseNode = null;
    this.noiseGain = null;
    this.isRadioPlaying = false;
  }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }

  step() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(45, this.ctx.currentTime);
    g.gain.setValueAtTime(0.06, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  drip() { // 空靈水滴聲
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(950, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.12, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.25);
  }
  buzz() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(120, this.ctx.currentTime);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.12);
  }
  bang() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(140, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.6, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.4);
  }
  wheelSqueak() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(750, this.ctx.currentTime);
    o.frequency.linearRampToValueAtTime(1300, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.5);
  }
  doorOpen() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(90, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.7);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.7);
  }

  startRadioStatic() {
    if (this.isRadioPlaying || !this.ctx) return;
    this.isRadioPlaying = true;
    const bufferSize = this.ctx.sampleRate * 2;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    this.noiseNode = this.ctx.createBufferSource();
    this.noiseNode.buffer = buffer;
    this.noiseNode.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1200;
    filter.Q.value = 3.0;

    this.noiseGain = this.ctx.createGain();
    this.noiseGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
    this.noiseGain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.5);

    this.noiseNode.connect(filter);
    filter.connect(this.noiseGain);
    this.noiseGain.connect(this.ctx.destination);
    this.noiseNode.start();
  }

  stopRadioStatic() {
    if (!this.isRadioPlaying) return;
    if (this.noiseGain) {
      this.noiseGain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
      setTimeout(() => {
        if (this.noiseNode) { this.noiseNode.stop(); this.noiseNode.disconnect(); }
        this.isRadioPlaying = false;
      }, 400);
    }
  }
}

function speakDirectorVoice(code) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const digits = code.split("").join("……");
  const text = `這裡是院長室……有人聽得見嗎？他們在門外……聽著……緊急逃生代碼是……${digits}……重複一次……代碼是……${digits}……快逃……`;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-TW";
  utter.pitch = 0.5;
  utter.rate = 0.75;
  utter.volume = 1.0;
  window.speechSynthesis.speak(utter);
}

/* ==================== ⭐ 核心：程序化高解析老舊 PBR 貼圖生成器 ==================== */
function createHospitalWallTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // 上半部泛黃老舊白牆
  ctx.fillStyle = "#b4bfb6";
  ctx.fillRect(0, 0, 512, 340);

  // 下半部深綠色防污踢腳帶 (台灣老醫院經典特色)
  ctx.fillStyle = "#1d3324";
  ctx.fillRect(0, 340, 512, 172);

  // 分界黑色裝飾線
  ctx.fillStyle = "#0a140d";
  ctx.fillRect(0, 335, 512, 6);

  // 霉斑與水痕噪點
  for (let i = 0; i < 4500; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const r = Math.random() * 2.5;
    ctx.fillStyle = Math.random() > 0.5 ? "rgba(20, 35, 25, 0.15)" : "rgba(80, 70, 50, 0.12)";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 1);
  return tex;
}

function createHospitalTileTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // 老舊綠白磨石子棋盤磚
  const tileSize = 64;
  for (let y = 0; y < 512; y += tileSize) {
    for (let x = 0; x < 512; x += tileSize) {
      ctx.fillStyle = ((x + y) / tileSize) % 2 === 0 ? "#1e2e24" : "#14211a";
      ctx.fillRect(x, y, tileSize, tileSize);
      // 磚縫黑邊
      ctx.strokeStyle = "rgba(5, 10, 7, 0.8)";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, tileSize, tileSize);
    }
  }

  // 隨機反光水漬污斑
  for (let i = 0; i < 15; i++) {
    const rx = Math.random() * 512, ry = Math.random() * 512;
    const rad = 25 + Math.random() * 45;
    const grad = ctx.createRadialGradient(rx, ry, 5, rx, ry, rad);
    grad.addColorStop(0, "rgba(8, 14, 10, 0.7)");
    grad.addColorStop(1, "transparent");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(rx, ry, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  return tex;
}

function initThreeEngine() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  // ⭐ 手電筒聚光燈（開啟物理柔和陰影 Cast Shadows）
  flashlight = new THREE.SpotLight(0xecfff2, 3.2, 26, Math.PI / 4.4, 0.45, 1.2);
  flashlight.castShadow = true;
  flashlight.shadow.mapSize.width = 1024;
  flashlight.shadow.mapSize.height = 1024;
  flashlight.shadow.bias = -0.001;
  camera.add(flashlight);
  flashlight.position.set(0, 0, 0.2);
  flashlight.target = camera;
  scene.add(camera);

  // 故障天花板長條日光燈
  ceilingLight1 = new THREE.PointLight(0xaaffcc, 0.6, 16);
  ceilingLight1.position.set(0, 5.2, 5);
  scene.add(ceilingLight1);

  ceilingLight2 = new THREE.PointLight(0xaaffcc, 0.6, 16);
  ceilingLight2.position.set(0, 5.2, -6);
  scene.add(ceilingLight2);

  scene.add(new THREE.AmbientLight(0x060e0a));

  // ⭐ 懸浮空氣灰塵粒子
  buildDustParticles();

  // ⭐ 天花板水滴模型
  buildWaterDrip();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和陰影
  renderer.toneMapping = THREE.ACESFilmicToneMapping; // 電影感色調映射
  renderer.toneMappingExposure = 0.9;
  container.appendChild(renderer.domElement);

  window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

  container.addEventListener('pointerdown', (e) => {
    isInteractingLook = true;
    lastTouchX = e.clientX; lastTouchY = e.clientY;
  });
  window.addEventListener('pointermove', (e) => {
    if (isInteractingLook) {
      const dx = e.clientX - lastTouchX, dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX; lastTouchY = e.clientY;
      yaw -= dx * 0.0035;
      pitch -= dy * 0.0035;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
    }
  });
  window.addEventListener('pointerup', () => { isInteractingLook = false; });
  container.addEventListener('click', checkRaycastInteract);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

// 懸浮塵埃粒子
function buildDustParticles() {
  const particleCount = 200;
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount * 3; i += 3) {
    positions[i] = (Math.random() - 0.5) * 25;
    positions[i + 1] = Math.random() * 5.5;
    positions[i + 2] = (Math.random() - 0.5) * 25;
  }
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: 0xccffdd, size: 0.06, transparent: true, opacity: 0.45
  });
  dustParticles = new THREE.Points(geom, mat);
  scene.add(dustParticles);
}

/* ==================== 走動與碰撞檢測 ==================== */
function updateMovement() {
  const moveSpeed = 0.11;
  let moveX = 0, moveZ = 0;

  if (keys.KeyW) moveZ -= 1;
  if (keys.KeyS) moveZ += 1;
  if (keys.KeyA) moveX -= 1;
  if (keys.KeyD) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const len = Math.hypot(moveX, moveZ);
    moveX = (moveX / len) * moveSpeed;
    moveZ = (moveZ / len) * moveSpeed;

    const sinYaw = Math.sin(yaw);
    const cosYaw = Math.cos(yaw);

    const nextX = playerPos.x + (moveX * cosYaw + moveZ * sinYaw);
    const nextZ = playerPos.z + (-moveX * sinYaw + moveZ * cosYaw);

    let canMoveX = true, canMoveZ = true;
    for (let box of wallColliders) {
      if (nextX >= box.minX && nextX <= box.maxX && playerPos.z >= box.minZ && playerPos.z <= box.maxZ) canMoveX = false;
      if (playerPos.x >= box.minX && playerPos.x <= box.maxX && nextZ >= box.minZ && nextZ <= box.maxZ) canMoveZ = false;
    }

    if (nextX < -15 || nextX > 15) canMoveX = false;
    if (nextZ < -15 || nextZ > 15) canMoveZ = false;

    if (canMoveX) playerPos.x = nextX;
    if (canMoveZ) playerPos.z = nextZ;

    headBob += 0.18;
    camera.position.y = playerPos.y + Math.sin(headBob) * 0.05;

    if (Math.sin(headBob) < -0.95 && !updateMovement.stepped) {
      sfx.step();
      updateMovement.stepped = true;
    } else if (Math.sin(headBob) > 0) {
      updateMovement.stepped = false;
    }
  }

  camera.position.x = playerPos.x;
  camera.position.z = playerPos.z;

  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);

  checkHospitalEvents();
}

function checkHospitalEvents() {
  if (!wheelchairScared && wheelchairMesh) {
    const distToChair = Math.hypot(wheelchairMesh.position.x - playerPos.x, wheelchairMesh.position.z - playerPos.z);
    if (distToChair < 7.5) {
      wheelchairScared = true;
      sfx.wheelSqueak();
      triggerFlash();
      let frames = 0;
      const timer = setInterval(() => {
        wheelchairMesh.position.z += 0.35;
        wheelchairMesh.rotation.y += 0.08;
        frames++;
        if (frames > 22) clearInterval(timer);
      }, 25);
    }
  }

  if (!morgueScared && morgueDrawerMesh) {
    const distToMorgue = Math.hypot(-10 - playerPos.x, 5 - playerPos.z);
    if (distToMorgue < 6.0) {
      morgueScared = true;
      sfx.bang();
      triggerFlash();
      let frames = 0;
      const timer = setInterval(() => {
        morgueDrawerMesh.position.z += 0.25;
        frames++;
        if (frames > 12) clearInterval(timer);
      }, 30);
    }
  }

  if (radioMesh) {
    const distRadio = Math.hypot(radioMesh.position.x - playerPos.x, radioMesh.position.z - playerPos.z);
    if (distRadio < 4.5 && !isNearRadio) {
      isNearRadio = true;
      sfx.startRadioStatic();
      speakDirectorVoice(HOSPITAL_STAGES[currentStageIdx].passcode);
      document.getElementById('radio-instruction').innerText =
        "「耳邊傳來收音機的雜訊與微弱通話聲……仔細聆聽院長留下的逃生代碼！」";
    } else if (distRadio >= 5.5 && isNearRadio) {
      isNearRadio = false;
      sfx.stopRadioStatic();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
  }
}

function triggerFlash() {
  const flash = document.getElementById('scare-flash');
  flash.style.display = 'block';
  setTimeout(() => { flash.style.display = 'none'; }, 200);
}

/* ==================== 水滴動態與灰塵漂浮動畫 ==================== */
function updateEnvironmentParticles() {
  // 水滴落下
  if (waterDripMesh) {
    waterDripMesh.position.y -= 0.14;
    if (waterDripMesh.position.y <= 0.05) {
      waterDripMesh.position.y = 5.4;
      sfx.drip();
    }
  }

  // 灰塵浮動
  if (dustParticles) {
    const pos = dustParticles.geometry.attributes.position.array;
    for (let i = 1; i < pos.length; i += 3) {
      pos[i] -= 0.003;
      if (pos[i] < 0) pos[i] = 5.5;
    }
    dustParticles.geometry.attributes.position.needsUpdate = true;
  }
}

/* ==================== 準心射線交互 ==================== */
function checkRaycastInteract() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length > 0) {
    let hitObj = hits[0].object;
    while (hitObj.parent && !hitObj.userData.type) hitObj = hitObj.parent;

    const dist = camera.position.distanceTo(hits[0].point);
    if (dist <= 4.8) {
      if (hitObj.userData.type === "clue") {
        openClueDialog(hitObj.userData.data);
      } else if (hitObj.userData.type === "door") {
        openKeypadDialog();
      }
    }
  }
}

function updateInteractHint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);
  const cross = document.getElementById('crosshair');
  const hint = document.getElementById('interact-hint');

  if (hits.length > 0 && hits[0].distance <= 4.8) {
    cross.classList.add('interactable');
    hint.style.display = 'block';
  } else {
    cross.classList.remove('interactable');
    hint.style.display = 'none';
  }
}

function submitPasscode() {
  const currentStage = HOSPITAL_STAGES[currentStageIdx];
  if (passcodeBuffer === currentStage.passcode) {
    sfx.doorOpen();
    closeKeypad();
    alert(`🎉【閘門開啟！】防護鐵門在刺耳金屬摩擦聲中升起！成功突破【${currentStage.title}】！`);

    if (currentStageIdx + 1 < HOSPITAL_STAGES.length) {
      load3DHospitalStage(currentStageIdx + 1);
    } else {
      alert("🏆【杏林生還者！】你已成功穿梭整座杏林綜合醫院，解開全部 4 道病區封鎖，重見天日！");
    }
  } else {
    alert("【密碼錯誤！】門禁系統紅燈蜂鳴！請核對病歷或收音機中的數字代碼！");
    clearKeypad();
  }
}

/* ==================== 主動畫循環 ==================== */
function animate() {
  requestAnimationFrame(animate);

  updateMovement();
  updateInteractHint();
  updateLightsFlicker();
  updateEnvironmentParticles();

  if (clueObject) clueObject.rotation.y += 0.02;

  if (radioMesh) {
    const led = radioMesh.getObjectByName("radioLed");
    if (led) {
      led.material.color.setRGB(isNearRadio ? 1 : 0.2 + Math.sin(Date.now() * 0.005) * 0.2, 0, 0);
    }
  }

  renderer.render(scene, camera);
}
</script>
