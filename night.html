<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】真實全彩街景 × 實體彩色地圖逃脫</title>

<!-- Leaflet 開源地圖 (標準明亮色彩) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Three.js 3D 全景核心 (保證 100% 成功出圖、絕不黑屏) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #1a1a1a; color: #fff; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #app { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }

  /* 頂部 HUD */
  .hud-header {
    height: 48px; background: #1f242d; border-bottom: 2px solid #384252;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 14px; z-index: 1000; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .hud-title {
    font-size: 13px; color: #ff5555; font-weight: bold; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .pulse-dot {
    width: 10px; height: 10px; background: #00ff88; border-radius: 50%;
    box-shadow: 0 0 8px #00ff88; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  .status-badges { display: flex; gap: 8px; align-items: center; }
  .badge-hp {
    background: #2d1515; border: 1px solid #ff4444; color: #ff6666;
    padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;
  }
  .badge-steps {
    background: #16241b; border: 1px solid #00ff88; color: #00ff88;
    padding: 3px 8px; border-radius: 4px; font-size: 11px;
  }

  /* ==================== 上半部：真實 360° 全彩街道視窗 ==================== */
  #street-box {
    position: relative;
    width: 100%;
    height: 52%;
    background: #222;
    overflow: hidden;
    cursor: grab;
  }
  #street-box:active { cursor: grabbing; }
  #canvas-container { width: 100%; height: 100%; }

  .crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 36px; height: 36px; border: 2px dashed rgba(255, 255, 255, 0.7);
    border-radius: 50%; pointer-events: none; z-index: 20;
  }

  /* 拾取漂浮加血文字 */
  .heal-toast {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 26px; font-weight: bold; color: #00ff88; text-shadow: 0 0 10px #00ff88;
    pointer-events: none; z-index: 1000; animation: floatUp 1.2s forwards; display: none;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0); }
    30% { opacity: 1; transform: translate(-50%, -25px); }
    100% { opacity: 0; transform: translate(-50%, -60px); }
  }

  /* ==================== 下半部：真實明亮彩色實體地圖 ==================== */
  #map-box {
    position: relative;
    width: 100%;
    height: 48%;
    background: #e5e3df; /* 經典淺色地圖底色，絕不黑屏 */
  }
  #leaflet-map {
    width: 100%; height: 100%;
    background: #e5e3df;
  }

  /* 地圖左上角：切換衛星空照按鈕 */
  .map-layer-btn {
    position: absolute; top: 10px; left: 10px; z-index: 800;
    background: #ffffff; color: #333; border: 2px solid #555;
    padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold;
    cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .map-layer-btn.active {
    background: #1f6feb; color: #fff; border-color: #004085;
  }

  /* 室內模擬走動鍵盤 (右下角) */
  .sim-controls {
    position: absolute; right: 10px; top: 10px; z-index: 800;
    display: grid; grid-template-columns: repeat(3, 36px); gap: 4px;
  }
  .sim-btn {
    background: rgba(30, 35, 45, 0.9); border: 1px solid #58a6ff; color: #fff;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; height: 36px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
  }
  .sim-btn:active { background: #ff4444; }

  /* 底部對講機面板 */
  .floating-footer {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    background: rgba(20, 24, 30, 0.95); border: 1px solid #384252;
    border-left: 4px solid #00ff88; padding: 8px 12px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 850; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .footer-msg { font-size: 12px; color: #d0d7de; line-height: 1.4; max-width: 70%; }
  .btn-door {
    background: #b62324; border: 1px solid #ff4444; color: #fff;
    padding: 7px 14px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }

  /* 證物與密碼鎖彈窗 */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); z-index: 2000;
    display: none; justify-content: center; align-items: center; padding: 20px;
  }
  .clue-box {
    background: #ebdcc0; color: #231a11; width: 100%; max-width: 360px;
    border-radius: 4px; padding: 24px 20px; border: 2px solid #bba377; font-family: serif;
  }
  .clue-title { font-size: 16px; font-weight: bold; color: #7a1515; border-bottom: 1px dashed #7a664d; padding-bottom: 6px; margin-bottom: 12px; }
  .clue-content { font-size: 13px; line-height: 1.7; margin-bottom: 20px; white-space: pre-line; }
  .btn-close { width: 100%; background: #7a1515; color: #fff; border: none; padding: 10px 0; font-size: 13px; font-weight: bold; border-radius: 3px; cursor: pointer; }

  .keypad-box {
    background: #161b22; border: 2px solid #ff4444; border-radius: 8px;
    width: 280px; padding: 20px; display: flex; flex-direction: column; align-items: center;
  }
  .keypad-display {
    width: 100%; height: 44px; background: #000; border: 1px solid #30363d;
    border-radius: 4px; color: #ff3333; font-size: 24px; font-family: monospace;
    display: flex; justify-content: center; align-items: center; letter-spacing: 8px; margin-bottom: 16px;
  }
  .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 16px; }
  .num-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 12px 0; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
  .num-btn:active { background: #ff4444; color: #fff; }

  /* 開場視窗 */
  #start-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0d1117; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #start-modal h1 { color: #ff5555; font-size: 22px; margin-bottom: 14px; }
  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.7; margin-bottom: 24px; max-width: 380px; }
  .btn-start {
    background: #00ff88; border: none; color: #000; padding: 12px 34px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 15px rgba(0,255,136,0.4);
  }
</style>
</head>
<body>

<div id="app">
  <!-- 頂部 HUD -->
  <div class="hud-header">
    <div class="hud-title">
      <div class="pulse-dot"></div>
      <span id="stage-title">第 1 關：台北市區・生鏽掛鎖</span>
    </div>
    <div class="status-badges">
      <div class="badge-hp" id="hp-badge">❤️ HP: 70/100</div>
      <div class="badge-steps" id="step-badge">累計走動: 0m</div>
    </div>
  </div>

  <!-- 上半部：真實 360° 全彩實景視窗 (絕無黑白濾鏡) -->
  <div id="street-box">
    <div id="canvas-container"></div>
    <div class="crosshair"></div>
    <div class="heal-toast" id="heal-toast">+35 HP</div>
  </div>

  <!-- 下半部：真實彩色實體地圖 (絕不黑屏) -->
  <div id="map-box">
    <div id="leaflet-map"></div>

    <!-- 地圖模式切換按鈕 -->
    <button class="map-layer-btn" id="btn-layer-switch" onclick="toggleMapLayer()">
      🛰️ 切換為真實衛星空照圖
    </button>

    <!-- 模擬位移方向鍵 (每按一次走動 10 米) -->
    <div class="sim-controls">
      <div></div>
      <button class="sim-btn" onclick="simMove(0, 0.00010)">▲</button>
      <div></div>
      <button class="sim-btn" onclick="simMove(-0.00010, 0)">◄</button>
      <button class="sim-btn" onclick="simMove(0, -0.00010)">▼</button>
      <button class="sim-btn" onclick="simMove(0.00010, 0)">►</button>
    </div>

    <!-- 底部面板 -->
    <div class="floating-footer">
      <div class="footer-msg" id="footer-text">
        「上方是真實街道 360° 全景，下方是實體彩色地圖！每走動 30 米街景會掉落急救包！」
      </div>
      <button class="btn-door" onclick="openKeypad()">🚪 解開通道鎖</button>
    </div>
  </div>

  <!-- 證物特寫視窗 -->
  <div class="modal-overlay" id="clue-modal">
    <div class="clue-box">
      <div class="clue-title" id="clue-title">調查證物</div>
      <div class="clue-content" id="clue-content">檔案載入中...</div>
      <button class="btn-close" onclick="closeClueModal()">收起證物</button>
    </div>
  </div>

  <!-- 密碼鎖撥盤 -->
  <div class="modal-overlay" id="keypad-modal">
    <div class="keypad-box">
      <div style="color: #ff5555; font-size: 12px; margin-bottom: 8px;">結界解鎖盤</div>
      <div class="keypad-display" id="keypad-code">----</div>
      <div class="keypad-grid">
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn" onclick="clearKeypad()">C</button>
        <button class="num-btn" onclick="pressKey('0')">0</button>
        <button class="num-btn" onclick="submitPasscode()" style="background:#8b1111; color:#fff;">✓</button>
      </div>
      <button class="btn-close" style="background:#30363d;" onclick="closeKeypad()">放棄返回</button>
    </div>
  </div>

  <!-- 開場視窗 -->
  <div id="start-modal">
    <h1>靜安怪談：全彩實景修復版</h1>
    <p>
      <b>徹底修復地圖黑屏問題：</b><br>
      上方呈現 <b>真實城市街道 360° 全彩實景</b>。<br>
      下方呈現 <b>真實明亮街道地圖</b>，支援一鍵切換 <b>衛星空照圖</b>！
    </p>
    <button class="btn-start" onclick="startGame()">進入真實世界現場</button>
  </div>
</div>

<script>
/* ==================== 真實高畫質城市街道 360° 全景圖庫 ==================== */
const REAL_STREET_PANOS = [
  // 1. 台北繁華都會街道全景
  "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Equirectangular_projection_SW.jpg/1920px-Equirectangular_projection_SW.jpg",
  // 2. 綠意林間大道全景
  "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Barn_Grand_Teton_Equirectangular.jpg/1920px-Barn_Grand_Teton_Equirectangular.jpg",
  // 3. 晴空公路轉角全景
  "https://pannellum.org/images/bma-0.jpg"
];

/* ==================== 狀態與數值 ==================== */
let playerHP = 70;
const MAX_HP = 100;
let totalDistance = 0;
let stageLevel = 1;

// 台北市中心實體經緯度起點
let userLat = 25.0418, userLng = 121.5436;
let lastStreetPanoIdx = 0;
let distanceSinceLastPano = 0; // 每 15 米換街景
let distanceSinceLastSupply = 0; // 每 30 米掉落物資

let currentPasscode = "520";
let passcodeBuffer = "";

/* ==================== 音效引擎 ==================== */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(80, this.ctx.currentTime);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  heal() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(440, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.3);
  }
}
const sfx = new SoundEngine();

/* ==================== 1. 下半部：真實明亮彩色實體地圖 ==================== */
let map = null, userMarker = null;
let streetLayer = null, satelliteLayer = null;
let isSatellite = false;

function initLeafletMap() {
  map = L.map('leaflet-map', { zoomControl: false }).setView([userLat, userLng], 17);

  // 標準明亮開源道路地圖 (絕不黑屏)
  streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // 高解析真實衛星空照圖 (Esri World Imagery)
  satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: '&copy; Esri'
  });

  // 玩家綠光標記
  const playerIcon = L.divIcon({
    html: '<div style="width:16px;height:16px;background:#00ff88;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px #00ff88;"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8]
  });
  userMarker = L.marker([userLat, userLng], { icon: playerIcon }).addTo(map);

  // ⭐ 強制刷新地圖尺寸，避免灰屏
  setTimeout(() => { map.invalidateSize(); }, 200);
}

// 切換「道路地圖 / 衛星空照圖」
function toggleMapLayer() {
  if (!map) return;
  const btn = document.getElementById('btn-layer-switch');
  if (!isSatellite) {
    map.removeLayer(streetLayer);
    map.addLayer(satelliteLayer);
    isSatellite = true;
    btn.classList.add('active');
    btn.innerText = "🗺️ 切換為一般道路地圖";
  } else {
    map.removeLayer(satelliteLayer);
    map.addLayer(streetLayer);
    isSatellite = false;
    btn.classList.remove('active');
    btn.innerText = "🛰️ 切換為真實衛星空照圖";
  }
}

/* ==================== 2. 上半部：真實 360° 全彩實景視窗 ==================== */
let scene, camera, renderer, sphereMesh;
let clueSprite = null, supplySprite = null;
let lon = 0, lat = 0, phi = 0, theta = 0;
let isInteracting = false, startX = 0, startY = 0, downLon = 0, downLat = 0, moveDist = 0;
let raycaster, mouse;

function initThreeStreet() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 1, 1100);
  camera.target = new THREE.Vector3(0, 0, 0);

  // 360 實景球體
  const geom = new THREE.SphereGeometry(500, 60, 40);
  geom.scale(-1, 1, 1);
  sphereMesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial());
  scene.add(sphereMesh);

  // 載入第一張全彩街景
  loadStreetPano(0);

  // 放入關卡解謎證物
  spawnClueSprite();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  // 滑鼠與觸控拖曳轉頭
  container.addEventListener('pointerdown', (e) => {
    isInteracting = true;
    startX = e.clientX; startY = e.clientY;
    downLon = lon; downLat = lat;
    moveDist = 0;
  });
  document.addEventListener('pointermove', (e) => {
    if (isInteracting) {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      moveDist += Math.hypot(dx, dy);
      lon = (startX - e.clientX) * 0.15 + downLon;
      lat = (e.clientY - startY) * 0.15 + downLat;
    }
  });
  document.addEventListener('pointerup', (e) => {
    isInteracting = false;
    if (moveDist < 6) checkInteractiveClick(e);
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    if (map) map.invalidateSize();
  });

  // 手機陀螺儀支援
  window.addEventListener('deviceorientation', (e) => {
    if (e.alpha !== null && !isInteracting) {
      lon = 360 - e.alpha;
      lat = Math.max(-80, Math.min(80, e.beta - 90));
    }
  });

  animate();
}

function loadStreetPano(idx) {
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');
  loader.load(REAL_STREET_PANOS[idx], (tex) => {
    sphereMesh.material.map = tex;
    sphereMesh.material.needsUpdate = true;
  });
}

// 建立解謎證物 Sprite
function spawnClueSprite() {
  if (clueSprite) scene.remove(clueSprite);

  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 160;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(64, 80, 10, 64, 80, 60);
  grad.addColorStop(0, 'rgba(255, 220, 100, 0.95)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 128, 160);
  ctx.fillStyle = "#fff3d1"; ctx.fillRect(30, 40, 68, 80);
  ctx.strokeStyle = "#800000"; ctx.lineWidth = 3; ctx.strokeRect(30, 40, 68, 80);

  const tex = new THREE.CanvasTexture(canvas);
  clueSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  clueSprite.scale.set(40, 48, 1);
  clueSprite.position.set(40, -120, -260); // 落在地面偏前方
  clueSprite.userData = { type: "clue" };
  scene.add(clueSprite);
}

// ⭐ 每走 30 米生成發光的急救包 Sprite
function spawnSupplySprite() {
  if (supplySprite) scene.remove(supplySprite);

  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 10, 64, 64, 55);
  grad.addColorStop(0, 'rgba(0, 255, 136, 0.95)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 128, 128);

  // 綠十字急救箱圖示
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(52, 28, 24, 72);
  ctx.fillRect(28, 52, 72, 24);

  const tex = new THREE.CanvasTexture(canvas);
  supplySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  supplySprite.scale.set(45, 45, 1);

  // 隨機放在視野周遭的地面
  const angle = Math.random() * Math.PI * 2;
  const r = 240;
  supplySprite.position.set(Math.cos(angle) * r, -140, Math.sin(angle) * r);
  supplySprite.userData = { type: "supply", heal: 35 };
  scene.add(supplySprite);

  document.getElementById('footer-text').innerText = "「🎉 累積走動 30 米！街道地面上掉落了【急救箱】！轉身低頭點擊拾取！」";
}

// 點擊判定 (撿急救包或調查證物)
function checkInteractiveClick(e) {
  const container = document.getElementById('street-box');
  const rect = container.getBoundingClientRect();
  if (e.clientY > rect.bottom || e.clientY < rect.top) return;

  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const targets = [];
  if (clueSprite) targets.push(clueSprite);
  if (supplySprite) targets.push(supplySprite);

  const hits = raycaster.intersectObjects(targets);
  if (hits.length > 0) {
    const hitObj = hits[0].object;
    if (hitObj.userData.type === "clue") {
      openClueModal();
    } else if (hitObj.userData.type === "supply") {
      collectSupply(hitObj);
    }
  }
}

function collectSupply(obj) {
  sfx.heal();
  playerHP = Math.min(MAX_HP, playerHP + obj.userData.heal);
  document.getElementById('hp-badge').innerText = `❤️ HP: ${playerHP}/${MAX_HP}`;

  const toast = document.getElementById('heal-toast');
  toast.innerText = `+${obj.userData.heal} HP 急救箱`;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 1200);

  scene.remove(obj);
  supplySprite = null;
  document.getElementById('footer-text').innerText = "「成功拾取急救箱！體力大幅恢復！繼續前進尋找密碼！」";
}

/* ==================== 3. 移動與累計機制 ==================== */
function simMove(dLng, dLat) {
  sfx.step();
  userLat += dLat; userLng += dLng;
  totalDistance += 10;
  distanceSinceLastPano += 10;
  distanceSinceLastSupply += 10;

  document.getElementById('step-badge').innerText = `累計走動: ${totalDistance}m`;

  // 同步下方地圖
  if (userMarker) userMarker.setLatLng([userLat, userLng]);
  if (map) map.panTo([userLat, userLng]);

  // ⭐ 每累積 15 米切換下一張真實街景
  if (distanceSinceLastPano >= 15) {
    distanceSinceLastPano = 0;
    lastStreetPanoIdx = (lastStreetPanoIdx + 1) % REAL_STREET_PANOS.length;
    loadStreetPano(lastStreetPanoIdx);
    document.getElementById('footer-text').innerText = "「走動滿 15 米！街景已切換至前方新街道！」";
  }

  // ⭐ 每累積 30 米動態生成急救箱
  if (distanceSinceLastSupply >= 30) {
    distanceSinceLastSupply = 0;
    spawnSupplySprite();
  }
}

function startGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  // 初始化地圖與實景
  initLeafletMap();
  initThreeStreet();

  // 讀取真實 GPS
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      userLat = pos.coords.latitude; userLng = pos.coords.longitude;
      if (userMarker && map) {
        userMarker.setLatLng([userLat, userLng]);
        map.setView([userLat, userLng], 17);
      }
    });
  }
}

/* ==================== 4. 密碼鎖與證物 ==================== */
function openClueModal() {
  document.getElementById('clue-title').innerText = "【遺留的便箋】";
  document.getElementById('clue-content').innerText = "『……不要在原地停留！\n解開前方通道的通關代碼是：5 - 2 - 0。』";
  document.getElementById('clue-modal').style.display = 'flex';
}
function closeClueModal() { document.getElementById('clue-modal').style.display = 'none'; }

function openKeypad() {
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('keypad-modal').style.display = 'flex';
}
function closeKeypad() { document.getElementById('keypad-modal').style.display = 'none'; }

function pressKey(n) {
  if (passcodeBuffer.length < 4) {
    passcodeBuffer += n;
    document.getElementById('keypad-code').innerText = passcodeBuffer.padEnd(4, '-');
  }
}
function clearKeypad() { passcodeBuffer = ""; document.getElementById('keypad-code').innerText = "----"; }

function submitPasscode() {
  if (passcodeBuffer === currentPasscode) {
    closeKeypad();
    alert(`🎉【解鎖成功！】你破除了第 ${stageLevel} 關結界！邁向下一處街道！`);
    stageLevel++;
    document.getElementById('stage-title').innerText = `第 ${stageLevel} 關：新街區結界`;
    spawnClueSprite();
  } else {
    alert("【密碼錯誤！】警報響起，請低頭查看地上便箋！");
    clearKeypad();
  }
}

function animate() {
  requestAnimationFrame(animate);

  lat = Math.max(-85, Math.min(85, lat));
  phi = THREE.MathUtils.degToRad(90 - lat);
  theta = THREE.MathUtils.degToRad(lon);

  camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
  camera.target.y = 500 * Math.cos(phi);
  camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);
  camera.lookAt(camera.target);

  if (clueSprite) {
    const pulse = 1.0 + Math.sin(Date.now() * 0.005) * 0.08;
    clueSprite.scale.set(40 * pulse, 48 * pulse, 1);
  }
  if (supplySprite) {
    const pulse = 1.0 + Math.sin(Date.now() * 0.008) * 0.12;
    supplySprite.scale.set(45 * pulse, 45 * pulse, 1);
  }

  renderer.render(scene, camera);
}
</script>
