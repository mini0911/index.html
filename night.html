<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>校安危機處理模擬器｜今天也要平安下班</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(15, 23, 42, 0.92);
      --accent-blue: #38bdf8;
      --accent-gold: #fbbf24;
      --danger-red: #ef4444;
      --safe-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #020617;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* 手機直式 9:16 主舞台容器 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      max-height: 880px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* 背景層（支援填入豆包生成的背景圖） */
    #scene-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: all 0.5s ease;
      z-index: 0;
    }

    #scene-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, rgba(15, 23, 42, 0.25) 0%, rgba(2, 6, 23, 0.85) 100%);
      z-index: 1;
    }

    /* 頂部狀態欄：壓力值血條 & 地點資訊 */
    #hud-top {
      position: relative;
      z-index: 10;
      padding: 14px 16px 10px;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.9) 0%, rgba(2, 6, 23, 0) 100%);
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .location-badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .audio-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .stress-wrapper {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .stress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .stress-bar-bg {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    #stress-bar-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #22c55e, #eab308);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease;
    }

    /* 中央角色立繪舞台 */
    #character-stage {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 10px;
      pointer-events: none;
    }

    #character-sprite {
      width: 260px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
    }

    #character-sprite img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .sprite-shake {
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
    }

    /* 底部對話框與選項互動區 */
    #dialogue-panel {
      position: relative;
      z-index: 15;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px 20px 0 0;
      padding: 16px 18px 22px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }

    .speaker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    #speaker-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    #speaker-role {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
    }

    #dialogue-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-main);
      min-height: 76px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    /* 選項按鈕列表 */
    #choices-container {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #f8fafc;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .choice-btn:active {
      transform: scale(0.98);
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-blue);
    }

    .choice-tag {
      font-size: 11px;
      color: var(--accent-blue);
      margin-left: 8px;
      white-space: nowrap;
    }

    .next-hint {
      text-align: right;
      font-size: 12px;
      color: var(--accent-blue);
      animation: pulse 1.2s infinite;
      cursor: pointer;
      padding: 6px 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* 封面與結局遮罩畫面 */
    .overlay-screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 24px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .cover-tag {
      color: var(--accent-gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .cover-title {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #fff, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .primary-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease;
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    .ending-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .ending-good { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .ending-bad { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .ending-hidden { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 背景圖層 -->
  <div id="scene-bg"></div>
  <div id="scene-overlay"></div>

  <!-- 頂部 HUD 狀態列 -->
  <div id="hud-top">
    <div class="hud-row">
      <span id="location-label" class="location-badge">📍 學務處／學安室・16:45</span>
      <button id="audio-toggle" class="audio-btn" onclick="toggleAudio()">🔊 音效開</button>
    </div>
    <div class="stress-wrapper">
      <div class="stress-header">
        <span>校安人員壓力指數</span>
        <span id="stress-text" style="color: #4ade80;">20%（冷靜可控）</span>
      </div>
      <div class="stress-bar-bg">
        <div id="stress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- 中央角色立繪舞台 -->
  <div id="character-stage">
    <div id="character-sprite"></div>
  </div>

  <!-- 底部對話框與選項 -->
  <div id="dialogue-panel">
    <div class="speaker-row">
      <span id="speaker-name">系統提示</span>
      <span id="speaker-role">事件紀錄</span>
    </div>
    <div id="dialogue-text" onclick="handleDialogueClick()">點擊開始執勤...</div>
    <div id="choices-container"></div>
  </div>

  <!-- 開場封面 -->
  <div id="start-screen" class="overlay-screen">
    <div class="cover-tag">CAMPUS SAFETY SIMULATOR</div>
    <h1 class="cover-title">校園安全危機處理<br>：放學前的突發衝突</h1>
    <p class="cover-desc">
      距離下班只剩 15 分鐘，學務處大門卻被氣勢洶洶的家長推開。<br>
      身為第一線校安人員，你的每一個應對與蒐證決策，都將決定事態走向與多重結局。
    </p>
    <button class="primary-btn" onclick="startGame()">佩戴對講機・開始值勤</button>
  </div>

  <!-- 結局結算畫面 -->
  <div id="ending-screen" class="overlay-screen hidden">
    <div id="ending-type" class="ending-badge ending-good">S 級完美結局</div>
    <h2 id="ending-title" class="cover-title">危機化解・準時打卡下班</h2>
    <p id="ending-desc" class="cover-desc">結局說明文字</p>
    <button class="primary-btn" onclick="startGame()">重新挑戰其他分支</button>
  </div>
</div>

  // ==========================================

      text: "林主任迅速疏散圍觀學生，並接手安撫家長情緒；你則冷靜備份了校門口監視器畫面交給主任佐證，成功化解公關危機。",
      choices: [
        { text: "填寫校安事件紀錄表，結束驚險的一天", stressDelta: -10, next: "ending_normal_report", tag: "平安下班" }
      ]
    },

    // ==========================================
    // 3. 多重結局定義
    // ==========================================
    ending_perfect: {
      isEnding: true,
      badgeClass: "ending-good",
      badgeText: "S 級完美結局｜專業典範",
      title: "證據說話・準時平安下班",
      desc: "你全程遵守校安 SOP，情緒穩定、密錄器與監視器證據完整，不僅讓家長心服口服簽下安全切結書，還守護了放學師生安全。17:00 準時打卡下班！"
    },
    ending_normal_report: {
      isEnding: true,
      badgeClass: "ending-good",
      badgeText: "B 級普通結局｜有驚無險",
      desc: "雖然過程中一度陷入溝通僵局與壓力飆升，但最終仍透過團隊協作與監視器佐證完成事件處置。記得下次第一時間開啟密錄器與影像佐證會更輕鬆！"
    },
    ending_bad_grab: {
      isEnding: true,
      badgeClass: "ending-bad",
      badgeText: "D 級危機結局｜公關風暴",
      desc: "在未經同意下伸手碰觸家長手機引發肢體拉扯，畫面被旁人拍下上傳網路，演變成嚴重投訴事件，今晚得留下來寫三千字事件檢討報告了……"
    },
    ending_hidden_intruder: {
      isEnding: true,
      badgeClass: "ending-hidden",
      badgeText: "★ 隱藏懸疑結局｜第 2 集開啟",
      title: "發現校外可疑人士入侵！",
      desc: "你敏銳地從監視器角落發現趁亂翻牆進入的鴨舌帽黑衣人！你立刻按下無線電全校通報啟動門禁封鎖——真正的校園安全守護戰現在才剛開始！"
    }
  };

  // ==========================================
  // 4. 遊戲狀態與音效引擎
  // ==========================================
  let stress = 20;
  let audioEnabled = true;
  let typingTimer = null;
  let isTyping = false;
  let currentFullText = "";

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(type) {
    if (!audioEnabled) return;
    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === "click") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(620, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === "alert" || type === "danger") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(140, now + 0.25);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === "success") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.start(now);
      osc.stop(now + 0.28);
    }
  }

  function toggleAudio() {
    audioEnabled = !audioEnabled;
    document.getElementById("audio-toggle").textContent = audioEnabled ? "🔊 音效開" : "🔇 靜音";
  }

  function updateStressUI() {
    stress = Math.max(0, Math.min(100, stress));
    const fill = document.getElementById("stress-bar-fill");
    const label = document.getElementById("stress-text");

    fill.style.width = stress + "%";
    if (stress < 40) {
      fill.style.background = "linear-gradient(90deg, #22c55e, #38bdf8)";
      label.style.color = "#4ade80";
      label.textContent = `${stress}%（冷靜可控）`;
    } else if (stress < 75) {
      fill.style.background = "linear-gradient(90deg, #eab308, #f97316)";
      label.style.color = "#fbbf24";
      label.textContent = `${stress}%（氣氛緊繃）`;
    } else {
      fill.style.background = "linear-gradient(90deg, #ef4444, #b91c1c)";
      label.style.color = "#f87171";
      label.textContent = `${stress}%（瀕臨失控！）`;
    }
  }

  function startGame() {
    stress = 20;
    updateStressUI();
    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("ending-screen").classList.add("hidden");
    playTone("click");
    renderNode("start");
  }

  function renderNode(nodeId) {
    const node = STORY_NODES[nodeId];
    if (!node) return;

    // 檢查是否為結局節點
    if (node.isEnding) {
      const endScreen = document.getElementById("ending-screen");
      const badge = document.getElementById("ending-type");
      badge.className = "ending-badge " + node.badgeClass;
      badge.textContent = node.badgeText;
      document.getElementById("ending-title").textContent = node.title;
      document.getElementById("ending-desc").textContent = node.desc;
      endScreen.classList.remove("hidden");
      return;
    }

    // 更新場景與音效
    document.getElementById("location-label").textContent = node.location;
    document.getElementById("scene-bg").style.background = node.bgGradient;
    if (node.sound) playTone(node.sound);

    // 更新角色立繪
    const charData = CHARACTERS[node.char] || CHARACTERS.none;
    document.getElementById("speaker-name").textContent = charData.name;
    document.getElementById("speaker-role").textContent = charData.role;

    const spriteBox = document.getElementById("character-sprite");
    spriteBox.classList.remove("sprite-shake");
    if (charData.imageUrl) {
      spriteBox.innerHTML = `<img src="${charData.imageUrl}" alt="${charData.name}">`;
    } else {
      spriteBox.innerHTML = charData.svg;
    }
    if (node.shake) {
      void spriteBox.offsetWidth; // 觸發重繪以重播震動動畫
      spriteBox.classList.add("sprite-shake");
    }

    // 打字機效果輸出對話
    const choicesBox = document.getElementById("choices-container");
    choicesBox.innerHTML = "";
    typeWriter(node.text, () => {
      renderChoices(node.choices);
    });
  }

  function typeWriter(text, onComplete) {
    clearInterval(typingTimer);
    isTyping = true;
    currentFullText = text;
    const textEl = document.getElementById("dialogue-text");
    textEl.textContent = "";
    let idx = 0;

    typingTimer = setInterval(() => {
      textEl.textContent += text.charAt(idx);
      idx++;
      if (idx >= text.length) {
        clearInterval(typingTimer);
        isTyping = false;
        if (onComplete) onComplete();
      }
    }, 24);
  }

  function handleDialogueClick() {
    // 若正在打字中，點擊對話框可瞬間顯示完整句子
    if (isTyping) {
      clearInterval(typingTimer);
      isTyping = false;
      document.getElementById("dialogue-text").textContent = currentFullText;
    }
  }

  function renderChoices(choices) {
    const choicesBox = document.getElementById("choices-container");
    choicesBox.innerHTML = "";

    choices.forEach((choice) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = `
        <span>${choice.text}</span>
        <span class="choice-tag">${choice.tag || ""}</span>
      `;
      btn.onclick = () => {
        playTone("click");
        stress += choice.stressDelta || 0;
        updateStressUI();

        // 若壓力值爆表（>= 100），強制進入高壓力失敗結局
        if (stress >= 100) {
          renderNode("ending_bad_grab");
        } else {
          renderNode(choice.next);
        }
      };
      choicesBox.appendChild(btn);
    });
  }
</script>
</body>
