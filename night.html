<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>末日便利店 - 廢土放置大亨</title>
<style>
  :root {
    --bg-main: #12181b;
    --card-bg: #1e262b;
    --card-border: #2f3b43;
    --accent-gold: #f6ad55;
    --accent-green: #48bb78;
    --accent-red: #f56565;
    --text-main: #edf2f7;
    --text-muted: #a0aec0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: #090d0f;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* 直式手機容器 (Mobile Container) */
  .mobile-shell {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 900px;
    background: var(--bg-main);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  /* 頂部看板 */
  header {
    background: #182025;
    padding: 14px 16px;
    border-bottom: 2px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .caps-display {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--accent-gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cps-display {
    font-size: 0.8rem;
    color: var(--accent-green);
    font-weight: 600;
  }

  /* 招攬顧客大按鈕區 (Tap Area) */
  .tap-section {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(180deg, #182025 0%, var(--bg-main) 100%);
    position: relative;
  }
  .tap-btn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, #dd6b20 0%, #c05621 100%);
    border: 3px solid #fbd38d;
    box-shadow: 0 6px 15px rgba(221, 107, 32, 0.4);
    font-size: 2.2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform 0.05s ease;
  }
  .tap-btn:active {
    transform: scale(0.92);
  }
  .tap-hint {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* 漂浮點擊數字 */
  .float-text {
    position: absolute;
    color: var(--accent-gold);
    font-weight: 800;
    font-size: 1.2rem;
    pointer-events: none;
    animation: floatUp 0.7s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
  }

  /* 貨架清單滾動區 (Scrollable Shelf List) */
  .shelf-container {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .shelf-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .shelf-icon {
    font-size: 1.8rem;
    width: 44px;
    height: 44px;
    background: #151c20;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 12px;
  }
  .shelf-info { flex: 1; }
  .shelf-title { font-weight: bold; font-size: 0.95rem; }
  .shelf-desc { font-size: 0.75rem; color: var(--accent-green); margin-top: 2px; }

  /* 升級按鈕 */
  .upgrade-btn {
    background: #2b3840;
    border: 1px solid #4a5d6a;
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    cursor: pointer;
    text-align: right;
    min-width: 95px;
  }
  .upgrade-btn.can-buy {
    background: linear-gradient(135deg, #d69e2e 0%, #b7791f 100%);
    border-color: #f6e05e;
  }
  .upgrade-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .upgrade-cost { font-size: 0.85rem; font-weight: bold; }
  .upgrade-lv { font-size: 0.7rem; color: #cbd5e0; }

  /* 底部導航欄 (Mobile Footer Nav) */
  footer {
    height: 58px;
    background: #151c20;
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 0.7rem;
    color: var(--text-muted);
    cursor: pointer;
  }
  .nav-item.active { color: var(--accent-gold); font-weight: bold; }
  .nav-item span:first-child { font-size: 1.2rem; }
</style>
</head>
<body>
