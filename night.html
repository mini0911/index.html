<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】實境逃脫偵查雷達</title>
<!-- 載入免金鑰的 Leaflet 實境開源地圖 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html {
    width: 100%; height: 100%;
    background: #050508;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", monospace;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    position: relative;
  }

  /* 頂部 HUD 狀態列 */
  .hud-header {
    height: 52px;
    background: #0d1117;
    border-bottom: 2px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    z-index: 1000;
  }
  .hud-title {
    font-size: 13px;
    letter-spacing: 2px;
    color: #ff5555;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pulse-dot {
    width: 10px; height: 10px;
    background: #ff2222;
    border-radius: 50%;
    box-shadow: 0 0 8px #ff0000;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  .gps-status {
    font-size: 11px;
    color: #8b949e;
    background: #161b22;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #30363d;
  }

  /* 地圖主視圖 */
  #map {
    flex: 1;
    width: 100%;
    background: #0a0a0c;
  }
  /* 夜間恐怖濾鏡（讓地圖呈現深沉夜視高對比風格） */
  .leaflet-tile {
    filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(120%) saturate(30%) !important;
  }

  /* 雷達掃描特效覆蓋層 */
  .radar-overlay {
    position: absolute;
    top: 52px; left: 0; right: 0; bottom: 130px;
    pointer-events: none;
    background: radial-gradient(circle, transparent 45%, rgba(0,0,0,0.6) 95%);
    box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.15);
    z-index: 500;
  }

  /* 底部對講機與解謎控制盤 */
  .hud-footer {
    height: 130px;
    background: #0d1117;
    border-top: 2px solid #30363d;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 1000;
  }
  .radio-channel {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #f0883e;
  }
  .radio-bubble {
    background: #161b22;
    border: 1px solid #21262d;
    border-left: 3px solid #ff5555;
    padding: 8px 12px;
    font-size: 13px;
    color: #c9d1d9;
    line-height: 1.4;
    min-height: 48px;
    border-radius: 4px;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .target-info {
    font-size: 12px;
    color: #58a6ff;
  }
  .btn-action {
    background: #b62324;
    border: 1px solid #e05252;
    color: #fff;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-action:disabled {
    background: #21262d;
    border-color: #30363d;
    color: #484f58;
    cursor: not-allowed;
  }

  /* 實境線索特寫視窗 */
  #clue-modal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 86%;
    max-width: 400px;
    background: #161b22;
    border: 2px solid #ff4444;
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
    padding: 20px;
    border-radius: 8px;
    display: none;
    z-index: 2000;
  }
  #clue-modal h3 { color: #ff5555; margin-bottom: 10px; font-size: 16px; }
  #clue-modal p { font-size: 13px; line-height: 1.6; color: #8b949e; margin-bottom: 14px; }
  .code-box {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .code-box input {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff;
    padding: 8px; font-size: 16px; text-align: center; font-family: monospace;
  }

  /* 模擬走動方向鍵（針對室內測試） */
  .sim-controls {
    position: absolute;
    right: 12px;
    bottom: 140px;
    z-index: 999;
    display: grid;
    grid-template-columns: repeat(3, 38px);
    grid-template-rows: repeat(2, 38px);
    gap: 4px;
  }
  .sim-btn {
    background: rgba(13, 17, 23, 0.85);
    border: 1px solid #30363d;
    color: #c9d1d9;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
  }

  /* 開場定位啟動布幕 */
  #start-modal {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #050508;
    z-index: 3000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
  }
  #start-modal h1 { color: #ff4444; font-size: 24px; margin-bottom: 14px; letter-spacing: 2px; }
  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.6; margin-bottom: 24px; max-width: 340px; }
  .btn-start {
    background: #b62324;
    border: none;
    color: #fff;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
  }
</style>
</head>
<body>

<div id="app">
  <!-- 頂部 HUD -->
  <div class="hud-header">
    <div class="hud-title">
      <div class="pulse-dot"></div>
      <span>靈異實境雷達</span>
    </div>
    <div class="gps-status" id="gps-status">GPS 待命: 請走動</div>
  </div>

  <!-- Leaflet 地圖容器 -->
  <div id="map"></div>
  <div class="radar-overlay"></div>

  <!-- 室內模擬步行鍵 (手機/電腦測試用) -->
  <div class="sim-controls">
    <div></div>
    <button class="sim-btn" onclick="simMove(0, 0.00015)">▲</button>
    <div></div>
    <button class="sim-btn" onclick="simMove(-0.00015, 0)">◄</button>
    <button class="sim-btn" onclick="simMove(0, -0.00015)">▼</button>
    <button class="sim-btn" onclick="simMove(0.00015, 0)">►</button>
  </div>

  <!-- 底部無線電對講與互動面板 -->
  <div class="hud-footer">
    <div class="radio-channel">
      <span>對講機 [CH-9] 隊長</span>
      <span id="zone-alert" style="color: #ff4444;">結界異常值: 中</span>
    </div>
    <div class="radio-bubble" id="radio-msg">
      「喂？訊號接上了！你周圍 100 公尺的街道被不明力場封鎖了，看地圖上的紅色光圈，走到第一個據點！」
    </div>
    <div class="controls">
      <div class="target-info" id="target-dist">距下個封印點: 計算中...</div>
      <button class="btn-action" id="interact-btn" disabled onclick="openCurrentQuest()">調查現場物證</button>
    </div>
  </div>

  <!-- 解謎彈窗 -->
  <div id="clue-modal">
    <h3 id="modal-title">現場異象</h3>
    <p id="modal-desc">說明內容</p>
    <div class="code-box" id="modal-input-area">
      <input type="text" id="modal-input" placeholder="輸入破除咒語/密碼">
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn-action" style="background: #21262d; border-color: #30363d;" onclick="closeQuest()">離開</button>
      <button class="btn-action" id="modal-submit-btn" onclick="verifyQuest()">解開結界</button>
    </div>
  </div>

  <!-- 開場授權頁面 -->
  <div id="start-modal">
    <h1>靜安怪談：現地封鎖線</h1>
    <p>這是一款**必須靠雙腳在真實世界走動**才能破解的實境遊戲。<br>遊戲會以你現在的真實地理位置為中心，在周圍街道生成 3 個詭異調查點。</p>
    <button class="btn-start" onclick="initRealWorldGame()">開啟定位，進入結界</button>
  </div>
</div>

<script>
/* ==================== 恐怖合成音效 ==================== */
class SoundFx {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  ping() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
  }
  unlocked() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.4);
  }
}
const sfx = new SoundFx();

/* ==================== 狀態與關卡配置 ==================== */
let userLat = 25.053, userLng = 121.606; // 預設值（取得真實 GPS 後即刻覆蓋）
let map, userMarker, userCircle;
let currentStage = 0;
let questPoints = [];

// 關卡劇情與謎題設定（將動態映射至玩家真實周遭座標）
const QUESTS = [
  {
    name: "第一結界：失蹤者的長椅 / 電線桿",
    offset: [0.0005, 0.0004], // 約北偏東 50-70 公尺
    hint: "走到地圖上的標記處！那裡殘留著失蹤住戶的隨身物品。",
    modalDesc: "你走到了現場。地上用粉筆畫著一圈怪異符號，中間壓著一張泛黃卡片：<br>『白晝將盡，鐘擺停在午夜零點前四十六分。』<br><br>請輸入鐘面指針所代表的 4 位數時間代碼 (HHMM)：",
    answer: "2314",
    radioSuccess: "「很好！第一個封印破除了，儀表顯示磁場往東南方向轉移了，快跟過去！」"
  },
  {
    name: "第二結界：帶血的水泥牆角",
    offset: [-0.0006, 0.0005], // 約南偏東 80 公尺
    hint: "跟隨雷達光圈前往第二個點！不要理會背後的腳步聲。",
    modalDesc: "你抵達了陰暗角落。牆壁上刻滿了扭曲的字痕：<br>『三個人進去，只有一個人的影子出來。四零四室沒有門。』<br><br>請輸入這棟公寓消失的房間編號：",
    answer: "404",
    radioSuccess: "「破除成功！最後一個核心反應就在你附近的正北方，那是整座結界的心臟！」"
  },
  {
    name: "終極結界：公寓的真實天台界標",
    offset: [0.0007, -0.0003], // 約北偏西 80 公尺
    hint: "前往最後的決戰座標！屏住呼吸！",
    modalDesc: "強烈的刺鼻焚香味迎面而來。地上放著一個被紅繩纏繞的生鏽金屬盒。<br>封條上寫著：『熄燈之時，方得自由』。<br><br>破除咒語是本遊戲的英文名第一個單字：",
    answer: "GOODNIGHT",
    radioSuccess: "「天亮了！封鎖線消失了！你成功活著走出結界了！」"
  }
];

/* ==================== 地圖與 GPS 核心系統 ==================== */
function initRealWorldGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  if (navigator.geolocation) {
    document.getElementById('gps-status').innerText = "定位中...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
        setupMap();
        trackGPS();
      },
      () => {
        // 定位被拒絕或超時，以預設座標啟動
        alert("無法取得高精準 GPS，已為你切換為【室內虛擬偵查模式】（可用右下方方向鍵模擬走動）。");
        setupMap();
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else {
    setupMap();
  }
}

function setupMap() {
  document.getElementById('gps-status').innerText = "GPS 鎖定中 (誤差 < 8m)";
  
  // 初始化 Leaflet 地圖
  map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: ''
  }).addTo(map);

  // 繪製玩家目前位置標記（綠光脈衝點）
  const playerIcon = L.divIcon({
    className: 'player-radar-dot',
    html: '<div style="width:16px;height:16px;background:#00ff88;border:2px solid #fff;border-radius:50%;box-shadow:0 0 12px #00ff88;"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
  userMarker = L.marker([userLat, userLng], { icon: playerIcon }).addTo(map);

  // 玩家 15 公尺互動範圍圈
  userCircle = L.circle([userLat, userLng], {
    radius: 15,
    color: '#00ff88',
    fillColor: '#00ff88',
    fillOpacity: 0.1,
    weight: 1
  }).addTo(map);

  // 動態在真實世界周圍佈置 3 個怪談點
  spawnQuests();
  updateGameLoop();
}

function spawnQuests() {
  questPoints = QUESTS.map((q, idx) => {
    const qLat = userLat + q.offset[0];
    const qLng = userLng + q.offset[1];

    // 地圖標記點
    const marker = L.circleMarker([qLat, qLng], {
      radius: 12,
      color: '#ff2222',
      fillColor: '#ff0000',
      fillOpacity: 0.4,
      weight: 2
    }).addTo(map);

    return { ...q, lat: qLat, lng: qLng, marker, solved: false };
  });
}

function trackGPS() {
  navigator.geolocation.watchPosition(
    (pos) => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      updatePlayerPosition();
    },
    null,
    { enableHighAccuracy: true, maximumAge: 2000 }
  );
}

// 模擬走動（供室內測試使用）
function simMove(dLng, dLat) {
  userLat += dLat;
  userLng += dLng;
  updatePlayerPosition();
}

function updatePlayerPosition() {
  if (!userMarker) return;
  const newPos = [userLat, userLng];
  userMarker.setLatLng(newPos);
  userCircle.setLatLng(newPos);
  map.panTo(newPos);
  updateGameLoop();
}

/* ==================== 距離計算與地理圍欄觸發 ==================== */
// Haversine 公尺距離公式
function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2) * Math.sin(dp/2) +
            Math.cos(p1) * Math.cos(p2) *
            Math.sin(dl/2) * Math.sin(dl/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round(R * c);
}

function updateGameLoop() {
  if (currentStage >= questPoints.length) {
    document.getElementById('radio-msg').innerText = "「所有結界皆已破除！恭喜你完成了這趟實境逃脫冒險！」";
    document.getElementById('target-dist').innerText = "【已全數脫困】";
    document.getElementById('interact-btn').disabled = true;
    return;
  }

  const currentQ = questPoints[currentStage];
  const dist = getDistanceMeters(userLat, userLng, currentQ.lat, currentQ.lng);

  document.getElementById('target-dist').innerText = `距【${currentQ.name.split('：')[0]}】: ${dist} 公尺`;

  const btn = document.getElementById('interact-btn');
  if (dist <= 18) {
    // 進入 18 公尺範圍內：解鎖解謎按鈕
    btn.disabled = false;
    btn.innerText = "【已抵達現場】調查物證";
    btn.style.boxShadow = "0 0 10px #ff0000";
  } else {
    btn.disabled = true;
    btn.innerText = `請步行靠近 (差 ${dist}m)`;
    btn.style.boxShadow = "none";
  }
}

/* ==================== 現場搜查與密碼驗證 ==================== */
function openCurrentQuest() {
  const currentQ = questPoints[currentStage];
  sfx.ping();
  document.getElementById('modal-title').innerText = currentQ.name;
  document.getElementById('modal-desc').innerHTML = currentQ.modalDesc;
  document.getElementById('modal-input').value = '';
  document.getElementById('clue-modal').style.display = 'block';
}

function closeQuest() {
  document.getElementById('clue-modal').style.display = 'none';
}

function verifyQuest() {
  const currentQ = questPoints[currentStage];
  const val = document.getElementById('modal-input').value.trim().toUpperCase();

  if (val === currentQ.answer) {
    sfx.unlocked();
    currentQ.solved = true;
    currentQ.marker.setStyle({ color: '#00ff88', fillColor: '#00ff88' });
    closeQuest();
    document.getElementById('radio-msg').innerText = currentQ.radioSuccess;
    currentStage++;
    updateGameLoop();
  } else {
    sfx.ping();
    alert("封印毫無反應……密碼似乎不正確。");
  }
}
</script>
</body>
</html>
