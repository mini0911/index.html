<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>末日便利商店 - Doomsday Outpost</title>
<style>
  :root {
    --bg-color: #0f1416;
    --card-bg: #182024;
    --accent-amber: #e6a13b;
    --accent-green: #48bb78;
    --accent-red: #e53e3e;
    --accent-blue: #4299e1;
    --text-primary: #e2e8f0;
    --text-secondary: #718096;
    --border-color: #2d3748;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-color);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    display: flex;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 頂部看板 */
  header {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .title-group h1 {
    font-size: 1.5rem;
    color: var(--accent-amber);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-badge {
    font-size: 0.85rem;
    background: #2a3739;
    color: #cbd5e0;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .stats-bar {
    display: flex;
    gap: 20px;
    font-size: 1.1rem;
    font-family: var(--font-mono);
  }
  .stat-val { font-weight: bold; color: var(--accent-amber); }

  /* 突發事件廣播條 */
  .news-banner {
    background: #272015;
    border-left: 4px solid var(--accent-amber);
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 0.95rem;
    color: #ecc94b;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* 雙欄排版 */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel h2 {
    font-size: 1.1rem;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
    color: #a0aec0;
    display: flex;
    justify-content: space-between;
  }

  /* 交易表格 */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    padding: 8px 6px;
    text-align: left;
    border-bottom: 1px solid #232d32;
  }
  th { color: var(--text-secondary); font-weight: 500; }
  .price-cell { font-family: var(--font-mono); font-weight: bold; }
  .price-up { color: var(--accent-red); }
  .price-down { color: var(--accent-green); }

  .btn {
    background: #2b3940;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: 0.15s ease;
  }
  .btn:hover:not(:disabled) { background: #3b4d57; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-accent { background: #b7791f; }
  .btn-accent:hover:not(:disabled) { background: #d69e2e; }
  .btn-danger { background: #9b2c2c; }
  .btn-danger:hover:not(:disabled) { background: #c53030; }

  /* 拾荒者卡片 */
  .scav-card {
    background: #11171a;
    border: 1px solid #243036;
    border-radius: 6px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .scav-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .scav-stats {
    display: flex;
    gap: 12px;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  .scav-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* 終端日誌窗口 */
  .console {
    background: #090d0e;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    height: 180px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .log-entry { margin-bottom: 4px; }
  .log-event { color: #f6e05e; }
  .log-success { color: #68d391; }
  .log-danger { color: #fc8181; }

  /* 底部推進按鈕 */
  .action-footer {
    display: flex;
    justify-content: flex-end;
  }
  .btn-large {
    padding: 12px 24px;
    font-size: 1.1rem;
    font-weight: bold;
    background: var(--accent-amber);
    color: #1a202c;
  }
  .btn-large:hover:not(:disabled) { background: #ecc94b; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="title-group">
      <h1>☣️ 末日便利商店</h1>
      <span class="status-badge" id="day-badge">第 1 天 / 黎明</span>
    </div>
    <div class="stats-bar">
      <div>金庫: <span class="stat-val" id="caps-val">300</span> 瓶蓋</div>
      <div>聲望: <span class="stat-val" id="rep-val">50</span></div>
    </div>
  </header>

  <div class="news-banner" id="news-banner">
    📻 無線電廣播：避難所外目前無特別劇烈輻射風暴，周邊市場平穩。
  </div>

  <div class="main-grid">
    <!-- 貨架與市價面板 -->
    <div class="panel">
      <h2>📦 物資交易與庫存</h2>
      <table>
        <thead>
          <tr>
            <th>物品</th>
            <th>市價</th>
            <th>庫存</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="market-tbody"></tbody>
      </table>
    </div>

    <!-- 拾荒隊員面板 -->
    <div class="panel">
      <h2>🎒 拾荒隊員與派遣</h2>
      <div id="scav-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <!-- 終端日誌 -->
  <div class="console" id="console-log">
    <div class="log-entry">🟢 [系統] 終端機連線就緒，便利商店開始營運。點擊「結算營業」推進時間。</div>
  </div>

  <div class="action-footer">
    <button class="btn btn-large" id="end-day-btn" onclick="nextDay()">結算營業，進入下一天 ➔</button>
  </div>
</div>

<script>
let gameState = {
  day: 1,
  caps: 300,
  reputation: 50,
  activeEvent: null,
  eventDays: 0,
  inventory: {
    water: 5,
    food: 5,
    rad_pill: 1,
    ammo_9mm: 10,
    cigarettes: 1
  }
};

const ITEMS = {
  water: { name: "純水", category: "Vital", base: 10 },
  food: { name: "乾糧罐頭", category: "Vital", base: 15 },
  rad_pill: { name: "碘片抗輻藥", category: "Medical", base: 40 },
  ammo_9mm: { name: "9mm子彈", category: "Defense", base: 15 },
  cigarettes: { name: "舊時代香菸", category: "Luxury", base: 120 }
};

const EVENTS = [
  { name: "酸雨風暴", catMulti: { Medical: 2.8, Vital: 1.2 }, duration: 3, desc: "酸雨傾瀉，抗輻射藥物與純水價格大漲！" },
  { name: "淨水器故障", catMulti: { Vital: 3.2 }, duration: 2, desc: "避難所主淨水機損毀，純水成為極度緊缺品！" },
  { name: "暴民襲擊預警", catMulti: { Defense: 2.2, Vital: 1.1 }, duration: 3, desc: "外圍暴民集結，居民瘋狂收購子彈備戰！" },
  { name: "拾荒大篷車抵達", catMulti: { Luxury: 0.6, Defense: 0.8 }, duration: 2, desc: "外來商隊低價傾銷奢侈物資，市價重跌。" },
  { name: "避難所狂歡夜", catMulti: { Luxury: 2.4 }, duration: 2, desc: "避難所發放大節日津貼，香菸等奢侈品需求暴增！" }
];

const ZONES = [
  { id: "supermarket", name: "廢棄超商區", danger: 0.15, minLoot: 80, maxLoot: 160, drops: ["water", "food", "rad_pill"] },
  { id: "scrapyard", name: "市郊廢車場", danger: 0.35, minLoot: 220, maxLoot: 420, drops: ["ammo_9mm", "food", "cigarettes"] },
  { id: "checkpoint", name: "軍事檢查站", danger: 0.55, minLoot: 550, maxLoot: 950, drops: ["ammo_9mm", "rad_pill", "cigarettes"] }
];

let scavengers = [
  { id: 1, name: "老雷 (老兵)", phy: 7, per: 5, grt: 8, wage: 25, status: "閒置", missionZone: null },
  { id: 2, name: "阿雅 (偵察兵)", phy: 4, per: 9, grt: 6, wage: 20, status: "閒置", missionZone: null }
];

let currentPrices = {};

function calcPrices() {
  for (let key in ITEMS) {
    let item = ITEMS[key];
    let mult = 1.0;
    if (gameState.activeEvent && gameState.activeEvent.catMulti[item.category]) {
      mult = gameState.activeEvent.catMulti[item.category];
    }
    let noise = 1 + (Math.random() * 0.16 - 0.08);
    currentPrices[key] = Math.round(item.base * mult * noise);
  }
}

function buyItem(key) {
  let price = currentPrices[key];
  if (gameState.caps >= price) {
    gameState.caps -= price;
    gameState.inventory[key] += 1;
    log(`🛒 購入【${ITEMS[key].name}】，花費 ${price} 瓶蓋。`);
    render();
  }
}

function sellItem(key) {
  let price = currentPrices[key];
  if (gameState.inventory[key] > 0) {
    gameState.caps += price;
    gameState.inventory[key] -= 1;
    log(`💵 售出【${ITEMS[key].name}】，入帳 ${price} 瓶蓋。`, "log-success");
    render();
  }
}

function sendScavenger(scavId, zoneId) {
  let s = scavengers.find(x => x.id === scavId);
  let z = ZONES.find(x => x.id === zoneId);
  if (!s || !z || s.status !== "閒置") return;

  s.status = "外出探索中";
  s.missionZone = z;
  log(`🎒 派遣 ${s.name} 前往【${z.name}】拾荒...`);
  render();
}

function resolveScavengers() {
  scavengers.forEach(s => {
    if (s.status === "外出探索中" && s.missionZone) {
      let z = s.missionZone;
      let gearMitigation = (s.phy * 0.015) + (s.grt * 0.01);
      let risk = Math.max(0.05, z.danger - gearMitigation);
      let roll = Math.random();

      if (roll <= risk) {
        s.status = "殉職";
        log(`☠️ 慘報！${s.name} 在【${z.name}】遭遇致命伏擊，不幸殉職！`, "log-danger");
      } else if (roll <= risk + 0.25) {
        s.status = "負傷修養中";
        let lootVal = Math.round((Math.random() * (z.maxLoot - z.minLoot) + z.minLoot) * 0.5);
        let drop = z.drops[Math.floor(Math.random() * z.drops.length)];
        gameState.inventory[drop] += 1;
        let net = Math.round(lootVal - s.wage - 30);
        gameState.caps += Math.max(0, net);
        log(`⚠️ ${s.name} 身負重傷逃回，帶回【${ITEMS[drop].name}】與估值 ${lootVal}C，扣除工資醫藥費淨得 ${net}C。`, "log-danger");
      } else {
        s.status = "閒置";
        let lootVal = Math.round(Math.random() * (z.maxLoot - z.minLoot) + z.minLoot);
        let drop = z.drops[Math.floor(Math.random() * z.drops.length)];
        gameState.inventory[drop] += 1;
        let net = Math.round(lootVal * 0.8 - s.wage);
        gameState.caps += net;
        log(`🎉 ${s.name} 從【${z.name}】大獲全勝歸來！帶回【${ITEMS[drop].name}】，為便利店淨賺 ${net} 瓶蓋！`, "log-success");
      }
      s.missionZone = null;
    } else if (s.status === "負傷修養中") {
      s.status = "閒置";
      log(`💊 ${s.name} 傷勢康復，已可再次出勤。`);
    }
  });
}

function nextDay() {
  gameState.day += 1;

  if (gameState.eventDays > 0) {
    gameState.eventDays--;
    if (gameState.eventDays === 0) {
      log(`📻 事件【${gameState.activeEvent.name}】結束，市場供需回到基礎水平。`, "log-event");
      gameState.activeEvent = null;
    }
  }

  if (!gameState.activeEvent && Math.random() < 0.35) {
    let ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
    gameState.activeEvent = ev;
    gameState.eventDays = ev.duration;
    log(`🚨 突發廣播：【${ev.name}】持續 ${ev.duration} 天！${ev.desc}`, "log-event");
  }

  calcPrices();
  resolveScavengers();

  // 每日客流自然銷售
  for (let key in gameState.inventory) {
    if (gameState.inventory[key] > 0 && Math.random() < 0.4) {
      gameState.inventory[key] -= 1;
      let income = currentPrices[key];
      gameState.caps += income;
      log(`🏪 常客上門買走了 1 份【${ITEMS[key].name}】，獲利 ${income} 瓶蓋。`);
    }
  }

  render();
}

function log(msg, className = "") {
  let box = document.getElementById("console-log");
  let p = document.createElement("div");
  p.className = `log-entry ${className}`;
  p.innerHTML = `[第${gameState.day}天] ${msg}`;
  box.prepend(p);
}

function render() {
  document.getElementById("day-badge").innerText = `第 ${gameState.day} 天 / 營業中`;
  document.getElementById("caps-val").innerText = gameState.caps;
  document.getElementById("rep-val").innerText = gameState.reputation;

  let banner = document.getElementById("news-banner");
  if (gameState.activeEvent) {
    banner.innerHTML = `🚨 <b>【${gameState.activeEvent.name}】</b> (剩餘 ${gameState.eventDays} 天) - ${gameState.activeEvent.desc}`;
  } else {
    banner.innerHTML = `📻 無線電廣播：避難所外目前無特別劇烈輻射風暴，周邊市場平穩。`;
  }

  let tbody = document.getElementById("market-tbody");
  tbody.innerHTML = "";
  for (let key in ITEMS) {
    let item = ITEMS[key];
    let price = currentPrices[key] || item.base;
    let inv = gameState.inventory[key];
    let diffClass = price > item.base ? "price-up" : (price < item.base ? "price-down" : "");

    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td><b>${item.name}</b><br><small style="color:#718096">${item.category}</small></td>
      <td class="price-cell ${diffClass}">${price} C</td>
      <td>${inv}</td>
      <td>
        <button class="btn btn-accent" onclick="buyItem('${key}')" ${gameState.caps < price ? 'disabled' : ''}>買入</button>
        <button class="btn" onclick="sellItem('${key}')" ${inv <= 0 ? 'disabled' : ''}>賣出</button>
      </td>
    `;
    tbody.appendChild(tr);
  }

  let scavList = document.getElementById("scav-list");
  scavList.innerHTML = "";
  scavengers.forEach(s => {
    let card = document.createElement("div");
    card.className = "scav-card";
    let statusColor = s.status === "閒置" ? "var(--accent-green)" : (s.status === "殉職" ? "var(--accent-red)" : "var(--accent-amber)");

    let actionBtns = "";
    if (s.status === "閒置") {
      actionBtns = ZONES.map(z => 
        `<button class="btn" onclick="sendScavenger(${s.id}, '${z.id}')">派往${z.name} (危險${Math.round(z.danger*100)}%)</button>`
      ).join(" ");
    } else {
      actionBtns = `<span style="font-size:0.85rem; color:#a0aec0;">狀態：${s.status}</span>`;
    }

    card.innerHTML = `
      <div class="scav-header">
        <b>${s.name}</b>
        <span style="color: ${statusColor}; font-size: 0.85rem; font-weight:bold;">[${s.status}]</span>
      </div>
      <div class="scav-stats">
        <span>體魄: ${s.phy}</span>
        <span>感知: ${s.per}</span>
        <span>膽量: ${s.grt}</span>
        <span>日薪: ${s.wage}C</span>
      </div>
      <div class="scav-actions">${actionBtns}</div>
    `;
    scavList.appendChild(card);
  });
}

// 啟動遊戲
calcPrices();
render();
</script>
</body>
</html>
