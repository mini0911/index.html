<!-- Three.js 3D 核心庫 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #000; color: #eee; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #game-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
  #three-canvas { width: 100%; height: 100%; display: block; }

  /* 驚悚老醫院 VHS 暗角與雜訊 */

    background: radial-gradient(circle at 50% 50%, transparent 26%, rgba(2, 6, 4, 0.8) 68%, rgba(0, 0, 0, 0.98) 96%),

  /* 防火鐵門密碼鎖盤 */
  .keypad-box {
    background: #111a14; border: 2px solid #00ff88; border-radius: 8px;
    width: 280px; padding: 22px; display: flex; flex-direction: column; align-items: center;

  /* 開場視窗 */
  #start-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #040806; z-index: 3000; display: flex; flex-direction: column;

  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.8; margin-bottom: 24px; max-width: 440px; }

    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,136,0.5);

      使用鍵盤 <b>W / A / S / D</b> 走動，滑鼠拖曳視角，深入四個病區解開醫院封閉真相！

<script>
/* ==================== 4 大醫院關卡資料庫 ==================== */
const HOSPITAL_STAGES = [
  {
    level: 1,
    title: "區域 1：杏林醫院・門診大廳與候診長廊",
    clueName: "急診室初診紀錄單",
    passcode: "404",
    diary: "『……1991 年 4 月，重症急診室送來了一名沒有身分證明的病患。\n病床號碼被鮮血塗抹，只隱約辨識出號碼：4-0-4。\n輸入 404 解開急診隔離閘門！』"
  },
  {
    level: 2,
    title: "區域 2：放射科・暗房 X 光觀片室",
    clueName: "曝光過度的胸腔透視片",
    passcode: "713",
    diary: "『觀片燈箱閃爍不定……透視片中的肺部夾著一把手術刀。\n底片右下角標註的病歷序號是 7-1-3。\n輸入 7-1-3 解鎖防輻射鉛門！』"
  },
  {
    level: 3,
    title: "區域 3：地下太平間・冷凍冰櫃排",
    clueName: "屍體腳趾掛牌",
    passcode: "909",
    diary: "『冰櫃自行彈開了……掛牌上的字跡歪斜顫抖：\n“冷藏櫃防腐排氣閥緊急代碼為 9-0-9”。\n輸入 909 解除排風閥逃出太平間！』"
  },
  {
    level: 4,
    title: "區域 4：院長辦公室・封存檔案庫",
    clueName: "衛生局停業查封公文",
    passcode: "1993",
    diary: "『真相終於大白……偽造病歷與醫療糾紛爆發。\n杏林醫院於西元 1993 年正式勒令停業並永久封存！\n輸入停業年份 1993 開啟最後逃生鐵捲門！』"
  }
];

let currentStageIdx = 0;
let inventory = [];
let passcodeBuffer = "";

/* ==================== 音效引擎 (含收音機白噪音) ==================== */
class HospitalAudioEngine {
  constructor() {
    this.ctx = null;
    this.noiseNode = null;
    this.noiseGain = null;
    this.isRadioPlaying = false;
  }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }

  step() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(45, this.ctx.currentTime);
    g.gain.setValueAtTime(0.06, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  buzz() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(120, this.ctx.currentTime);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.12);
  }
  bang() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(140, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.6, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.4);
  }
  doorOpen() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(90, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.7);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.7);
  }

  startRadioStatic() {
    if (this.isRadioPlaying || !this.ctx) return;
    this.isRadioPlaying = true;
    const bufferSize = this.ctx.sampleRate * 2;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    this.noiseNode = this.ctx.createBufferSource();
    this.noiseNode.buffer = buffer;
    this.noiseNode.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1200;
    filter.Q.value = 3.0;

    this.noiseGain = this.ctx.createGain();
    this.noiseGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
    this.noiseGain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.5);

    this.noiseNode.connect(filter);
    filter.connect(this.noiseGain);
    this.noiseGain.connect(this.ctx.destination);
    this.noiseNode.start();
  }

  stopRadioStatic() {
    if (!this.isRadioPlaying) return;
    if (this.noiseGain) {
      this.noiseGain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
      setTimeout(() => {
        if (this.noiseNode) { this.noiseNode.stop(); this.noiseNode.disconnect(); }
        this.isRadioPlaying = false;
      }, 400);
    }
  }
}
const sfx = new HospitalAudioEngine();

/* ==================== 院長求救語音合成 (Web Speech API) ==================== */
function speakDirectorVoice(code) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const digits = code.split("").join("……");
  const text = `這裡是院長室……有人聽得見嗎？他們在門外……聽著……緊急逃生代碼是……${digits}……重複一次……代碼是……${digits}……快逃……`;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-TW";
  utter.pitch = 0.5;
  utter.rate = 0.75;
  utter.volume = 1.0;
  window.speechSynthesis.speak(utter);
}

/* ==================== Three.js 3D 空間與第一人稱控制器 ==================== */
let scene, camera, renderer, flashlight;
let ceilingLight1, ceilingLight2;
let hospitalGroup = null, clueObject = null, doorObject = null, radioMesh = null;
let yaw = 0, pitch = 0;
let playerPos = { x: 0, y: 1.8, z: 13 };
let keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
let isInteractingLook = false, lastTouchX = 0, lastTouchY = 0;
let headBob = 0;
let wallColliders = [];
let isNearRadio = false;

function startGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThreeEngine();
  load3DHospitalStage(0);
}

function initThreeEngine() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  // 第一人稱醫用冷光手電筒
  flashlight = new THREE.SpotLight(0xecfff2, 2.6, 24, Math.PI / 4.6, 0.4, 1.2);
  camera.add(flashlight);
  flashlight.position.set(0, 0, 0.2);
  flashlight.target = camera;
  scene.add(camera);

  // 天花板故障長條日光燈
  ceilingLight1 = new THREE.PointLight(0xaaffcc, 0.7, 16);
  ceilingLight1.position.set(0, 5.2, 5);
  scene.add(ceilingLight1);

  ceilingLight2 = new THREE.PointLight(0xaaffcc, 0.7, 16);
  ceilingLight2.position.set(0, 5.2, -6);
  scene.add(ceilingLight2);

  scene.add(new THREE.AmbientLight(0x060e0a));

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

  container.addEventListener('pointerdown', (e) => {
    isInteractingLook = true;
    lastTouchX = e.clientX; lastTouchY = e.clientY;
  });
  window.addEventListener('pointermove', (e) => {
    if (isInteractingLook) {
      const dx = e.clientX - lastTouchX, dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX; lastTouchY = e.clientY;
      yaw -= dx * 0.0035;
      pitch -= dy * 0.0035;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
    }
  });
  window.addEventListener('pointerup', () => { isInteractingLook = false; });
  container.addEventListener('click', checkRaycastInteract);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

/* ==================== ⭐ 核心：真實 3D 醫院建築與醫療物件建模 ==================== */
function load3DHospitalStage(idx) {
  currentStageIdx = idx;
  const stage = HOSPITAL_STAGES[idx];

  document.getElementById('stage-title').innerText = stage.title;
  document.getElementById('radio-instruction').innerText =
    `「進入【${stage.title}】！搜查病房裡的病歷或走近收音機聽取語音，前往盡頭防護門解鎖！」`;

  playerPos = { x: 0, y: 1.8, z: 13 };
  yaw = 0; pitch = 0;
  isNearRadio = false;

  if (hospitalGroup) scene.remove(hospitalGroup);
  hospitalGroup = new THREE.Group();
  wallColliders = [];

  // 1. 經典老醫院下綠上白防污牆面 (寬 32m, 深 32m, 高 6m)
  const outerWall = new THREE.Mesh(
    new THREE.BoxGeometry(32, 6, 32),
    new THREE.MeshStandardMaterial({ color: 0x142019, roughness: 0.9, side: THREE.BackSide })
  );
  outerWall.position.y = 3;
  hospitalGroup.add(outerWall);

  // 2. 潮濕綠白磨石子地磚
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(32, 32),
    new THREE.MeshStandardMaterial({ color: 0x0c1611, roughness: 0.85 })
  );
  floor.rotation.x = -Math.PI / 2;
  hospitalGroup.add(floor);

  // 3. 天花板水泥橫樑與通風金屬風管
  buildCeilingVentilation();

  // 4. 醫院走廊隔間牆 (帶有房門開口)
  build3DHospitalWalls();

  // 5. 3D 醫院病床 (Gurney Bed)
  buildHospitalBed(-6.5, 3.5, 0);
  buildHospitalBed(6.5, -4.5, Math.PI / 6);

  // 6. 3D 不銹鋼點滴架 (IV Drip Stands)
  buildIVStand(-5.2, 4.2);
  buildIVStand(5.5, -3.2);

  // 7. 3D 候診排椅 (Waiting Benches)
  build3DWaitingBenches(2.5, 10.5);

function buildWallSegment(x, z, width, depth) {

  // 兩側金屬護欄

// 3D 醫療推車上的木紋收音機
function build3DRadioCart(x, z) {
  const cartGroup = new THREE.Group();

/* ==================== 走動與碰撞檢測 ==================== */
function updateMovement() {
  const moveSpeed = 0.11;
  let moveX = 0, moveZ = 0;

  if (keys.KeyW) moveZ -= 1;
  if (keys.KeyS) moveZ += 1;
  if (keys.KeyA) moveX -= 1;
  if (keys.KeyD) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const len = Math.hypot(moveX, moveZ);
    moveX = (moveX / len) * moveSpeed;
    moveZ = (moveZ / len) * moveSpeed;

    const sinYaw = Math.sin(yaw);
    const cosYaw = Math.cos(yaw);

    const nextX = playerPos.x + (moveX * cosYaw + moveZ * sinYaw);
    const nextZ = playerPos.z + (-moveX * sinYaw + moveZ * cosYaw);

    let canMoveX = true, canMoveZ = true;
    for (let box of wallColliders) {
      if (nextX >= box.minX && nextX <= box.maxX && playerPos.z >= box.minZ && playerPos.z <= box.maxZ) canMoveX = false;
      if (playerPos.x >= box.minX && playerPos.x <= box.maxX && nextZ >= box.minZ && nextZ <= box.maxZ) canMoveZ = false;
    }

    if (nextX < -15 || nextX > 15) canMoveX = false;
    if (nextZ < -15 || nextZ > 15) canMoveZ = false;

    if (canMoveX) playerPos.x = nextX;
    if (canMoveZ) playerPos.z = nextZ;

    headBob += 0.18;
    camera.position.y = playerPos.y + Math.sin(headBob) * 0.05;

    if (Math.sin(headBob) < -0.95 && !updateMovement.stepped) {
      sfx.step();
      updateMovement.stepped = true;
    } else if (Math.sin(headBob) > 0) {
      updateMovement.stepped = false;
    }
  }

  camera.position.x = playerPos.x;
  camera.position.z = playerPos.z;

  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);

  checkHospitalEvents();
}

/* ==================== 收音機距離監聽 ==================== */
function checkHospitalEvents() {
  if (radioMesh) {
    const distRadio = Math.hypot(radioMesh.position.x - playerPos.x, radioMesh.position.z - playerPos.z);
    if (distRadio < 4.5 && !isNearRadio) {
      isNearRadio = true;
      sfx.startRadioStatic();
      speakDirectorVoice(HOSPITAL_STAGES[currentStageIdx].passcode);
      document.getElementById('radio-instruction').innerText =
        "「耳邊傳來收音機的雜訊與微弱通話聲……仔細聆聽院長留下的逃生代碼！」";
    } else if (distRadio >= 5.5 && isNearRadio) {
      isNearRadio = false;
      sfx.stopRadioStatic();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
  }
}

/* ==================== 天花板日光燈短路爆閃 ==================== */
let flickerTimer = 0;
function updateLightsFlicker() {
  flickerTimer++;
  if (flickerTimer % 45 === 0 && Math.random() > 0.45) {
    sfx.buzz();
    ceilingLight1.intensity = 0.05;
    ceilingLight2.intensity = 0.05;
    setTimeout(() => {
      ceilingLight1.intensity = 1.3;
      ceilingLight2.intensity = 1.3;
      setTimeout(() => {
        ceilingLight1.intensity = 0.7;
        ceilingLight2.intensity = 0.7;
      }, 70);
    }, 60);
  }
}

/* ==================== 準心射線交互 ==================== */
function checkRaycastInteract() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length > 0) {
    let hitObj = hits[0].object;
    while (hitObj.parent && !hitObj.userData.type) hitObj = hitObj.parent;

    const dist = camera.position.distanceTo(hits[0].point);
    if (dist <= 4.8) {
      if (hitObj.userData.type === "clue") {
        openClueDialog(hitObj.userData.data);
      } else if (hitObj.userData.type === "door") {
        openKeypadDialog();
      }
    }
  }
}

function updateInteractHint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);
  const cross = document.getElementById('crosshair');
  const hint = document.getElementById('interact-hint');

  if (hits.length > 0 && hits[0].distance <= 4.8) {
    cross.classList.add('interactable');
    hint.style.display = 'block';
  } else {
    cross.classList.remove('interactable');
    hint.style.display = 'none';
  }
}

/* ==================== 彈窗機制 ==================== */
function openClueDialog(data) {
  sfx.bang();
  document.getElementById('clue-title').innerText = `【${data.clueName}】`;
  document.getElementById('clue-body').innerText = data.diary;
  document.getElementById('clue-modal').style.display = 'flex';

  if (!inventory.includes(data.clueName)) {
    inventory.push(data.clueName);
    document.getElementById('inv-display').innerText = `道具包: ${inventory.join(', ')}`;
  }
}
function closeClueModal() { document.getElementById('clue-modal').style.display = 'none'; }

function openKeypadDialog() {
  sfx.buzz();
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('keypad-modal').style.display = 'flex';
}
function closeKeypad() { document.getElementById('keypad-modal').style.display = 'none'; }

function pressKey(n) {
  sfx.buzz();
  if (passcodeBuffer.length < 4) {
    passcodeBuffer += n;
    document.getElementById('keypad-code').innerText = passcodeBuffer.padEnd(4, '-');
  }
}
function clearKeypad() { sfx.buzz(); passcodeBuffer = ""; document.getElementById('keypad-code').innerText = "----"; }

function submitPasscode() {
  const currentStage = HOSPITAL_STAGES[currentStageIdx];
  if (passcodeBuffer === currentStage.passcode) {
    sfx.doorOpen();
    closeKeypad();
    alert(`🎉【閘門開啟！】防護鐵門在刺耳金屬摩擦聲中升起！成功突破【${currentStage.title}】！`);

    if (currentStageIdx + 1 < HOSPITAL_STAGES.length) {
      load3DHospitalStage(currentStageIdx + 1);
    } else {
      alert("🏆【杏林生還者！】你已成功穿梭整座杏林綜合醫院，解開全部 4 道病區封鎖，重見天日！");
    }
  } else {
    alert("【密碼錯誤！】門禁系統紅燈蜂鳴！請核對病歷或收音機中的數字代碼！");
    clearKeypad();
  }
}

/* ==================== 主動畫循環 ==================== */
function animate() {
  requestAnimationFrame(animate);

  updateMovement();
  updateInteractHint();
  updateLightsFlicker();

  if (clueObject) clueObject.rotation.y += 0.02;

  if (radioMesh) {
    const led = radioMesh.getObjectByName("radioLed");
    if (led) {
      led.material.color.setRGB(isNearRadio ? 1 : 0.2 + Math.sin(Date.now() * 0.005) * 0.2, 0, 0);
    }
  }

  renderer.render(scene, camera);
}
