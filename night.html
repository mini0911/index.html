<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>今天也要平安下班！校安問答手遊版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: #ffedd5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: #fef3c7;
      border: 4px solid #fbbf24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
    }
    canvas {
      display: block;
      width: 100%;
      height: 52%;
      background: #fef3c7;
    }

    /* 頂部狀態列 */
    #top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 170px;
    }
    .bar-container {
      background: #fef08a;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      height: 20px;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
      border-radius: 10px;
    }
    #san-bar { background: #f87171; }
    #sta-bar { background: #4ade80; }
    .bar-label {
      position: absolute;
      top: 0;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      line-height: 18px;
      color: #78350f;
    }
    #clock-box {
      background: #ffffff;
      border: 3px solid #fb923c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 16px;
      font-weight: 900;
      color: #ea580c;
      text-align: center;
      box-shadow: 0 2px 0 #fdba74;
    }

    /* 對話視窗 */
    #dialog-box {
      position: absolute;
      bottom: 125px;
      left: 10px;
      right: 10px;
      background: #ffffff;
      border: 4px solid #f97316;
      border-radius: 16px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 0 #fed7aa;
      z-index: 10;
      max-height: 38%;
      overflow-y: auto;
    }
    #dialog-title {
      font-size: 12px;
      font-weight: 900;
      color: #ea580c;
      background: #ffedd5;
      padding: 2px 8px;
      border-radius: 8px;
      align-self: flex-start;
    }
    #dialog-text {
      font-size: 14px;
      font-weight: bold;
      color: #1e293b;
      line-height: 1.35;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .option-btn {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      color: #78350f;
      cursor: pointer;
      text-align: left;
    }
    .option-btn:active {
      background: #fde047;
      transform: scale(0.98);
    }

    /* 手機虛擬控制面板 */
    #touch-controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 15px);
      left: 0;
      right: 0;
      height: 95px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 8;
    }
    .d-pad {
      display: flex;
      gap: 14px;
    }
    .ctrl-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #fed7aa;
      border: 3px solid #ea580c;
