<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜密室】360° 實景驚悚逃脫</title>

<!-- Three.js 3D 全景核心 (保證 100% 滿版秒出圖、支援真實 360° 自由環顧與陀螺儀) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #000; color: #eee; overflow: hidden; font-family: monospace; }

  #game-container {
    position: relative; width: 100%; height: 100%; overflow: hidden; cursor: grab;
  }
  #game-container:active { cursor: grabbing; }

  #webgl-canvas { width: 100%; height: 100%; display: block; }

  /* 頂部 HUD (半透明懸浮) */
  .hud-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 50px;
    background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; z-index: 100; pointer-events: auto;
  }
  .stage-badge {
    color: #ff4444; font-size: 13px; font-weight: bold; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: #ff2222; border-radius: 50%;
    box-shadow: 0 0 8px #ff0000; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  .hud-actions { display: flex; gap: 8px; align-items: center; }

  .btn-hud {
    background: rgba(22, 27, 34, 0.8); border: 1px solid #444; color: #58a6ff;
    padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
    transition: 0.2s;
  }
  .btn-hud.active {
    background: #003311; border-color: #00ff66; color: #00ff66;
    box-shadow: 0 0 10px rgba(0,255,102,0.4);
  }

  /* 道具欄 HUD */
  .inventory-bar {
    background: rgba(13, 17, 23, 0.85); border: 1px solid #30363d;
    padding: 3px 8px; border-radius: 4px; font-size: 11px; color: #e3b341;
  }

  /* 準心 */
  .center-crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 32px; height: 32px; border: 2px dashed rgba(255, 60, 60, 0.6);
    border-radius: 50%; pointer-events: none; z-index: 50;
  }

  /* 恐怖 VHS 掃描線與暗角 (夜視模式時套用) */
  #night-vision-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 30, 0, 0.4) 80%, rgba(0, 10, 0, 0.95) 100%),
                linear-gradient(rgba(0, 255, 0, 0) 50%, rgba(0, 255, 0, 0.1) 50%);
    background-size: 100% 100%, 100% 4px;
    filter: invert(88%) hue-rotate(180deg) contrast(140%) brightness(75%);
    pointer-events: none; z-index: 40; display: none;
  }

  /* 底部對講機任務提示 (懸浮條) */
  .bottom-radio {
    position: absolute; bottom: 16px; left: 16px; right: 16px;
    background: rgba(13, 17, 23, 0.92); border: 1px solid #30363d;
    border-left: 4px solid #ff4444; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  .radio-text { font-size: 12px; color: #c9d1d9; line-height: 1.4; max-width: 75%; }
  .btn-check-door {
    background: #b62324; border: 1px solid #ff4444; color: #fff;
    padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 4px;
    cursor: pointer; transition: 0.2s;
  }
  .btn-check-door:hover { background: #d72627; }

  /* ==================== 彈窗 1：線索特寫視窗 ==================== */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); z-index: 2000;
    display: none; justify-content: center; align-items: center; padding: 20px;
  }
  .clue-paper {
    background: #ebdcc0; color: #231a11; width: 100%; max-width: 360px;
    border-radius: 4px; padding: 24px 20px; box-shadow: 0 0 30px rgba(255,200,100,0.3);
    border: 2px solid #bba377; position: relative; font-family: serif;
    animation: popIn 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .clue-title { font-size: 16px; font-weight: bold; color: #7a1515; border-bottom: 1px dashed #7a664d; padding-bottom: 6px; margin-bottom: 12px; }
  .clue-body { font-size: 13px; line-height: 1.7; margin-bottom: 20px; white-space: pre-line; }
  .btn-close { width: 100%; background: #7a1515; color: #fff; border: none; padding: 10px 0; font-size: 13px; font-weight: bold; border-radius: 3px; cursor: pointer; }

  /* ==================== 彈窗 2：密碼撥盤解鎖器 (Keypad) ==================== */
  .keypad-box {
    background: #161b22; border: 2px solid #ff4444; border-radius: 8px;
    width: 280px; padding: 20px; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 0 35px rgba(255, 0, 0, 0.4); animation: popIn 0.2s ease;
  }
  .keypad-display {
    width: 100%; height: 44px; background: #000; border: 1px solid #30363d;
    border-radius: 4px; color: #ff3333; font-size: 24px; font-family: monospace;
    display: flex; justify-content: center; align-items: center; letter-spacing: 8px;
    margin-bottom: 16px;
  }
  .keypad-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 16px;
  }
  .num-btn {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 12px 0; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }
  .num-btn:active { background: #ff4444; color: #fff; }
  .keypad-actions { display: flex; width: 100%; gap: 8px; }
  .btn-keypad-action {
    flex: 1; padding: 8px 0; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer;
  }

  /* 開場視窗 */
  #start-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #050508; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #start-modal h1 { color: #ff4444; font-size: 24px; margin-bottom: 14px; letter-spacing: 2px; }
  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.7; margin-bottom: 24px; max-width: 380px; }
  .btn-start {
    background: #b62324; border: none; color: #fff; padding: 12px 32px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.4);
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- 頂部 HUD -->
  <div class="hud-top">
    <div class="stage-badge">
      <div class="pulse-dot"></div>
      <span id="stage-title">關卡 1：辛亥隧道口・午夜引渡</span>
    </div>
    <div class="hud-actions">
      <div class="inventory-bar" id="inv-display">道具: 無</div>
      <button class="btn-hud" id="nvg-btn" onclick="toggleNightVision()">🌙 夜視鏡</button>
    </div>
  </div>

  <!-- Three.js 滿版畫布容器 -->
  <div id="canvas-wrapper" style="width: 100%; height: 100%;"></div>

  <!-- 準心與夜視濾鏡層 -->
  <div class="center-crosshair"></div>
  <div id="night-vision-layer"></div>

  <!-- 底部任務對講機條 -->
  <div class="bottom-radio">
    <div class="radio-text" id="radio-instruction">
      「你被困在隧道的結界中……轉身環顧四周，低頭尋找遺留在地上的密碼線索！」
    </div>
    <button class="btn-check-door" onclick="openKeypad()">🚪 解開通道鎖</button>
  </div>

  <!-- 線索特寫視窗 -->
  <div class="modal-overlay" id="clue-modal">
    <div class="clue-paper">
      <div class="clue-title" id="clue-title">調查檔案</div>
      <div class="clue-body" id="clue-content">檔案載入中...</div>
      <button class="btn-close" onclick="closeClueModal()">收起線索</button>
    </div>
  </div>

  <!-- 密碼鎖撥盤 (Keypad) -->
  <div class="modal-overlay" id="keypad-modal">
    <div class="keypad-box">
      <div style="color: #ff5555; font-size: 12px; margin-bottom: 8px;">結界電子鎖盤</div>
      <div class="keypad-display" id="keypad-code">----</div>
      <div class="keypad-grid">
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn" onclick="clearKeypad()">C</button>
        <button class="num-btn" onclick="pressKey('0')">0</button>
        <button class="num-btn" onclick="submitPasscode()" style="background:#8b1111; color:#fff;">✓</button>
      </div>
      <div class="keypad-actions">
        <button class="btn-keypad-action" style="background:#30363d; color:#c9d1d9;" onclick="closeKeypad()">放棄離開</button>
      </div>
    </div>
  </div>

  <!-- 開場全螢幕授權視窗 -->
  <div id="start-modal">
    <h1>靜安怪談：滿版 360° 實景密室</h1>
    <p>
      <b>純粹實景 × 4 大驚悚密室章節：</b><br>
      已移除地圖，畫面全螢幕滿版！<br>
      滑動或持手機轉身 360°，搜查隱藏在暗角地面上的鑰匙、遺書與線索，輸入密碼解鎖逃出生天！
    </p>
    <button class="btn-start" onclick="startGame()">踏入現場</button>
  </div>
</div>

<script>
/* ==================== 4 大密室驚悚主題關卡配置 ==================== */
const STAGES = [
  {
    title: "關卡 1：辛亥隧道口・午夜引渡",
    panorama: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Equirectangular_projection_SW.jpg/1920px-Equirectangular_projection_SW.jpg",
    passcode: "404",
    radio: "「此處是辛亥隧道出口。結界已封死……轉身看身後地面，有一張散落的遇害者便條！」",
    item: {
      type: "note",
      name: "泥濘的車票便條",
      posX: 40, posY: -140, posZ: -240,
      title: "【浸滿泥水的便條】",
      text: "『……祂們在天花板上爬行。\n隧道口的警示燈閃爍著 4-0-4。\n輸入 404 解開鐵捲門，千萬別回頭！』"
    }
  },
  {
    title: "關卡 2：廢棄醫院急診室・紅水滴落",
    panorama: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Barn_Grand_Teton_Equirectangular.jpg/1920px-Barn_Grand_Teton_Equirectangular.jpg",
    passcode: "911",
    radio: "「空氣中瀰漫著消毒水和鐵鏽味。牆角有生鏽的手術剪，找找看醫護留下的門禁代碼！」",
    item: {
      type: "key",
      name: "生鏽手術剪",
      posX: -180, posY: -130, posZ: -160,
      title: "【沾血的手術托盤】",
      text: "托盤底部刻著一行抓痕：『救護車呼叫代碼是 9-1-1，門禁鎖密碼即是呼叫代碼……』"
    }
  },
  {
    title: "關卡 3：外雙溪鄭成功廟後山・無頭陰兵",
    panorama: "https://pannellum.org/images/bma-0.jpg",
    passcode: "777",
    radio: "「濃霧升起了……遠處樹林傳來踏步聲。在石階旁尋找道長留下的鎮煞黃符！」",
    item: {
      type: "note",
      name: "褪色鎮煞符",
      posX: 120, posY: -110, posZ: 220,
      title: "【硃砂褪色的符紙】",
      text: "『天地玄宗，三陽開泰，以三吉數 7-7-7 破除山煞！』"
    }
  },
  {
    title: "關卡 4：終焉停屍間・最後的鎖櫃",
    panorama: "https://pannellum.org/images/jfk.jpg",
    passcode: "2026",
    radio: "「最後一扇逃生門就在眼前！低頭搜查地面冰櫃號碼牌，輸入逃生門年份密碼！」",
    item: {
      type: "key",
      name: "停屍間主通行卡",
      posX: -30, posY: -150, posZ: 260,
      title: "【遺落的識別證】",
      text: "工作證正面寫著：『停業封存年份：2026 年。門鎖密碼為封存年份。』"
    }
  }
];

let currentStageIdx = 0;
let inventory = [];
let currentPasscodeAttempt = "";
let isNightVision = false;

/* ==================== 音效引擎 ==================== */
class HorrorAudio {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  click() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(600, this.ctx.currentTime);
    g.gain.setValueAtTime(0.15, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  doorOpen() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(100, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.6);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.6);
  }
  error() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(130, this.ctx.currentTime);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.3);
  }
}
const sfx = new HorrorAudio();

/* ==================== Three.js 滿版 360 實景視圖 ==================== */
let scene, camera, renderer, sphereMesh, clueSprite;
let lon = 0, lat = 0, phi = 0, theta = 0;
let isInteracting = false, downX = 0, downY = 0, downLon = 0, downLat = 0, moveDist = 0;
let raycaster, mouse;

function startGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThree360();
  loadStage(0);

  // 陀螺儀支援
  window.addEventListener('deviceorientation', (e) => {
    if (e.alpha !== null && !isInteracting) {
      lon = 360 - e.alpha;
      lat = Math.max(-80, Math.min(80, e.beta - 90));
    }
  });
}

function initThree360() {
  const container = document.getElementById('canvas-wrapper');
  scene = new THREE.Scene();
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
  camera.target = new THREE.Vector3(0, 0, 0);

  // 360 實景大球體
  const geom = new THREE.SphereGeometry(500, 60, 40);
  geom.scale(-1, 1, 1);
  sphereMesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial());
  scene.add(sphereMesh);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // 觸控與滑鼠拖曳
  container.addEventListener('pointerdown', (e) => {
    isInteracting = true;
    downX = e.clientX; downY = e.clientY;
    downLon = lon; downLat = lat;
    moveDist = 0;
  });
  document.addEventListener('pointermove', (e) => {
    if (isInteracting) {
      const dx = e.clientX - downX, dy = e.clientY - downY;
      moveDist += Math.hypot(dx, dy);
      lon = (downX - e.clientX) * 0.15 + downLon;
      lat = (e.clientY - downY) * 0.15 + downLat;
    }
  });
  document.addEventListener('pointerup', (e) => {
    isInteracting = false;
    // 點擊距離小於 5px 視為點擊調查物品
    if (moveDist < 6) {
      checkSpriteClick(e);
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

// 載入關卡全景與物品
function loadStage(idx) {
  currentStageIdx = idx;
  const stage = STAGES[idx];

  document.getElementById('stage-title').innerText = stage.title;
  document.getElementById('radio-instruction').innerText = stage.radio;

  // 切換 360 實景球體材質
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');
  loader.load(stage.panorama, (tex) => {
    sphereMesh.material.map = tex;
    sphereMesh.material.needsUpdate = true;
  });

  // 移除上一關物品
  if (clueSprite) scene.remove(clueSprite);

  // 建立本關散落在地面的發光線索物品
  const canvasTex = createItemTexture(stage.item.type);
  const mat = new THREE.SpriteMaterial({ map: canvasTex, transparent: true });
  clueSprite = new THREE.Sprite(mat);
  clueSprite.scale.set(40, 48, 1);
  clueSprite.position.set(stage.item.posX, stage.item.posY, stage.item.posZ);
  clueSprite.userData = stage.item;
  scene.add(clueSprite);
}

// 繪製發光物品材質
function createItemTexture(type) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 160;
  const ctx = c.getContext('2d');
  // 發光金黃光暈
  const grad = ctx.createRadialGradient(64, 80, 10, 64, 80, 60);
  grad.addColorStop(0, 'rgba(255, 230, 120, 0.95)');
  grad.addColorStop(0.7, 'rgba(255, 100, 0, 0.6)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 160);

  // 繪製紙條或鑰匙
  ctx.fillStyle = type === "note" ? "#fff3d1" : "#d4af37";
  ctx.fillRect(28, 40, 72, 80);
  ctx.strokeStyle = "#800000"; ctx.lineWidth = 3;
  ctx.strokeRect(28, 40, 72, 80);

  return new THREE.CanvasTexture(c);
}

// 物品點擊判定
function checkSpriteClick(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(clueSprite);

  if (hits.length > 0) {
    const data = hits[0].object.userData;
    openClue(data);
  }
}

function openClue(data) {
  sfx.click();
  document.getElementById('clue-title').innerText = data.title;
  document.getElementById('clue-content').innerText = data.text;
  document.getElementById('clue-modal').style.display = 'flex';

  if (!inventory.includes(data.name)) {
    inventory.push(data.name);
    document.getElementById('inv-display').innerText = `道具: ${inventory.join(', ')}`;
  }
}

function closeClueModal() {
  document.getElementById('clue-modal').style.display = 'none';
}

/* ==================== 密碼鎖與通關判定 ==================== */
function openKeypad() {
  sfx.click();
  currentPasscodeAttempt = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('keypad-modal').style.display = 'flex';
}
function closeKeypad() {
  document.getElementById('keypad-modal').style.display = 'none';
}
function pressKey(num) {
  sfx.click();
  if (currentPasscodeAttempt.length < 4) {
    currentPasscodeAttempt += num;
    document.getElementById('keypad-code').innerText = currentPasscodeAttempt.padEnd(4, '-');
  }
}
function clearKeypad() {
  sfx.click();
  currentPasscodeAttempt = "";
  document.getElementById('keypad-code').innerText = "----";
}
function submitPasscode() {
  const currentStage = STAGES[currentStageIdx];
  if (currentPasscodeAttempt === currentStage.passcode) {
    sfx.doorOpen();
    closeKeypad();
    alert(`【通道解鎖成功！】結界開啟！你已逃離【${currentStage.title}】！`);

    // 前進至下一關
    if (currentStageIdx + 1 < STAGES.length) {
      loadStage(currentStageIdx + 1);
    } else {
      alert("🎉【大逃殺生還！】你已成功解開全部 4 大密室結界，安全重返人間！");
    }
  } else {
    sfx.error();
    alert("【密碼錯誤！】警報響起，身邊的陰氣更加濃烈了！請重新檢視地上線索！");
    clearKeypad();
  }
}

// 🌙 夜視鏡開關
function toggleNightVision() {
  isNightVision = !isNightVision;
  const nvgLayer = document.getElementById('night-vision-layer');
  const btn = document.getElementById('nvg-btn');
  nvgLayer.style.display = isNightVision ? 'block' : 'none';
  btn.classList.toggle('active', isNightVision);
  sfx.click();
}

function animate() {
  requestAnimationFrame(animate);

  lat = Math.max(-85, Math.min(85, lat));
  phi = THREE.MathUtils.degToRad(90 - lat);
  theta = THREE.MathUtils.degToRad(lon);

  camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
  camera.target.y = 500 * Math.cos(phi);
  camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);
  camera.lookAt(camera.target);

  // 物品金光微幅呼吸
  if (clueSprite) {
    const pulse = 1.0 + Math.sin(Date.now() * 0.005) * 0.1;
    clueSprite.scale.set(40 * pulse, 48 * pulse, 1);
  }

  renderer.render(scene, camera);
}
</script>
