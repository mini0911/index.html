<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>今天也要平安下班！校安問答手遊版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: #ffedd5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: #fef3c7;
      border: 4px solid #fbbf24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
    }
    canvas {
      display: block;
      width: 100%;
      height: 52%;
      background: #fffbeb;
    }

    #top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 160px;
    }
    .bar-container {
      background: #fef08a;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      height: 20px;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
      border-radius: 10px;
    }
    #san-bar { background: #f87171; }
    #sta-bar { background: #4ade80; }
    .bar-label {
      position: absolute;
      top: 0;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      line-height: 18px;
      color: #78350f;
    }
    .top-right-group {
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    #sound-toggle {
      background: #fff;
      border: 2px solid #f97316;
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 #fdba74;
    }
    #clock-box {
      background: #ffffff;
      border: 3px solid #fb923c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 16px;
      font-weight: 900;
      color: #ea580c;
      text-align: center;
      box-shadow: 0 2px 0 #fdba74;
    }

    #dialog-box {
      position: absolute;
      bottom: 125px;
      left: 10px;
      right: 10px;
      background: #ffffff;
      border: 4px solid #f97316;
      border-radius: 20px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 6px 0 #fed7aa;
      z-index: 10;
      max-height: 42%;
      overflow-y: auto;
    }
    #dialog-title {
      font-size: 12px;
      font-weight: 900;
      color: #ea580c;
      background: #ffedd5;
      padding: 3px 10px;
      border-radius: 10px;
      align-self: flex-start;
    }
    #dialog-text {
      font-size: 14px;
      font-weight: bold;
      color: #1e293b;
      line-height: 1.4;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .option-btn {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #78350f;
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
    }
    .option-btn:active {
      background: #fde047;
      transform: scale(0.98);
    }

    #touch-controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 15px);
      left: 0;
      right: 0;
      height: 95px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 8;
    }
    .d-pad {
      display: flex;
      gap: 14px;
    }
    .ctrl-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #fed7aa;
      border: 3px solid #ea580c;
      box-shadow: 0 4px 0 #c2410c;
      font-size: 24px;
      font-weight: 900;
      color: #7c2d12;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c2410c;
      background: #fdba74;
    }
    #action-btn {
      width: 75px;
      height: 75px;
      background: #f97316;
      border: 3px solid #7c2d12;
      box-shadow: 0 4px 0 #7c2d12;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
    }
    #action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7c2d12;
      background: #ea580c;
    }

    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(254, 243, 199, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    #modal h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ea580c;
    }
    #modal p {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #7c2d12;
      line-height: 1.6;
    }
    .cute-btn {
      padding: 12px 30px;
      font-size: 17px;
      font-weight: 900;
      background: #f97316;
      color: #ffffff;
      border: 3px solid #7c2d12;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #7c2d12;
    }
  </style>
</head>
<body>

  <div id="mobile-frame">
    <div id="top-bar">
      <div class="status-group">
        <div class="bar-container">
          <div id="san-bar" class="bar-fill"></div>
          <span class="bar-label">❤️ 理智 (SAN)</span>
        </div>
        <div class="bar-container">
          <div id="sta-bar" class="bar-fill"></div>
          <span class="bar-label">👟 耐力 (STA)</span>
        </div>
      </div>
      <div class="top-right-group">
        <button id="sound-toggle" onclick="toggleAudio()">🔊</button>
        <div id="clock-box">
          <span style="font-size: 9px; color: #f97316; display: block;">目標 17:00</span>
          <span id="time-display">16:30</span>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas" width="400" height="420"></canvas>

    <div id="dialog-box">
      <div id="dialog-title">💬 學生來請教你了！</div>
      <div id="dialog-text">問題內容</div>
      <div class="options-list" id="options-container"></div>
    </div>

    <div id="touch-controls">
      <div class="d-pad">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
      </div>
      <button class="ctrl-btn" id="action-btn">💬 對話</button>
    </div>

    <div id="modal">
      <h1 id="modal-title">校安生存戰 🎒</h1>
      <p id="modal-desc">
        你是學務處最親切的校安老師！<br>
        在 17:00 前利用下方按鈕巡視校園，<br>
        點擊【對話】傾聽同學們的現代校園煩惱，<br>
        憑著愛心與專業守住理智，平安下班！
      </p>
      <button class="cute-btn" id="start-btn" onclick="startGame()">開始值勤 ⏰</button>
    </div>
  </div>

  <script>
    /* 音訊引擎 */
    let audioCtx = null;
    let bgmInterval = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudio() {
      initAudio();
      isMuted = !isMuted;
      document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🔊';
      if (isMuted) stopBGM();
      else if (isPlaying) startBGM();
    }

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (!audioCtx || isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    function playCorrectSound() {
      initAudio();
      if (isMuted) return;
      playTone(523.25, 'triangle', 0.1, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.12, 0.15), 80);
      setTimeout(() => playTone(783.99, 'triangle', 0.2, 0.2), 160);
    }

    function playWrongSound() {
      initAudio();
      if (isMuted) return;
      playTone(260, 'sawtooth', 0.15, 0.12);
      setTimeout(() => playTone(180, 'sawtooth', 0.25, 0.15), 100);
    }

    function playPopSound() {
      initAudio();
      if (isMuted) return;
      playTone(440, 'sine', 0.08, 0.1);
    }

    const melody = [
      { f: 392.00, d: 200 },
      { f: 440.00, d: 200 },
      { f: 523.25, d: 350 },
      { f: 440.00, d: 200 },
      { f: 523.25, d: 200 },
      { f: 587.33, d: 400 },
      { f: 523.25, d: 200 },
      { f: 392.00, d: 400 },
    ];
    let melodyIndex = 0;

    function startBGM() {
      if (bgmInterval || isMuted) return;
      melodyIndex = 0;
      bgmInterval = setInterval(() => {
        if (!isPlaying || isMuted) return;
        const note = melody[melodyIndex];
        playTone(note.f, 'sine', note.d / 1000, 0.04);
        melodyIndex = (melodyIndex + 1) % melody.length;
      }, 300);
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function triggerHaptic(type) {
      if (!('vibrate' in navigator)) return;
      if (type === 'success') navigator.vibrate([40, 60, 50]);
      else if (type === 'warning') navigator.vibrate(180);
      else if (type === 'click') navigator.vibrate(20);
    }

    /* 遊戲核心 */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const sanBar = document.getElementById('san-bar');
    const staBar = document.getElementById('sta-bar');
    const timeDisplay = document.getElementById('time-display');
    const dialogBox = document.getElementById('dialog-box');
    const dialogText = document.getElementById('dialog-text');
    const optionsContainer = document.getElementById('options-container');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let gameTime = 16.5 * 60;
    const targetTime = 17.0 * 60;
    const timeScale = 0.55;

    const player = {
      x: 80,
      y: 270,
      speed: 3.5,
      san: 100,
      maxSan: 100,
      sta: 100,
      maxSta: 100,
      facing: 'right',
      walkFrame: 0
    };

    let students = [];
    let activeStudent = null;
    let feedbackText = "";
    let feedbackTimer = 0;

    let moveLeft = false;
    let moveRight = false;

    /* 現代校園生活題庫（已移除後方分數顯示） */
    const questionBank = [
      {
        text: "老師！有人把我的醜照發在匿名 Threads 和 IG 告白粉專，底下好多人在笑我...",
        options: [
          { text: "截圖存證！我陪你找輔導老師與生輔組，發函要求平台撤下並啟動關懷。", san: 12, sta: -5 },
          { text: "先不要看手機了，網路留言過幾天大家就忘了，別想太多。", san: -15, sta: 0 },
          { text: "叫你朋友一起去貼文底下留言罵回去，看誰比較大聲！", san: -25, sta: 0 }
        ]
      },
      {
        text: "老師，二樓男廁裡面有很濃的水果甜味，好像有人在偷抽電子煙...",
        options: [
          { text: "收到！謝謝你反映，我馬上帶生輔組老師過去巡查，並保密你的身分。", san: 10, sta: -10 },
          { text: "你現在帶我進去抓，直接指給我看是誰！", san: -15, sta: -5 },
          { text: "那種東西很貴他們抽不起啦，應該只是芳香劑吧？", san: -20, sta: 0 }
        ]
      },
      {
        text: "老師，我偷訂的外送到了，可是門口警衛杯杯把外送員擋在外面，我的奶茶要被沒收了...",
        options: [
          { text: "校規規定外送需集中在專區，我先幫你領回暫管，放學再來學務處拿。", san: 8, sta: -10 },
          { text: "警衛做得對！你現在去罰站，外送當場銷毀倒掉！", san: -15, sta: 0 },
          { text: "趁警衛不注意，你繞去側門圍牆偷偷接過來啦。", san: -25, sta: 0 }
        ]
      },
      {
        text: "老師，網路上有網友說要給我免費手遊造型，要我傳學生證跟手機驗證碼給他...",
        options: [
          { text: "千萬不要傳！這是典型的詐騙套路，立刻封鎖對方，有問題找老師！", san: 15, sta: 0 },
          { text: "天下沒有白吃的午餐，但先給他看看，真的有拿到造型再說？", san: -20, sta: 0 },
          { text: "你都幾歲了還玩這種遊戲，手機先交出來保管！", san: -15, sta: 0 }
        ]
      },
      {
        text: "老師，隔壁班阿凱放學想借我的機車去載人，但他根本沒有駕照，不借他就要堵我...",
        options: [
          { text: "絕對不能借！無照駕駛非常危險，我放學親自找阿凱跟他的導師會談。", san: 10, sta: -10 },
          { text: "你就跟他說車子沒油了，自己想辦法推託掉。", san: -10, sta: 0 },
          { text: "他敢騎你就借啊，被警察抓到罰單算他的又不是你的。", san: -30, sta: 0 }
        ]
      },
      {
        text: "老師，我交友軟體認識的『哥哥』說放學要開車在側門載我去夜景餐廳，我有點害怕...",
        options: [
          { text: "別去！未成年私下見網友風險極高，我陪你聯絡家長，放學一起走。", san: 15, sta: -10 },
          { text: "既然害怕，那就約在人多的麥當勞見面比較安全吧？", san: -15, sta: 0 },
          { text: "人家請吃飯幹嘛不去？大驚小怪的。", san: -25, sta: 0 }
        ]
      },
      {
        text: "老師！我的 AirPods 掉在操場草叢，定位顯示還在那裡，快放學了我好急！",
        options: [
          { text: "別慌，我們拿手電筒去定位點找找，順便廣播失物招領。", san: 8, sta: -15 },
          { text: "操場那麼大找不到了啦，回家叫爸媽再買一副新的。", san: -15, sta: 0 },
          { text: "肯定是剛才體育課被別班撿走了，直接報警調閱全校監視器！", san: -10, sta: -10 }
        ]
      },
      {
        text: "老師，下一節要考數學，我胃好痛手都在發抖，好想翻牆翹課回家...",
        options: [
          { text: "深呼吸，翻牆很危險！我先帶你去健康中心休息，我來跟導師溝通。", san: 12, sta: -10 },
          { text: "考個試而已裝什麼病？回去教室坐好，不會寫就用猜的！", san: -20, sta: 0 },
          { text: "想翹課自己動作俐落點，別被我看到就不算違規。", san: -30, sta: 0 }
        ]
      }
    ];

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const actionBtn = document.getElementById('action-btn');

    const bindTouch = (elem, onPress, onRelease) => {
      elem.addEventListener('touchstart', (e) => { e.preventDefault(); triggerHaptic('click'); onPress(); });
      elem.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
      elem.addEventListener('mousedown', () => { triggerHaptic('click'); onPress(); });
      elem.addEventListener('mouseup', onRelease);
    };

    bindTouch(btnLeft, () => { moveLeft = true; player.facing = 'left'; }, () => { moveLeft = false; });
    bindTouch(btnRight, () => { moveRight = true; player.facing = 'right'; }, () => { moveRight = false; });

    actionBtn.addEventListener('click', () => {
      if (activeStudent && dialogBox.style.display === 'none') {
        playPopSound();
        triggerHaptic('click');
        openQuestion();
      }
    });

    function spawnStudent() {
      if (!isPlaying || students.length >= 2) return;
      students.push({
        x: 180 + Math.random() * 140,
        y: 285,
        hasQuestion: true,
        type: Math.floor(Math.random() * 2),
        bounce: Math.random() * Math.PI
      });
    }

    function openQuestion() {
      if (!activeStudent) return;
      const currentQuestion = questionBank[Math.floor(Math.random() * questionBank.length)];
      dialogText.innerText = currentQuestion.text;
      optionsContainer.innerHTML = '';

      currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt.text}`;
        btn.onclick = () => answerQuestion(opt);
        optionsContainer.appendChild(btn);
      });

      dialogBox.style.display = 'flex';
    }

    function answerQuestion(opt) {
      player.san = Math.max(0, Math.min(player.maxSan, player.san + opt.san));
      player.sta = Math.max(0, Math.min(player.maxSta, player.sta + opt.sta));

      if (opt.san >= 0) {
        playCorrectSound();
        triggerHaptic('success');
        feedbackText = "處置得宜，守護了學生！ ❤️";
      } else {
        playWrongSound();
        triggerHaptic('warning');
        feedbackText = "處置不當，理智下降... 💦";
      }

      feedbackTimer = 75;
      dialogBox.style.display = 'none';

      if (activeStudent) {
        activeStudent.hasQuestion = false;
        setTimeout(() => {
          students = students.filter(s => s !== activeStudent);
          activeStudent = null;
        }, 800);
      }

      if (player.san <= 0) {
        gameOver(false);
      }
    }

    function startGame() {
      initAudio();
      startBGM();
      modal.style.display = 'none';
      isPlaying = true;
      gameTime = 16.5 * 60;
      player.san = 100;
      player.sta = 100;
      player.x = 80;
      students = [];
      activeStudent = null;
      dialogBox.style.display = 'none';
      feedbackText = "";
      spawnStudent();
    }

    function gameOver(win) {
      isPlaying = false;
      stopBGM();
      modal.style.display = 'flex';
      dialogBox.style.display = 'none';

      if (win) {
        playCorrectSound();
        triggerHaptic('success');
        modalTitle.innerText = "🎉 順利平安下班！";
        modalTitle.style.color = "#10b981";
        modalDesc.innerHTML = "17:00 打卡鐘響起！ ⏰<br>你用滿滿的愛與專業解答了孩子們的煩惱！<br>守住了理智值，今天又是平安的一天！";
        startBtn.innerText = "明天再戰";
      } else {
        playWrongSound();
        triggerHaptic('warning');
        modalTitle.innerText = "💦 理智斷線加班中...";
        modalTitle.style.color = "#ef4444";
        modalDesc.innerHTML = "SAN 值歸零了！ 🥺<br>面對連環突發狀況與求助，精神徹底被榨乾，<br>今天只好多留下來喝杯奶茶寫檢討報告了。";
        startBtn.innerText = "重新振作";
      }
    }

    let spawnTimer = 0;

    function update() {
      if (!isPlaying) return;

      gameTime += (1 / 60) * timeScale;
      let hours = Math.floor(gameTime / 60);
      let minutes = Math.floor(gameTime % 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

      if (gameTime >= targetTime) {
        gameOver(true);
        return;
      }

      let isMoving = false;
      if (dialogBox.style.display === 'none') {
        if (moveLeft) { player.x -= player.speed; isMoving = true; }
        if (moveRight) { player.x += player.speed; isMoving = true; }
      }

      if (isMoving) player.walkFrame += 0.2;
      else player.walkFrame = 0;

      player.x = Math.max(30, Math.min(canvas.width - 70, player.x));

      activeStudent = null;
      students.forEach(st => {
        let dist = Math.abs((player.x + 25) - (st.x + 20));
        if (dist < 55 && st.hasQuestion) {
          activeStudent = st;
        }
      });

      if (activeStudent && dialogBox.style.display === 'none') {
        actionBtn.style.background = "#fbbf24";
        actionBtn.style.color = "#7c2d12";
      } else {
        actionBtn.style.background = "#f97316";
        actionBtn.style.color = "#ffffff";
      }

      spawnTimer++;
      if (spawnTimer > 280) {
        spawnStudent();
        spawnTimer = 0;
      }

      sanBar.style.width = `${(player.san / player.maxSan) * 100}%`;
      staBar.style.width = `${(player.sta / player.maxSta) * 100}%`;

      if (feedbackTimer > 0) feedbackTimer--;
    }

    /* 可愛角色繪製函式 */
    function drawCuteEye(x, y, radius, lookDir = 0) {
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#2c1810';
      ctx.beginPath();
      ctx.arc(x + lookDir, y, radius * 0.75, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x + lookDir - 1.5, y - 1.5, radius * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + lookDir + 1.5, y + 1.5, radius * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCuteTeacher(x, y, facing, walkFrame) {
      ctx.save();
      ctx.translate(x, y);

      let bobY = Math.sin(walkFrame) * 3;
      let dir = facing === 'right' ? 1 : -1;

      ctx.fillStyle = 'rgba(120, 53, 15, 0.15)';
      ctx.beginPath();
      ctx.ellipse(25, 75, 20, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      let legOffset = Math.sin(walkFrame) * 5;
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.ellipse(18 + legOffset, 72, 5, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(32 - legOffset, 72, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(10, 36 + bobY, 30, 32, 12);
      ctx.fill();
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.roundRect(11, 40 + bobY, 28, 22, 6);
      ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.fillRect(11, 48 + bobY, 28, 4);

      ctx.fillStyle = '#d97706';
      ctx.fillRect(dir > 0 ? 32 : 6, 46 + bobY, 8, 12);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(dir > 0 ? 33 : 7, 47 + bobY, 6, 10);

      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(25, 22 + bobY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(25, 14 + bobY, 20, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(18, 12 + bobY, 8, 0, Math.PI);
      ctx.arc(30, 12 + bobY, 9, 0, Math.PI);
      ctx.fill();

      ctx.fillStyle = '#1e3a8a';
      ctx.beginPath();
      ctx.ellipse(25, 5 + bobY, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(25, 4 + bobY, 2.5, 0, Math.PI * 2);
      ctx.fill();

      let lookOffset = dir * 1.5;
      drawCuteEye(19, 21 + bobY, 4, lookOffset);
      drawCuteEye(31, 21 + bobY, 4, lookOffset);

      ctx.fillStyle = 'rgba(251, 113, 133, 0.5)';
      ctx.beginPath();
      ctx.arc(14, 26 + bobY, 3.5, 0, Math.PI * 2);
      ctx.arc(36, 26 + bobY, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(25, 25 + bobY, 3, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawCuteStudent(st) {
      ctx.save();
      ctx.translate(st.x, st.y);

      st.bounce += 0.05;
      let bob = Math.sin(st.bounce) * 2.5;

      ctx.fillStyle = 'rgba(120, 53, 15, 0.15)';
      ctx.beginPath();
      ctx.ellipse(20, 68, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.ellipse(14, 65, 4, 3, 0, 0, Math.PI * 2);
      ctx.ellipse(26, 65, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      if (st.type === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(9, 32 + bob, 22, 18, 5);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.moveTo(8, 48 + bob);
        ctx.lineTo(32, 48 + bob);
        ctx.lineTo(34, 58 + bob);
        ctx.lineTo(6, 58 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(20, 38 + bob, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(9, 32 + bob, 22, 18, 5);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#854d0e';
        ctx.fillRect(10, 48 + bob, 20, 10);
        ctx.strokeRect(10, 48 + bob, 20, 10);
      }

      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(20, 20 + bob, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      if (st.type === 0) {
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.arc(20, 14 + bob, 17, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(15, 12 + bob, 6, 0, Math.PI);
        ctx.arc(25, 12 + bob, 6, 0, Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(1, 18 + bob, 6, 0, Math.PI * 2);
        ctx.arc(39, 18 + bob, 6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#374151';
        ctx.beginPath();
        ctx.arc(20, 14 + bob, 17, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(20, 2 + bob);
        ctx.quadraticCurveTo(24, -8 + bob, 28, -2 + bob);
        ctx.stroke();
      }

      drawCuteEye(15, 20 + bob, 3.5, 0);
      drawCuteEye(25, 20 + bob, 3.5, 0);

      ctx.fillStyle = 'rgba(254, 202, 202, 0.7)';
      ctx.beginPath();
      ctx.arc(11, 24 + bob, 3, 0, Math.PI * 2);
      ctx.arc(29, 24 + bob, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(20, 26 + bob, 2, 0, Math.PI * 2);
      ctx.fill();

      if (st.hasQuestion) {
        let qBob = Math.sin(st.bounce * 1.5) * 4;
        ctx.font = 'bold 22px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
        ctx.fillText("❓", 10, -5 + qBob);
      }

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(0, 340, canvas.width, canvas.height - 340);
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 340);
      ctx.lineTo(canvas.width, 340);
      ctx.stroke();

      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.roundRect(240, 45, 120, 75, 10);
      ctx.fill();
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(270, 75, 12, 0, Math.PI * 2);
      ctx.arc(285, 70, 15, 0, Math.PI * 2);
      ctx.arc(300, 75, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.roundRect(30, 70, 140, 85, 10);
      ctx.fill();
      ctx.strokeStyle = '#c2410c';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#fef08a';
      ctx.fillRect(45, 85, 30, 35);
      ctx.fillStyle = '#fbcfe8';
      ctx.fillRect(90, 95, 40, 30);

      ctx.fillStyle = '#7c2d12';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText("平安下班", 245, 145);
      ctx.font = '12px sans-serif';
      ctx.fillText("溫馨校園 守護成長 💕", 225, 165);

      students.forEach(st => drawCuteStudent(st));
      drawCuteTeacher(player.x, player.y, player.facing, player.walkFrame);

      if (activeStudent && dialogBox.style.display === 'none') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(player.x - 15, player.y - 35, 80, 24, 8);
        ctx.fill();
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText("點擊 [對話] 💬", player.x - 9, player.y - 19);
      }

      if (feedbackTimer > 0) {
        ctx.fillStyle = feedbackText.includes("守護") ? '#059669' : '#dc2626';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(feedbackText, player.x - 35, player.y - 50);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
