<style>

    diary: "『真相終於大白……偽造病歷與不法人體試驗被揭發。\n杏林醫院於西元 1993 年正式勒令停業並永久封存！\n輸入停業年份 1993 開啟最後逃生鐵捲門！』"
  }

let currentStageIdx = 0;
let inventory = [];
let passcodeBuffer = "";

/* ==================== 音效引擎 ==================== */
class HospitalAudioEngine {
  constructor() {
    this.ctx = null;
    this.noiseNode = null;
    this.noiseGain = null;
    this.isRadioPlaying = false;
  }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }

  step() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(45, this.ctx.currentTime);
    g.gain.setValueAtTime(0.06, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  heartbeatFlatline() { // ICU 心電圖心跳停止長鳴
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(880, this.ctx.currentTime);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 1.2);
  }
  drip() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(950, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.12, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.25);
  }
  buzz() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(120, this.ctx.currentTime);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.12);
  }
  bang() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(140, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.6, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.4);
  }
  wheelSqueak() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(750, this.ctx.currentTime);
    o.frequency.linearRampToValueAtTime(1300, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.5);
  }
  doorOpen() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(90, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.7);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.7);
  }

  startRadioStatic() {
    if (this.isRadioPlaying || !this.ctx) return;
    this.isRadioPlaying = true;
    const bufferSize = this.ctx.sampleRate * 2;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    this.noiseNode = this.ctx.createBufferSource();
    this.noiseNode.buffer = buffer;
    this.noiseNode.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1200;
    filter.Q.value = 3.0;

    this.noiseGain = this.ctx.createGain();
    this.noiseGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
    this.noiseGain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.5);

    this.noiseNode.connect(filter);
    filter.connect(this.noiseGain);
    this.noiseGain.connect(this.ctx.destination);
    this.noiseNode.start();
  }

  stopRadioStatic() {
    if (!this.isRadioPlaying) return;
    if (this.noiseGain) {
      this.noiseGain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
      setTimeout(() => {
        if (this.noiseNode) { this.noiseNode.stop(); this.noiseNode.disconnect(); }
        this.isRadioPlaying = false;
      }, 400);
    }
  }
}
const sfx = new HospitalAudioEngine();

function speakDirectorVoice(code) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const digits = code.split("").join("……");
  const text = `這裡是院長室……有人聽得見嗎？他們在門外……聽著……緊急逃生代碼是……${digits}……重複一次……代碼是……${digits}……快逃……`;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-TW";
  utter.pitch = 0.5;
  utter.rate = 0.75;
  utter.volume = 1.0;
  window.speechSynthesis.speak(utter);
}

/* ==================== 5 大病區專屬貼圖生成器 ==================== */
function createWallTextureForStage(colors) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // 上半部牆壁
  ctx.fillStyle = colors.top;
  ctx.fillRect(0, 0, 512, 340);

  // 下半部防污踢腳帶
  ctx.fillStyle = colors.bottom;
  ctx.fillRect(0, 340, 512, 172);

  ctx.fillStyle = "#0a140d";
  ctx.fillRect(0, 335, 512, 6);

  // 霉斑水痕
  for (let i = 0; i < 4000; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    ctx.fillStyle = "rgba(10, 20, 15, 0.12)";
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 1);
  return tex;
}

function createFloorTextureForStage(colors) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  const tileSize = 64;
  for (let y = 0; y < 512; y += tileSize) {
    for (let x = 0; x < 512; x += tileSize) {
      ctx.fillStyle = ((x + y) / tileSize) % 2 === 0 ? colors.floorA : colors.floorB;
      ctx.fillRect(x, y, tileSize, tileSize);
      ctx.strokeStyle = "rgba(0, 0, 0, 0.7)";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, tileSize, tileSize);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  return tex;
}

/* ==================== Three.js 3D 渲染與光影系統 ==================== */
let scene, camera, renderer, flashlight;
let ceilingLight1, ceilingLight2;
let hospitalGroup = null, clueObject = null, doorObject = null, radioMesh = null;
let wheelchairMesh = null, morgueDrawerMesh = null;
let dustParticles = null, waterDripMesh = null;

let yaw = 0, pitch = 0;
let playerPos = { x: 0, y: 1.8, z: 18 }; // 超大場景起點
let keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
let isInteractingLook = false, lastTouchX = 0, lastTouchY = 0;
let headBob = 0;
let wallColliders = [];

let stageScareTriggered = false;
let isNearRadio = false;

function startGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThreeEngine();
  loadLargeHospitalStage(0);
}

function initThreeEngine() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 120);
  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  // 手電筒聚光燈 (物理柔和陰影)
  flashlight = new THREE.SpotLight(0xecfff2, 3.2, 30, Math.PI / 4.4, 0.45, 1.2);
  flashlight.castShadow = true;
  flashlight.shadow.mapSize.width = 1024;
  flashlight.shadow.mapSize.height = 1024;
  flashlight.shadow.bias = -0.001;
  camera.add(flashlight);
  flashlight.position.set(0, 0, 0.2);
  flashlight.target = camera;
  scene.add(camera);

  // 天花板故障長條日光燈
  ceilingLight1 = new THREE.PointLight(0xaaffcc, 0.6, 20);
  ceilingLight1.position.set(0, 5.2, 6);
  scene.add(ceilingLight1);

  ceilingLight2 = new THREE.PointLight(0xaaffcc, 0.6, 20);
  ceilingLight2.position.set(0, 5.2, -8);
  scene.add(ceilingLight2);

  scene.add(new THREE.AmbientLight(0x060e0a));

  buildDustParticles();
  buildWaterDrip();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  container.appendChild(renderer.domElement);

  window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

  container.addEventListener('pointerdown', (e) => {
    isInteractingLook = true;
    lastTouchX = e.clientX; lastTouchY = e.clientY;
  });
  window.addEventListener('pointermove', (e) => {
    if (isInteractingLook) {
      const dx = e.clientX - lastTouchX, dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX; lastTouchY = e.clientY;
      yaw -= dx * 0.0035;
      pitch -= dy * 0.0035;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
    }
  });
  window.addEventListener('pointerup', () => { isInteractingLook = false; });
  container.addEventListener('click', checkRaycastInteract);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

function buildDustParticles() {
  const particleCount = 260;
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount * 3; i += 3) {
    positions[i] = (Math.random() - 0.5) * 36;
    positions[i + 1] = Math.random() * 5.5;
    positions[i + 2] = (Math.random() - 0.5) * 44;
  }
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  dustParticles = new THREE.Points(geom, new THREE.PointsMaterial({
    color: 0xccffdd, size: 0.06, transparent: true, opacity: 0.45
  }));
  scene.add(dustParticles);
}

function buildWaterDrip() {
  waterDripMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0x88ffbb })
  );
  waterDripMesh.position.set(-2, 5.4, 2);
  scene.add(waterDripMesh);
}

/* ==================== ⭐ 核心：載入 5 大專屬結構病區 ==================== */
function loadLargeHospitalStage(idx) {
  currentStageIdx = idx;
  const stage = GIANT_HOSPITAL_STAGES[idx];

  document.getElementById('stage-title').innerText = stage.title;
  document.getElementById('radio-instruction').innerText =
    `「進入【${stage.title}】！探索超大病區，找出隱藏的病歷或線索，解開防護鐵門！」`;

  // 重置玩家起點至超大長廊入口
  playerPos = { x: 0, y: 1.8, z: 18 };
  yaw = 0; pitch = 0;
  stageScareTriggered = false;
  isNearRadio = false;

  if (hospitalGroup) scene.remove(hospitalGroup);
  hospitalGroup = new THREE.Group();
  wallColliders = [];

  const wallTexture = createWallTextureForStage(stage.wallColors);
  const floorTexture = createFloorTextureForStage(stage.wallColors);

  // 1. 超大型外牆結構 (寬 40m, 深 48m, 高 6m)
  const outerWall = new THREE.Mesh(
    new THREE.BoxGeometry(40, 6, 48),
    new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.85, side: THREE.BackSide })
  );
  outerWall.position.y = 3;
  outerWall.receiveShadow = true;
  hospitalGroup.add(outerWall);

  // 2. 超大地板
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 48),
    new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.35, metalness: 0.2 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  hospitalGroup.add(floor);

  // 天花板通風風管
  buildCeilingVentilation();

  // 3. 根據病區主題建立獨特的 3D 結構
  if (stage.theme === "hallway") {
    buildHallwayTheme(wallTexture);
  } else if (stage.theme === "icu") {
    buildICUTheme(wallTexture);
  } else if (stage.theme === "xray") {
    buildXRayTheme(wallTexture);
  } else if (stage.theme === "morgue") {
    buildMorgueTheme(wallTexture);
  } else if (stage.theme === "office") {
    buildOfficeTheme(wallTexture);
  }

  // 4. 重型防火安全鐵門 (位於盡頭：X: 0, Z: -23.8)
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x16221c, metalness: 0.85, roughness: 0.3 });
  doorObject = new THREE.Mesh(new THREE.BoxGeometry(4.2, 5.2, 0.4), doorMat);
  doorObject.position.set(0, 2.6, -23.8);
  doorObject.castShadow = true;
  doorObject.receiveShadow = true;
  doorObject.userData = { type: "door", data: stage };
  hospitalGroup.add(doorObject);

  const lockPlate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.2), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
  lockPlate.position.set(1.5, 0, 0.3);
  doorObject.add(lockPlate);

  scene.add(hospitalGroup);
}

/* ==================== 走動與碰撞檢測 ==================== */
function updateMovement() {
  const moveSpeed = 0.12;
  let moveX = 0, moveZ = 0;

  if (keys.KeyW) moveZ -= 1;
  if (keys.KeyS) moveZ += 1;
  if (keys.KeyA) moveX -= 1;
  if (keys.KeyD) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const len = Math.hypot(moveX, moveZ);
    moveX = (moveX / len) * moveSpeed;
    moveZ = (moveZ / len) * moveSpeed;

    const sinYaw = Math.sin(yaw);
    const cosYaw = Math.cos(yaw);

    const nextX = playerPos.x + (moveX * cosYaw + moveZ * sinYaw);
    const nextZ = playerPos.z + (-moveX * sinYaw + moveZ * cosYaw);

    let canMoveX = true, canMoveZ = true;
    for (let box of wallColliders) {
      if (nextX >= box.minX && nextX <= box.maxX && playerPos.z >= box.minZ && playerPos.z <= box.maxZ) canMoveX = false;
      if (playerPos.x >= box.minX && playerPos.x <= box.maxX && nextZ >= box.minZ && nextZ <= box.maxZ) canMoveZ = false;
    }

    if (nextX < -19 || nextX > 19) canMoveX = false;
    if (nextZ < -23 || nextZ > 23) canMoveZ = false;

    if (canMoveX) playerPos.x = nextX;
    if (canMoveZ) playerPos.z = nextZ;

    headBob += 0.18;
    camera.position.y = playerPos.y + Math.sin(headBob) * 0.05;

    if (Math.sin(headBob) < -0.95 && !updateMovement.stepped) {
      sfx.step();
      updateMovement.stepped = true;
    } else if (Math.sin(headBob) > 0) {
      updateMovement.stepped = false;
    }
  }

  camera.position.x = playerPos.x;
  camera.position.z = playerPos.z;

  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);

  checkHospitalEvents();
}

function checkHospitalEvents() {
  const stage = GIANT_HOSPITAL_STAGES[currentStageIdx];

  // ICU 心跳驟停驚嚇
  if (stage.theme === "icu" && !stageScareTriggered) {
    if (Math.hypot(-9 - playerPos.x, 4 - playerPos.z) < 5.0) {
      stageScareTriggered = true;
      sfx.heartbeatFlatline();
      triggerFlash();
    }
  }

  // 放射科輪椅暴衝
  if (stage.theme === "xray" && !stageScareTriggered && wheelchairMesh) {
    if (Math.hypot(wheelchairMesh.position.x - playerPos.x, wheelchairMesh.position.z - playerPos.z) < 7.5) {
      stageScareTriggered = true;
      sfx.wheelSqueak();
      triggerFlash();
      let frames = 0;
      const timer = setInterval(() => {
        wheelchairMesh.position.z += 0.35;
        wheelchairMesh.rotation.y += 0.08;
        frames++;
        if (frames > 22) clearInterval(timer);
      }, 25);
    }
  }

  // 太平間抽屜暴彈
  if (stage.theme === "morgue" && !stageScareTriggered && morgueDrawerMesh) {
    if (Math.hypot(-12 - playerPos.x, 6 - playerPos.z) < 6.0) {
      stageScareTriggered = true;
      sfx.bang();
      triggerFlash();
      let frames = 0;
      const timer = setInterval(() => {
        morgueDrawerMesh.position.z += 0.25;
        frames++;
        if (frames > 12) clearInterval(timer);
      }, 30);
    }
  }

  // 院長室收音機監聽
  if (stage.theme === "office" && radioMesh) {
    const distRadio = Math.hypot(radioMesh.position.x - playerPos.x, radioMesh.position.z - playerPos.z);
    if (distRadio < 4.5 && !isNearRadio) {
      isNearRadio = true;
      sfx.startRadioStatic();
      speakDirectorVoice(stage.passcode);
      document.getElementById('radio-instruction').innerText =
        "「耳邊傳來收音機的雜訊與微弱通話聲……仔細聆聽院長留下的逃生代碼！」";
    } else if (distRadio >= 5.5 && isNearRadio) {
      isNearRadio = false;
      sfx.stopRadioStatic();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
  }
}

function triggerFlash() {
  const flash = document.getElementById('scare-flash');
  flash.style.display = 'block';
  setTimeout(() => { flash.style.display = 'none'; }, 200);
}

function updateEnvironmentParticles() {
  if (waterDripMesh) {
    waterDripMesh.position.y -= 0.14;
    if (waterDripMesh.position.y <= 0.05) {
      waterDripMesh.position.y = 5.4;
      sfx.drip();
    }
  }

  if (dustParticles) {
    const pos = dustParticles.geometry.attributes.position.array;
    for (let i = 1; i < pos.length; i += 3) {
      pos[i] -= 0.003;
      if (pos[i] < 0) pos[i] = 5.5;
    }
    dustParticles.geometry.attributes.position.needsUpdate = true;
  }
}

let flickerTimer = 0;
function updateLightsFlicker() {
  flickerTimer++;
  if (flickerTimer % 45 === 0 && Math.random() > 0.45) {
    sfx.buzz();
    ceilingLight1.intensity = 0.05;
    ceilingLight2.intensity = 0.05;
    setTimeout(() => {
      ceilingLight1.intensity = 1.3;
      ceilingLight2.intensity = 1.3;
      setTimeout(() => {
        ceilingLight1.intensity = 0.6;
        ceilingLight2.intensity = 0.6;
      }, 70);
    }, 60);
  }
}

/* ==================== 準心交互 ==================== */
function checkRaycastInteract() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length > 0) {
    let hitObj = hits[0].object;
    while (hitObj.parent && !hitObj.userData.type) hitObj = hitObj.parent;

    const dist = camera.position.distanceTo(hits[0].point);
    if (dist <= 4.8) {
      if (hitObj.userData.type === "clue") {
        openClueDialog(hitObj.userData.data);
      } else if (hitObj.userData.type === "door") {
        openKeypadDialog();
      }
    }
  }
}

function updateInteractHint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);
  const cross = document.getElementById('crosshair');
  const hint = document.getElementById('interact-hint');

  if (hits.length > 0 && hits[0].distance <= 4.8) {
    cross.classList.add('interactable');
    hint.style.display = 'block';
  } else {
    cross.classList.remove('interactable');
    hint.style.display = 'none';
  }
}

function openClueDialog(data) {
  sfx.bang();
  document.getElementById('clue-title').innerText = `【${data.clueName}】`;
  document.getElementById('clue-body').innerText = data.diary;
  document.getElementById('clue-modal').style.display = 'flex';

  if (!inventory.includes(data.clueName)) {
    inventory.push(data.clueName);
    document.getElementById('inv-display').innerText = `道具包: ${inventory.join(', ')}`;
  }
}
function closeClueModal() { document.getElementById('clue-modal').style.display = 'none'; }

function openKeypadDialog() {
  sfx.buzz();
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('keypad-modal').style.display = 'flex';
}
function closeKeypad() { document.getElementById('keypad-modal').style.display = 'none'; }

function pressKey(n) {
  sfx.buzz();
  if (passcodeBuffer.length < 4) {
    passcodeBuffer += n;
    document.getElementById('keypad-code').innerText = passcodeBuffer.padEnd(4, '-');
  }
}
function clearKeypad() { sfx.buzz(); passcodeBuffer = ""; document.getElementById('keypad-code').innerText = "----"; }

function submitPasscode() {
  const currentStage = GIANT_HOSPITAL_STAGES[currentStageIdx];
  if (passcodeBuffer === currentStage.passcode) {
    sfx.doorOpen();
    closeKeypad();
    alert(`🎉【閘門開啟！】防護鐵門在刺耳金屬摩擦聲中升起！成功突破【${currentStage.title}】！`);

    if (currentStageIdx + 1 < GIANT_HOSPITAL_STAGES.length) {
      loadLargeHospitalStage(currentStageIdx + 1);
    } else {
      alert("🏆【杏林生還者！】你已成功穿梭整座杏林綜合醫院 5 大病區，逃出生天！");
    }
  } else {
    alert("【密碼錯誤！】門禁系統紅燈蜂鳴！請核對病歷或收音機中的數字代碼！");
    clearKeypad();
  }
}

/* ==================== 主動畫循環 ==================== */
function animate() {
  requestAnimationFrame(animate);

  updateMovement();
  updateInteractHint();
  updateLightsFlicker();
  updateEnvironmentParticles();

  if (clueObject) clueObject.rotation.y += 0.02;

  if (radioMesh) {
    const led = radioMesh.getObjectByName("radioLed");
    if (led) {
      led.material.color.setRGB(isNearRadio ? 1 : 0.2 + Math.sin(Date.now() * 0.005) * 0.2, 0, 0);
    }
  }

  renderer.render(scene, camera);
}
</script>
