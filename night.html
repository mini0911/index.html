<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>今天也要平安下班！校安值勤室</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: #ffedd5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: #fef3c7;
      border: 4px solid #fbbf24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
    }
    canvas {
      display: block;
      width: 100%;
      height: 52%;
      background: #fffbeb;
    }

    /* 頂部數據狀態列 */
    #top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 160px;
    }
    .bar-container {
      background: #fef08a;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      height: 20px;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
      border-radius: 10px;
      background: #f87171;
    }
    .bar-label {
      position: absolute;
      top: 0;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      line-height: 18px;
      color: #78350f;
    }
    .counter-badge {
      font-size: 11px;
      font-weight: 900;
      color: #7c2d12;
      background: #fed7aa;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid #ea580c;
    }
    .top-right-group {
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    #sound-toggle {
      background: #fff;
      border: 2px solid #f97316;
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 #fdba74;
    }
    #clock-box {
      background: #ffffff;
      border: 3px solid #fb923c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 16px;
      font-weight: 900;
      color: #ea580c;
      text-align: center;
      box-shadow: 0 2px 0 #fdba74;
    }

    /* 下半部：學生提問與處置決策區 */
    #decision-panel {
      flex: 1;
      background: #fff;
      border-top: 4px solid #f97316;
      padding: 14px 16px env(safe-area-inset-bottom, 15px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 -4px 15px rgba(249, 115, 22, 0.15);
      overflow-y: auto;
    }
    #question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #student-tag {
      font-size: 12px;
      font-weight: 900;
      color: #ea580c;
      background: #ffedd5;
      padding: 3px 10px;
      border-radius: 10px;
    }
    #question-text {
      font-size: 14px;
      font-weight: bold;
      color: #1e293b;
      line-height: 1.45;
      min-height: 42px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 12px;
    }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-card {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #78350f;
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
      box-shadow: 0 3px 0 #d97706;
      transition: transform 0.1s;
    }
    .option-card:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #d97706;
      background: #fde047;
    }

    /* 彈出視窗（開始/結束） */
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
    }
    .modal-card {
      background: #fffbeb;
      border: 4px solid #f97316;
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 320px;
    }
    .modal-card h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ea580c;
    }
    .modal-card p {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #7c2d12;
      line-height: 1.6;
    }
    .cute-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 900;
      background: #f97316;
      color: #ffffff;
      border: 3px solid #7c2d12;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #7c2d12;
    }
  </style>
</head>
<body>

  <div id="mobile-frame">
    <!-- 頂部數據列 -->
    <div id="top-bar">
      <div class="status-group">
        <div class="bar-container">
          <div id="san-bar" class="bar-fill"></div>
          <span class="bar-label">❤️ 理智 (SAN)</span>
        </div>
        <span class="counter-badge">已排解: <span id="solved-count">0</span> 件</span>
      </div>
      <div class="top-right-group">
        <button id="sound-toggle" onclick="toggleAudio()">🔊</button>
        <div id="clock-box">
          <span style="font-size: 9px; color: #f97316; display: block;">打卡倒數</span>
          <span id="time-display">16:30</span>
        </div>
      </div>
    </div>

    <!-- 辦公室畫面畫布 -->
    <canvas id="gameCanvas" width="400" height="380"></canvas>

    <!-- 下半部決策對話板 -->
    <div id="decision-panel">
      <div id="question-header">
        <span id="student-tag">🎒 學生諮詢中...</span>
        <span style="font-size: 11px; color: #94a3b8; font-weight: bold;">今天也要平安下班</span>
      </div>
      <div id="question-text">同學正在走進辦公室...</div>
      <div class="options-group" id="options-container">
        <!-- 動態打亂生成選項按鈕 -->
      </div>
    </div>

    <!-- 開始/結束彈窗 -->
    <div id="modal">
      <div class="modal-card">
        <h1 id="modal-title">今天也要平安下班！</h1>
        <p id="modal-desc">
          放學前夕，學務處門庭若市！<br>
          學生們帶著五花八門的棘手問題走進來求助。<br>
          善用專業與耐心做出妥善處置，<br>
          保護你的理智值（SAN），撐到 17:00 打卡撤退！
        </p>
        <button class="cute-btn" id="start-btn" onclick="startGame()">坐上值勤桌 📋</button>
      </div>
    </div>
  </div>

  <script>
    // Canvas 圓角 Polyfill
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'undefined') r = 5;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }

    /* Web Audio 音訊與 BGM */
    let audioCtx = null;
    let bgmInterval = null;
    let isMuted = false;

    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { }
    }

    function toggleAudio() {
      initAudio();
      isMuted = !isMuted;
      document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🔊';
      if (isMuted) stopBGM();
      else if (isPlaying) startBGM();
    }

    function playTone(freq, type = 'sine', duration = 0.12, gainVal = 0.1) {
      if (!audioCtx || isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    function playCorrect() {
      playTone(523.25, 'triangle', 0.08, 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.1, 0.15), 60);
      setTimeout(() => playTone(783.99, 'triangle', 0.18, 0.2), 120);
    }

    function playWrong() {
      playTone(220, 'sawtooth', 0.12, 0.18);
      setTimeout(() => playTone(150, 'sawtooth', 0.22, 0.18), 80);
    }

    const melody = [
      { f: 392.00, d: 200 }, { f: 440.00, d: 200 }, { f: 523.25, d: 350 }, { f: 440.00, d: 200 },
      { f: 523.25, d: 200 }, { f: 587.33, d: 400 }, { f: 523.25, d: 200 }, { f: 392.00, d: 400 }
    ];
    let melodyIdx = 0;

    function startBGM() {
      if (bgmInterval || isMuted) return;
      melodyIdx = 0;
      bgmInterval = setInterval(() => {
        if (!isPlaying || isMuted) return;
        const note = melody[melodyIdx];
        playTone(note.f, 'triangle', note.d / 1000, 0.035);
        melodyIdx = (melodyIdx + 1) % melody.length;
      }, 300);
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function triggerHaptic(type) {
      if (!('vibrate' in navigator)) return;
      try {
        if (type === 'success') navigator.vibrate([35, 50, 45]);
        else if (type === 'wrong') navigator.vibrate(180);
        else if (type === 'click') navigator.vibrate(20);
      } catch (e) { }
    }

    /* 遊戲核心變數與題庫 */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const sanBar = document.getElementById('san-bar');
    const solvedCountText = document.getElementById('solved-count');
    const timeDisplay = document.getElementById('time-display');
    const questionText = document.getElementById('question-text');
    const studentTag = document.getElementById('student-tag');
    const optionsContainer = document.getElementById('options-container');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let gameTime = 16.5 * 60; // 16:30 起算
    const targetTime = 17.0 * 60; // 17:00 準時下班
    let san = 100;
    const maxSan = 100;
    let solvedCount = 0;

    // 校安老師狀態
    const teacher = {
      x: 170,
      y: 130,
      blinkTimer: 100,
      emotion: 'normal', // 'normal' | 'happy' | 'sweat'
      emotionTimer: 0
    };

    // 當前在場學生狀態
    let currentStudent = null;
    let feedbackText = "";
    let feedbackTimer = 0;

    // 豐富現代情境題庫
    const questionBank = [
      {
        studentRole: "三年二班 陳同學",
        type: 0,
        text: "老師！有人把我的照片截圖做成 meme 梗圖發在 Threads 告白粉專，底下好多人在笑我...",
        options: [
          { text: "截圖存證！我聯絡生輔組發函要求管理員撤下，並安排輔導關懷。", san: 10 },
          { text: "網路上的留言過兩天大家就忘了，先別看手機好好自習。", san: -15 },
          { text: "叫你朋友一起到貼文留言罵回去，看誰比較站得住腳！", san: -25 }
        ]
      },
      {
        studentRole: "一年四班 林同學",
        type: 1,
        text: "老師，二樓洗手間裡面有很濃的水果甜味，好像有同學躲在裡面偷抽電子煙...",
        options: [
          { text: "收到！謝謝你機警反映，我馬上會同生輔老師去巡查，並保密你的身分。", san: 12 },
          { text: "你現在直接帶我進去，指給我看是哪幾個人！", san: -15 },
          { text: "那個很貴學生買不起啦，應該只是芳香劑的味道。", san: -20 }
        ]
      },
      {
        studentRole: "二年一班 張同學",
        type: 2,
        text: "老師，我偷訂的外送奶茶到了，但警衛杯杯把外送員攔在外面說要全部銷毀...",
        options: [
          { text: "校規規定外送需由外送區統一登記，我先幫你代領保管，放學再來拿。", san: 8 },
          { text: "警衛做得好！你現在去旁邊罰站，外送當場倒掉！", san: -15 },
          { text: "趁警衛沒注意，你繞去體育館圍牆偷翻過去接過來。", san: -25 }
        ]
      },
      {
        studentRole: "三年五班 游同學",
        type: 1,
        text: "老師，網友說要免費送我手遊限定造型，只要我拍學生證跟提供手機驗證碼給他...",
        options: [
          { text: "千萬不能傳！這是典型詐騙話術，立刻封鎖對方，有問題找老師！", san: 15 },
          { text: "天下沒有白吃的午餐，但先給他看看，拿到造型立刻改密碼？", san: -20 },
          { text: "都快高中畢業了還被這種騙，手機先交出來保管！", san: -15 }
        ]
      },
      {
        studentRole: "二年三班 黃同學",
        type: 0,
        text: "老師，放學有隔壁班同學要向我借機車去載女友，但他根本沒駕照，不借他要找人堵我...",
        options: [
          { text: "絕對不能借！無照駕駛危險又違法，放學我找該生導師陪你走出校門。", san: 12 },
          { text: "你就跟他說車子沒油了，自己想辦法推掉就好。", san: -10 },
          { text: "他敢騎你就借啊，被警察抓到開單也是算他的。", san: -30 }
        ]
      },
      {
        studentRole: "一年一班 吳同學",
        type: 2,
        text: "老師，交友軟體認識的『大哥』說放學要開車到側門載我去吃飯，我突然很害怕...",
        options: [
          { text: "千萬別去！未成年私約風險極高，我陪你聯絡家長，放學一起走。", san: 15 },
          { text: "既然會怕，那就改約在人多的超商門口見面就好？", san: -15 },
          { text: "有人請吃大餐幹嘛不去？膽子這麼小。", san: -25 }
        ]
      },
      {
        studentRole: "三年三班 郭同學",
        type: 1,
        text: "老師！剛才體育課搶籃球場，別班帶球棒過來叫囂，雙方現在快打起來了！",
        options: [
          { text: "大家冷靜！我帶哨子與擴音器立刻過去隔開雙方，體育組長隨後就到！", san: 10 },
          { text: "打球有摩擦很正常，讓他們自己講開就好了。", san: -15 },
          { text: "有種去校門口打，別在校園裡丟人現眼！", san: -30 }
        ]
      },
      {
        studentRole: "二年四班 謝同學",
        type: 0,
        text: "老師，我同桌同學剛才把一把彈簧折疊刀藏在鉛筆盒裡，說是買來防身的...",
        options: [
          { text: "謝謝你的反映！為保障安全，我請導師協助請該生到辦公室查證保管。", san: 12 },
          { text: "你回去直接叫他拿出來，問他到底想幹嘛！", san: -20 },
          { text: "他平常滿乖的應該只是切水果，不要大驚小怪。", san: -20 }
        ]
      },
      {
        studentRole: "一年三班 鄭同學",
        type: 2,
        text: "老師，下一節要考段考，我肚子好痛手一直在抖，好想翻牆翹課回家...",
        options: [
          { text: "深呼吸，翻牆太危險！我帶你去健康中心休息，我來向導師說明。", san: 12 },
          { text: "考個試而已裝什麼病？回去教室坐好，不會寫用猜的！", san: -20 },
          { text: "想翹課動作俐落點，別被監視器拍到就好。", san: -30 }
        ]
      },
      {
        studentRole: "三年一班 劉同學",
        type: 1,
        text: "老師，網路前輩找我假日去幫忙拿提款卡領錢，說一天領現五千，能去嗎？",
        options: [
          { text: "那是詐騙集團車手陷阱！會背刑法責任！我立刻通報少年隊宣導輔導。", san: 15 },
          { text: "這麼好賺？你自己小心點，發現警察就快跑。", san: -25 },
          { text: "賺了記得分紅請學務處喝杯飲料就好。", san: -35 }
        ]
      }
    ];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* 學生進退場狀態機器 */
    function spawnNextStudent() {
      if (!isPlaying) return;

      const q = questionBank[Math.floor(Math.random() * questionBank.length)];

      currentStudent = {
        x: 380, // 從右側門外走入
        y: 195,
        targetX: 180, // 走到辦公桌前
        state: 'walking_in', // 'walking_in' | 'talking' | 'walking_out'
        facing: 'left',
        walkFrame: 0,
        type: q.type, // 0: 雙馬尾, 1: 呆毛男生, 2: 班長
        role: q.studentRole,
        question: q,
        mood: null, // 'happy' | 'crying'
        blinkTimer: 80
      };

      studentTag.innerText = `🎒 ${currentStudent.role}`;
      questionText.innerText = "（同學正走向辦公桌前...）";
      optionsContainer.innerHTML = '';
    }

    function showDialogue() {
      if (!currentStudent) return;
      questionText.innerText = currentStudent.question.text;
      optionsContainer.innerHTML = '';

      // 隨機打亂選項
      const shuffled = shuffle(currentStudent.question.options);

      shuffled.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-card';
        btn.innerText = `${idx + 1}. ${opt.text}`;
        btn.onclick = () => selectOption(opt);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(opt) {
      if (!currentStudent || currentStudent.state !== 'talking') return;

      // 處置結果影響理智值
      san = Math.max(0, Math.min(maxSan, san + opt.san));
      sanBar.style.width = `${(san / maxSan) * 100}%`;

      // 每次答題時間推進 3~4 分鐘
      gameTime += 3.5;
      let hours = Math.floor(gameTime / 60);
      let mins = Math.floor(gameTime % 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;

      optionsContainer.innerHTML = '';

      if (opt.san >= 0) {
        playCorrect();
        triggerHaptic('success');
        solvedCount++;
        solvedCountText.innerText = solvedCount;
        currentStudent.mood = 'happy';
        teacher.emotion = 'happy';
        feedbackText = "處置合宜！學生安心道謝！ ❤️";
      } else {
        playWrong();
        triggerHaptic('wrong');
        currentStudent.mood = 'crying';
        teacher.emotion = 'sweat';
        feedbackText = "處置失當...理智遭到耗損！ 💦";
      }

      teacher.emotionTimer = 60;
      feedbackTimer = 65;

      // 學生轉身離開
      currentStudent.state = 'walking_out';
      currentStudent.facing = 'right';

      if (san <= 0) {
        gameOver(false);
      } else if (gameTime >= targetTime) {
        gameOver(true);
      }
    }

    function startGame() {
      initAudio();
      startBGM();
      modal.style.display = 'none';
      isPlaying = true;
      gameTime = 16.5 * 60;
      san = 100;
      sanBar.style.width = '100%';
      solvedCount = 0;
      solvedCountText.innerText = '0';
      feedbackText = "";
      feedbackTimer = 0;

      spawnNextStudent();
    }

    function gameOver(win) {
      isPlaying = false;
      stopBGM();
      modal.style.display = 'flex';
      optionsContainer.innerHTML = '';

      if (win) {
        playCorrect();
        triggerHaptic('success');
        modalTitle.innerText = "🎉 平安下班！(金牌校安)";
        modalTitle.style.color = "#10b981";
        modalDesc.innerHTML = `17:00 打卡鐘響起！ ⏰<br>你成功化解了 <b>${solvedCount} 件</b>校園突發狀況，<br>守護了學生，更守住了最後的理智值！`;
        startBtn.innerText = "明天再戰";
      } else {
        playWrong();
        triggerHaptic('wrong');
        modalTitle.innerText = "💀 理智斷線！被迫加班！";
        modalTitle.style.color = "#ef4444";
        modalDesc.innerHTML = `SAN 值歸零了！ 🥺<br>面對連環突發難題，精神防線徹底崩潰，<br>今天只好多留下來寫檢討報告與加班了。`;
        startBtn.innerText = "重新振作";
      }
    }

    function update() {
      if (!isPlaying) return;

      // 老師眨眼與表情倒數
      teacher.blinkTimer--;
      if (teacher.blinkTimer <= 0) teacher.blinkTimer = 100 + Math.random() * 80;

      if (teacher.emotionTimer > 0) {
        teacher.emotionTimer--;
        if (teacher.emotionTimer <= 0) teacher.emotion = 'normal';
      }

      // 學生動態更新
      if (currentStudent) {
        currentStudent.blinkTimer--;
        if (currentStudent.blinkTimer <= 0) currentStudent.blinkTimer = 90 + Math.random() * 70;

        if (currentStudent.state === 'walking_in') {
          currentStudent.x -= 3.2;
          currentStudent.walkFrame += 0.25;
          if (currentStudent.x <= currentStudent.targetX) {
            currentStudent.x = currentStudent.targetX;
            currentStudent.state = 'talking';
            currentStudent.walkFrame = 0;
            showDialogue();
          }
        } else if (currentStudent.state === 'walking_out') {
          currentStudent.x += 3.5;
          currentStudent.walkFrame += 0.25;
          if (currentStudent.x > 410) {
            currentStudent = null;
            // 稍作停頓迎來下一位
            setTimeout(spawnNextStudent, 400);
          }
        }
      }

      if (feedbackTimer > 0) feedbackTimer--;
    }

    /* ==========================================================
       Q版超萌人物與辦公室繪製
       ========================================================== */

    function drawChibiEye(x, y, radius, isBlinking = false, lookDir = 0) {
      ctx.save();
      if (isBlinking) {
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(x, y + 1, radius * 0.9, 1.1 * Math.PI, 1.9 * Math.PI);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.fillStyle = '#2c1810';
        ctx.beginPath();
        ctx.arc(x + lookDir, y, radius * 0.75, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x + lookDir - 1.8, y - 1.6, radius * 0.38, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTeacher() {
      const isBlink = (teacher.blinkTimer > 0 && teacher.blinkTimer <= 6);

      ctx.save();
      ctx.translate(teacher.x, teacher.y);

      // 身體 (坐姿)
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(14, 38, 32, 28, 8);
      ctx.fill();
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 反光小背心
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.roundRect(16, 42, 28, 18, 5);
      ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.fillRect(16, 48, 28, 3.5);

      // 二頭身大圓頭
      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(30, 22, 23, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      // 頭髮
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(30, 14, 23, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(22, 12, 9, 0, Math.PI);
      ctx.arc(38, 12, 10, 0, Math.PI);
      ctx.fill();

      // 小警帽
      ctx.fillStyle = '#1e3a8a';
      ctx.beginPath();
      ctx.ellipse(30, 3, 18, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(30, 2, 2.8, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛
      drawChibiEye(22, 21, 4.5, isBlink, 0);
      drawChibiEye(38, 21, 4.5, isBlink, 0);

      // 腮紅
      ctx.fillStyle = 'rgba(251, 113, 133, 0.6)';
      ctx.beginPath();
      ctx.arc(16, 26, 4, 0, Math.PI * 2);
      ctx.arc(44, 26, 4, 0, Math.PI * 2);
      ctx.fill();

      // 微笑嘴型
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(30, 26, 3, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      // 表情泡泡特效
      if (teacher.emotion === 'happy') {
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText("💖", 46, 5);
      } else if (teacher.emotion === 'sweat') {
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText("💦", 46, 5);
      }

      ctx.restore();
    }

    function drawStudent(st) {
      ctx.save();
      ctx.translate(st.x, st.y);

      const isBlink = (st.blinkTimer > 0 && st.blinkTimer <= 6);
      let bob = (st.state !== 'talking') ? Math.sin(st.walkFrame) * 3 : 0;
      let dir = st.facing === 'right' ? 1 : -1;

      // 影子
      ctx.fillStyle = 'rgba(120, 53, 15, 0.15)';
      ctx.beginPath();
      ctx.ellipse(20, 72, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 腳步擺動
      let leg = (st.state !== 'talking') ? Math.sin(st.walkFrame) * 4 : 0;
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.ellipse(15 + leg, 69, 4, 3, 0, 0, Math.PI * 2);
      ctx.ellipse(25 - leg, 69, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 背後小書包
      ctx.fillStyle = '#ef4444';
      let bagX = dir > 0 ? 5 : 28;
      ctx.beginPath();
      ctx.roundRect(bagX, 40 + bob, 7, 13, 3);
      ctx.fill();

      // 身體服裝
      if (st.type === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(11, 38 + bob, 18, 14, 4);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.moveTo(9, 52 + bob);
        ctx.lineTo(31, 52 + bob);
        ctx.lineTo(33, 60 + bob);
        ctx.lineTo(7, 60 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(20, 42 + bob, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (st.type === 1) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(11, 38 + bob, 18, 14, 4);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = '#b45309';
        ctx.fillRect(12, 52 + bob, 16, 10);
        ctx.strokeRect(12, 52 + bob, 16, 10);
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.roundRect(11, 38 + bob, 18, 16, 4);
        ctx.fill();
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = '#10b981';
        ctx.fillRect(16, 45 + bob, 8, 10);
      }

      // 二頭身大頭
      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(20, 22 + bob, 19, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 髮型
      if (st.type === 0) {
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.arc(20, 15 + bob, 19, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(14, 13 + bob, 7, 0, Math.PI);
        ctx.arc(26, 13 + bob, 7, 0, Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 19 + bob, 6.5, 0, Math.PI * 2);
        ctx.arc(40, 19 + bob, 6.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (st.type === 1) {
        ctx.fillStyle = '#374151';
        ctx.beginPath();
        ctx.arc(20, 15 + bob, 19, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(20, 3 + bob);
        ctx.quadraticCurveTo(24, -6 + bob, 29, -1 + bob);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(20, 15 + bob, 19, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(8, 11 + bob, 24, 8);
      }

      let eyeDir = dir * 1.5;
      drawChibiEye(15, 23 + bob, 4, isBlink, eyeDir);
      drawChibiEye(26, 23 + bob, 4, isBlink, eyeDir);

      if (st.type === 2 && !isBlink) {
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(15, 23 + bob, 4.8, 0, Math.PI * 2);
        ctx.arc(26, 23 + bob, 4.8, 0, Math.PI * 2);
        ctx.moveTo(19.8, 23 + bob);
        ctx.lineTo(21.2, 23 + bob);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(254, 202, 202, 0.75)';
      ctx.beginPath();
      ctx.arc(10, 28 + bob, 3.5, 0, Math.PI * 2);
      ctx.arc(30, 28 + bob, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // 離開時的心情泡泡
      if (st.mood === 'happy') {
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText("💖", 10, -5 + bob);
      } else if (st.mood === 'crying') {
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText("😭", 10, -5 + bob);
      }

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 學務處背景
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 木質地板
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(0, 250, canvas.width, canvas.height - 250);
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 250);
      ctx.lineTo(canvas.width, 250);
      ctx.stroke();

      // 右側學務處進出大門
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(340, 110, 50, 140);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      ctx.strokeRect(340, 110, 50, 140);
      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText("大門", 352, 135);

      // 窗戶
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.roundRect(140, 45, 120, 65, 10);
      ctx.fill();
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 窗外小雲朵
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(170, 75, 10, 0, Math.PI * 2);
      ctx.arc(182, 70, 13, 0, Math.PI * 2);
      ctx.arc(195, 75, 10, 0, Math.PI * 2);
      ctx.fill();

      // 牆上海報
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.roundRect(20, 60, 95, 75, 8);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText("平安下班", 35, 90);
      ctx.font = '10px sans-serif';
      ctx.fillText("安全第一", 42, 110);

      // 繪製坐著的校安老師
      drawTeacher();

      // 繪製前方的學務處辦公桌
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.roundRect(130, 195, 140, 55, 8);
      ctx.fill();
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 桌上的公文夾與大茶杯
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(145, 202, 22, 14);
      ctx.fillStyle = '#38bdf8'; // 馬克杯
      ctx.fillRect(235, 204, 12, 16);

      // 繪製來訪學生
      if (currentStudent) {
        drawStudent(currentStudent);
      }

      // 飄字回饋
      if (feedbackTimer > 0) {
        ctx.fillStyle = feedbackText.includes("合宜") ? '#059669' : '#dc2626';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(feedbackText, 90, 40);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
