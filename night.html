<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】PokéGO 禁地標誌・密室逃脫版</title>

<!-- Three.js 3D 核心庫 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #050608; color: #eee; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #game-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* 3D 遊戲世界畫布 */
  #three-canvas { width: 100%; height: 100%; display: block; }

  /* 暗角與雜訊掃描線 */
  .horror-vignette {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(15, 0, 0, 0.5) 75%, rgba(0, 0, 0, 0.95) 100%),
                repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0, 20, 10, 0.12) 3px, rgba(0,0,0,0) 4px);
    pointer-events: none; z-index: 10;
  }

  /* 頂部 HUD */
  .poke-hud-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 60px;
    background: linear-gradient(180deg, rgba(5,6,8,0.95) 0%, transparent 100%);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; z-index: 100;
  }
  .player-card { display: flex; align-items: center; gap: 10px; }
  .player-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #1a0808;
    border: 2px solid #ff4444; display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 10px rgba(255, 68, 68, 0.5); font-size: 18px;
  }
  .player-info { display: flex; flex-direction: column; gap: 2px; }
  .player-level { font-size: 13px; font-weight: bold; color: #ff5555; letter-spacing: 0.5px; }
  .hp-bar-outer {
    width: 110px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #444;
  }
  .hp-bar-inner { width: 70%; height: 100%; background: linear-gradient(90deg, #ff2222, #00ff88); transition: width 0.3s; }

  .status-badges { display: flex; gap: 8px; align-items: center; }
  .badge {
    background: rgba(22, 27, 34, 0.85); border: 1px solid #30363d;
    padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #8b949e;
  }
  .badge.steps { color: #00ff88; border-color: #008844; }

  /* 底部對講機與控制列 */
  .poke-bottom-bar {
    position: absolute; bottom: 18px; left: 16px; right: 16px;
    background: rgba(13, 17, 23, 0.92); border: 1px solid #30363d;
    border-left: 4px solid #ff4444; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  .radio-text { font-size: 12px; color: #c9d1d9; line-height: 1.4; max-width: 68%; }
  .btn-enter-landmark {
    background: #b62324; border: 1px solid #ff4444; color: #fff;
    padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 4px;
    cursor: pointer; transition: 0.2s; box-shadow: 0 0 12px rgba(255, 68, 68, 0.4);
  }
  .btn-enter-landmark:disabled {
    background: #21262d; border-color: #444; color: #666; cursor: not-allowed; box-shadow: none;
  }

  /* 虛擬走動十字搖桿 (右側懸浮) */
  .joystick-zone {
    position: absolute; bottom: 84px; right: 16px; z-index: 150;
    display: grid; grid-template-columns: repeat(3, 38px); gap: 4px;
  }
  .joy-btn {
    width: 38px; height: 38px; background: rgba(18, 22, 28, 0.85);
    border: 1px solid #58a6ff; border-radius: 6px; color: #fff; font-weight: bold;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
  }
  .joy-btn:active { background: #ff4444; border-color: #ff2222; }

  /* 禁地警報紅光 */
  #encounter-flash {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: 4px solid #ff0000; box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.8);
    pointer-events: none; z-index: 500; display: none;
    animation: flashAlert 0.4s infinite alternate;
  }
  @keyframes flashAlert { 0% { opacity: 0.2; } 100% { opacity: 0.9; } }

  /* 拾取漂浮加血文字 */
  .toast-popup {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    font-size: 24px; font-weight: bold; color: #00ff88; text-shadow: 0 0 12px #00ff88;
    pointer-events: none; z-index: 600; display: none; animation: toastUp 1s forwards;
  }
  @keyframes toastUp {
    0% { opacity: 0; transform: translate(-50%, 0); }
    30% { opacity: 1; transform: translate(-50%, -20px); }
    100% { opacity: 0; transform: translate(-50%, -50px); }
  }

  /* ==================== 密室逃脫解謎彈窗 (Escape Room Dialog) ==================== */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.88); z-index: 2000;
    display: none; justify-content: center; align-items: center; padding: 20px;
  }
  .escape-card {
    background: #161b22; border: 2px solid #ff4444; border-radius: 8px;
    width: 100%; max-width: 380px; padding: 22px; display: flex; flex-direction: column;
    box-shadow: 0 0 35px rgba(255, 0, 0, 0.5); animation: popIn 0.25s ease;
  }
  @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .escape-header {
    border-bottom: 1px dashed #7a1515; padding-bottom: 8px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .escape-title { font-size: 15px; font-weight: bold; color: #ff5555; }
  .clue-paper-box {
    background: #ebdcc0; color: #231a11; border-radius: 4px; padding: 14px;
    font-family: serif; font-size: 13px; line-height: 1.6; margin-bottom: 16px;
    border: 1px solid #bba377; white-space: pre-line;
  }

  .keypad-display {
    width: 100%; height: 42px; background: #000; border: 1px solid #30363d;
    border-radius: 4px; color: #ff3333; font-size: 22px; font-family: monospace;
    display: flex; justify-content: center; align-items: center; letter-spacing: 8px; margin-bottom: 12px;
  }
  .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-bottom: 14px; }
  .num-btn {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 10px 0; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }
  .num-btn:active { background: #ff4444; color: #fff; }
  .btn-close-escape {
    width: 100%; background: #30363d; color: #c9d1d9; border: none; padding: 9px 0;
    font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }

  /* 開場視窗 */
  #start-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #080a0e; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #start-modal h1 { color: #ff4444; font-size: 24px; margin-bottom: 12px; letter-spacing: 2px; }
  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.7; margin-bottom: 24px; max-width: 360px; }
  .btn-start {
    background: #b62324; border: none; color: #fff; padding: 14px 36px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
  }
</style>
</head>
<body>

<div id="game-viewport">
  <div class="horror-vignette"></div>
  <div id="encounter-flash"></div>
  <div class="toast-popup" id="toast-text">+35 HP 急救包</div>

  <!-- 頂部 HUD -->
  <div class="poke-hud-top">
    <div class="player-card">
      <div class="player-avatar">🕯️</div>
      <div class="player-info">
        <span class="player-level" id="player-title">第 1 關：辛亥引渡血柱</span>
        <div class="hp-bar-outer">
          <div class="hp-bar-inner" id="hp-bar" style="width: 70%;"></div>
        </div>
      </div>
    </div>
    <div class="status-badges">
      <div class="badge steps" id="steps-badge">走動: 0m</div>
      <div class="badge" id="hp-badge">HP: 70/100</div>
    </div>
  </div>

  <!-- 滿版 3D 傾斜大地圖畫布 -->
  <div id="canvas-container" style="width: 100%; height: 100%;"></div>

  <!-- 虛擬走動十字搖桿 -->
  <div class="joystick-zone">
    <div></div>
    <button class="joy-btn" onclick="simMove(0, 8)">▲</button>
    <div></div>
    <button class="joy-btn" onclick="simMove(-8, 0)">◄</button>
    <button class="joy-btn" onclick="simMove(0, -8)">▼</button>
    <button class="joy-btn" onclick="simMove(8, 0)">►</button>
  </div>

  <!-- 底部任務與解鎖按鈕 -->
  <div class="poke-bottom-bar">
    <div class="radio-text" id="radio-instruction">
      「遠處佇立著靈異禁地巨柱！走動接近至 35 米內解開密室封印！」
    </div>
    <button class="btn-enter-landmark" id="btn-enter-landmark" onclick="openEscapeRoom()" disabled>
      🔒 尚未進入結界
    </button>
  </div>

  <!-- 密室逃脫解謎彈窗 -->
  <div class="modal-overlay" id="escape-modal">
    <div class="escape-card">
      <div class="escape-header">
        <span class="escape-title" id="escape-title">辛亥引渡血柱・封印解除</span>
        <span style="font-size:12px; color:#ff4444;">道館級結界</span>
      </div>
      <div class="clue-paper-box" id="escape-clue">
        『……祂們在天花板上爬行。
        隧道口的警示燈閃爍著 4-0-4。
        輸入 404 解開鐵捲門，千萬別回頭！』
      </div>
      <div class="keypad-display" id="keypad-code">----</div>
      <div class="keypad-grid">
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn" onclick="clearKeypad()">C</button>
        <button class="num-btn" onclick="pressKey('0')">0</button>
        <button class="num-btn" onclick="submitPasscode()" style="background:#8b1111; color:#fff;">✓</button>
      </div>
      <button class="btn-close-escape" onclick="closeEscapeRoom()">退回地圖安全區</button>
    </div>
  </div>

  <!-- 開場視窗 -->
  <div id="start-modal">
    <h1>靜安怪談：禁地密室逃脫</h1>
    <p>
      <b>Pokémon GO 大地圖 × 巨型禁地道館：</b><br>
      地圖遠方佇立著聳入雲霄的<b>「靈異禁地結界柱」</b>。<br>
      手持手機走動（或操作搖桿）靠近至 <b>35 米內</b>，觸發密室機關解謎破關！
    </p>
    <button class="btn-start" onclick="initGame()">啟動禁地雷達</button>
  </div>
</div>

<script>
/* ==================== 多關卡靈異禁地資料庫 ==================== */
const ESCAPE_STAGES = [
  {
    level: 1,
    title: "第 1 關：辛亥引渡血柱",
    passcode: "404",
    landmarkName: "辛亥隧道・午夜結界巨柱",
    distOffset: { x: 30, z: -45 }, // 生成在前方 54 米處
    clue: "『……祂們在天花板上爬行。\n隧道口的警示燈閃爍著 4-0-4。\n輸入 404 解除隧道鐵捲門！』"
  },
  {
    level: 2,
    title: "第 2 關：地下水宮殿・沉骨祭壇",
    passcode: "379",
    landmarkName: "地下蓄水池・百年水煞柱",
    distOffset: { x: -40, z: -50 },
    clue: "『希臘石柱底部刻著排水閥順序：\n第 3 號閘門、第 7 號出水口、第 9 號減壓槽。\n按順序輸入 3-7-9 解鎖抽水門。』"
  },
  {
    level: 3,
    title: "第 3 關：三芝荒土・飛碟殘骸靈塔",
    passcode: "1980",
    landmarkName: "白沙灣・廢棄飛碟屋神殿",
    distOffset: { x: 45, z: -40 },
    clue: "『……自從切割龍身雕像後意外頻傳。\n工程委員會決議於西元 1980 年停工封閉機房。\n解除警報請輸入停工年份。』"
  },
  {
    level: 4,
    title: "第 4 關：陽明迷霧・魔神仔鎮煞碑",
    passcode: "8848",
    landmarkName: "仰德大道・下坡急彎鎮煞碑",
    distOffset: { x: 0, z: -60 },
    clue: "『車子在這裡打了三個轉……不要相信霧裡的招手白影！\n破除鬼打牆生還代碼：8-8-4-8。』"
  }
];

let currentStageIndex = 0;
let playerHP = 70;
const MAX_HP = 100;
let totalMeters = 0;
let lastSupplyMeters = 0;

// Three.js 核心
let scene, camera, renderer;
let playerGroup, radarPulseRing;
let currentLandmarkGroup = null; // 存放當前關卡的巨型禁地結界模型
let spawnedSupplies = []; // 存放 30 米掉落物資

let playerPos = { x: 0, z: 0 };
let currentTargetCoord = { x: 30, z: -45 };
let isWithinLandmarkRadius = false;
let passcodeBuffer = "";

/* ==================== 音效引擎 ==================== */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.frequency.setValueAtTime(60, this.ctx.currentTime);
    g.gain.setValueAtTime(0.06, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.05);
  }
  alarm() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(320, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
  }
  unlock() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(523, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046, this.ctx.currentTime + 0.5);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.5);
  }
}
const sfx = new SoundEngine();

function initGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThreePokeMap();
  loadStageLandmark(0);
}

/* ==================== 建立 3D 大地圖與環境 ==================== */
function initThreePokeMap() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050608);
  scene.fog = new THREE.FogExp2(0x050608, 0.007);

  // Pokémon GO 經典 45° 俯仰攝影機
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 1000);
  camera.position.set(0, 85, 95);
  camera.lookAt(0, 0, 0);

  // 建立陰暗發光地表與城市街道
  buildDarkEnvironment();

  // 建立玩家化身與雷達感應圈
  buildPlayerAvatar();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // 點擊急救包射線判定
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  container.addEventListener('pointerup', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const hitItems = [];
    spawnedSupplies.forEach(obj => { if (obj.mesh) hitItems.push(obj.mesh); });
    const intersects = raycaster.intersectObjects(hitItems);

    if (intersects.length > 0) {
      const hitObj = intersects[0].object.userData.objRef;
      collectSupply(hitObj);
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animateMap();
}

function buildDarkEnvironment() {
  const gridHelper = new THREE.GridHelper(900, 90, 0x1f3045, 0x0f1822);
  gridHelper.position.y = -0.5;
  scene.add(gridHelper);

  const roadMat = new THREE.MeshBasicMaterial({ color: 0x151c24 });
  const mainRoadX = new THREE.Mesh(new THREE.PlaneGeometry(900, 18), roadMat);
  mainRoadX.rotation.x = -Math.PI / 2;
  scene.add(mainRoadX);

  const mainRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(18, 900), roadMat);
  mainRoadZ.rotation.x = -Math.PI / 2;
  scene.add(mainRoadZ);

  // 周圍深黑半透明建築
  const buildingMat = new THREE.MeshBasicMaterial({
    color: 0x0c1017, wireframe: true, transparent: true, opacity: 0.35
  });
  for (let i = 0; i < 35; i++) {
    const w = 20 + Math.random() * 25, h = 25 + Math.random() * 60, d = 20 + Math.random() * 25;
    const bMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
    let bx = (Math.random() - 0.5) * 500, bz = (Math.random() - 0.5) * 500;
    if (Math.abs(bx) < 25) bx += 40;
    if (Math.abs(bz) < 25) bz += 40;
    bMesh.position.set(bx, h / 2, bz);
    scene.add(bMesh);
  }
}

function buildPlayerAvatar() {
  playerGroup = new THREE.Group();

  const bodyMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
  const avatarMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.5, 6, 8), bodyMat);
  avatarMesh.position.y = 3;
  playerGroup.add(avatarMesh);

  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(1.8, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  headMesh.position.y = 7;
  playerGroup.add(headMesh);

  // 45 米雷達光圈
  const ringGeom = new THREE.RingGeometry(42, 43, 48);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
  radarPulseRing = new THREE.Mesh(ringGeom, ringMat);
  radarPulseRing.rotation.x = -Math.PI / 2;
  radarPulseRing.position.y = 0.2;
  playerGroup.add(radarPulseRing);

  scene.add(playerGroup);
}

/* ==================== 靈異禁地結界標誌（道館級圖騰） ==================== */
function loadStageLandmark(stageIdx) {
  currentStageIndex = stageIdx;
  const stage = ESCAPE_STAGES[stageIdx];

  document.getElementById('player-title').innerText = stage.title;
  document.getElementById('escape-title').innerText = `${stage.landmarkName}・封印解除`;
  document.getElementById('escape-clue').innerText = stage.clue;

  if (currentLandmarkGroup) scene.remove(currentLandmarkGroup);

  currentLandmarkGroup = new THREE.Group();

  // 計算禁地目標座標 (以玩家為基準偏移)
  currentTargetCoord.x = playerPos.x + stage.distOffset.x;
  currentTargetCoord.z = playerPos.z + stage.distOffset.z;

  // 1. 血色衝天巨柱 (高達 60 米)
  const pillarGeom = new THREE.CylinderGeometry(4, 7, 60, 16);
  const pillarMat = new THREE.MeshBasicMaterial({ color: 0x880000, wireframe: true });
  const pillarMesh = new THREE.Mesh(pillarGeom, pillarMat);
  pillarMesh.position.y = 30;
  currentLandmarkGroup.add(pillarMesh);

  // 2. 禁地頂部血紅旋轉光環
  const haloGeom = new THREE.TorusGeometry(12, 1.2, 16, 48);
  const haloMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const haloMesh = new THREE.Mesh(haloGeom, haloMat);
  haloMesh.position.y = 55;
  haloMesh.rotation.x = Math.PI / 2;
  haloMesh.name = "halo";
  currentLandmarkGroup.add(haloMesh);

  // 3. 35 米半徑的靈異結界封鎖光圈 (地面血紅圓環)
  const barrierGeom = new THREE.RingGeometry(34, 35, 48);
  const barrierMat = new THREE.MeshBasicMaterial({ color: 0xff2222, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
  const barrierMesh = new THREE.Mesh(barrierGeom, barrierMat);
  barrierMesh.rotation.x = -Math.PI / 2;
  barrierMesh.position.y = 0.3;
  currentLandmarkGroup.add(barrierMesh);

  currentLandmarkGroup.position.set(currentTargetCoord.x, 0, currentTargetCoord.z);
  scene.add(currentLandmarkGroup);

  checkLandmarkDistance();
}

/* ==================== 走動與 30 米物資掉落 ==================== */
function simMove(dx, dz) {
  sfx.step();
  playerPos.x += dx;
  playerPos.z += dz;

  const moveDist = Math.hypot(dx, dz);
  totalMeters += Math.round(moveDist);
  lastSupplyMeters += moveDist;

  document.getElementById('steps-badge').innerText = `走動: ${totalMeters}m`;

  playerGroup.position.set(playerPos.x, 0, playerPos.z);
  camera.position.set(playerPos.x, 85, playerPos.z + 95);
  camera.lookAt(playerPos.x, 0, playerPos.z);

  // 每 30 米隨機掉落急救包
  if (lastSupplyMeters >= 30) {
    lastSupplyMeters = 0;
    spawnSupplyBoxNearby();
  }

  // 檢查是否走入禁地結界 35 米範圍
  checkLandmarkDistance();
}

function spawnSupplyBoxNearby() {
  const angle = Math.random() * Math.PI * 2;
  const radius = 22 + Math.random() * 15;
  const sx = playerPos.x + Math.cos(angle) * radius;
  const sz = playerPos.z + Math.sin(angle) * radius;

  const boxGeom = new THREE.BoxGeometry(4, 4, 4);
  const boxMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
  const mesh = new THREE.Mesh(boxGeom, boxMat);
  mesh.position.set(sx, 2.5, sz);

  const supplyData = { id: Date.now(), heal: 35, mesh: mesh };
  mesh.userData = { objRef: supplyData };

  scene.add(mesh);
  spawnedSupplies.push(supplyData);
  alert("【地脈共鳴！】走動滿 30 米！路邊掉落了【急救包】！點擊地圖上的綠色方塊拾取！");
}

function collectSupply(objRef) {
  playerHP = Math.min(MAX_HP, playerHP + objRef.heal);
  document.getElementById('hp-bar').style.width = `${(playerHP / MAX_HP) * 100}%`;
  document.getElementById('hp-badge').innerText = `HP: ${playerHP}/${MAX_HP}`;

  const toast = document.getElementById('toast-text');
  toast.innerText = `+${objRef.heal} HP 急救包`;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 1000);

  scene.remove(objRef.mesh);
  spawnedSupplies = spawnedSupplies.filter(item => item !== objRef);
}

// 檢查與禁地標誌的距離
function checkLandmarkDistance() {
  const dist = Math.hypot(currentTargetCoord.x - playerPos.x, currentTargetCoord.z - playerPos.z);
  const btn = document.getElementById('btn-enter-landmark');
  const flash = document.getElementById('encounter-flash');

  if (dist <= 35) {
    if (!isWithinLandmarkRadius) {
      sfx.alarm();
      isWithinLandmarkRadius = true;
    }
    flash.style.display = 'block';
    btn.disabled = false;
    btn.innerText = "⚡ 解除禁地結界 ⚡";
    document.getElementById('radio-instruction').innerText =
      `「⚠️ 已踏入【${ESCAPE_STAGES[currentStageIndex].landmarkName}】的 35 米結界！點擊右側按鈕進行密室逃脫解謎！」`;
  } else {
    isWithinLandmarkRadius = false;
    flash.style.display = 'none';
    btn.disabled = true;
    btn.innerText = `🔒 距離禁地 ${Math.round(dist)}m`;
    document.getElementById('radio-instruction').innerText =
      `「前方的【${ESCAPE_STAGES[currentStageIndex].landmarkName}】正在散發血光！距離結界：${Math.round(dist)} 公尺。」`;
  }
}

/* ==================== 密室逃脫解謎彈窗邏輯 ==================== */
function openEscapeRoom() {
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('escape-modal').style.display = 'flex';
}

function closeEscapeRoom() {
  document.getElementById('escape-modal').style.display = 'none';
}

function pressKey(num) {
  if (passcodeBuffer.length < 4) {
    passcodeBuffer += num;
    document.getElementById('keypad-code').innerText = passcodeBuffer.padEnd(4, '-');
  }
}

function clearKeypad() {
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
}

function submitPasscode() {
  const currentStage = ESCAPE_STAGES[currentStageIndex];
  if (passcodeBuffer === currentStage.passcode) {
    sfx.unlock();
    closeEscapeRoom();
    alert(`🎉【封印破除！】你成功破解了【${currentStage.landmarkName}】！結界已被完全淨化！`);

    // 推進至下一道靈異禁地
    if (currentStageIndex + 1 < ESCAPE_STAGES.length) {
      loadStageLandmark(currentStageIndex + 1);
    } else {
      alert("🏆【全境生還！】你已成功拔除大地圖上全部 4 座靈異道館禁地！生還歸來！");
    }
  } else {
    alert("【密碼錯誤！】禁地結界釋放出劇烈陰氣！受到 15 點反噬傷害！請仔細閱讀現場線索！");
    playerHP = Math.max(0, playerHP - 15);
    document.getElementById('hp-bar').style.width = `${(playerHP / MAX_HP) * 100}%`;
    document.getElementById('hp-badge').innerText = `HP: ${playerHP}/${MAX_HP}`;
    clearKeypad();
  }
}

/* ==================== 主動畫循環 ==================== */
function animateMap() {
  requestAnimationFrame(animateMap);

  // 45 米雷達感應圈脈衝
  if (radarPulseRing) {
    const pulse = 1.0 + Math.sin(Date.now() * 0.004) * 0.06;
    radarPulseRing.scale.set(pulse, pulse, 1);
  }

  // 靈異禁地頂部光環旋轉
  if (currentLandmarkGroup) {
    const halo = currentLandmarkGroup.getObjectByName("halo");
    if (halo) halo.rotation.z += 0.02;
  }

  // 急救包自轉浮動
  spawnedSupplies.forEach(item => {
    if (item.mesh) {
      item.mesh.rotation.y += 0.03;
      item.mesh.position.y = 2.5 + Math.sin(Date.now() * 0.006) * 0.5;
    }
  });

  renderer.render(scene, camera);
}
</script>
