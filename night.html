<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【杏林夜泣】第一人稱心理驚悚醫院密室逃脫</title>

<!-- Three.js 3D 核心庫 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #000; color: #eee; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #game-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
  #three-canvas { width: 100%; height: 100%; display: block; }

  /* 驚悚老舊醫院 VHS 暗角與雜訊 */
  .vignette-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 25%, rgba(0, 10, 5, 0.75) 65%, rgba(0, 0, 0, 0.98) 95%),
                repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0, 30, 15, 0.12) 3px, rgba(0,0,0,0) 4px);
    pointer-events: none; z-index: 10;
  }

  /* 驚嚇紅屏閃爍層 */
  #scare-flash {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 0, 0, 0.45); pointer-events: none; z-index: 500;
    display: none; animation: scareGlitch 0.2s infinite alternate;
  }
  @keyframes scareGlitch { 0% { opacity: 0.1; } 100% { opacity: 0.9; } }

  /* 準心 */
  .crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 6px; height: 6px; background: rgba(255, 255, 255, 0.6); border-radius: 50%;
    pointer-events: none; z-index: 20; transition: all 0.15s;
  }
  .crosshair.interactable {
    width: 24px; height: 24px; background: transparent; border: 2px solid #ff4444;
    box-shadow: 0 0 12px #ff0000;
  }

  #interact-hint {
    position: absolute; top: 56%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; font-weight: bold; color: #ff5555; text-shadow: 0 0 8px #000;
    pointer-events: none; z-index: 25; display: none; letter-spacing: 1px;
  }

  /* 頂部 HUD */
  .hud-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 56px;
    background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, transparent 100%);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; z-index: 100; pointer-events: none;
  }
  .stage-badge {
    color: #00ff88; font-size: 13px; font-weight: bold; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px; text-shadow: 0 0 8px rgba(0,255,136,0.4);
  }
  .pulse-dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .inventory-bar {
    background: rgba(13, 20, 16, 0.85); border: 1px solid #1f402c;
    padding: 4px 12px; border-radius: 4px; font-size: 12px; color: #e3b341;
  }

  /* 行動裝置走動按鈕 */
  .touch-controls {
    position: absolute; bottom: 20px; left: 20px; z-index: 150;
    display: grid; grid-template-columns: repeat(3, 44px); gap: 6px;
  }
  .touch-btn {
    width: 44px; height: 44px; background: rgba(13, 24, 18, 0.75);
    border: 1px solid #00ff88; border-radius: 6px; color: #fff; font-size: 15px; font-weight: bold;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
  }
  .touch-btn:active { background: #00ff88; color: #000; }

  /* 底部對講機任務提示 */
  .bottom-radio {
    position: absolute; bottom: 18px; left: 175px; right: 20px;
    background: rgba(10, 15, 12, 0.94); border: 1px solid #1f382b;
    border-left: 4px solid #00ff88; padding: 10px 14px;
    z-index: 100; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .radio-text { font-size: 12px; color: #c9d1d9; line-height: 1.4; }

  /* ==================== 彈窗 1：病歷調查紙條 ==================== */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9); z-index: 2000;
    display: none; justify-content: center; align-items: center; padding: 20px;
  }
  .clue-paper {
    background: #e8e2d3; color: #1e1914; width: 100%; max-width: 400px;
    border-radius: 6px; padding: 24px; box-shadow: 0 0 35px rgba(0,255,136,0.15);
    border: 2px solid #a39985; font-family: serif; animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .clue-title { font-size: 16px; font-weight: bold; color: #8a1d1d; border-bottom: 1px dashed #7a664d; padding-bottom: 8px; margin-bottom: 14px; }
  .clue-body { font-size: 13px; line-height: 1.8; margin-bottom: 20px; white-space: pre-line; }
  .btn-close { width: 100%; background: #26382b; color: #00ff88; border: 1px solid #00ff88; padding: 10px 0; font-size: 13px; font-weight: bold; border-radius: 3px; cursor: pointer; }

  /* ==================== 彈窗 2：鐵捲門電子密碼盤 ==================== */
  .keypad-box {
    background: #111a14; border: 2px solid #00ff88; border-radius: 8px;
    width: 280px; padding: 22px; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 0 35px rgba(0, 255, 136, 0.3); animation: popIn 0.2s ease;
  }
  .keypad-display {
    width: 100%; height: 44px; background: #000; border: 1px solid #1f382b;
    border-radius: 4px; color: #00ff88; font-size: 24px; font-family: monospace;
    display: flex; justify-content: center; align-items: center; letter-spacing: 8px; margin-bottom: 16px;
  }
  .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 16px; }
  .num-btn {
    background: #19241d; border: 1px solid #2a3d31; color: #c9d1d9;
    padding: 12px 0; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }
  .num-btn:active { background: #00ff88; color: #000; }

  /* 開場視窗 */
  #start-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #040806; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #start-modal h1 { color: #00ff88; font-size: 24px; margin-bottom: 14px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
  #start-modal p { font-size: 13px; color: #8b949e; line-height: 1.8; margin-bottom: 24px; max-width: 420px; }
  .btn-start {
    background: #00ff88; border: none; color: #000; padding: 14px 40px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,136,0.5);
  }
</style>
</head>
<body>

<div id="game-viewport">
  <div class="vignette-overlay"></div>
  <div id="scare-flash"></div>
  <div class="crosshair" id="crosshair"></div>
  <div id="interact-hint">[ 點擊滑鼠 / 觸控進行調查 ]</div>

  <!-- 頂部 HUD -->
  <div class="hud-top">
    <div class="stage-badge">
      <div class="pulse-dot"></div>
      <span id="stage-title">區域 1：杏林醫院・急診候診長廊</span>
    </div>
    <div class="inventory-bar" id="inv-display">道具包: 空</div>
  </div>

  <!-- 3D 畫布容器 -->
  <div id="canvas-container" style="width: 100%; height: 100%;"></div>

  <!-- 虛擬走動十字按鈕 -->
  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" onpointerdown="keys.KeyW=true" onpointerup="keys.KeyW=false">▲</button>
    <div></div>
    <button class="touch-btn" onpointerdown="keys.KeyA=true" onpointerup="keys.KeyA=false">◄</button>
    <button class="touch-btn" onpointerdown="keys.KeyS=true" onpointerup="keys.KeyS=false">▼</button>
    <button class="touch-btn" onpointerdown="keys.KeyD=true" onpointerup="keys.KeyD=false">►</button>
  </div>

  <!-- 底部任務提示 -->
  <div class="bottom-radio">
    <div class="radio-text" id="radio-instruction">
      「你踏入了荒廢已久的杏林醫院……四周充滿異響。請走動深入隔間尋找病歷線索與開門密碼！」
    </div>
  </div>

  <!-- 調查檔案彈窗 -->
  <div class="modal-overlay" id="clue-modal">
    <div class="clue-paper">
      <div class="clue-title" id="clue-title">調查證物</div>
      <div class="clue-body" id="clue-body">檔案內容載入中...</div>
      <button class="btn-close" onclick="closeClueModal()">放回並繼續前進</button>
    </div>
  </div>

  <!-- 密碼鎖彈窗 -->
  <div class="modal-overlay" id="keypad-modal">
    <div class="keypad-box">
      <div style="color: #00ff88; font-size: 12px; margin-bottom: 8px;">通道重型防護門</div>
      <div class="keypad-display" id="keypad-code">----</div>
      <div class="keypad-grid">
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn" onclick="clearKeypad()">C</button>
        <button class="num-btn" onclick="pressKey('0')">0</button>
        <button class="num-btn" onclick="submitPasscode()" style="background:#1b4d2e; color:#00ff88;">✓</button>
      </div>
      <button class="btn-close" style="background:#19241d; color:#888; border-color:#333;" onclick="closeKeypad()">放棄返回</button>
    </div>
  </div>

  <!-- 開場視窗 -->
  <div id="start-modal">
    <h1>杏林夜泣：本格醫院逃脫</h1>
    <p>
      <b>真實還原杏林綜合醫院驚悚氛圍：</b><br>
      無怪物追殺，聚焦於<b>突發驚嚇（自動滑行輪椅、日光燈短路狂閃、冷藏櫃暴彈）</b>。<br>
      使用鍵盤 <b>W / A / S / D</b> 走動，滑鼠拖曳視角，深入四個病區解開醫院停業的真相！
    </p>
    <button class="btn-start" onclick="startGame()">踏入醫院大廳</button>
  </div>
</div>

<script>
/* ==================== 4 大杏林醫院連鎖病區關卡庫 ==================== */
const HOSPITAL_STAGES = [
  {
    level: 1,
    title: "區域 1：杏林醫院・急診候診長廊",
    wallColor: 0x0f1a14, floorColor: 0x08100b,
    clueName: "急診室初診紀錄單",
    passcode: "404",
    diary: "『……1991 年 4 月，重症急診室送來了一名沒有身分證明的病患。\n病床號碼被鮮血塗抹，只隱約辨識出號碼：4-0-4。\n輸入 404 解開急診隔離閘門！』"
  },
  {
    level: 2,
    title: "區域 2：放射科・暗房 X 光觀片室",
    wallColor: 0x14181a, floorColor: 0x0a0e10,
    clueName: "曝光過度的胸腔透視片",
    passcode: "713",
    diary: "『觀片燈箱閃爍不定……透視片中的肺部夾著一把手術刀。\n底片右下角標註的病歷序號是 7-1-3。\n輸入 7-1-3 解鎖防輻射鉛門！』"
  },
  {
    level: 3,
    title: "區域 3：地下太平間・冷凍冰櫃排",
    wallColor: 0x1a1515, floorColor: 0x100a0a,
    clueName: "屍體腳趾掛牌",
    passcode: "909",
    diary: "『冰櫃自行彈開了……掛牌上的字跡歪斜顫抖：\n“冷藏櫃防腐排氣閥緊急代碼為 9-0-9”。\n輸入 909 解除排風閥逃出太平間！』"
  },
  {
    level: 4,
    title: "區域 4：院長辦公室・封存檔案庫",
    wallColor: 0x18140c, floorColor: 0x0f0c08,
    clueName: "衛生局停業查封公文",
    passcode: "1993",
    diary: "『真相終於大白……偽造病歷與醫療糾紛爆發。\n杏林醫院於西元 1993 年正式勒令停業並永久封存！\n輸入停業年份 1993 開啟最後逃生鐵捲門！』"
  }
];

let currentStageIdx = 0;
let inventory = [];
let passcodeBuffer = "";

/* ==================== 音效引擎 (真實驚悚環境音) ==================== */
class HorrorAudio {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  step() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(45, this.ctx.currentTime);
    g.gain.setValueAtTime(0.06, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.05);
  }
  bang() { // 金屬重擊/冰櫃暴彈聲
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(140, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.6, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.4);
  }
  wheelSqueak() { // 生鏽輪椅尖銳滑行聲
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(800, this.ctx.currentTime);
    o.frequency.linearRampToValueAtTime(1400, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.6);
  }
  buzz() { // 日光燈電流短路爆閃聲
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(120, this.ctx.currentTime);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.15);
  }
  doorOpen() {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(90, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.7);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.7);
  }
}
const sfx = new HorrorAudio();

/* ==================== Three.js 第一人稱 3D 空間 ==================== */
let scene, camera, renderer, flashlight, ceilingFlickerLight;
let roomMeshGroup = null, clueObject = null, doorObject = null;
let wheelchairMesh = null, morgueDrawerMesh = null; // 驚嚇道具
let yaw = 0, pitch = 0;
let playerPos = { x: 0, y: 1.8, z: 13 };
let keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
let isInteractingLook = false, lastTouchX = 0, lastTouchY = 0;
let headBob = 0;
let wallColliders = [];

// 驚嚇觸發旗標
let wheelchairScareTriggered = false;
let morgueScareTriggered = false;

function startGame() {
  document.getElementById('start-modal').style.display = 'none';
  sfx.init();

  initThreeEngine();
  loadStageHospital(0);
}

function initThreeEngine() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(playerPos.x, playerPos.y, playerPos.z);

  // 第一人稱手電筒 (冷白微綠醫用光色)
  flashlight = new THREE.SpotLight(0xecfff2, 2.8, 22, Math.PI / 4.6, 0.4, 1.2);
  camera.add(flashlight);
  flashlight.position.set(0, 0, 0.2);
  flashlight.target = camera;
  scene.add(camera);

  // 天花板故障短路燈
  ceilingFlickerLight = new THREE.PointLight(0xaaffcc, 0.8, 15);
  ceilingFlickerLight.position.set(0, 5.5, 0);
  scene.add(ceilingFlickerLight);

  scene.add(new THREE.AmbientLight(0x040806));

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

  container.addEventListener('pointerdown', (e) => {
    isInteractingLook = true;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  });
  window.addEventListener('pointermove', (e) => {
    if (isInteractingLook) {
      const dx = e.clientX - lastTouchX;
      const dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;

      yaw -= dx * 0.0035;
      pitch -= dy * 0.0035;
      pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
    }
  });
  window.addEventListener('pointerup', () => { isInteractingLook = false; });
  container.addEventListener('click', checkRaycastInteract);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

/* ==================== 建立精緻杏林醫院隔間與驚嚇道具 ==================== */
function loadStageHospital(idx) {
  currentStageIdx = idx;
  const stage = HOSPITAL_STAGES[idx];

  document.getElementById('stage-title').innerText = stage.title;
  document.getElementById('radio-instruction').innerText =
    `「進入【${stage.title}】！注意長廊轉角的異響，在深處病房搜查病歷，再前往鐵捲門！」`;

  playerPos = { x: 0, y: 1.8, z: 13 };
  yaw = 0; pitch = 0;
  wheelchairScareTriggered = false;
  morgueScareTriggered = false;

  if (roomMeshGroup) scene.remove(roomMeshGroup);
  roomMeshGroup = new THREE.Group();
  wallColliders = [];

  // 外牆 (寬 32m, 深 32m, 高 6m，老舊斑駁瓷磚質感色調)
  const wallMat = new THREE.MeshStandardMaterial({ color: stage.wallColor, roughness: 0.95, side: THREE.BackSide });
  const outerRoom = new THREE.Mesh(new THREE.BoxGeometry(32, 6, 32), wallMat);
  outerRoom.position.y = 3;
  roomMeshGroup.add(outerRoom);

  // 地板 (老舊潮濕綠瓷磚感)
  const floorMat = new THREE.MeshStandardMaterial({ color: stage.floorColor, roughness: 0.8 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMat);
  floor.rotation.x = -Math.PI / 2;
  roomMeshGroup.add(floor);

  // ⭐ 醫院內部迷宮隔間牆 (候診走廊、處置室、隔離開間)
  buildWall(-6, 2, 10, 0.8);
  buildWall(6, -3, 0.8, 12);
  buildWall(-7, -8, 8, 0.8);
  buildWall(4, 7, 10, 0.8);
  buildWall(-4, 9, 0.8, 8);

  // 1. 調查病歷桌 (位於深處病房：X: -11, Z: -11)
  const deskMesh = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.2, 1.8), new THREE.MeshStandardMaterial({ color: 0x1f2824 }));
  deskMesh.position.set(-11, 0.6, -11);
  roomMeshGroup.add(deskMesh);

  // 發光病歷夾
  const bookMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 1.1), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
  bookMesh.position.set(-11, 1.3, -11);
  clueObject = bookMesh;
  clueObject.userData = { type: "clue", data: stage };
  roomMeshGroup.add(clueObject);

  // 2. ⭐ 驚嚇道具 1：生鏽手推輪椅 (停在長廊死角 X: 6, Z: 2)
  buildWheelchair(6, 2);

  // 3. ⭐ 驚嚇道具 2：地下冷藏冰櫃排 (位於 X: -10, Z: 5)
  buildMorgueDrawers(-10, 5);

  // 4. 重型逃生鐵捲門 (走廊盡頭：X: 0, Z: -15.8)
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x15221b, metalness: 0.85, roughness: 0.25 });
  doorObject = new THREE.Mesh(new THREE.BoxGeometry(4, 5, 0.4), doorMat);
  doorObject.position.set(0, 2.5, -15.8);
  doorObject.userData = { type: "door", data: stage };
  roomMeshGroup.add(doorObject);

  const lockPlate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.2), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
  lockPlate.position.set(1.4, 0, 0.3);
  doorObject.add(lockPlate);

  scene.add(roomMeshGroup);
}

function buildWall(x, z, width, depth) {
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x111c16, roughness: 0.95 });
  const wall = new THREE.Mesh(new THREE.BoxGeometry(width, 5.8, depth), wallMat);
  wall.position.set(x, 2.9, z);
  roomMeshGroup.add(wall);

  wallColliders.push({
    minX: x - width / 2 - 0.7, maxX: x + width / 2 + 0.7,
    minZ: z - depth / 2 - 0.7, maxZ: z + depth / 2 + 0.7
  });
}

// 建立輪椅模型
function buildWheelchair(x, z) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x332222, metalness: 0.8 });

  // 椅座與椅背
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 1.6), mat);
  seat.position.y = 1.0;
  const back = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.8, 0.2), mat);
  back.position.set(0, 1.9, -0.7);
  group.add(seat); group.add(back);

  // 兩個大輪子
  const wheelGeom = new THREE.TorusGeometry(0.8, 0.08, 8, 24);
  const leftWheel = new THREE.Mesh(wheelGeom, mat);
  leftWheel.position.set(-0.9, 0.8, 0);
  leftWheel.rotation.y = Math.PI / 2;
  const rightWheel = leftWheel.clone();
  rightWheel.position.set(0.9, 0.8, 0);
  group.add(leftWheel); group.add(rightWheel);

  group.position.set(x, 0, z);
  wheelchairMesh = group;
  roomMeshGroup.add(wheelchairMesh);
}

// 建立太平間冰櫃排
function buildMorgueDrawers(x, z) {
  const group = new THREE.Group();
  const steelMat = new THREE.MeshStandardMaterial({ color: 0x303c35, metalness: 0.9, roughness: 0.2 });

  // 櫃體
  const cabinet = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 5), steelMat);
  cabinet.position.y = 1.5;
  group.add(cabinet);

  // 暴彈抽屜
  const drawer = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 3.8), new THREE.MeshStandardMaterial({ color: 0x45554c, metalness: 0.9 }));
  drawer.position.set(0, 1.5, 0);
  morgueDrawerMesh = drawer;
  group.add(morgueDrawerMesh);

  group.position.set(x, 0, z);
  roomMeshGroup.add(group);
}

/* ==================== 走動與碰撞檢測 ==================== */
function updateMovement() {
  const moveSpeed = 0.11;
  let moveX = 0, moveZ = 0;

  if (keys.KeyW) moveZ -= 1;
  if (keys.KeyS) moveZ += 1;
  if (keys.KeyA) moveX -= 1;
  if (keys.KeyD) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const len = Math.hypot(moveX, moveZ);
    moveX = (moveX / len) * moveSpeed;
    moveZ = (moveZ / len) * moveSpeed;

    const sinYaw = Math.sin(yaw);
    const cosYaw = Math.cos(yaw);

    const nextX = playerPos.x + (moveX * cosYaw + moveZ * sinYaw);
    const nextZ = playerPos.z + (-moveX * sinYaw + moveZ * cosYaw);

    let canMoveX = true, canMoveZ = true;
    for (let box of wallColliders) {
      if (nextX >= box.minX && nextX <= box.maxX && playerPos.z >= box.minZ && playerPos.z <= box.maxZ) canMoveX = false;
      if (playerPos.x >= box.minX && playerPos.x <= box.maxX && nextZ >= box.minZ && nextZ <= box.maxZ) canMoveZ = false;
    }

    if (nextX < -15 || nextX > 15) canMoveX = false;
    if (nextZ < -15 || nextZ > 15) canMoveZ = false;

    if (canMoveX) playerPos.x = nextX;
    if (canMoveZ) playerPos.z = nextZ;

    headBob += 0.18;
    camera.position.y = playerPos.y + Math.sin(headBob) * 0.05;

    if (Math.sin(headBob) < -0.95 && !updateMovement.stepped) {
      sfx.step();
      updateMovement.stepped = true;
    } else if (Math.sin(headBob) > 0) {
      updateMovement.stepped = false;
    }
  }

  camera.position.x = playerPos.x;
  camera.position.z = playerPos.z;

  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);

  // 檢查環境驚嚇觸發點
  checkEnvironmentalScares();
}

/* ==================== ⭐ 核心：環境靈異驚嚇事件觸發器 ==================== */
function checkEnvironmentalScares() {
  // 驚嚇 1：走進轉角時，生鏽輪椅突然自行暴衝滑過來
  if (!wheelchairScareTriggered && wheelchairMesh) {
    const distToChair = Math.hypot(wheelchairMesh.position.x - playerPos.x, wheelchairMesh.position.z - playerPos.z);
    if (distToChair < 7.5) {
      wheelchairScareTriggered = true;
      sfx.wheelSqueak();
      triggerScareFlash();

      // 輪椅向玩家方向猛烈衝刺滑行
      let slideFrames = 0;
      const slideInterval = setInterval(() => {
        wheelchairMesh.position.z += 0.35;
        wheelchairMesh.rotation.y += 0.08;
        slideFrames++;
        if (slideFrames > 22) clearInterval(slideInterval);
      }, 25);
    }
  }

  // 驚嚇 2：靠近太平間冰櫃時，金屬抽屜伴隨巨響突然自行向外彈出
  if (!morgueScareTriggered && morgueDrawerMesh) {
    const distToMorgue = Math.hypot(-10 - playerPos.x, 5 - playerPos.z);
    if (distToMorgue < 6.0) {
      morgueScareTriggered = true;
      sfx.bang();
      triggerScareFlash();

      // 抽屜向外彈出
      let popFrames = 0;
      const popInterval = setInterval(() => {
        morgueDrawerMesh.position.z += 0.25;
        popFrames++;
        if (popFrames > 12) clearInterval(popInterval);
      }, 30);
    }
  }
}

// 突發紅屏視覺干擾
function triggerScareFlash() {
  const flash = document.getElementById('scare-flash');
  flash.style.display = 'block';
  setTimeout(() => { flash.style.display = 'none'; }, 220);
}

/* ==================== 日光燈隨機短路爆閃 ==================== */
let flickerTimer = 0;
function updateCeilingFlicker() {
  flickerTimer++;
  if (flickerTimer % 45 === 0 && Math.random() > 0.4) {
    sfx.buzz();
    ceilingFlickerLight.intensity = 0.05; // 瞬間斷電黑屏
    setTimeout(() => {
      ceilingFlickerLight.intensity = 1.4;
      setTimeout(() => { ceilingFlickerLight.intensity = 0.8; }, 80);
    }, 60);
  }
}

/* ==================== 準心交互 ==================== */
function checkRaycastInteract() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length > 0) {
    let hitObj = hits[0].object;
    while (hitObj.parent && !hitObj.userData.type) hitObj = hitObj.parent;

    const dist = camera.position.distanceTo(hits[0].point);
    if (dist <= 4.8) {
      if (hitObj.userData.type === "clue") {
        openClueDialog(hitObj.userData.data);
      } else if (hitObj.userData.type === "door") {
        openKeypadDialog();
      }
    }
  }
}

function updateInteractHint() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = [];
  if (clueObject) targets.push(clueObject);
  if (doorObject) targets.push(doorObject);

  const hits = raycaster.intersectObjects(targets, true);
  const cross = document.getElementById('crosshair');
  const hint = document.getElementById('interact-hint');

  if (hits.length > 0 && hits[0].distance <= 4.8) {
    cross.classList.add('interactable');
    hint.style.display = 'block';
  } else {
    cross.classList.remove('interactable');
    hint.style.display = 'none';
  }
}

/* ==================== 密室彈窗解謎邏輯 ==================== */
function openClueDialog(data) {
  sfx.bang();
  document.getElementById('clue-title').innerText = `【${data.clueName}】`;
  document.getElementById('clue-body').innerText = data.diary;
  document.getElementById('clue-modal').style.display = 'flex';

  if (!inventory.includes(data.clueName)) {
    inventory.push(data.clueName);
    document.getElementById('inv-display').innerText = `道具包: ${inventory.join(', ')}`;
  }
}
function closeClueModal() { document.getElementById('clue-modal').style.display = 'none'; }

function openKeypadDialog() {
  sfx.buzz();
  passcodeBuffer = "";
  document.getElementById('keypad-code').innerText = "----";
  document.getElementById('keypad-modal').style.display = 'flex';
}
function closeKeypad() { document.getElementById('keypad-modal').style.display = 'none'; }

function pressKey(n) {
  sfx.buzz();
  if (passcodeBuffer.length < 4) {
    passcodeBuffer += n;
    document.getElementById('keypad-code').innerText = passcodeBuffer.padEnd(4, '-');
  }
}
function clearKeypad() { sfx.buzz(); passcodeBuffer = ""; document.getElementById('keypad-code').innerText = "----"; }

function submitPasscode() {
  const currentStage = HOSPITAL_STAGES[currentStageIdx];
  if (passcodeBuffer === currentStage.passcode) {
    sfx.doorOpen();
    closeKeypad();
    alert(`🎉【閘門開啟！】重型防護門在刺耳的金屬摩擦聲中升起！成功逃離【${currentStage.title}】！`);

    if (currentStageIdx + 1 < HOSPITAL_STAGES.length) {
      loadStageHospital(currentStageIdx + 1);
    } else {
      alert("🏆【杏林生還者！】你已成功穿梭整座杏林綜合醫院，解開全部 4 道病區封鎖，重見天日！");
    }
  } else {
    alert("【密碼錯誤！】門禁指示燈發出蜂鳴！請核對病歷上的數字代碼！");
    clearKeypad();
  }
}

/* ==================== 主動畫循環 ==================== */
function animate() {
  requestAnimationFrame(animate);

  updateMovement();
  updateInteractHint();
  updateCeilingFlicker();

  // 病歷光芒呼吸
  if (clueObject) clueObject.rotation.y += 0.02;

  renderer.render(scene, camera);
}
</script>
