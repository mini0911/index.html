<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>學務處狂想曲：今天也要平安下班！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: #ffedd5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: #fef3c7;
      border: 4px solid #fbbf24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
    }
    canvas {
      display: block;
      width: 100%;
      height: 60%;
      background: #fffbeb;
    }

    /* 頂部狀態列 */
    #top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .status-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 150px;
    }
    .bar-container {
      background: #fef08a;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      height: 18px;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
      border-radius: 10px;
    }
    #san-bar { background: #f87171; }
    .bar-label {
      position: absolute;
      top: 0;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      line-height: 16px;
      color: #78350f;
    }
    .score-badge {
      font-size: 13px;
      font-weight: 900;
      color: #b45309;
      background: #ffedd5;
      padding: 2px 8px;
      border-radius: 8px;
      display: inline-block;
    }
    .top-right-group {
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    #sound-toggle {
      background: #fff;
      border: 2px solid #f97316;
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 #fdba74;
    }
    #clock-box {
      background: #ffffff;
      border: 3px solid #fb923c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 16px;
      font-weight: 900;
      color: #ea580c;
      text-align: center;
      box-shadow: 0 2px 0 #fdba74;
    }

    /* 手機虛擬控制面板 */
    #touch-controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 15px);
      left: 0;
      right: 0;
      height: 140px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 8;
    }
    .d-pad-cross {
      position: relative;
      width: 120px;
      height: 120px;
    }
    .ctrl-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #fed7aa;
      border: 2px solid #ea580c;
      box-shadow: 0 3px 0 #c2410c;
      font-size: 18px;
      font-weight: 900;
      color: #7c2d12;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c2410c;
      background: #fdba74;
    }
    #btn-up { top: 0; left: 38px; }
    #btn-down { bottom: 0; left: 38px; }
    #btn-left { top: 38px; left: 0; }
    #btn-right { top: 38px; right: 0; }

    .action-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #action-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f97316;
      border: 3px solid #7c2d12;
      box-shadow: 0 4px 0 #7c2d12;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7c2d12;
      background: #ea580c;
    }
    #held-item-display {
      font-size: 12px;
      font-weight: 900;
      color: #78350f;
      background: #fff;
      padding: 3px 10px;
      border-radius: 10px;
      border: 2px solid #f59e0b;
      min-width: 90px;
      text-align: center;
    }

    /* 開始/結算視窗 */
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(254, 243, 199, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    #modal h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #ea580c;
    }
    #modal p {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 22px;
      color: #7c2d12;
      line-height: 1.6;
    }
    .cute-btn {
      padding: 12px 32px;
      font-size: 17px;
      font-weight: 900;
      background: #f97316;
      color: #ffffff;
      border: 3px solid #7c2d12;
      border-radius: 14px;
      cursor: pointer;
