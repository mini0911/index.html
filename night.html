<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>【寂靜結界】Mapillary 免費真實街景生還戰</title>
<!-- 引入 MapillaryJS 官方開源庫 (免 Key/免卡) -->
<link href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" rel="stylesheet" />
<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }

  #viewport-rig {
    position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
  }

  /* Mapillary 街景視圖容器 */
  #mly-container {
    flex: 1; width: 100%; height: 100%; position: relative;
    /* 恐怖夜視濾鏡：黑夜反轉、去飽和、深暗高對比 */
    filter: invert(90%) hue-rotate(180deg) contrast(140%) saturate(15%) brightness(65%);
  }

  /* 隱藏 Mapillary 原生覆蓋圖標，保持純粹恐懼感 */
  .mapillary-attribution-container, .mapillary-sequence-container {
    opacity: 0.15 !important;
  }

  /* 恐怖 VHS 掃描線與暗紅暗角 */
  .vhs-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(20, 0, 0, 0.6) 80%, rgba(0, 0, 0, 0.95) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
    background-size: 100% 100%, 100% 4px;
    pointer-events: none; z-index: 50;
  }

  /* 準心 */
  .center-crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 46px; height: 46px; border: 2px dashed rgba(255, 60, 60, 0.7);
    border-radius: 50%; pointer-events: none; z-index: 60;
  }

  /* 釘在真實道路街景上的惡靈實體 */
  #ghost-anchor {
    position: absolute; width: 120px; height: 180px;
    transform: translate(-50%, -50%); pointer-events: auto;
    cursor: pointer; display: none; z-index: 70;
  }
  .ghost-shadow {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 35%, rgba(255, 0, 0, 0.95) 0%, rgba(50, 0, 0, 0.8) 55%, transparent 80%);
    filter: blur(4px); animation: ghostBreathe 1.2s infinite alternate;
  }
  .ghost-eyes {
    position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 20px;
  }
  .ghost-eye {
    width: 12px; height: 16px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 10px #ff0000;
  }
  @keyframes ghostBreathe {
    0% { transform: scale(0.95); opacity: 0.8; }
    100% { transform: scale(1.05); opacity: 1; }
  }

  /* 頂部 HUD */
  .hud-header {
    height: 48px; background: rgba(13, 17, 23, 0.9);
    border-bottom: 2px solid #30363d; display: flex;
    justify-content: space-between; align-items: center;
    padding: 0 16px; z-index: 1000; position: absolute; top: 0; left: 0; width: 100%;
  }
  .hud-title {
    font-size: 13px; letter-spacing: 2px; color: #ff5555; font-weight: bold;
    display: flex; align-items: center; gap: 8px;
  }
  .pulse-dot {
    width: 8px; height: 8px; background: #ff2222; border-radius: 50%;
    box-shadow: 0 0 8px #ff0000; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* 底部面板與對講機 */
  .hud-footer {
    height: 140px; background: rgba(13, 17, 23, 0.95);
    border-top: 2px solid #30363d; padding: 10px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    z-index: 1000;
  }
  .radio-channel {
    display: flex; justify-content: space-between; font-size: 11px; color: #f0883e;
  }
  .radio-bubble {
    background: #161b22; border: 1px solid #21262d; border-left: 3px solid #ff5555;
    padding: 6px 10px; font-size: 12px; color: #c9d1d9; line-height: 1.4;
    min-height: 44px; border-radius: 4px;
  }
  .controls { display: flex; justify-content: space-between; align-items: center; }

  .btn-action {
    background: #b62324; border: 1px solid #e05252; color: #fff;
    padding: 8px 16px; font-size: 12px; font-weight: bold; border-radius: 4px;
    cursor: pointer;
  }

  /* 開場視窗 */
  #modal-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #050508; z-index: 3000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #modal-mask h1 { color: #ff4444; font-size: 22px; margin-bottom: 12px; }
  #modal-mask p { font-size: 13px; color: #8b949e; line-height: 1.6; margin-bottom: 22px; max-width: 380px; }
  .btn-main {
    background: #b62324; border: none; color: #fff; padding: 12px 28px;
    font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="viewport-rig">
  <div class="hud-header">
    <div class="hud-title">
      <div class="pulse-dot"></div>
      <span>MAPILLARY 真實街景靈異調查</span>
    </div>
    <div id="gps-status" style="font-size: 11px; color: #8b949e;">GPS: 定位中...</div>
  </div>

  <!-- Mapillary 街景畫布 -->
  <div id="mly-container"></div>
  <div class="vhs-overlay"></div>
  <div class="center-crosshair"></div>

  <!-- 惡靈實體 -->
  <div id="ghost-anchor" onclick="onGhostDefeated()">
    <div class="ghost-shadow"></div>
    <div class="ghost-eyes">
      <div class="ghost-eye"></div>
      <div class="ghost-eye"></div>
    </div>
  </div>

  <!-- 底部面板 -->
  <div class="hud-footer">
    <div class="radio-channel">
      <span>對講機 [CH-9] 隊長</span>
      <span style="color: #00ff88;">引擎: MapillaryJS (100% 免卡)</span>
    </div>
    <div class="radio-bubble" id="radio-msg">
      「正在透過真實 GPS 搜尋你身旁的道路實景……滑動畫面環顧街道尋找惡靈！」
    </div>
    <div class="controls">
      <div id="status-desc" style="font-size: 12px; color: #58a6ff;">街景狀態: 搜尋中...</div>
      <button class="btn-action" onclick="onGhostDefeated()">⚡ 封印驅魔 ⚡</button>
    </div>
  </div>

  <!-- 開場視窗 -->
  <div id="modal-mask">
    <h1>靜安怪談：Mapillary 實景篇</h1>
    <p>
      <b>完全免信用卡・免付費方案！</b><br>
      本關卡調用 Meta Mapillary 開源道路全景圖資。<br>
      點擊下方按鈕，系統將自動定位抓取你真實身處的街道！
    </p>
    <button class="btn-main" onclick="startExperience()">授權 GPS 進入街道</button>
  </div>
</div>

<script>
// ⭐ 請將此處替換為你在 Mapillary 免費取得的 Client Token
const MAPILLARY_CLIENT_TOKEN = "YMLY|28733254389675887|86d28fb76c4cd708f49749d1d979baf4";

// 備用街景 ID（台北市中心實景，若當前位置無街景時無縫使用）
const BACKUP_IMAGE_ID = "498763468214164";

let mlyViewer = null;
let currentCoords = { lat: 25.0418, lng: 121.5436 }; // 預設台北座標
let ghostHeading = 45; // 惡靈固定在街景東北方 45 度

function startExperience() {
  document.getElementById('modal-mask').style.display = 'none';

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentCoords.lat = pos.coords.latitude;
        currentCoords.lng = pos.coords.longitude;
        document.getElementById('gps-status').innerText =
          `GPS: ${currentCoords.lat.toFixed(4)}, ${currentCoords.lng.toFixed(4)}`;
        searchNearbyStreetImage(currentCoords.lat, currentCoords.lng);
      },
      () => {
        document.getElementById('gps-status').innerText = "GPS: 模擬台北信義區";
        searchNearbyStreetImage(currentCoords.lat, currentCoords.lng);
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else {
    searchNearbyStreetImage(currentCoords.lat, currentCoords.lng);
  }
}

// 1. 使用 Mapillary Graph API 透過經緯度邊界盒（bbox）搜尋周圍 150m 內最近的真實道路照片
async function searchNearbyStreetImage(lat, lng) {
  const delta = 0.0015; // 約 150 公尺半徑
  const bbox = `${lng - delta},${lat - delta},${lng + delta},${lat + delta}`;
  const url = `https://graph.mapillary.com/images?access_token=${MAPILLARY_CLIENT_TOKEN}&fields=id,geometry&bbox=${bbox}&limit=1`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.data && data.data.length > 0) {
      const bestImageId = data.data[0].id;
      loadMapillaryViewer(bestImageId, "【已成功抓取你身旁的真實道路街景！】");
    } else {
      // 周圍暫無資料時，優雅退回經典實景
      loadMapillaryViewer(BACKUP_IMAGE_ID, "【周圍深巷無街景車圖資，已為你載入最近的幹道實景！】");
    }
  } catch (err) {
    console.warn("API 查詢異常，切換至備用街景:", err);
    loadMapillaryViewer(BACKUP_IMAGE_ID, "【已連線至備用街景結界！】");
  }
}

// 2. 初始化 MapillaryJS 3D 全景瀏覽器
function loadMapillaryViewer(imageId, hintMsg) {
  const { Viewer } = mapillary;

  mlyViewer = new Viewer({
    accessToken: MAPILLARY_CLIENT_TOKEN,
    container: 'mly-container',
    imageId: imageId,
    component: {
      cover: false,
      direction: false,
      sequence: false
    }
  });

  document.getElementById('radio-msg').innerText = hintMsg;
  document.getElementById('status-desc').innerText = `街景 ID: ${imageId}`;

  // 監聽視角旋轉（POV Changed），同步惡靈在街景畫面的座標
  mlyViewer.on('pov', updateGhostOverlay);
  window.addEventListener('resize', updateGhostOverlay);
  updateGhostOverlay();
}

// 3. 視角投影運算：將世界方位角（Heading）動態投影至 2D 螢幕，釘在真實建築物上
function updateGhostOverlay() {
  if (!mlyViewer) return;

  mlyViewer.getPointOfView().then(pov => {
    const stage = document.getElementById('viewport-rig');
    const w = stage.clientWidth;
    const h = stage.clientHeight;

    // 計算水平角度差並維持在 [-180, 180]
    let diff = ghostHeading - (pov.bearing || 0);
    while (diff < -180) diff += 360;
    while (diff > 180) diff -= 360;

    const ghostEl = document.getElementById('ghost-anchor');
    const hFov = 75; // Mapillary 預設視野約 75 度

    if (Math.abs(diff) < hFov / 2) {
      const screenX = (w / 2) + (diff / (hFov / 2)) * (w / 2);
      ghostEl.style.display = 'block';
      ghostEl.style.left = `${screenX}px`;
      ghostEl.style.top = `${h * 0.52}px`;
    } else {
      ghostEl.style.display = 'none';
    }
  });
}

function onGhostDefeated() {
  alert("【除靈成功！】潛伏在真實道路上的惡靈已被徹底驅散！");
  // 隨機切換惡靈方位，繼續下一輪搜查
  ghostHeading = (ghostHeading + 120 + Math.random() * 60) % 360;
  updateGhostOverlay();
}
</script>
</body>
</html>
