<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南港高工電影欣賞社-影片欣賞學習單</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas for export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased py-8 px-4 sm:px-6">

  <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-100">
    
    <!-- 頂部標題區 -->
    <div class="bg-gradient-to-r from-indigo-600 to-blue-600 px-6 py-8 text-white text-center">
      <span class="inline-block bg-white/20 text-xs font-semibold px-3 py-1 rounded-full mb-2 tracking-wide">🎬 互動學習單</span>
      <h1 class="text-2xl sm:text-3xl font-bold">南港高工電影欣賞社-影片欣賞學習單</h1>
      <p class="text-indigo-100 text-sm mt-2">請帶著思考觀賞影片，認真記錄你的觀點與收穫</p>
    </div>

    <!-- 表單本體 -->
    <form id="worksheetForm" class="p-6 sm:p-10 space-y-8">
      
      <!-- 基本資料 (已將班級與學號獨立分開) -->
      <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">班級 *</label>
          <input type="text" id="studentClass" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例：重一忠">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">學號 *</label>
          <input type="text" id="studentId" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例：115XXXXX">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">學生姓名 *</label>
          <input type="text" id="studentName" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="請輸入姓名">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">觀看日期 *</label>
          <input type="date" id="watchDate" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <!-- 影片基本資料 -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 flex items-center gap-2">
          <span class="w-2 h-6 bg-indigo-600 rounded-full inline-block"></span> 影片基本資料
        </h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">影片名稱 *</label>
            <input type="text" id="videoTitle" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="輸入影片或短片名稱">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">影片類型/主題</label>
            <select id="videoType" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
              <option value="紀錄片">紀錄片</option>
              <option value="劇情片">劇情片</option>
              <option value="動畫短片">動畫短片</option>
              <option value="TED 演說">TED 演說</option>
              <option value="商業廣告/宣導片">商業廣告/宣導片</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 第一部分：觀影前熱身 -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 flex items-center gap-2">
          <span class="w-2 h-6 bg-indigo-600 rounded-full inline-block"></span> 第一部分：觀影前熱身
        </h2>
        
        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">1. 看到這個影片標題或簡介，你覺得這部片最想探討的是什麼？你對這個主題原本有什麼既定印象？</label>
          <textarea id="q1" rows="3" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="請寫下你的預測與既有認知..."></textarea>
        </div>
      </div>

      <!-- 第二部分：觀影中捕捉 -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 flex items-center gap-2">
          <span class="w-2 h-6 bg-indigo-600 rounded-full inline-block"></span> 第二部分：觀影中捕捉
        </h2>
        
        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">2. 核心衝突：影片中的主角（或講者）遇到了什麼主要問題或挑戰？他是怎麼面對的？</label>
          <textarea id="q2" rows="3" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="描述主角面臨的困境與應對方式..."></textarea>
        </div>

        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">3. 印象最深刻的一幕：請寫下對你視覺 or 心理衝擊最大的一個畫面，並說明原因：</label>
          <textarea id="q3" rows="3" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="畫面描述與觸動原因..."></textarea>
        </div>
      </div>

      <!-- 第三部分：深度思考與對話 -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 flex items-center gap-2">
          <span class="w-2 h-6 bg-indigo-600 rounded-full inline-block"></span> 第三部分：深度思考與對話
        </h2>
        
        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">4. 觀點碰撞：影片中是否有哪個觀點是你最認同或最不認同的？為什麼？</label>
          <textarea id="q4" rows="3" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="寫下你的贊同或批判觀點..."></textarea>
        </div>

        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">5. 角色抉擇：如果今天換作是你處在主角的位子，你會做出一樣的選擇嗎？你會怎麼做？</label>
          <textarea id="q5" rows="3" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="假如是你，你會採取什麼不同的行動？"></textarea>
        </div>
      </div>

      <!-- 第四部分：行動與反思 -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 flex items-center gap-2">
          <span class="w-2 h-6 bg-indigo-600 rounded-full inline-block"></span> 第四部分：行動與反思
        </h2>
        
        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">6. 金句摘錄：請抄下一句影片中最觸動你心弦的話（或自己寫一句總結）：</label>
          <input type="text" id="q6" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="「觸動人心的話語...」">
        </div>

        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">7. 生活連結：看完這部影片後，它如何改變了你看待某件事的眼光或態度？</label>
          <textarea id="q7" rows="3" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="對個人或日常生活的啟發..."></textarea>
        </div>

        <div class="space-y-3">
          <label class="block text-sm font-semibold text-slate-700">8. 我的下一步：接下來的這週，你可以在生活中實踐的一個小改變或行動是什麼？</label>
          <textarea id="q8" rows="3" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="具體想嘗試的行動..."></textarea>
        </div>
      </div>

      <!-- 提交按鈕區 -->
      <div class="pt-6 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
        <p id="statusMsg" class="text-sm font-medium text-slate-500"></p>
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <button type="button" id="exportBtn" class="w-full sm:w-auto px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-all text-center">
            📸 截圖儲存
          </button>
          <button type="submit" id="submitBtn" class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-200 transition-all text-center">
            🚀 傳送繳交作業
          </button>
        </div>
      </div>

    </form>
  </div>

  <!-- JavaScript 邏輯與串接 -->
  <script>
    // ⚠️ 請將下方引號中的網址替換為你的 Google Apps Script 網頁應用程式網址
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    // 自動帶入今天日期
    document.getElementById('watchDate').valueAsDate = new Date();

    // 提交表單事件
    document.getElementById('worksheetForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      submitBtn.disabled = true;
      submitBtn.textContent = "傳送中...";
      statusMsg.textContent = "正在將作答資料寫入後台試算表，請稍候...";
      statusMsg.className = "text-sm font-medium text-indigo-600";

      // 蒐集所有欄位資料（包含獨立的班級與學號）
      const formData = {
        studentClass: document.getElementById('studentClass').value,
        studentId: document.getElementById('studentId').value,
        studentName: document.getElementById('studentName').value,
        watchDate: document.getElementById('watchDate').value,
        videoTitle: document.getElementById('videoTitle').value,
        videoType: document.getElementById('videoType').value,
        q1: document.getElementById('q1').value,
        q2: document.getElementById('q2').value,
        q3: document.getElementById('q3').value,
        q4: document.getElementById('q4').value,
        q5: document.getElementById('q5').value,
        q6: document.getElementById('q6').value,
        q7: document.getElementById('q7').value,
        q8: document.getElementById('q8').value
      };

      // 透過 fetch 發送 POST 請求至 Google Apps Script
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Google Apps Script 跨域標準設定
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      })
      .then(() => {
        statusMsg.textContent = "🎉 作業繳交成功！資料已自動收錄至老師的試算表後台。";
        statusMsg.className = "text-sm font-bold text-emerald-600";
        submitBtn.textContent = "已成功繳交";
        submitBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-indigo-200');
        submitBtn.classList.add('bg-emerald-600', 'cursor-not-allowed');
      })
      .catch((error) => {
        console.error('Error:', error);
        statusMsg.textContent = "❌ 傳送失敗，請檢查網路連線或聯絡老師。";
        statusMsg.className = "text-sm font-bold text-rose-600";
        submitBtn.disabled = false;
        submitBtn.textContent = "🚀 重新傳送繳交";
      });
    });

    // 截圖功能
    document.getElementById('exportBtn').addEventListener('click', function() {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.textContent = "正在產生學習單截圖，請稍候...";
      statusMsg.className = "text-sm font-medium text-indigo-600";
      
      html2canvas(document.querySelector('.max-w-3xl'), { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${document.getElementById('studentClass').value}_${document.getElementById('studentId').value}_${document.getElementById('studentName').value || '學生'}_影片學習單.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        statusMsg.textContent = "📸 截圖已成功下載到您的裝置！";
        statusMsg.className = "text-sm font-bold text-emerald-600";
      });
    });
  </script>
</body>
</html>
