<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>校安危機處理模擬器｜今天也要平安下班</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --accent-blue: #38bdf8;
      --accent-gold: #fbbf24;
      --danger-red: #ef4444;
      --safe-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #020617;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* 手機直式 9:16 主舞台容器 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      max-height: 880px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 滿版角色與場景 CG 圖層（自動放大 1.07 倍隱藏右下角浮水印） */
    #full-cg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center 15%;
      transform: scale(1.07);
      transition: background-image 0.35s ease, filter 0.35s ease, transform 0.5s ease;
      z-index: 0;
    }

    /* 情緒濾鏡特效 */
    .filter-danger {
      filter: contrast(1.15) saturate(1.25) sepia(0.2) hue-rotate(-25deg);
    }

    .filter-tense {
      filter: contrast(1.1) brightness(0.92);
    }

    /* 上下漸層暗角，確保頂部血條與底部文字清晰可讀 */
    #scene-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(2, 6, 23, 0.82) 0%,
        rgba(2, 6, 23, 0.05) 24%,
        rgba(2, 6, 23, 0.1) 52%,
        rgba(2, 6, 23, 0.92) 78%,
        rgba(2, 6, 23, 0.98) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .screen-shake {
      animation: shake 0.38s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: scale(1.07) translateX(0); }
      20% { transform: scale(1.09) translateX(-10px); }
      40% { transform: scale(1.09) translateX(10px); }
      60% { transform: scale(1.08) translateX(-6px); }
      80% { transform: scale(1.08) translateX(6px); }
    }

    /* 頂部狀態欄：壓力值血條 & 地點資訊 */
    #hud-top {
      position: relative;
      z-index: 10;
      padding: 14px 16px 10px;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .location-badge {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .audio-btn {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .stress-wrapper {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .stress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
    }

    #stress-bar-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease;
    }

    /* 中央留白區（讓出空間完整展示豆包插畫主角上半身與表情） */
    #visual-spacer {
      flex: 1;
      z-index: 2;
      pointer-events: none;
    }

    /* 底部對話框與選項互動區 */
    #dialogue-panel {
      position: relative;
      z-index: 15;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 22px 22px 0 0;
      padding: 16px 18px 24px;
      box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.75);
    }

    .speaker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    #speaker-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    #speaker-role {
      font-size: 11px;
      color: #e2e8f0;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 2px 8px;
      border-radius: 4px;
    }

    #dialogue-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-main);
      min-height: 74px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    /* 選項按鈕列表 */
    #choices-container {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #f8fafc;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .choice-btn:active {
      transform: scale(0.98);
      background: rgba(56, 189, 248, 0.28);
      border-color: var(--accent-blue);
    }

    .choice-tag {
      font-size: 11px;
      color: var(--accent-blue);
      margin-left: 8px;
      white-space: nowrap;
      font-weight: 700;
    }

    /* 封面與結局遮罩畫面 */
    .overlay-screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: rgba(2, 6, 23, 0.86);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 24px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .cover-tag {
      color: var(--accent-gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      background: rgba(251, 191, 36, 0.1);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .cover-title {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #ffffff, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .primary-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
      transition: transform 0.15s ease;
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    .ending-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .ending-good { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .ending-bad { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .ending-hidden { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 滿版角色插畫 CG 圖層 -->
  <div id="full-cg-layer" style="background-image: url('./officer.jpg');"></div>
  <div id="scene-vignette"></div>

  <!-- 頂部 HUD 狀態列 -->
  <div id="hud-top">
    <div class="hud-row">
      <span id="location-label" class="location-badge">📍 學務處／學安室・16:45</span>
      <button id="audio-toggle" class="audio-btn" onclick="toggleAudio()">🔊 音效開</button>
    </div>
    <div class="stress-wrapper">
      <div class="stress-header">
        <span>校安人員壓力指數</span>
        <span id="stress-text" style="color: #4ade80;">20%（冷靜可控）</span>
      </div>
      <div class="stress-bar-bg">
        <div id="stress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- 中央視覺留白區 -->
  <div id="visual-spacer"></div>

  <!-- 底部對話框與選項 -->
  <div id="dialogue-panel">
    <div class="speaker-row">
      <span id="speaker-name">系統提示</span>
      <span id="speaker-role">事件紀錄</span>
    </div>
    <div id="dialogue-text" onclick="handleDialogueClick()">點擊開始執勤...</div>
    <div id="choices-container"></div>
  </div>

  <!-- 開場封面（背景直接展示校安人員帥氣立繪） -->
  <div id="start-screen" class="overlay-screen">
    <div class="cover-tag">CAMPUS SAFETY SIMULATOR</div>
    <h1 class="cover-title">校園安全危機處理<br>：放學前的突發衝突</h1>
    <p class="cover-desc">
      距離下班只剩 15 分鐘，辦公室大門卻被氣勢洶洶的家長推開。<br>
      身為第一線校安人員，你的每一個應對與蒐證決策，都將決定事態走向與多重結局。
    </p>
    <button class="primary-btn" onclick="startGame()">佩戴對講機・開始值勤</button>
  </div>

  <!-- 結局結算畫面 -->
  <div id="ending-screen" class="overlay-screen hidden">
    <div id="ending-type" class="ending-badge ending-good">S 級完美結局</div>
    <h2 id="ending-title" class="cover-title">危機化解・準時打卡下班</h2>
    <p id="ending-desc" class="cover-desc">結局說明文字</p>
    <button class="primary-btn" onclick="startGame()">重新挑戰其他分支</button>
  </div>
</div>

<script>
  // ==========================================
  // 1. 圖片與視角焦點設定（對應你的兩張豆包圖片）
  // ==========================================
  const CG_PROFILES = {
    officer: {
      name: "陳宇（你）",
      role: "校安人員",
      img: "./officer.jpg",
      focus: "center 18%", // 聚焦校安人員臉部與「校安人員」背心
      filter: ""
    },
    parent_smirk: {
      name: "王先生",
      role: "囂張家長",
      img: "./parent.jpg",
      focus: "center 10%", // 針對全身立繪，鏡頭往上移聚焦臉部與西裝上半身
      filter: ""
    },
    parent_angry: {
      name: "王先生",
      role: "情緒激動家長",
      img: "./parent.jpg",
      focus: "center 8%",
      filter: "filter-danger" // 透過紅光高對比濾鏡強化怒氣張力
    },
    parent_shock: {
      name: "王先生",
      role: "臉色大變家長",
      img: "./parent.jpg",
      focus: "center 12%",
      filter: "filter-tense"
    }
  };

  // ==========================================
  // 2. 劇本節點與多重結局分支資料
  // ==========================================
  const STORY_NODES = {
    start: {
      location: "📍 辦公室・16:45",
      profile: "parent_smirk",
      shake: true,
      sound: "alert",
      text: "「砰！」辦公室大門被推開。一名身穿高級西裝、戴著金絲眼鏡的男子單手插兜走了進來，嘴角帶著傲慢冷笑：「你們校安怎麼當的？剛才在穿堂攔下我兒子的車，害他差點趕不上補習！」",
      choices: [
        { text: "保持冷靜並開啟執勤密錄器，先請家長到會談區就座", stressDelta: -5, next: "calm_record", tag: "標準SOP" },
        { text: "立刻正面反駁：「是你兒子無照騎車衝進校園！」", stressDelta: +30, next: "argue_back", tag: "正面硬剛" },
        { text: "低頭道歉息事寧人，答應不記違規直接放行", stressDelta: +20, next: "give_in", tag: "妥協退讓" }
      ]
    },

    calm_record: {
      location: "📍 校園穿堂・16:48",
      profile: "officer",
      shake: false,
      sound: "click",
      text: "你眼神沉穩地按了一下腰間無線電與密錄器：「王先生您好，為了保障雙方權益，現場全程錄音錄影。我們直接調閱校門口的雲端監控畫面確認經過。」",
      choices: [
        { text: "調出即時雲端影像，客觀說明人車分流安全規範", stressDelta: -10, next: "show_cctv", tag: "證據說話" },
        { text: "順便警告他若再干擾執勤就直接通報轄區派出所", stressDelta: +25, next: "threat_police", tag: "語氣過激" }
      ]
    },

    argue_back: {
      location: "📍 辦公室・16:47",
      profile: "parent_angry",
      shake: true,
      sound: "danger",
      text: "王先生聽到「無照」二字臉色一沉，舉起手機對著你錄影：「好啊！一個看大門的態度這麼囂張，我現在就發上網路，再打給你們校董會林總！」",
      choices: [
        { text: "深呼吸退後一步，無線電呼叫學務主任支援並隔離圍觀學生", stressDelta: +10, next: "director_arrive", tag: "緊急止血" },
        { text: "伸手去搶家長正在錄影的手機要求刪除", stressDelta: +50, next: "ending_bad_grab", tag: "高風險行為" }
      ]
    },

    give_in: {
      location: "📍 校門口穿堂・16:50",
      profile: "officer",
      shake: true,
      sound: "alert",
      text: "你剛放行不到兩分鐘，穿堂突然傳來刺耳煞車聲！該名學生騎車險些擦撞放學路隊，你立刻衝上前吹哨攔停並通報學務處啟動緊急應變。",
      choices: [
        { text: "坦承疏失並完整登記違規與交通組協助處理", stressDelta: +15, next: "ending_normal_report", tag: "補救處置" }
      ]
    },

    show_cctv: {
      location: "📍 監控中控螢幕前・16:52",
      profile: "parent_shock",
      shake: true,
      sound: "success",
      text: "螢幕清晰顯示：剛才該名學生高速衝過斑馬線，差點撞上一年級新生，是你及時攔停才避免事故。王先生看著畫面額頭冒汗，傲慢的笑容瞬間僵住……",
      choices: [
        { text: "給予台階下：依校規完成安全輔導登記，並提醒接送動線", stressDelta: -5, next: "ending_perfect", tag: "完美收尾" },
        { text: "發現畫面角落還有一名戴鴨舌帽的黑衣人趁亂翻牆進入校園！", stressDelta: +15, next: "ending_hidden_intruder", tag: "隱藏線索" }
      ]
    },

    threat_police: {
      location: "📍 辦公室・16:51",
      profile: "parent_angry",
      shake: true,
      sound: "alert",
      text: "家長聽到報警立刻情緒失控拍桌，學務主任聞聲趕來打圓場。雖然最後順利登記違規，但家長隔天仍投訴了溝通態度問題。",
      choices: [
        { text: "完成書面事件紀錄表並提交檢討報告", stressDelta: 0, next: "ending_normal_report", tag: "完成勤務" }
      ]
    },

    director_arrive: {
      location: "📍 校園穿堂・16:55",
      profile: "officer",
      shake: false,
      sound: "click",
      text: "學務主任迅速到場協助疏散圍觀學生並安撫家長；你則冷靜備份了校門口監視器畫面作為佐證，成功化解公關危機。",
      choices: [
        { text: "填寫校安事件紀錄表，結束驚險的一天", stressDelta: -10, next: "ending_normal_report", tag: "平安下班" }
      ]
    },

    // ==========================================
    // 3. 多重結局定義
    // ==========================================
    ending_perfect: {
      isEnding: true,
      badgeClass: "ending-good",
      badgeText: "S 級完美結局｜專業典範",
      title: "證據說話・準時平安下班",
      desc: "你全程遵守校安 SOP，情緒穩定、密錄器與監視器證據完整，不僅讓家長心服口服簽下安全切結書，還守護了放學師生安全。17:00 準時打卡下班！"
    },
    ending_normal_report: {
      isEnding: true,
      badgeClass: "ending-good",
      badgeText: "B 級普通結局｜有驚無險",
      desc: "雖然過程中一度陷入溝通僵局與壓力飆升，但最終仍透過團隊協作與監視器佐證完成事件處置。記得下次第一時間開啟密錄器與影像佐證會更輕鬆！"
    },
    ending_bad_grab: {
      isEnding: true,
      badgeClass: "ending-bad",
      badgeText: "D 級危機結局｜公關風暴",
      desc: "在未經同意下伸手碰觸家長手機引發肢體拉扯，畫面被旁人拍下上傳網路，演變成嚴重投訴事件，今晚得留下來寫三千字事件檢討報告了……"
    },
    ending_hidden_intruder: {
      isEnding: true,
      badgeClass: "ending-hidden",
      badgeText: "★ 隱藏懸疑結局｜第 2 集開啟",
      title: "發現校外可疑人士入侵！",
      desc: "你敏銳地從監視器角落發現趁亂翻牆進入的鴨舌帽黑衣人！你立刻按下無線電全校通報啟動門禁封鎖——真正的校園安全守護戰現在才剛開始！"
    }
  };

  // ==========================================
  // 4. 遊戲狀態與音效引擎
  // ==========================================
  let stress = 20;
  let audioEnabled = true;
  let typingTimer = null;
  let isTyping = false;
  let currentFullText = "";

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(type) {
    if (!audioEnabled) return;
    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === "click") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(620, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === "alert" || type === "danger") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(140, now + 0.25);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === "success") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.start(now);
      osc.stop(now + 0.28);
    }
  }

  function toggleAudio() {
    audioEnabled = !audioEnabled;
    document.getElementById("audio-toggle").textContent = audioEnabled ? "🔊 音效開" : "🔇 靜音";
  }

  function updateStressUI() {
    stress = Math.max(0, Math.min(100, stress));
    const fill = document.getElementById("stress-bar-fill");
    const label = document.getElementById("stress-text");

    fill.style.width = stress + "%";
    if (stress < 40) {
      fill.style.background = "linear-gradient(90deg, #22c55e, #38bdf8)";
      label.style.color = "#4ade80";
      label.textContent = `${stress}%（冷靜可控）`;
    } else if (stress < 75) {
      fill.style.background = "linear-gradient(90deg, #eab308, #f97316)";
      label.style.color = "#fbbf24";
      label.textContent = `${stress}%（氣氛緊繃）`;
    } else {
      fill.style.background = "linear-gradient(90deg, #ef4444, #b91c1c)";
      label.style.color = "#f87171";
      label.textContent = `${stress}%（瀕臨失控！）`;
    }
  }

  function startGame() {
    stress = 20;
    updateStressUI();
    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("ending-screen").classList.add("hidden");
    playTone("click");
    renderNode("start");
  }

  function renderNode(nodeId) {
    const node = STORY_NODES[nodeId];
    if (!node) return;

    if (node.isEnding) {
      const endScreen = document.getElementById("ending-screen");
      const badge = document.getElementById("ending-type");
      badge.className = "ending-badge " + node.badgeClass;
      badge.textContent = node.badgeText;
      document.getElementById("ending-title").textContent = node.title;
      document.getElementById("ending-desc").textContent = node.desc;
      endScreen.classList.remove("hidden");
      return;
    }

    document.getElementById("location-label").textContent = node.location;
    if (node.sound) playTone(node.sound);

    // 切換滿版豆包圖片與視角焦點
    const prof = CG_PROFILES[node.profile] || CG_PROFILES.officer;
    document.getElementById("speaker-name").textContent = prof.name;
    document.getElementById("speaker-role").textContent = prof.role;

    const cgLayer = document.getElementById("full-cg-layer");
    cgLayer.style.backgroundImage = `url('${prof.img}')`;
    cgLayer.style.backgroundPosition = prof.focus;
    cgLayer.className = prof.filter || "";

    if (node.shake) {
      void cgLayer.offsetWidth;
      cgLayer.classList.add("screen-shake");
    }

    const choicesBox = document.getElementById("choices-container");
    choicesBox.innerHTML = "";
    typeWriter(node.text, () => {
      renderChoices(node.choices);
    });
  }

  function typeWriter(text, onComplete) {
    clearInterval(typingTimer);
    isTyping = true;
    currentFullText = text;
    const textEl = document.getElementById("dialogue-text");
    textEl.textContent = "";
    let idx = 0;

    typingTimer = setInterval(() => {
      textEl.textContent += text.charAt(idx);
      idx++;
      if (idx >= text.length) {
        clearInterval(typingTimer);
        isTyping = false;
        if (onComplete) onComplete();
      }
    }, 24);
  }

  function handleDialogueClick() {
    if (isTyping) {
      clearInterval(typingTimer);
      isTyping = false;
      document.getElementById("dialogue-text").textContent = currentFullText;
    }
  }

  function renderChoices(choices) {
    const choicesBox = document.getElementById("choices-container");
    choicesBox.innerHTML = "";

    choices.forEach((choice) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = `
        <span>${choice.text}</span>
        <span class="choice-tag">${choice.tag || ""}</span>
      `;
      btn.onclick = () => {
        playTone("click");
        stress += choice.stressDelta || 0;
        updateStressUI();

        if (stress >= 100) {
          renderNode("ending_bad_grab");
        } else {
          renderNode(choice.next);
        }
      };
      choicesBox.appendChild(btn);
    });
  }
</script>
</body>
</html>
