<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>毛孩星光餐廳 - 開羅風經營模擬</title>
    <!-- 引入繁體中文像素/圓體字型與 Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --kairo-bg: #f5ebd6;
            --kairo-panel: #fff9eb;
            --kairo-border: #5c3a21;
            --kairo-accent: #e87a3e;
            --kairo-accent-dark: #b8531e;
            --kairo-green: #58a65c;
            --kairo-blue: #4a90e2;
            --kairo-gold: #f5b82e;
            --kairo-pink: #f06595;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #3d2817;
            background-image: radial-gradient(#4f3520 2px, transparent 2px);
            background-size: 16px 16px;
            font-family: 'DotGothic16', 'Noto Sans TC', sans-serif;
            color: #3e2716;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 開羅風經典像素邊框與立體按鈕 */
        .kairo-box {
            background-color: var(--kairo-panel);
            border: 4px solid var(--kairo-border);
            border-radius: 10px;
            box-shadow: 0 4px 0 #3b2312, inset 0 2px 0 rgba(255, 255, 255, 0.8);
        }

        .kairo-header-bar {
            background: linear-gradient(180deg, #ffcf6e 0%, #f5a623 100%);
            border-bottom: 4px solid var(--kairo-border);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        }

        .kairo-btn {
            background: linear-gradient(180deg, #ffffff 0%, #f0e2c8 100%);
            border: 3px solid var(--kairo-border);
            border-radius: 8px;
            box-shadow: 0 3px 0 var(--kairo-border);
            transition: transform 0.06s, box-shadow 0.06s, filter 0.1s;
            cursor: pointer;
            font-weight: 700;
        }

        .kairo-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 0 0 var(--kairo-border);
        }

        .kairo-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        .kairo-btn-orange {
            background: linear-gradient(180deg, #ff9b54 0%, #e86f2c 100%);
            color: #fff;
            text-shadow: 1px 1px 0 #7a2e08;
        }

        .kairo-btn-green {
            background: linear-gradient(180deg, #74c678 0%, #4b9e4f 100%);
            color: #fff;
            text-shadow: 1px 1px 0 #1f5422;
        }

        .kairo-btn-blue {
            background: linear-gradient(180deg, #6eb5ff 0%, #3d85d6 100%);
            color: #fff;
            text-shadow: 1px 1px 0 #184273;
        }

        .kairo-tab {
            background-color: #d8c3a0;
            border: 3px solid var(--kairo-border);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            color: #5c3a21;
            transition: all 0.1s;
        }

        .kairo-tab.active {
            background-color: var(--kairo-panel);
            color: #d94e1f;
            transform: translateY(3px);
            padding-bottom: 10px;
            z-index: 10;
        }

        /* 畫布容器與像素渲染設定 */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            max-height: 54vh;
            background-color: #2d4c2b;
            border: 4px solid var(--kairo-border);
            border-radius: 12px;
            box-shadow: 0 6px 0 #2b190d;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 跑馬燈動畫 */
        .ticker-wrap {
            background-color: #3e2716;
            color: #ffe89e;
            border: 3px solid #754c29;
            border-radius: 6px;
            overflow: hidden;
            white-space: nowrap;
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e6d5b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #9c6f44;
            border-radius: 4px;
            border: 1px solid #5c3a21;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="select-none">

    <!-- 頂部開羅風資訊列 -->
    <header class="kairo-header-bar px-2 py-1.5 sm:px-4 sm:py-2 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <!-- 店名與星級 -->
            <div class="flex items-center gap-2">
                <div class="bg-[#5c3a21] text-[#ffdf73] px-2.5 py-1 rounded-lg border-2 border-[#fff3d1] text-sm sm:text-base font-bold tracking-wider shadow">
                    🐾 毛孩星光餐廳
                </div>
                <div class="bg-white/90 border-2 border-[#5c3a21] px-2 py-0.5 rounded-lg flex items-center gap-1 text-xs sm:text-sm font-bold">
                    <span class="text-amber-500">★</span>
                    <span id="ui-rating">1.2</span>
                    <span class="text-gray-500 hidden sm:inline">評價</span>
                </div>
            </div>

            <!-- 時間與營業日 -->
            <div class="flex items-center gap-1.5 sm:gap-2 bg-[#fff9eb] border-2 border-[#5c3a21] px-2.5 py-1 rounded-lg text-xs sm:text-sm font-bold">
                <span class="text-[#b8531e]" id="ui-day">第 1 天</span>
                <span class="text-gray-400">|</span>
                <span id="ui-clock" class="font-mono text-base text-[#3e2716]">09:00</span>
                <span id="ui-period-badge" class="bg-amber-200 text-amber-900 px-1.5 py-0.2 rounded text-xs">早午餐</span>
            </div>

            <!-- 資源顯示：金幣 & 愛心研究點 -->
            <div class="flex items-center gap-2">
                <div class="bg-[#3e2716] text-[#ffd447] border-2 border-[#8c5a32] px-2.5 py-1 rounded-lg flex items-center gap-1 text-xs sm:text-sm font-bold shadow-inner">
                    <span>💰</span>
                    <span id="ui-gold">1,200</span>
                </div>
                <div class="bg-[#3e2716] text-[#ff85b3] border-2 border-[#8c5a32] px-2.5 py-1 rounded-lg flex items-center gap-1 text-xs sm:text-sm font-bold shadow-inner">
                    <span>💖</span>
                    <span id="ui-hearts">35</span>
                </div>
            </div>

            <!-- 遊戲速度與音效控制 -->
            <div class="flex items-center gap-1">
                <button id="btn-speed-0" onclick="setGameSpeed(0)" class="kairo-btn px-2 py-1 text-xs" title="暫停">⏸</button>
                <button id="btn-speed-1" onclick="setGameSpeed(1)" class="kairo-btn kairo-btn-green px-2 py-1 text-xs" title="正常速度">▶ 1x</button>
                <button id="btn-speed-2" onclick="setGameSpeed(2)" class="kairo-btn px-2 py-1 text-xs" title="兩倍速">⏩ 2x</button>
                <button id="btn-sound" onclick="toggleSound()" class="kairo-btn px-2 py-1 text-xs ml-1" title="切換音效與音樂">🔊</button>
            </div>
        </div>
    </header>

    <!-- 主遊戲區塊 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-2 sm:p-3 flex flex-col gap-2.5">
        
        <!-- 經營快報跑馬燈 & 快捷狀態 -->
        <div class="flex items-center gap-2">
            <div class="ticker-wrap flex-1 px-3 py-1 text-xs sm:text-sm flex items-center gap-2">
                <span class="bg-[#e87a3e] text-white px-1.5 py-0.5 rounded text-xs font-bold shrink-0">快報</span>
                <span id="ui-news" class="truncate">歡迎來到毛孩星光餐廳！點擊下方按鈕擴建餐桌、研發寵物鮮食，吸引更多飼主光臨吧！</span>
            </div>
            <button onclick="openStatsModal()" class="kairo-btn px-2.5 py-1 text-xs sm:text-sm shrink-0 flex items-center gap-1">
                📊 <span class="hidden sm:inline">經營數據</span>
            </button>
        </div>

        <!-- 像素餐廳主畫布 -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <!-- 左上角即時營業資訊浮標 -->
            <div class="absolute top-2 left-2 bg-[#3e2716]/85 text-white px-2.5 py-1 rounded-lg border border-[#a87948] text-xs flex items-center gap-3 pointer-events-none">
                <span>🪑 座位: <b id="hud-seats" class="text-amber-300">2/2</b></span>
                <span>👥 客數: <b id="hud-customers" class="text-emerald-300">0</b></span>
                <span>🐾 魅力: <b id="hud-appeal" class="text-pink-300">25</b></span>
            </div>
            <!-- 右下角操作提示 -->
            <div class="absolute bottom-2 right-2 bg-black/60 text-amber-100 px-2 py-0.5 rounded text-[11px] pointer-events-none">
                點擊餐廳內毛孩或客人可互動打氣 ✨
            </div>
        </div>

        <!-- 下方開羅風經營管理面板 -->
        <section class="flex-1 flex flex-col min-h-[260px]">
            <!-- 分頁標籤列 -->
            <div class="flex items-end gap-1 sm:gap-2 px-1">
                <button onclick="switchTab('facilities')" id="tab-facilities" class="kairo-tab active px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1">
                    🏠 <span>設施與裝潢</span>
                </button>
                <button onclick="switchTab('menu')" id="tab-menu" class="kairo-tab px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1">
                    🍽️ <span>菜單研發</span>
                </button>
                <button onclick="switchTab('staff')" id="tab-staff" class="kairo-tab px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1">
                    🐾 <span>員工與毛孩</span>
                </button>
                <button onclick="switchTab('system')" id="tab-system" class="kairo-tab px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1 ml-auto">
                    ⚙️ <span>存檔/說明</span>
                </button>
            </div>

            <!-- 分頁內容盒 -->
            <div class="kairo-box p-3 flex-1 overflow-y-auto">
                <div id="panel-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5">
                    <!-- 由 JavaScript 動態渲染卡片 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 每日營業結算彈窗 (開羅風經典報表) -->
    <div id="eod-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="kairo-box max-w-md w-full p-5 modal-animate relative bg-[#fff9eb]">
            <div class="bg-[#e87a3e] text-white text-center py-2 px-4 rounded-lg border-3 border-[#5c3a21] -mt-9 mb-4 shadow-md">
                <h2 class="text-lg sm:text-xl font-bold tracking-wider" id="eod-title">🌙 第 1 天 營業結算報告</h2>
            </div>

            <div class="space-y-2.5 text-sm sm:text-base">
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded-lg border-2 border-[#d4be98]">
                    <span>👥 接待顧客總數</span>
                    <span class="font-bold text-[#3e2716]" id="eod-customers">0 組</span>
                </div>
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded-lg border-2 border-[#d4be98]">
                    <span>🐶 服務毛孩數量</span>
                    <span class="font-bold text-[#b8531e]" id="eod-pets">0 隻</span>
                </div>
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded-lg border-2 border-[#d4be98]">
                    <span>💰 今日營業收入</span>
                    <span class="font-bold text-amber-600" id="eod-revenue">+$0</span>
                </div>
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded-lg border-2 border-[#d4be98]">
                    <span>💖 獲得愛心研究點</span>
                    <span class="font-bold text-pink-600" id="eod-hearts">+0</span>
                </div>
                <div class="flex justify-between items-center bg-[#fff3cd] px-3 py-2 rounded-lg border-2 border-[#e0b84c]">
                    <span>★ 餐廳目前星級評價</span>
                    <span class="font-bold text-amber-600 text-lg" id="eod-rating">★ 1.2</span>
                </div>
            </div>

            <div class="mt-4 p-2.5 bg-emerald-50 border-2 border-emerald-300 rounded-lg text-xs text-emerald-900" id="eod-comment">
                💡 評語：溫馨的小店剛起步，添購更多寵物設施與鮮食能吸引大批毛孩家庭喔！
            </div>

            <div class="mt-5 flex justify-center">
                <button onclick="startNextDay()" class="kairo-btn kairo-btn-green w-full py-3 text-base sm:text-lg tracking-wider">
                    ☀️ 開始新的一天！
                </button>
            </div>
        </div>
    </div>

    <!-- 經營數據與圖鑑彈窗 -->
    <div id="stats-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="kairo-box max-w-md w-full p-5 modal-animate">
            <div class="flex justify-between items-center border-b-2 border-[#5c3a21] pb-2 mb-3">
                <h3 class="text-lg font-bold">📊 餐廳累計經營數據</h3>
                <button onclick="closeStatsModal()" class="kairo-btn px-2.5 py-0.5 text-sm">✕</button>
            </div>
            <div class="space-y-2 text-sm" id="stats-body"></div>
            <div class="mt-4 text-right">
                <button onclick="closeStatsModal()" class="kairo-btn kairo-btn-orange px-4 py-1.5 text-sm">關閉</button>
            </div>
        </div>
    </div>

    <!-- 浮動提示訊息框 (替代 alert) -->
    <div id="toast-container" class="fixed top-16 right-3 z-50 flex flex-col gap-1.5 pointer-events-none"></div>

/**
 * ============================================================================
 * 2. Web Audio API 8-Bit 溫馨背景音樂與音效合成器
 * ============================================================================
 */
class RetroAudio {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmTimer = null;
        this.noteIndex = 0;
        // 輕快治癒的 C 大調開羅風旋律 (頻率 Hz)
        this.melody = [
            523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46,
            523.25, 659.25, 783.99, 1046.50, 987.77, 783.99, 659.25, 587.33
        ];
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                this.ctx = new AudioCtx();
            }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    startBGM() {
        if (this.bgmTimer) return;
        this.bgmTimer = setInterval(() => {
            if (this.muted || gameSpeed === 0 || isEndOfDayModalOpen) return;
            this.init();
            if (!this.ctx) return;

            const freq = this.melody[this.noteIndex % this.melody.length];
            this.noteIndex++;
            this.playTone(freq, 'triangle', 0.14, 0.035);
        }, 420);
    }

    playTone(freq, type = 'sine', duration = 0.12, volume = 0.08, slideTo = null) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
            }

            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
    }

    playCoin() {
        this.playTone(987.77, 'square', 0.08, 0.06);
        setTimeout(() => this.playTone(1318.51, 'square', 0.18, 0.06), 70);
    }

    playHeart() {
        this.playTone(659.25, 'sine', 0.1, 0.07, 880);
    }

    playUpgrade() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.12, 0.08), idx * 65);
        });
    }

    playPetSound() {
        // 可愛的汪/喵高音滑音
        this.playTone(520, 'triangle', 0.12, 0.07, 780);
    }
}

function loadGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            const def = createDefaultState();
            return {
                ...def,
                ...parsed,
                dailyStats: { ...def.dailyStats, ...(parsed.dailyStats || {}) },
                facilities: { ...def.facilities, ...(parsed.facilities || {}) },
                menu: { ...def.menu, ...(parsed.menu || {}) },
                staffPets: { ...def.staffPets, ...(parsed.staffPets || {}) }
            };
        }
    } catch (e) {
        console.warn('讀取存檔失敗，使用預設進度', e);
    }
    return createDefaultState();
}

function saveGame(showMsg = false) {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
        if (showMsg) showToast('💾 遊戲進度已儲存！', 'bg-emerald-600');
    } catch (e) {}
}

function resetGameProgress() {
    // 使用自訂確認狀態避免 window.confirm
    const btn = document.getElementById('btn-reset-confirm');
    if (btn && btn.dataset.armed !== 'true') {
        btn.dataset.armed = 'true';
        btn.textContent = '⚠️ 再點一次確定重置所有進度';
        btn.classList.add('kairo-btn-orange');
        setTimeout(() => {
            if (btn) {
                btn.dataset.armed = 'false';
                btn.textContent = '🗑️ 重置存檔（重新開始）';
                btn.classList.remove('kairo-btn-orange');
            }
        }, 4000);
        return;
    }
    localStorage.removeItem(SAVE_KEY);
    gameState = createDefaultState();
    initEntities();
    renderPanel();
    updateTopHUD();
    showToast('🔄 已重置為第 1 天全新開始！', 'bg-amber-600');
}

function showToast(msg, colorClass = 'bg-[#5c3a21]') {

    el.className = `${colorClass} text-white px-3 py-1.5 rounded-lg border-2 border-[#fff3d1] shadow-lg text-xs sm:text-sm font-bold modal-animate`;

// 計算餐廳目前總魅力值
function getTotalAppeal() {
    let appeal = 15;
    FACILITIES_DB.forEach(f => {
        const lv = gameState.facilities[f.id] || 0;
        if (lv > 0) appeal += f.appeal + (lv - 1) * 6;
    });
    STAFF_PETS_DB.forEach(sp => {
        const lv = gameState.staffPets[sp.id] || 0;
        if (lv > 0 && sp.kind === 'mascot') {
            appeal += lv * 8;
        }
    });
    return appeal;
}

// 計算已解鎖座位清單
function getActiveTables() {
    return FACILITIES_DB.filter(f => f.category === 'seat' && (gameState.facilities[f.id] || 0) > 0);
}

// 計算菜單單品目前售價
function getDishPrice(dish) {
    const lv = gameState.menu[dish.id] || 0;
    if (lv <= 0) return dish.basePrice;
    const machineLv = gameState.facilities.espresso_machine || 0;
    const machineBonus = 1 + machineLv * 0.06;
    return Math.round((dish.basePrice * (1 + (lv - 1) * 0.25)) * machineBonus);
}

// 輔助移動函式
function moveTowards(entity, tx, ty, speed, dt) {
    const dx = tx - entity.x;
    const dy = ty - entity.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= speed * dt || dist < 1.5) {
        entity.x = tx;
        entity.y = ty;
        return true;
    }
    entity.x += (dx / dist) * speed * dt;
    entity.y += (dy / dist) * speed * dt;
    entity.animPhase += dt * 10;
    return false;
}

/**
 * ============================================================================
 * 5. 主遊戲模擬更新迴圈 (Simulation Update)
 * ============================================================================
 */
function updateSimulation(dt) {
    if (gameSpeed === 0 || isEndOfDayModalOpen) return;

    const scaledDt = dt * gameSpeed;

    // 1. 推進遊戲時鐘 (1 現實秒 = 8 遊戲分鐘 -> 12 小時營業約 90 秒)
    gameState.timeMinutes += scaledDt * 8;
    if (gameState.timeMinutes >= 21 * 60) {
        gameState.timeMinutes = 21 * 60;
        triggerEndOfDay();
        return;
    }

    // 2. 根據魅力值與餐桌數量自動生成客人
    const appeal = getTotalAppeal();
    const spawnInterval = Math.max(2.6, 7.5 - appeal * 0.035);
    spawnTimer -= scaledDt;
    if (spawnTimer <= 0) {
        spawnCustomer();
        spawnTimer = spawnInterval;
    }

    // 3. 更新主廚烹飪邏輯
    const chef = staffEntities.find(s => s.role === 'chef');
    if (chef) {
        const chefLv = gameState.staffPets.chef_leo || 1;
        const machineLv = gameState.facilities.espresso_machine || 0;
        const cookDuration = Math.max(0.9, 2.6 - chefLv * 0.16 - machineLv * 0.12);

        if (!chef.cookingOrder && kitchenOrders.length > 0) {
            chef.cookingOrder = kitchenOrders.shift();
            chef.cookTimer = cookDuration;
        }

        if (chef.cookingOrder) {
            chef.animPhase += scaledDt * 12;
            chef.cookTimer -= scaledDt;
            if (Math.random() < scaledDt * 4) {
                spawnSmokeParticle(chef.x, chef.y - 16);
            }
            if (chef.cookTimer <= 0) {
                readyDishes.push(chef.cookingOrder);
                chef.cookingOrder = null;
            }
        }
    }

    // 4. 更新外場店員 AI (送餐 > 收桌 > 待機)
    staffEntities.filter(s => s.role === 'waiter').forEach((waiter, idx) => {
        const lv = gameState.staffPets[waiter.id] || 1;
        const moveSpeed = 95 + lv * 14;

        if (waiter.state === 'idle') {
            // 優先檢查櫃檯是否有做好的餐點
            if (readyDishes.length > 0) {
                waiter.state = 'to_counter';
                waiter.targetX = POS.counterPickup.x;
                waiter.targetY = POS.counterPickup.y;
                return;
            }
            // 其次檢查是否有髒桌子需要清理
            const dirtyTable = tablesState.find(t =>
                t.dirty && !staffEntities.some(other => other !== waiter && other.targetTableId === t.id)
            );
            if (dirtyTable) {
                waiter.state = 'to_table_clean';
                waiter.targetTableId = dirtyTable.id;
                waiter.targetX = dirtyTable.x;
                waiter.targetY = dirtyTable.y - 24;
                return;
            }
            // 回到待機點
            moveTowards(waiter, POS.staffIdle.x + idx * 34, POS.staffIdle.y, moveSpeed * 0.7, scaledDt);
        } else if (waiter.state === 'to_counter') {
            if (moveTowards(waiter, waiter.targetX, waiter.targetY, moveSpeed, scaledDt)) {
                if (readyDishes.length > 0) {
                    const dishOrder = readyDishes.shift();
                    const table = tablesState.find(t => t.id === dishOrder.tableId);
                    if (table && table.occupiedBy) {
                        waiter.carryingDish = dishOrder;
                        waiter.targetTableId = table.id;
                        waiter.state = 'to_table_deliver';
                        waiter.targetX = table.x;
                        waiter.targetY = table.y - 24;
                    } else {
                        waiter.state = 'idle';
                    }
                } else {
                    waiter.state = 'idle';
                }
            }
        } else if (waiter.state === 'to_table_deliver') {
            if (moveTowards(waiter, waiter.targetX, waiter.targetY, moveSpeed, scaledDt)) {
                const cust = customers.find(c => c.tableId === waiter.targetTableId && c.state === 'waiting_food');
                if (cust) {
                    cust.state = 'eating';
                    cust.eatTimer = 4.2;
                    spawnHeartParticle(cust.x, cust.y - 16);
                }
                waiter.carryingDish = null;
                waiter.targetTableId = null;
                waiter.state = 'idle';
            }
        } else if (waiter.state === 'to_table_clean') {
            if (moveTowards(waiter, waiter.targetX, waiter.targetY, moveSpeed, scaledDt)) {
                const table = tablesState.find(t => t.id === waiter.targetTableId);
                if (table && table.dirty) {
                    table.cleanProgress += scaledDt * (1.2 + lv * 0.25);
                    waiter.animPhase += scaledDt * 15;
                    if (table.cleanProgress >= 1.0) {
                        table.dirty = false;
                        table.cleanProgress = 0;
                        waiter.targetTableId = null;
                        waiter.state = 'idle';
                    }
                } else {
                    waiter.targetTableId = null;
                    waiter.state = 'idle';
                }
            }
        }
    });

    // 5. 更新顧客與隨行毛孩 AI
    const activeTables = getActiveTables();
    for (let i = customers.length - 1; i >= 0; i--) {
        const c = customers[i];
        const custSpeed = 82;

        if (c.state === 'entering' || c.state === 'waiting') {
            moveTowards(c, c.targetX, c.targetY, custSpeed, scaledDt);
            // 尋找空桌
            const freeTable = tablesState.find(t =>
                activeTables.some(at => at.id === t.id) && !t.occupiedBy && !t.dirty
            );
            if (freeTable) {
                freeTable.occupiedBy = c.id;
                c.tableId = freeTable.id;
                c.state = 'to_seat';
                c.targetX = freeTable.x - 22;
                c.targetY = freeTable.y;
            } else {
                c.state = 'waiting';
            }
        } else if (c.state === 'to_seat') {
            if (moveTowards(c, c.targetX, c.targetY, custSpeed, scaledDt)) {
                c.state = 'ordering';
                c.thinkTimer = 1.4;
            }
        } else if (c.state === 'ordering') {
            c.thinkTimer -= scaledDt;
            if (c.thinkTimer <= 0) {
                // 挑選已解鎖的人類餐點與寵物鮮食
                const unlockedHuman = MENU_DB.filter(m => m.type === 'human' && (gameState.menu[m.id] || 0) > 0);
                const unlockedPet = MENU_DB.filter(m => m.type === 'pet' && (gameState.menu[m.id] || 0) > 0);

                c.humanDish = unlockedHuman[Math.floor(Math.random() * unlockedHuman.length)];
                let bill = getDishPrice(c.humanDish);

                if (c.hasPet && unlockedPet.length > 0) {
                    c.petDish = unlockedPet[Math.floor(Math.random() * unlockedPet.length)];
                    bill += getDishPrice(c.petDish);
                }

                // 設施與毛孩小費加成
                let tipMultiplier = 1.0;
                if (c.tableId === 'table_3') tipMultiplier += 0.10;
                if (c.tableId === 'table_4') tipMultiplier += 0.20;
                if ((gameState.facilities.pet_fountain || 0) > 0) tipMultiplier += 0.08 * gameState.facilities.pet_fountain;
                const shibaLv = gameState.staffPets.pet_doudou || 0;
                if (shibaLv > 0) tipMultiplier += shibaLv * 0.05;

                c.totalBill = Math.round(bill * tipMultiplier);
                c.state = 'waiting_food';
                kitchenOrders.push({
                    tableId: c.tableId,
                    humanDish: c.humanDish,
                    petDish: c.petDish
                });
            }
        } else if (c.state === 'eating') {
            c.eatTimer -= scaledDt;
            if (Math.random() < scaledDt * 1.5) {
                spawnHeartParticle(c.x + 12, c.y - 12);
            }
            if (c.eatTimer <= 0) {
                // 結帳離開！
                gameState.gold += c.totalBill;
                gameState.totalRevenue += c.totalBill;
                gameState.dailyStats.revenue += c.totalBill;
                gameState.totalCustomers += 1;
                gameState.dailyStats.customers += 1;

                let heartGain = c.hasPet ? 3 : 1;
                if ((gameState.facilities.grass_zone || 0) > 0 && c.hasPet) heartGain += 1;
                gameState.hearts += heartGain;
                gameState.dailyStats.hearts += heartGain;

                if (c.hasPet) {
                    gameState.totalPetsServed += 1;
                    gameState.dailyStats.pets += 1;
                }

                // 評價微幅上升
                gameState.rating = Math.min(5.0, +(gameState.rating + 0.025).toFixed(2));

                addFloatingText(c.x, c.y - 26, `+$${c.totalBill}`, '#ffd447');
                addFloatingText(c.x + 18, c.y - 42, `+${heartGain}💖`, '#ff85b3');
                audio.playCoin();

                const table = tablesState.find(t => t.id === c.tableId);
                if (table) {
                    table.occupiedBy = null;
                    table.dirty = true;
                    table.cleanProgress = 0;
                }
                c.state = 'leaving';
                c.targetX = POS.door.x;
                c.targetY = POS.door.y;
            }
        } else if (c.state === 'leaving') {
            if (moveTowards(c, c.targetX, c.targetY, custSpeed * 1.1, scaledDt)) {
                customers.splice(i, 1);
                continue;
            }
        }

        // 更新隨行毛孩跟隨位置
        if (c.hasPet) {
            let ptx = c.x - 18;
            let pty = c.y + 10;
            if (c.state === 'ordering' || c.state === 'waiting_food' || c.state === 'eating') {
                // 坐下時毛孩乖乖待在餐桌右側地面
                ptx = c.x + 42;
                pty = c.y + 6;
            }
            c.petX += (ptx - c.petX) * Math.min(1, scaledDt * 6);
            c.petY += (pty - c.petY) * Math.min(1, scaledDt * 6);
        }
    }

    // 6. 更新駐店毛孩巡邏與治癒愛心光環
    mascotEntities.forEach(m => {
        const lv = gameState.staffPets[m.id] || 1;
        m.waitTimer -= scaledDt;
        if (m.waitTimer <= 0) {
            if (moveTowards(m, m.targetX, m.targetY, 42 + lv * 4, scaledDt)) {
                // 抵達後休息一下並重新挑選草皮區或餐桌走道目標
                m.waitTimer = 1.5 + Math.random() * 2;
                const goGrass = (gameState.facilities.grass_zone || 0) > 0 && Math.random() < 0.65;
                if (goGrass) {
                    m.targetX = 595 + Math.random() * 110;
                    m.targetY = 175 + Math.random() * 115;
                } else {
                    m.targetX = 280 + Math.random() * 280;
                    m.targetY = 155 + Math.random() * 190;
                }
            }
        }

        // 定期產生愛心研究點
        m.heartTimer -= scaledDt;
        if (m.heartTimer <= 0) {
            m.heartTimer = Math.max(3.5, 8.5 - lv * 0.6);
            const bonusHearts = 1 + Math.floor(lv / 3);
            gameState.hearts += bonusHearts;
            gameState.dailyStats.hearts += bonusHearts;
            spawnHeartParticle(m.x, m.y - 12);
            addFloatingText(m.x, m.y - 20, `+${bonusHearts}💖`, '#ff9ec4');
        }
    });

    // 7. 更新飄浮文字與粒子
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 24 * scaledDt;
        ft.life -= scaledDt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * scaledDt;
        p.y += p.vy * scaledDt;
        p.life -= scaledDt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/**
 * ============================================================================
 * 6. 開羅風高精緻像素繪圖引擎 (HTML5 Canvas Renderer)
 * ============================================================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const wrapper = document.getElementById('canvas-wrapper');
    if (!wrapper) return;
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
}
window.addEventListener('resize', resizeCanvas);

// 繪製圓角氣泡框
function drawSpeechBubble(x, y, iconText, bgColor = '#ffffff', borderColor = '#5c3a21') {
    ctx.save();
    ctx.fillStyle = bgColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 2.5;

    const w = 34;
    const h = 24;
    const bx = x - w / 2;
    const by = y - h - 18;

    ctx.beginPath();
    ctx.roundRect(bx, by, w, h, 6);
    ctx.fill();
    ctx.stroke();

    // 氣泡小尾巴
    ctx.beginPath();
    ctx.moveTo(x - 4, by + h);
    ctx.lineTo(x, by + h + 5);
    ctx.lineTo(x + 4, by + h);
    ctx.fill();
    ctx.stroke();

    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(iconText, x, by + h / 2 + 1);
    ctx.restore();
}

// 繪製可愛像素小人 (主廚、店員、客人)
function drawPixelPerson(x, y, options = {}) {
    const {
        shirtColor = '#4a90e2',
        hairColor = '#3e2716',
        isChef = false,
        isWaiter = false,
        animPhase = 0,
        carrying = false
    } = options;

    const bob = Math.abs(Math.sin(animPhase)) * 2.5;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

    // 腳底陰影
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(0, 12, 10, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 身體
    ctx.fillStyle = isChef ? '#ffffff' : (isWaiter ? '#e87a3e' : shirtColor);
    ctx.fillRect(-7, -4 - bob, 14, 14);
    ctx.strokeStyle = '#2b190d';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-7, -4 - bob, 14, 14);

    // 圍裙細節
    if (isWaiter) {
        ctx.fillStyle = '#fff9eb';
        ctx.fillRect(-5, 1 - bob, 10, 8);
    }

    // 頭部
    ctx.fillStyle = '#ffdfc4';
    ctx.fillRect(-7, -18 - bob, 14, 14);
    ctx.strokeRect(-7, -18 - bob, 14, 14);

    // 頭髮或廚師帽
    if (isChef) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-8, -27 - bob, 16, 10);
        ctx.strokeRect(-8, -27 - bob, 16, 10);
    } else {
        ctx.fillStyle = hairColor;
        ctx.fillRect(-7, -19 - bob, 14, 5);
    }

    // 開羅風豆豆眼
    ctx.fillStyle = '#2b190d';
    ctx.fillRect(-4, -12 - bob, 2, 3);
    ctx.fillRect(2, -12 - bob, 2, 3);

    // 端盤子
    if (carrying) {
        ctx.fillStyle = '#d9a05b';
        ctx.fillRect(-10, -4 - bob, 20, 3);
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(0, -7 - bob, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

// 繪製可愛像素狗狗 / 貓咪
function drawPixelPet(x, y, species = 'shiba', animPhase = 0, nameTag = null) {
    const bob = Math.abs(Math.sin(animPhase * 1.2)) * 2;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

    // 陰影
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 7, 9, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    let bodyColor = '#e69d45';
    let bellyColor = '#fff6e5';
    let isCat = false;

    if (species === 'golden') { bodyColor = '#f2c166'; bellyColor = '#fff3d6'; }
    else if (species === 'shiba') { bodyColor = '#e07a35'; bellyColor = '#ffffff'; }
    else if (species === 'corgi') { bodyColor = '#d97b38'; bellyColor = '#ffffff'; }
    else if (species === 'poodle') { bodyColor = '#8c5332'; bellyColor = '#a66844'; }
    else if (species === 'husky') { bodyColor = '#6c7a89'; bellyColor = '#ffffff'; }
    else if (species === 'orange_cat') { bodyColor = '#f59b42'; bellyColor = '#fff0d4'; isCat = true; }
    else if (species === 'calico') { bodyColor = '#ffffff'; bellyColor = '#f08a3c'; isCat = true; }

    ctx.strokeStyle = '#2b190d';
    ctx.lineWidth = 1.5;

    // 尾巴
    const tailWag = Math.sin(animPhase * 3) * 3;
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-11, -3 - bob + tailWag * 0.4, 4, 5);

    // 身體
    ctx.fillRect(-8, -4 - bob, 15, 10);
    ctx.strokeRect(-8, -4 - bob, 15, 10);

    // 頭部
    ctx.fillRect(1, -11 - bob, 11, 10);
    ctx.strokeRect(1, -11 - bob, 11, 10);

    // 臉頰/吻部
    ctx.fillStyle = bellyColor;
    ctx.fillRect(5, -6 - bob, 6, 4);

    // 耳朵
    ctx.fillStyle = isCat ? '#d96b27' : '#5c3a21';
    if (isCat) {
        // 尖貓耳
        ctx.beginPath();
        ctx.moveTo(2, -11 - bob); ctx.lineTo(4, -16 - bob); ctx.lineTo(6, -11 - bob);
        ctx.moveTo(7, -11 - bob); ctx.lineTo(9, -16 - bob); ctx.lineTo(11, -11 - bob);
        ctx.fill();
    } else {
        ctx.fillRect(2, -14 - bob, 3, 4);
        ctx.fillRect(8, -14 - bob, 3, 4);
    }

    // 眼睛與鼻子
    ctx.fillStyle = '#1f1209';
    ctx.fillRect(4, -8 - bob, 2, 2);
    ctx.fillRect(9, -8 - bob, 2, 2);
    ctx.fillRect(10, -5 - bob, 2, 2);

    // 駐店毛孩名牌
    if (nameTag) {
        ctx.font = 'bold 10px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(62, 39, 22, 0.85)';
        ctx.fillRect(-22, -28 - bob, 48, 13);
        ctx.fillStyle = '#ffdf73';
        ctx.fillText(nameTag, 2, -18 - bob);
    }

    ctx.restore();
}

// 繪製整個餐廳場景
function renderScene() {
    if (!ctx) return;
    const scaleX = canvas.width / WORLD_W;
    const scaleY = canvas.height / WORLD_H;

    ctx.save();
    ctx.scale(scaleX, scaleY);

    // 1. 外部草地與木頭地板底色
    ctx.fillStyle = '#73a857';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // 餐廳室內主木地板 (x: 40~760, y: 40~455)
    ctx.fillStyle = '#e6c391';
    ctx.fillRect(40, 40, 720, 415);

    // 繪製木地板拼花紋路
    ctx.strokeStyle = '#cfa772';
    ctx.lineWidth = 1;
    for (let y = 40; y < 455; y += 22) {
        ctx.beginPath();
        ctx.moveTo(40, y);
        ctx.lineTo(760, y);
        ctx.stroke();
        const offset = (y / 22) % 2 === 0 ? 0 : 30;
        for (let x = 40 + offset; x < 760; x += 60) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 22);
            ctx.stroke();
        }
    }

    // 廚房黑白棋盤格地板 (x: 45~255, y: 45~245)
    const tileSize = 18;
    for (let gx = 45; gx < 252; gx += tileSize) {
        for (let gy = 45; gy < 243; gy += tileSize) {
            const isEven = (Math.floor(gx / tileSize) + Math.floor(gy / tileSize)) % 2 === 0;
            ctx.fillStyle = isEven ? '#f7f3eb' : '#d6cfc2';
            ctx.fillRect(gx, gy, tileSize, tileSize);
        }
    }

    // 2. 餐廳外牆與大門入口
    ctx.strokeStyle = '#5c3a21';
    ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, 720, 415);

    // 上方玻璃窗裝飾
    [320, 440, 560].forEach(wx => {
        ctx.fillStyle = '#a8e4ff';
        ctx.fillRect(wx, 34, 70, 12);
        ctx.strokeStyle = '#5c3a21';
        ctx.lineWidth = 3;
        ctx.strokeRect(wx, 34, 70, 12);
    });

    // 入口迎賓地毯 (左下角)
    ctx.fillStyle = '#d9534f';
    ctx.fillRect(75, 435, 70, 24);
    ctx.strokeStyle = '#ffd447';
    ctx.lineWidth = 2;
    ctx.strokeRect(78, 438, 64, 18);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WELCOME', 110, 450);

    // 3. 廚房流理台、爐灶與出餐吧台
    // 爐灶區
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(55, 65, 130, 42);
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 3;
    ctx.strokeRect(55, 65, 130, 42);
    // 兩個爐火口
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(88, 86, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(130, 86, 11, 0, Math.PI * 2); ctx.fill();

    // 義式咖啡機 (若已解鎖)
    if ((gameState.facilities.espresso_machine || 0) > 0) {
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(150, 68, 28, 32);
        ctx.strokeStyle = '#2b190d';
        ctx.lineWidth = 2;
        ctx.strokeRect(150, 68, 28, 32);
        ctx.fillStyle = '#ecf0f1';
        ctx.fillRect(155, 74, 18, 10);
    }

    // L型出餐吧台
    ctx.fillStyle = '#8c5327';
    ctx.fillRect(240, 45, 22, 180);
    ctx.fillRect(45, 225, 217, 22);
    ctx.strokeStyle = '#4a2810';
    ctx.lineWidth = 3;
    ctx.strokeRect(240, 45, 22, 180);
    ctx.strokeRect(45, 225, 217, 22);

    // 吧台上的待送餐點盤子
    readyDishes.slice(0, 4).forEach((d, idx) => {
        const py = 120 + idx * 24;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(251, py, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#e87a3e';
        ctx.beginPath();
        ctx.arc(251, py, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    // 4. 繪製已解鎖的寵物設施 (草皮區、貓跳台、寵物飲水機)
    if ((gameState.facilities.grass_zone || 0) > 0) {
        ctx.fillStyle = '#68b849';
        ctx.beginPath();
        ctx.roundRect(575, 155, 150, 155, 14);
        ctx.fill();
        ctx.strokeStyle = '#3f7d29';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 草皮上的玩具球與小骨頭
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath(); ctx.arc(620, 260, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd447';
        ctx.beginPath(); ctx.arc(690, 195, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = 'bold 11px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🌿 毛孩遊戲區', 650, 173);
    }

    if ((gameState.facilities.cat_tower || 0) > 0) {
        const tx = 650, ty = 95;
        ctx.fillStyle = '#d4a373';
        ctx.strokeStyle = '#5c3a21';
        ctx.lineWidth = 2.5;
        // 底座與柱子
        ctx.fillRect(tx - 24, ty + 14, 48, 12);
        ctx.strokeRect(tx - 24, ty + 14, 48, 12);
        ctx.fillRect(tx - 6, ty - 28, 12, 42);
        ctx.strokeRect(tx - 6, ty - 28, 12, 42);
        // 貓窩平台
        ctx.fillStyle = '#faedcd';
        ctx.fillRect(tx - 20, ty - 34, 40, 10);
        ctx.strokeRect(tx - 20, ty - 34, 40, 10);
    }

    if ((gameState.facilities.pet_fountain || 0) > 0) {
        const fx = 245, fy = 315;
        ctx.fillStyle = '#4ea8de';
        ctx.strokeStyle = '#1d4e89';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(fx, fy, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#caf0f8';
        ctx.beginPath();
        ctx.arc(fx, fy, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    // 5. 繪製餐桌與椅子
    const activeTables = getActiveTables();
    tablesState.forEach(t => {
        const isUnlocked = activeTables.some(at => at.id === t.id);
        if (!isUnlocked) {
            // 未解鎖空地虛線框
            ctx.save();
            ctx.strokeStyle = 'rgba(92, 58, 33, 0.35)';
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 2;
            ctx.strokeRect(t.x - 26, t.y - 20, 52, 40);
            ctx.fillStyle = 'rgba(92, 58, 33, 0.45)';
            ctx.font = '11px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('可擴建座位', t.x, t.y + 4);
            ctx.restore();
            return;
        }

        // 左右兩張椅子
        ctx.fillStyle = '#a86432';
        ctx.strokeStyle = '#4a2810';
        ctx.lineWidth = 2;
        ctx.fillRect(t.x - 32, t.y - 10, 12, 20);
        ctx.strokeRect(t.x - 32, t.y - 10, 12, 20);
        ctx.fillRect(t.x + 20, t.y - 10, 12, 20);
        ctx.strokeRect(t.x + 20, t.y - 10, 12, 20);

        // 桌面
        ctx.fillStyle = t.id === 'table_4' ? '#f7d08a' : '#c97e42';
        ctx.beginPath();
        ctx.roundRect(t.x - 20, t.y - 18, 40, 36, 6);
        ctx.fill();
        ctx.stroke();

        // 桌布紋飾
        ctx.fillStyle = '#fff9eb';
        ctx.fillRect(t.x - 14, t.y - 12, 28, 24);

        // 桌上的食物或待清理餐盤
        const cust = customers.find(c => c.tableId === t.id);
        if (cust && cust.state === 'eating') {
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(cust.humanDish ? cust.humanDish.icon : '🍽️', t.x - 4, t.y + 4);
            if (cust.petDish) {
                // 寵物鮮食碗放在桌旁地面
                ctx.fillStyle = '#ff85b3';
                ctx.beginPath();
                ctx.arc(t.x + 32, t.y + 14, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (t.dirty) {
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🧹', t.x, t.y + 4);
        }
    });

    // 6. 依 Y 軸深度排序並繪製所有動態角色 (員工、駐店毛孩、顧客與顧客毛孩)
    const renderList = [];

    staffEntities.forEach(s => {
        renderList.push({
            y: s.y,
            draw: () => {
                drawPixelPerson(s.x, s.y, {
                    isChef: s.role === 'chef',
                    isWaiter: s.role === 'waiter',
                    animPhase: s.animPhase,
                    carrying: !!s.carryingDish
                });
                if (s.role === 'chef' && s.cookingOrder) {
                    drawSpeechBubble(s.x, s.y - 12, '🍳', '#fff3cd');
                }
            }
        });
    });

    mascotEntities.forEach(m => {
        const shortName = m.name.split('「')[1]?.replace('」', '') || m.name;
        renderList.push({
            y: m.y,
            draw: () => drawPixelPet(m.x, m.y, m.species, m.animPhase, shortName)
        });
    });

    customers.forEach(c => {
        renderList.push({
            y: c.y,
            draw: () => {
                drawPixelPerson(c.x, c.y, {
                    shirtColor: c.color,
                    animPhase: c.animPhase
                });
                // 頭頂氣泡提示狀態
                if (c.state === 'waiting') {
                    drawSpeechBubble(c.x, c.y - 6, '⏳', '#ffe8e8');
                } else if (c.state === 'ordering') {
                    drawSpeechBubble(c.x, c.y - 6, '💭', '#ffffff');
                } else if (c.state === 'waiting_food' && c.humanDish) {
                    drawSpeechBubble(c.x, c.y - 6, c.humanDish.icon, '#fff9eb');
                } else if (c.state === 'eating') {
                    drawSpeechBubble(c.x, c.y - 6, '😋', '#e8ffe8');
                }
            }
        });
        if (c.hasPet) {
            renderList.push({
                y: c.petY,
                draw: () => drawPixelPet(c.petX, c.petY, c.petType, c.animPhase)
            });
        }
    });

    renderList.sort((a, b) => a.y - b.y);
    renderList.forEach(item => item.draw());

    // 7. 繪製粒子與飄浮文字
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        if (p.type === 'heart') {
            ctx.font = '14px sans-serif';
            ctx.fillText('💖', p.x, p.y);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    });

    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.font = 'bold 14px "DotGothic16", "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#2b190d';
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });

    ctx.restore();
}

// 點擊畫布互動：撫摸毛孩或給客人打氣獲得愛心
canvas.addEventListener('click', (e) => {
    audio.init();
    audio.startBGM();
    const rect = canvas.getBoundingClientRect();
    const clickX = ((e.clientX - rect.left) / rect.width) * WORLD_W;
    const clickY = ((e.clientY - rect.top) / rect.height) * WORLD_H;

    // 檢查是否點到駐店毛孩
    for (const m of mascotEntities) {
        if (Math.hypot(clickX - m.x, clickY - m.y) < 32) {
            gameState.hearts += 1;
            gameState.dailyStats.hearts += 1;
            spawnHeartParticle(m.x, m.y - 12);
            addFloatingText(m.x, m.y - 24, '+1💖 撫摸打氣!', '#ff85b3');
            audio.playPetSound();
            updateTopHUD();
            return;
        }
    }

    // 檢查是否點到顧客的毛孩
    for (const c of customers) {
        if (c.hasPet && Math.hypot(clickX - c.petX, clickY - c.petY) < 28) {
            gameState.hearts += 1;
            gameState.dailyStats.hearts += 1;
            spawnHeartParticle(c.petX, c.petY - 10);
            addFloatingText(c.petX, c.petY - 22, '+1💖 好乖!', '#ff85b3');
            audio.playPetSound();
            updateTopHUD();
            return;
        }
    }
});

/**

function updateTopHUD() {
    document.getElementById('ui-rating').textContent = gameState.rating.toFixed(1);
    document.getElementById('ui-day').textContent = `第 ${gameState.day} 天`;

    const hrs = Math.floor(gameState.timeMinutes / 60);
    const mins = Math.floor(gameState.timeMinutes % 60);
    document.getElementById('ui-clock').textContent =
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

    const badge = document.getElementById('ui-period-badge');
    if (hrs < 11) { badge.textContent = '早午餐'; badge.className = 'bg-amber-200 text-amber-900 px-1.5 rounded text-xs'; }
    else if (hrs < 14) { badge.textContent = '午餐尖峰'; badge.className = 'bg-orange-200 text-orange-900 px-1.5 rounded text-xs'; }
    else if (hrs < 17) { badge.textContent = '下午茶'; badge.className = 'bg-pink-200 text-pink-900 px-1.5 rounded text-xs'; }
    else { badge.textContent = '星光晚餐'; badge.className = 'bg-indigo-200 text-indigo-900 px-1.5 rounded text-xs'; }

    document.getElementById('ui-gold').textContent = gameState.gold.toLocaleString();
    document.getElementById('ui-hearts').textContent = gameState.hearts.toLocaleString();

    const activeTables = getActiveTables();
    const occupiedCount = tablesState.filter(t => t.occupiedBy).length;
    document.getElementById('hud-seats').textContent = `${occupiedCount}/${activeTables.length}`;
    document.getElementById('hud-customers').textContent = customers.length;
    document.getElementById('hud-appeal').textContent = getTotalAppeal();
}

function setGameSpeed(speed) {
    audio.init();

    [0, 1, 2].forEach(s => {

        if (!btn) return;

}

}

/**
 * ============================================================================
 * 8. 購買、研發與每日結算操作邏輯
 * ============================================================================
 */
function buyOrUpgradeFacility(id) {
    const item = FACILITIES_DB.find(f => f.id === id);
    if (!item) return;
    const lv = gameState.facilities[id] || 0;
    if (lv >= item.maxLevel) return;

    const cost = lv === 0 ? item.baseCost : Math.round(item.upgradeCost * Math.pow(1.35, lv - 1));
    if (gameState.gold < cost) return;

    gameState.gold -= cost;
    gameState.facilities[id] = lv + 1;
    gameState.rating = Math.min(5.0, +(gameState.rating + 0.08).toFixed(2));

    audio.playUpgrade();
    showToast(`✨ ${item.name} 升至 Lv.${lv + 1}！`);
    setNews(`店內新裝修！「${item.name}」等級提升，餐廳魅力大幅上升！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

function researchMenu(id) {
    const dish = MENU_DB.find(m => m.id === id);
    if (!dish) return;
    const lv = gameState.menu[id] || 0;
    if (lv >= dish.maxLevel) return;

    const goldCost = lv === 0 ? dish.unlockGold : Math.round(dish.upgGold * Math.pow(1.3, lv - 1));
    const heartCost = lv === 0 ? dish.unlockHearts : Math.round(dish.upgHearts * Math.pow(1.25, lv - 1));

    if (gameState.gold < goldCost || gameState.hearts < heartCost) return;

    gameState.gold -= goldCost;
    gameState.hearts -= heartCost;
    gameState.menu[id] = lv + 1;
    gameState.rating = Math.min(5.0, +(gameState.rating + 0.06).toFixed(2));

    audio.playUpgrade();
    showToast(`🍽️ 「${dish.name}」研發成功 (Lv.${lv + 1})！`);
    setNews(`新菜單好評如潮！「${dish.name}」現在售價 $${getDishPrice(dish)}！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

function hireOrTrainStaffPet(id) {
    const sp = STAFF_PETS_DB.find(s => s.id === id);
    if (!sp) return;
    const lv = gameState.staffPets[id] || 0;
    if (lv >= sp.maxLevel) return;

    const cost = lv === 0 ? sp.unlockGold : Math.round(sp.upgGold * Math.pow(1.35, lv - 1));
    if (gameState.gold < cost) return;

    gameState.gold -= cost;
    gameState.staffPets[id] = lv + 1;

    syncDynamicEntities();
    if (sp.kind === 'mascot') audio.playPetSound();
    else audio.playUpgrade();

    showToast(`${sp.avatar} ${sp.name} 達到 Lv.${lv + 1}！`);
    setNews(`${sp.name} 幹勁十足，毛孩星光餐廳的服務品質更上一層樓！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

    if (gameState.dailyStats.revenue >= 1500) {
        commentEl.textContent = '🌟 評語：高朋滿座的奇蹟！整條街的飼主都在討論這家超棒的毛孩餐廳！';

    } else {
        commentEl.textContent = '💡 評語：溫馨的小店正穩步成長，擴建座位與草皮遊戲區能吸引更多客人喔！';
    }

    modal.classList.remove('hidden');
    modal.classList.add('flex');

function startNextDay() {
    gameState.day += 1;
    gameState.timeMinutes = 9 * 60;
    gameState.dailyStats = { revenue: 0, customers: 0, pets: 0, hearts: 0 };

    // 清空殘留客人與重置桌子狀態
    customers = [];
    kitchenOrders = [];
    readyDishes = [];
    tablesState.forEach(t => {
        t.occupiedBy = null;
        t.dirty = false;
        t.cleanProgress = 0;
    });

    isEndOfDayModalOpen = false;
    const modal = document.getElementById('eod-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');

    audio.playUpgrade();
    setNews(`☀️ 第 ${gameState.day} 天開始營業囉！祝今天也客似雲來！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

/**
 * ============================================================================
 * 9. 遊戲主動畫迴圈與啟動入口
 * ============================================================================
 */
let lastFrameTime = performance.now();
let uiSyncTimer = 0;

function gameLoop(now) {
    const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    updateSimulation(dt);
    renderScene();

    uiSyncTimer += dt;
    if (uiSyncTimer >= 0.25) {
        uiSyncTimer = 0;
        updateTopHUD();
    }

    requestAnimationFrame(gameLoop);
}

window.onload = function () {
    resizeCanvas();
    initEntities();
    updateTopHUD();
    renderPanel();
    requestAnimationFrame(gameLoop);
};
</script>
