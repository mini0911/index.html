<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>毛孩星光餐廳 - 開羅風2.5D像素經營模擬</title>
    <!-- 引入繁體中文像素/圓體字型與 Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --kairo-bg: #f5ebd6;
            --kairo-panel: #fff9eb;
            --kairo-border: #4a2c16;
            --kairo-accent: #e87a3e;
            --kairo-accent-dark: #b8531e;
            --kairo-green: #58a65c;
            --kairo-blue: #4a90e2;
            --kairo-gold: #f5b82e;
            --kairo-pink: #f06595;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #352213;
            background-image:
                linear-gradient(45deg, #3e2817 25%, transparent 25%),
                linear-gradient(-45deg, #3e2817 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #3e2817 75%),
                linear-gradient(-45deg, transparent 75%, #3e2817 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            font-family: 'DotGothic16', 'Noto Sans TC', sans-serif;
            color: #3e2716;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 開羅風經典像素邊框與立體按鈕 */
        .kairo-box {
            background-color: var(--kairo-panel);
            border: 4px solid var(--kairo-border);
            border-radius: 8px;
            box-shadow: 0 4px 0 #2b180a, inset 0 2px 0 rgba(255, 255, 255, 0.85);
        }

        .kairo-header-bar {
            background: linear-gradient(180deg, #ffd670 0%, #f5a623 100%);
            border-bottom: 4px solid var(--kairo-border);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
        }

        .kairo-btn {
            background: linear-gradient(180deg, #ffffff 0%, #efe0c4 100%);
            border: 3px solid var(--kairo-border);
            border-radius: 6px;
            box-shadow: 0 3px 0 var(--kairo-border);
            transition: transform 0.05s, box-shadow 0.05s, filter 0.1s;
            cursor: pointer;
            font-weight: 700;
        }

        .kairo-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 0 0 var(--kairo-border);
        }

        .kairo-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(0.65);
        }

        .kairo-btn-orange {
            background: linear-gradient(180deg, #ff9b54 0%, #e86f2c 100%);
            color: #fff;
            text-shadow: 1px 1px 0 #7a2e08;
        }

        .kairo-btn-green {
            background: linear-gradient(180deg, #74c678 0%, #4b9e4f 100%);
            color: #fff;
            text-shadow: 1px 1px 0 #1f5422;
        }

        .kairo-btn-blue {
            background: linear-gradient(180deg, #6eb5ff 0%, #3d85d6 100%);
            color: #fff;
            text-shadow: 1px 1px 0 #184273;
        }

        .kairo-tab {
            background-color: #d6be96;
            border: 3px solid var(--kairo-border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: #4a2c16;
            transition: all 0.08s;
        }

        .kairo-tab.active {
            background-color: var(--kairo-panel);
            color: #d94e1f;
            transform: translateY(3px);
            padding-bottom: 10px;
            z-index: 10;
        }

        /* 2.5D 像素畫布容器 */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            max-height: 55vh;
            background-color: #6ab04c;
            border: 4px solid var(--kairo-border);
            border-radius: 10px;
            box-shadow: 0 6px 0 #261408;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 跑馬燈動畫 */
        .ticker-wrap {
            background-color: #362011;
            color: #ffe89e;
            border: 3px solid #754c29;
            border-radius: 6px;
            overflow: hidden;
            white-space: nowrap;
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e6d5b8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #9c6f44;
            border-radius: 4px;
            border: 1px solid #4a2c16;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: popIn 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="select-none">

    <!-- 頂部開羅風資訊列 -->
    <header class="kairo-header-bar px-2 py-1.5 sm:px-4 sm:py-2 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <!-- 店名與星級 -->
            <div class="flex items-center gap-2">
                <div class="bg-[#4a2c16] text-[#ffdf73] px-2.5 py-1 rounded border-2 border-[#fff3d1] text-sm sm:text-base font-bold tracking-wider shadow">
                    🐾 毛孩星光餐廳
                </div>
                <div class="bg-white/95 border-2 border-[#4a2c16] px-2 py-0.5 rounded flex items-center gap-1 text-xs sm:text-sm font-bold">
                    <span class="text-amber-500">★</span>
                    <span id="ui-rating">1.2</span>
                    <span class="text-gray-500 hidden sm:inline">評價</span>
                </div>
            </div>

            <!-- 時間與營業日進度 -->
            <div class="flex items-center gap-1.5 sm:gap-2 bg-[#fff9eb] border-2 border-[#4a2c16] px-2.5 py-1 rounded text-xs sm:text-sm font-bold">
                <span class="text-[#b8531e]" id="ui-day">第 1 天</span>
                <span class="text-gray-400">|</span>
                <span id="ui-clock" class="font-mono text-base text-[#3e2716]">09:00</span>
                <span id="ui-period-badge" class="bg-amber-200 text-amber-900 px-1.5 py-0.2 rounded text-xs">早午餐</span>
            </div>

            <!-- 資源顯示：金幣 G & 愛心研究點 ♥ -->
            <div class="flex items-center gap-2">
                <div class="bg-[#362011] text-[#ffd447] border-2 border-[#8c5a32] px-2.5 py-1 rounded flex items-center gap-1 text-xs sm:text-sm font-bold shadow-inner">
                    <span>💰</span>
                    <span id="ui-gold">1,200</span>
                    <span class="text-[11px] text-amber-200">G</span>
                </div>
                <div class="bg-[#362011] text-[#ff85b3] border-2 border-[#8c5a32] px-2.5 py-1 rounded flex items-center gap-1 text-xs sm:text-sm font-bold shadow-inner">
                    <span>♥</span>
                    <span id="ui-hearts">35</span>
                </div>
            </div>

            <!-- 遊戲速度與音效控制 -->
            <div class="flex items-center gap-1">
                <button id="btn-speed-0" onclick="setGameSpeed(0)" class="kairo-btn px-2 py-1 text-xs" title="暫停">⏸</button>
                <button id="btn-speed-1" onclick="setGameSpeed(1)" class="kairo-btn kairo-btn-green px-2 py-1 text-xs" title="正常速度">▶ 1x</button>
                <button id="btn-speed-2" onclick="setGameSpeed(2)" class="kairo-btn px-2 py-1 text-xs" title="兩倍速">⏩ 2x</button>
                <button id="btn-sound" onclick="toggleSound()" class="kairo-btn px-2 py-1 text-xs ml-1" title="切換音效與音樂">🔊</button>
            </div>
        </div>
    </header>

    <!-- 主遊戲區塊 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-2 sm:p-3 flex flex-col gap-2.5">
        
        <!-- 經營快報跑馬燈 & 快捷狀態 -->
        <div class="flex items-center gap-2">
            <div class="ticker-wrap flex-1 px-3 py-1 text-xs sm:text-sm flex items-center gap-2">
                <span class="bg-[#e87a3e] text-white px-1.5 py-0.5 rounded text-xs font-bold shrink-0">快報</span>
                <span id="ui-news" class="truncate">歡迎來到毛孩星光餐廳！點擊下方按鈕擴建餐桌、研發寵物鮮食，吸引街上行人進店吧！</span>
            </div>
            <button onclick="openStatsModal()" class="kairo-btn px-2.5 py-1 text-xs sm:text-sm shrink-0 flex items-center gap-1">
                📊 <span class="hidden sm:inline">經營數據</span>
            </button>
        </div>

        <!-- 2.5D 開羅風斜視角餐廳主畫布 -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <!-- 左上角即時營業資訊浮標 -->
            <div class="absolute top-2 left-2 bg-[#362011]/90 text-white px-2.5 py-1 rounded border-2 border-[#a87948] text-xs flex items-center gap-3 pointer-events-none shadow">
                <span>🪑 座位: <b id="hud-seats" class="text-amber-300">2/2</b></span>
                <span>👥 客數: <b id="hud-customers" class="text-emerald-300">0</b></span>
                <span>🐾 人氣: <b id="hud-appeal" class="text-pink-300">25</b></span>
            </div>
            <!-- 右下角操作提示 -->
            <div class="absolute bottom-2 right-2 bg-[#362011]/85 text-amber-100 border border-[#8c5a32] px-2.5 py-0.5 rounded text-[11px] pointer-events-none">
                點擊店內毛孩或客人可互動打氣獲得 ♥
            </div>
        </div>

        <!-- 下方開羅風經營管理面板 -->
        <section class="flex-1 flex flex-col min-h-[255px]">
            <!-- 分頁標籤列 -->
            <div class="flex items-end gap-1 sm:gap-2 px-1">
                <button onclick="switchTab('facilities')" id="tab-facilities" class="kairo-tab active px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1">
                    🏠 <span>設施裝潢</span>
                </button>
                <button onclick="switchTab('menu')" id="tab-menu" class="kairo-tab px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1">
                    🍽️ <span>食譜研發</span>
                </button>
                <button onclick="switchTab('staff')" id="tab-staff" class="kairo-tab px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1">
                    🐾 <span>員工與毛孩</span>
                </button>
                <button onclick="switchTab('system')" id="tab-system" class="kairo-tab px-3 py-2 text-xs sm:text-sm font-bold flex items-center gap-1 ml-auto">
                    ⚙️ <span>存檔/秘訣</span>
                </button>
            </div>

            <!-- 分頁內容盒 -->

                <div id="panel-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5">
                    <!-- 由 JavaScript 動態渲染卡片 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 每日營業結算彈窗 (開羅風經典報表) -->
    <div id="eod-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="kairo-box max-w-md w-full p-5 modal-animate relative bg-[#fff9eb]">
            <div class="bg-[#e87a3e] text-white text-center py-2 px-4 rounded border-3 border-[#4a2c16] -mt-9 mb-4 shadow-md">
                <h2 class="text-lg sm:text-xl font-bold tracking-wider" id="eod-title">🌙 第 1 天 營業結算報告</h2>
            </div>

            <div class="space-y-2 text-sm sm:text-base">
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded border-2 border-[#d4be98]">
                    <span>👥 接待顧客總數</span>
                    <span class="font-bold text-[#3e2716]" id="eod-customers">0 組</span>
                </div>
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded border-2 border-[#d4be98]">
                    <span>🐶 服務毛孩數量</span>
                    <span class="font-bold text-[#b8531e]" id="eod-pets">0 隻</span>
                </div>
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded border-2 border-[#d4be98]">
                    <span>💰 今日營業收入</span>
                    <span class="font-bold text-amber-600" id="eod-revenue">+0G</span>
                </div>
                <div class="flex justify-between items-center bg-[#f5ebd6] px-3 py-2 rounded border-2 border-[#d4be98]">
                    <span>♥ 獲得愛心研究點</span>
                    <span class="font-bold text-pink-600" id="eod-hearts">+0♥</span>
                </div>
                <div class="flex justify-between items-center bg-[#fff3cd] px-3 py-2 rounded border-2 border-[#e0b84c]">
                    <span>★ 餐廳目前星級評價</span>
                    <span class="font-bold text-amber-600 text-lg" id="eod-rating">★ 1.2</span>
                </div>
            </div>

            <div class="mt-4 p-2.5 bg-emerald-50 border-2 border-emerald-300 rounded text-xs text-emerald-900" id="eod-comment">
                💡 評語：溫馨的小店剛起步，添購更多寵物設施與鮮食能吸引大批毛孩家庭喔！
            </div>

            <div class="mt-5 flex justify-center">
                <button onclick="startNextDay()" class="kairo-btn kairo-btn-green w-full py-3 text-base sm:text-lg tracking-wider">
                    ☀️ 開始新的一天！
                </button>
            </div>
        </div>
    </div>

    <!-- 經營數據與圖鑑彈窗 -->
    <div id="stats-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="kairo-box max-w-md w-full p-5 modal-animate">
            <div class="flex justify-between items-center border-b-2 border-[#4a2c16] pb-2 mb-3">
                <h3 class="text-lg font-bold">📊 餐廳累計經營數據</h3>
                <button onclick="closeStatsModal()" class="kairo-btn px-2.5 py-0.5 text-sm">✕</button>
            </div>
            <div class="space-y-2 text-sm" id="stats-body"></div>
            <div class="mt-4 text-right">
                <button onclick="closeStatsModal()" class="kairo-btn kairo-btn-orange px-4 py-1.5 text-sm">關閉</button>
            </div>
        </div>
    </div>

    <!-- 浮動提示訊息框 (替代 alert) -->
    <div id="toast-container" class="fixed top-16 right-3 z-50 flex flex-col gap-1.5 pointer-events-none"></div>

/**
 * ============================================================================
 * 2. Web Audio API 8-Bit 開羅風溫馨背景音樂與音效合成器
 * ============================================================================
 */
class RetroAudio {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmTimer = null;
        this.noteIndex = 0;
        this.melody = [
            523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46,
            523.25, 659.25, 783.99, 1046.50, 987.77, 783.99, 659.25, 587.33
        ];
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    startBGM() {
        if (this.bgmTimer) return;
        this.bgmTimer = setInterval(() => {
            if (this.muted || gameSpeed === 0 || isEndOfDayModalOpen) return;
            this.init();
            if (!this.ctx) return;

            const freq = this.melody[this.noteIndex % this.melody.length];
            this.noteIndex++;
            this.playTone(freq, 'triangle', 0.14, 0.032);
        }, 420);
    }

    playTone(freq, type = 'sine', duration = 0.12, volume = 0.08, slideTo = null) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
            }

            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
    }

    playCoin() {
        this.playTone(987.77, 'square', 0.08, 0.055);
        setTimeout(() => this.playTone(1318.51, 'square', 0.18, 0.055), 70);
    }

    playHeart() {
        this.playTone(659.25, 'sine', 0.1, 0.07, 880);
    }

    playUpgrade() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.12, 0.075), idx * 65);
        });
    }

    playPetSound() {
        this.playTone(520, 'triangle', 0.12, 0.07, 780);
    }
}

function loadGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            const def = createDefaultState();
            return {
                ...def,
                ...parsed,
                dailyStats: { ...def.dailyStats, ...(parsed.dailyStats || {}) },
                facilities: { ...def.facilities, ...(parsed.facilities || {}) },
                menu: { ...def.menu, ...(parsed.menu || {}) },
                staffPets: { ...def.staffPets, ...(parsed.staffPets || {}) }
            };
        }
    } catch (e) {}
    return createDefaultState();
}

function saveGame(showMsg = false) {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
        if (showMsg) showToast('💾 遊戲進度已儲存！', 'bg-emerald-600');
    } catch (e) {}
}

function resetGameProgress() {
    const btn = document.getElementById('btn-reset-confirm');
    if (btn && btn.dataset.armed !== 'true') {
        btn.dataset.armed = 'true';
        btn.textContent = '⚠️ 再點一次確定重置所有進度';
        btn.classList.add('kairo-btn-orange');
        setTimeout(() => {
            if (btn) {
                btn.dataset.armed = 'false';
                btn.textContent = '🗑️ 重置存檔（重新開始）';
                btn.classList.remove('kairo-btn-orange');
            }
        }, 4000);
        return;
    }
    localStorage.removeItem(SAVE_KEY);
    gameState = createDefaultState();
    initEntities();
    renderPanel();
    updateTopHUD();
    showToast('🔄 已重置為第 1 天全新開始！', 'bg-amber-600');
}

    FACILITIES_DB.forEach(f => {

/**
 * ============================================================================
 * 4. 開羅風離線像素精靈圖產生器 (Procedural Crisp Pixel Sprite Baker)
 *    - 經典 2:1 大頭 Q 版比例、1px 深色輪廓 (#2c1e16)、紅暈臉頰、雙幀走路動畫
 * ============================================================================
 */
const SPRITE_CACHE = {};

function bakePixelSprite(key, width, height, drawFn) {
    if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
    const c = document.createElement('canvas');
    c.width = width;
    c.height = height;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    drawFn(g);
    SPRITE_CACHE[key] = c;
    return c;
}

// 取得開羅風二頭身 Q 版小人精靈 (16x24 像素，渲染時放大 2 倍為 32x48)
function getChibiHumanSprite(variant, dir, frame) {
    // dir: 'front' (面朝前景左/右) or 'back' (背對鏡頭朝廚房/後方)
    // frame: 0 or 1 (走路擺動幀)
    const key = `human_${variant}_${dir}_${frame}`;
    return bakePixelSprite(key, 16, 24, (g) => {
        const OL = '#2c1e16'; // 經典開羅深咖啡黑輪廓
        const SKIN = '#ffd9b3';
        const SKIN_SHADE = '#e8b48a';
        const BLUSH = '#ff8599';

        // 角色服裝與髮型配色
        const styles = {
            chef: { hair: '#4a2c16', shirt: '#ffffff', apron: '#f0f4f8', pants: '#3b4d61', hat: 'chef' },
            waiter_f: { hair: '#8c4227', shirt: '#e86f2c', apron: '#fff9eb', pants: '#4a2c16', hat: 'ribbon' },
            waiter_m: { hair: '#2c1e16', shirt: '#4b9e4f', apron: '#fff9eb', pants: '#2f3e46', hat: 'cap' },
            office: { hair: '#2c1e16', shirt: '#5c85b8', apron: null, pants: '#2b3a4a', hat: null },
            student: { hair: '#59331d', shirt: '#ff9b54', apron: null, pants: '#3b5998', hat: 'beret' },
            couple_f: { hair: '#b8531e', shirt: '#f06595', apron: null, pants: '#744253', hat: null },
            grandma: { hair: '#d8dee9', shirt: '#8fbc8f', apron: null, pants: '#5c4b51', hat: 'bun' },
            passerby: { hair: '#6b4423', shirt: '#e5c07b', apron: null, pants: '#4f5d75', hat: null }
        };
        const st = styles[variant] || styles.office;

        const px = (x, y, w, h, col) => {
            g.fillStyle = col;
            g.fillRect(x, y, w, h);
        };

        // 1. 雙腳與褲子 (2幀交替踏步)
        const leftFootY = frame === 0 ? 20 : 21;
        const rightFootY = frame === 0 ? 21 : 20;
        px(4, 17, 3, 3, st.pants);
        px(9, 17, 3, 3, st.pants);
        px(4, leftFootY, 3, 2, OL);
        px(9, rightFootY, 3, 2, OL);

        // 2. 身體軀幹 (小巧可愛的 1:2 比例)
        px(4, 13, 8, 5, OL);
        px(5, 14, 6, 4, st.shirt);
        if (st.apron && dir === 'front') {
            px(5, 15, 6, 3, st.apron);
        }
        // 手臂擺動
        const armOffset = frame === 0 ? 0 : 1;
        px(3, 14 + armOffset, 2, 3, OL);
        px(3, 14 + armOffset, 1, 2, SKIN);
        px(11, 15 - armOffset, 2, 3, OL);
        px(12, 15 - armOffset, 1, 2, SKIN);

        // 3. 大頭輪廓 (寬 12px, 高 11px)
        px(3, 3, 10, 11, OL);
        px(2, 4, 12, 9, OL);
        px(3, 4, 10, 9, SKIN);
        px(3, 12, 10, 1, SKIN_SHADE);

        if (dir === 'front') {
            // 瀏海
            px(3, 3, 10, 3, st.hair);
            px(3, 6, 2, 2, st.hair);
            px(11, 6, 2, 2, st.hair);

            // 豆豆眼 + 可愛臉頰紅暈
            px(5, 8, 2, 2, OL);
            px(9, 8, 2, 2, OL);
            px(4, 10, 2, 1, BLUSH);
            px(10, 10, 2, 1, BLUSH);
        } else {
            // 背面全頭髮覆蓋
            px(3, 3, 10, 9, st.hair);
            px(4, 11, 8, 2, st.hair);
        }

        // 4. 帽子與頭飾 (開羅靈魂細節)
        if (st.hat === 'chef') {
            px(3, 0, 10, 4, OL);
            px(4, 1, 8, 3, '#ffffff');
            px(5, 0, 6, 1, '#ffffff');
        } else if (st.hat === 'ribbon') {
            px(10, 2, 3, 2, '#ff4d6d');
        } else if (st.hat === 'cap') {
            px(4, 2, 8, 2, '#2b580c');
            if (dir === 'front') px(6, 3, 6, 1, '#2b580c');
        } else if (st.hat === 'beret') {
            px(4, 2, 8, 2, '#c92a2a');
        } else if (st.hat === 'bun') {
            px(6, 1, 4, 2, '#e5e9f0');
        }
    });
}

        const px = (x, y, w, h, col) => {

            px(8, 2, 1, 2, p.ear);
            px(12, 2, 1, 2, p.ear);
        } else {
            px(7, 2, 2, 3, p.ear);
            px(13, 2, 2, 3, p.ear);
        }

        // 豆豆眼與黑鼻子
        px(9, 6, 1, 2, OL);
        px(12, 6, 1, 2, OL);
        px(13, 8, 2, 1, OL);
    });
}

/**
 * ============================================================================
 * 5. 2.5D 等距菱形投影數學核心 (Isometric Projection Engine)
 * ============================================================================
 */
const WORLD_W = 860;
const WORLD_H = 540;
const ISO_ORIGIN_X = 430;
const ISO_ORIGIN_Y = 128;
const TILE_W = 64; // 菱形單格寬度
const TILE_H = 32; // 菱形單格高度 (標準 2:1 開羅像素斜視角)
const GRID_SIZE = 12;

// 網格座標 (gx, gy) -> 螢幕 2.5D 像素座標 (sx, sy)
function gridToIso(gx, gy) {
    return {
        x: ISO_ORIGIN_X + (gx - gy) * (TILE_W / 2),
        y: ISO_ORIGIN_Y + (gx + gy) * (TILE_H / 2)
    };
}

// 螢幕 2.5D 座標 -> 網格座標 (用於滑鼠/觸控點擊判定)
function isoToGrid(sx, sy) {
    const dx = sx - ISO_ORIGIN_X;
    const dy = sy - ISO_ORIGIN_Y;
    const gx = (dx / (TILE_W / 2) + dy / (TILE_H / 2)) / 2;
    const gy = (dy / (TILE_H / 2) - dx / (TILE_W / 2)) / 2;
    return { gx, gy };
}

                flipX: false,
                waitTimer: 0.5,
                heartTimer: 3,
                animPhase: idx
            });
        }
    });
}

// 生成店外人行道過路人 (開羅城鎮街景氛圍)
function spawnPasserby() {
    if (passersby.length >= 3) return;
    const fromLeft = Math.random() < 0.5;
    const variants = ['office', 'student', 'couple_f', 'grandma', 'passerby'];
    passersby.push({
        gx: fromLeft ? -1.5 : 13.5,
        gy: 12.6 + (Math.random() - 0.5) * 0.4,
        targetGx: fromLeft ? 13.5 : -1.5,
        variant: variants[Math.floor(Math.random() * variants.length)],
        hasPet: Math.random() < 0.5,
        petType: ['corgi', 'shiba', 'poodle'][Math.floor(Math.random() * 3)],
        flipX: !fromLeft,
        animPhase: Math.random() * 4
    });
}

// 生成進店顧客
function spawnCustomer() {
    if (gameState.timeMinutes >= 20 * 60 + 15) return;

    const activeTables = getActiveTables();
    const freeTable = tablesState.find(t =>
        activeTables.some(at => at.id === t.id) && !t.occupiedBy && !t.dirty
    );

    const waitingCount = customers.filter(c => c.state === 'entering' || c.state === 'waiting').length;
    if (!freeTable && waitingCount >= 2) return;

    const hasPet = Math.random() < 0.74;
    const petTypes = ['corgi', 'poodle', 'calico', 'husky', 'shiba'];
    const variants = ['office', 'student', 'couple_f', 'grandma'];

    customers.push({
        id: 'cust_' + Date.now() + '_' + Math.floor(Math.random() * 999),
        gx: GRID_POS.door.gx,
        gy: GRID_POS.door.gy + 1.2,
        targetGx: GRID_POS.waitSpot.gx + waitingCount * 0.8,
        targetGy: GRID_POS.waitSpot.gy,
        variant: variants[Math.floor(Math.random() * variants.length)],
        facing: 'back',
        flipX: false,
        hasPet,
        petType: petTypes[Math.floor(Math.random() * petTypes.length)],
        petGx: GRID_POS.door.gx - 0.6,
        petGy: GRID_POS.door.gy + 1.5,
        state: 'entering',
        tableId: null,
        thinkTimer: 0,
        eatTimer: 0,
        humanDish: null,
        petDish: null,
        totalBill: 0,
        animPhase: Math.random() * 5
    });
}

// 網格平滑移動與朝向更新
function moveGridTowards(entity, tGx, tGy, speed, dt) {
    const dx = tGx - entity.gx;
    const dy = tGy - entity.gy;
    const dist = Math.hypot(dx, dy);

    if (dist > 0.02) {
        // 根據等距螢幕投影方向判斷朝前(front)或朝後(back)與左右翻轉
        const screenDx = dx - dy;
        const screenDy = dx + dy;
        entity.facing = screenDy >= 0 ? 'front' : 'back';
        entity.flipX = screenDx < 0;
    }

    if (dist <= speed * dt || dist < 0.04) {
        entity.gx = tGx;
        entity.gy = tGy;
        return true;
    }
    entity.gx += (dx / dist) * speed * dt;
    entity.gy += (dy / dist) * speed * dt;
    entity.animPhase += dt * 9;
    return false;
}

/**
 * ============================================================================
 * 6. 主遊戲模擬更新迴圈 (Simulation Update)
 * ============================================================================
 */
function updateSimulation(dt) {
    if (gameSpeed === 0 || isEndOfDayModalOpen) return;

    const scaledDt = dt * gameSpeed;

    // 1. 推進遊戲時鐘
    gameState.timeMinutes += scaledDt * 8;
    if (gameState.timeMinutes >= 21 * 60) {
        gameState.timeMinutes = 21 * 60;
        triggerEndOfDay();
        return;
    }

    // 2. 生成店外街景行人與進店顧客
    passerbyTimer -= scaledDt;
    if (passerbyTimer <= 0) {
        spawnPasserby();
        passerbyTimer = 3.5 + Math.random() * 3;
    }
    for (let i = passersby.length - 1; i >= 0; i--) {
        const p = passersby[i];
        const dir = p.targetGx > p.gx ? 1 : -1;
        p.gx += dir * 1.4 * scaledDt;
        p.animPhase += scaledDt * 8;
        if ((dir > 0 && p.gx >= p.targetGx) || (dir < 0 && p.gx <= p.targetGx)) {
            passersby.splice(i, 1);
        }
    }

    const appeal = getTotalAppeal();
    const spawnInterval = Math.max(2.6, 7.2 - appeal * 0.035);
    spawnTimer -= scaledDt;
    if (spawnTimer <= 0) {
        spawnCustomer();
        spawnTimer = spawnInterval;
    }

    // 3. 更新主廚烹飪邏輯
    const chef = staffEntities.find(s => s.role === 'chef');
    if (chef) {
        const chefLv = gameState.staffPets.chef_leo || 1;
        const machineLv = gameState.facilities.espresso_machine || 0;
        const cookDuration = Math.max(0.9, 2.5 - chefLv * 0.16 - machineLv * 0.12);

        if (!chef.cookingOrder && kitchenOrders.length > 0) {
            chef.cookingOrder = kitchenOrders.shift();
            chef.cookTimer = cookDuration;
        }

        if (chef.cookingOrder) {
            chef.animPhase += scaledDt * 12;
            chef.cookTimer -= scaledDt;
            const isoChef = gridToIso(chef.gx, chef.gy);
            if (Math.random() < scaledDt * 4.5) {
                spawnSmokeParticle(isoChef.x, isoChef.y);
            }
            if (chef.cookTimer <= 0) {
                readyDishes.push(chef.cookingOrder);
                chef.cookingOrder = null;
            }
        }
    }

    // 4. 更新外場店員 AI
    staffEntities.filter(s => s.role === 'waiter').forEach((waiter, idx) => {
        const lv = gameState.staffPets[waiter.id] || 1;
        const moveSpeed = 2.6 + lv * 0.32;

        if (waiter.state === 'idle') {
            if (readyDishes.length > 0) {
                waiter.state = 'to_counter';
                waiter.targetGx = GRID_POS.counterPickup.gx;
                waiter.targetGy = GRID_POS.counterPickup.gy;
                return;
            }
            const dirtyTable = tablesState.find(t =>
                t.dirty && !staffEntities.some(other => other !== waiter && other.targetTableId === t.id)
            );
            if (dirtyTable) {
                waiter.state = 'to_table_clean';
                waiter.targetTableId = dirtyTable.id;
                waiter.targetGx = dirtyTable.gx - 0.6;
                waiter.targetGy = dirtyTable.gy - 0.6;
                return;
            }
            moveGridTowards(waiter, GRID_POS.staffIdle.gx + idx * 0.9, GRID_POS.staffIdle.gy, moveSpeed * 0.7, scaledDt);
        } else if (waiter.state === 'to_counter') {
            if (moveGridTowards(waiter, waiter.targetGx, waiter.targetGy, moveSpeed, scaledDt)) {
                if (readyDishes.length > 0) {
                    const dishOrder = readyDishes.shift();
                    const table = tablesState.find(t => t.id === dishOrder.tableId);
                    if (table && table.occupiedBy) {
                        waiter.carryingDish = dishOrder;
                        waiter.targetTableId = table.id;
                        waiter.state = 'to_table_deliver';
                        waiter.targetGx = table.gx - 0.6;
                        waiter.targetGy = table.gy - 0.6;
                    } else {
                        waiter.state = 'idle';
                    }
                } else {
                    waiter.state = 'idle';
                }
            }
        } else if (waiter.state === 'to_table_deliver') {
            if (moveGridTowards(waiter, waiter.targetGx, waiter.targetGy, moveSpeed, scaledDt)) {
                const cust = customers.find(c => c.tableId === waiter.targetTableId && c.state === 'waiting_food');
                if (cust) {
                    cust.state = 'eating';
                    cust.eatTimer = 4.2;
                    const isoC = gridToIso(cust.gx, cust.gy);
                    spawnHeartParticle(isoC.x, isoC.y - 14);
                }
                waiter.carryingDish = null;
                waiter.targetTableId = null;
                waiter.state = 'idle';
            }
        } else if (waiter.state === 'to_table_clean') {
            if (moveGridTowards(waiter, waiter.targetGx, waiter.targetGy, moveSpeed, scaledDt)) {
                const table = tablesState.find(t => t.id === waiter.targetTableId);
                if (table && table.dirty) {
                    table.cleanProgress += scaledDt * (1.2 + lv * 0.25);
                    waiter.animPhase += scaledDt * 14;
                    if (table.cleanProgress >= 1.0) {
                        table.dirty = false;
                        table.cleanProgress = 0;
                        waiter.targetTableId = null;
                        waiter.state = 'idle';
                    }
                } else {
                    waiter.targetTableId = null;
                    waiter.state = 'idle';
                }
            }
        }
    });

    // 5. 更新顧客與隨行毛孩 AI
    const activeTables = getActiveTables();
    for (let i = customers.length - 1; i >= 0; i--) {
        const c = customers[i];
        const custSpeed = 2.2;

        if (c.state === 'entering' || c.state === 'waiting') {
            moveGridTowards(c, c.targetGx, c.targetGy, custSpeed, scaledDt);
            const freeTable = tablesState.find(t =>
                activeTables.some(at => at.id === t.id) && !t.occupiedBy && !t.dirty
            );
            if (freeTable) {
                freeTable.occupiedBy = c.id;
                c.tableId = freeTable.id;
                c.state = 'to_seat';
                c.targetGx = freeTable.gx - 0.55;
                c.targetGy = freeTable.gy + 0.1;
            } else {
                c.state = 'waiting';
            }
        } else if (c.state === 'to_seat') {
            if (moveGridTowards(c, c.targetGx, c.targetGy, custSpeed, scaledDt)) {
                c.state = 'ordering';
                c.facing = 'front';
                c.flipX = false;
                c.thinkTimer = 1.4;
            }
        } else if (c.state === 'ordering') {
            c.thinkTimer -= scaledDt;
            if (c.thinkTimer <= 0) {
                const unlockedHuman = MENU_DB.filter(m => m.type === 'human' && (gameState.menu[m.id] || 0) > 0);
                const unlockedPet = MENU_DB.filter(m => m.type === 'pet' && (gameState.menu[m.id] || 0) > 0);

                c.humanDish = unlockedHuman[Math.floor(Math.random() * unlockedHuman.length)];
                let bill = getDishPrice(c.humanDish);

                if (c.hasPet && unlockedPet.length > 0) {
                    c.petDish = unlockedPet[Math.floor(Math.random() * unlockedPet.length)];
                    bill += getDishPrice(c.petDish);
                }

                let tipMultiplier = 1.0;
                if (c.tableId === 'table_3') tipMultiplier += 0.10;
                if (c.tableId === 'table_4') tipMultiplier += 0.20;
                if ((gameState.facilities.pet_fountain || 0) > 0) tipMultiplier += 0.08 * gameState.facilities.pet_fountain;
                const shibaLv = gameState.staffPets.pet_doudou || 0;
                if (shibaLv > 0) tipMultiplier += shibaLv * 0.05;

                c.totalBill = Math.round(bill * tipMultiplier);
                c.state = 'waiting_food';
                kitchenOrders.push({
                    tableId: c.tableId,
                    humanDish: c.humanDish,
                    petDish: c.petDish
                });
            }
        } else if (c.state === 'eating') {
            c.eatTimer -= scaledDt;
            const isoC = gridToIso(c.gx, c.gy);
            if (Math.random() < scaledDt * 1.6) {
                spawnHeartParticle(isoC.x + 8, isoC.y - 14);
            }
            if (c.eatTimer <= 0) {
                gameState.gold += c.totalBill;
                gameState.totalRevenue += c.totalBill;
                gameState.dailyStats.revenue += c.totalBill;
                gameState.totalCustomers += 1;
                gameState.dailyStats.customers += 1;

                let heartGain = c.hasPet ? 3 : 1;
                if ((gameState.facilities.grass_zone || 0) > 0 && c.hasPet) heartGain += 1;
                gameState.hearts += heartGain;
                gameState.dailyStats.hearts += heartGain;

                if (c.hasPet) {
                    gameState.totalPetsServed += 1;
                    gameState.dailyStats.pets += 1;
                }

                gameState.rating = Math.min(5.0, +(gameState.rating + 0.025).toFixed(2));

                addFloatingText(isoC.x, isoC.y - 34, `+${c.totalBill}G`, '#ffd447');
                addFloatingText(isoC.x + 16, isoC.y - 50, `+${heartGain}♥`, '#ff85b3');
                audio.playCoin();

                const table = tablesState.find(t => t.id === c.tableId);
                if (table) {
                    table.occupiedBy = null;
                    table.dirty = true;
                    table.cleanProgress = 0;
                }
                c.state = 'leaving';
                c.targetGx = GRID_POS.door.gx;
                c.targetGy = GRID_POS.door.gy + 1.2;
            }
        } else if (c.state === 'leaving') {
            if (moveGridTowards(c, c.targetGx, c.targetGy, custSpeed * 1.15, scaledDt)) {
                customers.splice(i, 1);
                continue;
            }
        }

        // 隨行毛孩跟隨座標
        if (c.hasPet) {
            let ptx = c.gx - 0.55;
            let pty = c.gy + 0.45;
            if (c.state === 'ordering' || c.state === 'waiting_food' || c.state === 'eating') {
                ptx = c.gx + 1.15;
                pty = c.gy + 0.35;
            }
            c.petGx += (ptx - c.petGx) * Math.min(1, scaledDt * 6);
            c.petGy += (pty - c.petGy) * Math.min(1, scaledDt * 6);
        }
    }

    // 6. 更新駐店毛孩巡邏與產生愛心 ♥
    mascotEntities.forEach(m => {
        const lv = gameState.staffPets[m.id] || 1;
        m.waitTimer -= scaledDt;
        if (m.waitTimer <= 0) {
            if (moveGridTowards(m, m.targetGx, m.targetGy, 1.35 + lv * 0.12, scaledDt)) {
                m.waitTimer = 1.4 + Math.random() * 2;
                const goGrass = (gameState.facilities.grass_zone || 0) > 0 && Math.random() < 0.65;
                if (goGrass) {
                    m.targetGx = 8.9 + Math.random() * 1.8;
                    m.targetGy = 3.8 + Math.random() * 2.1;
                } else {
                    m.targetGx = 4.2 + Math.random() * 4.5;
                    m.targetGy = 4.5 + Math.random() * 4.0;
                }
            }
        }

        m.heartTimer -= scaledDt;
        if (m.heartTimer <= 0) {
            m.heartTimer = Math.max(3.5, 8.2 - lv * 0.55);
            const bonusHearts = 1 + Math.floor(lv / 3);
            gameState.hearts += bonusHearts;
            gameState.dailyStats.hearts += bonusHearts;
            const isoM = gridToIso(m.gx, m.gy);
            spawnHeartParticle(isoM.x, isoM.y - 12);
            addFloatingText(isoM.x, isoM.y - 26, `+${bonusHearts}♥`, '#ff9ec4');
        }
    });

    // 7. 更新飄浮文字與粒子
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 24 * scaledDt;
        ft.life -= scaledDt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * scaledDt;
        p.y += p.vy * scaledDt;
        p.life -= scaledDt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/**
 * ============================================================================
 * 7. 開羅風 2.5D 等距斜視角像素繪圖引擎 (2.5D Isometric Pixel Renderer)
 * ============================================================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const wrapper = document.getElementById('canvas-wrapper');
    if (!wrapper) return;
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
}
window.addEventListener('resize', resizeCanvas);

// 繪製單格 2.5D 等距菱形地板磚
function drawIsoDiamond(gx, gy, wTiles, hTiles, fillColor, strokeColor = null) {
    const p0 = gridToIso(gx, gy);
    const p1 = gridToIso(gx + wTiles, gy);
    const p2 = gridToIso(gx + wTiles, gy + hTiles);
    const p3 = gridToIso(gx, gy + hTiles);

    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();

    ctx.fillStyle = fillColor;
    ctx.fill();
    if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

// 繪製 2.5D 等距立體方塊 (有頂面、左側陰影面、右側高光面與 1px 深色輪廓)
function drawIsoBox(gx, gy, wTiles, dTiles, heightPx, colors) {
    const { top, left, right, outline = '#2c1e16' } = colors;
    const p0 = gridToIso(gx, gy);
    const p1 = gridToIso(gx + wTiles, gy);
    const p2 = gridToIso(gx + wTiles, gy + dTiles);
    const p3 = gridToIso(gx, gy + dTiles);

    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = outline;

    // 左側面 (朝左下)
    ctx.beginPath();
    ctx.moveTo(p3.x, p3.y - heightPx);
    ctx.lineTo(p2.x, p2.y - heightPx);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fillStyle = left;
    ctx.fill();
    ctx.stroke();

    // 右側面 (朝右下)
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y - heightPx);
    ctx.lineTo(p1.x, p1.y - heightPx);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.fillStyle = right;
    ctx.fill();
    ctx.stroke();

    // 頂面
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y - heightPx);
    ctx.lineTo(p1.x, p1.y - heightPx);
    ctx.lineTo(p2.x, p2.y - heightPx);
    ctx.lineTo(p3.x, p3.y - heightPx);
    ctx.closePath();
    ctx.fillStyle = top;
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

// 繪製 2.5D 餐廳後牆 (左後牆 & 右後牆，附窗戶、寵物畫框、菜單黑板)
function drawIsoBackWalls() {
    const wallH = 68;
    const cTop = gridToIso(0, 0);
    const cLeft = gridToIso(0, GRID_SIZE);
    const cRight = gridToIso(GRID_SIZE, 0);

    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#2c1e16';

    // 1. 左後牆 (沿 gx = 0, gy: 0 -> 12)
    ctx.beginPath();
    ctx.moveTo(cTop.x, cTop.y);
    ctx.lineTo(cLeft.x, cLeft.y);
    ctx.lineTo(cLeft.x, cLeft.y - wallH);
    ctx.lineTo(cTop.x, cTop.y - wallH);
    ctx.closePath();
    ctx.fillStyle = '#e8cfa6';
    ctx.fill();
    ctx.stroke();

    // 左後牆木質腰板
    ctx.beginPath();
    ctx.moveTo(cTop.x, cTop.y);
    ctx.lineTo(cLeft.x, cLeft.y);
    ctx.lineTo(cLeft.x, cLeft.y - 24);
    ctx.lineTo(cTop.x, cTop.y - 24);
    ctx.closePath();
    ctx.fillStyle = '#b57642';
    ctx.fill();
    ctx.stroke();

    // 2. 右後牆 (沿 gy = 0, gx: 0 -> 12)
    ctx.beginPath();
    ctx.moveTo(cTop.x, cTop.y);
    ctx.lineTo(cRight.x, cRight.y);
    ctx.lineTo(cRight.x, cRight.y - wallH);
    ctx.lineTo(cTop.x, cTop.y - wallH);
    ctx.closePath();
    ctx.fillStyle = '#f5dfc0';
    ctx.fill();
    ctx.stroke();

    // 右後牆木質腰板
    ctx.beginPath();
    ctx.moveTo(cTop.x, cTop.y);
    ctx.lineTo(cRight.x, cRight.y);
    ctx.lineTo(cRight.x, cRight.y - 24);
    ctx.lineTo(cTop.x, cTop.y - 24);
    ctx.closePath();
    ctx.fillStyle = '#c9874e';
    ctx.fill();
    ctx.stroke();

    // 3. 右後牆裝飾：兩扇採光玻璃窗 + 寵物相框 + 菜單黑板
    const isEvening = gameState.timeMinutes >= 17.5 * 60;
    const skyColor = isEvening ? '#4b5d9e' : '#a8e6ff';

    [4.2, 6.8].forEach(wx => {
        const w0 = gridToIso(wx, 0);
        const w1 = gridToIso(wx + 1.4, 0);
        ctx.beginPath();
        ctx.moveTo(w0.x, w0.y - 28);
        ctx.lineTo(w1.x, w1.y - 28);
        ctx.lineTo(w1.x, w1.y - 54);
        ctx.lineTo(w0.x, w0.y - 54);
        ctx.closePath();
        ctx.fillStyle = skyColor;
        ctx.fill();
        ctx.stroke();
    });

    // 菜單小黑板 (gx: 9.0 ~ 10.4)
    const b0 = gridToIso(9.0, 0);
    const b1 = gridToIso(10.4, 0);
    ctx.beginPath();
    ctx.moveTo(b0.x, b0.y - 28);
    ctx.lineTo(b1.x, b1.y - 28);
    ctx.lineTo(b1.x, b1.y - 52);
    ctx.lineTo(b0.x, b0.y - 52);
    ctx.closePath();
    ctx.fillStyle = '#2d4739';
    ctx.fill();
    ctx.stroke();

    // 左後牆寵物肖像畫框 (gy: 5.5 ~ 7.0)
    const p0 = gridToIso(0, 5.5);
    const p1 = gridToIso(0, 7.0);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y - 30);
    ctx.lineTo(p1.x, p1.y - 30);
    ctx.lineTo(p1.x, p1.y - 52);
    ctx.lineTo(p0.x, p0.y - 52);
    ctx.closePath();
    ctx.fillStyle = '#ffdf73';
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

// 繪製圓角開羅像素氣泡框
function drawSpeechBubble(sx, sy, iconText, bgColor = '#ffffff') {
    ctx.save();
    const w = 32;
    const h = 22;
    const bx = Math.round(sx - w / 2);
    const by = Math.round(sy - h - 38);

    ctx.fillStyle = bgColor;
    ctx.strokeStyle = '#2c1e16';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.roundRect(bx, by, w, h, 4);
    ctx.fill();
    ctx.stroke();

    // 氣泡尖角
    ctx.beginPath();
    ctx.moveTo(sx - 3, by + h);
    ctx.lineTo(sx, by + h + 4);
    ctx.lineTo(sx + 3, by + h);
    ctx.fill();
    ctx.stroke();

    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(iconText, sx, by + h / 2 + 1);
    ctx.restore();
}

// 繪製 2.5D 等距餐桌與兩張木椅
function drawIsoDiningTable(t, isUnlocked) {
    const pos = gridToIso(t.gx, t.gy);
    if (!isUnlocked) {
        // 未擴建的虛線菱形地標
        ctx.save();
        drawIsoDiamond(t.gx - 0.5, t.gy - 0.5, 1.4, 1.4, 'rgba(92, 58, 33, 0.08)', 'rgba(92, 58, 33, 0.35)');
        ctx.fillStyle = 'rgba(74, 44, 22, 0.65)';
        ctx.font = 'bold 11px "DotGothic16", "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('可擴建座位', pos.x, pos.y + 8);
        ctx.restore();
        return;
    }

    // 左側椅子
    drawIsoBox(t.gx - 0.65, t.gy + 0.05, 0.45, 0.45, 9, {
        top: '#d99152', left: '#a86432', right: '#bd753c'
    });
    // 右側椅子
    drawIsoBox(t.gx + 0.85, t.gy + 0.05, 0.45, 0.45, 9, {
        top: '#d99152', left: '#a86432', right: '#bd753c'
    });

    // 餐桌本體
    const isVip = t.id === 'table_4';
    drawIsoBox(t.gx - 0.15, t.gy - 0.25, 0.95, 0.95, 15, {
        top: isVip ? '#ffe28a' : '#fff9eb',
        left: isVip ? '#d99b26' : '#a86432',
        right: isVip ? '#f2b84b' : '#c97e42'
    });

    // 桌上的食物或待清理餐盤
    const cust = customers.find(c => c.tableId === t.id);
    if (cust && cust.state === 'eating') {
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(cust.humanDish ? cust.humanDish.icon : '🍽️', pos.x + 8, pos.y - 6);
        if (cust.petDish) {
            // 桌旁地面寵物鮮食碗
            const bowlPos = gridToIso(t.gx + 0.95, t.gy + 0.85);
            ctx.fillStyle = '#ff6b9d';
            ctx.strokeStyle = '#2c1e16';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(bowlPos.x, bowlPos.y, 7, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }
    } else if (t.dirty) {
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🧹', pos.x + 8, pos.y - 6);
    }
}

// 繪製整個 2.5D 開羅風餐廳場景
function renderScene() {
    if (!ctx) return;
    const scaleX = canvas.width / WORLD_W;
    const scaleY = canvas.height / WORLD_H;

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.scale(scaleX, scaleY);

    // 1. 戶外青草與天空背景
    const isEvening = gameState.timeMinutes >= 17.5 * 60;
    ctx.fillStyle = isEvening ? '#4e7a43' : '#74b856';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // 繪製戶外小花與灌木點綴
    const bushes = [
        { x: 95, y: 185 }, { x: 145, y: 155 }, { x: 735, y: 175 },
        { x: 775, y: 215 }, { x: 80, y: 390 }, { x: 785, y: 380 }
    ];
    bushes.forEach(b => {
        ctx.fillStyle = '#478532';
        ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8ce063';
        ctx.beginPath(); ctx.arc(b.x - 3, b.y - 4, 9, 0, Math.PI * 2); ctx.fill();
    });

    // 2. 店外紅磚人行道街道 (gy: 12 ~ 13.8)
    for (let gx = -2; gx <= 14; gx++) {
        drawIsoDiamond(gx, 12.1, 1, 1.5, gx % 2 === 0 ? '#d98a6c' : '#c9795b', '#9e563c');
    }

    // 3. 繪製 12x12 餐廳室內 2.5D 地板磚
    for (let gx = 0; gx < GRID_SIZE; gx++) {
        for (let gy = 0; gy < GRID_SIZE; gy++) {
            // 左上角廚房區域 (gx < 3.6 && gy < 3.6) 使用黑白復古咖啡廳方格磚
            if (gx < 3.6 && gy < 3.6) {
                const isEven = (gx + gy) % 2 === 0;
                drawIsoDiamond(gx, gy, 1, 1, isEven ? '#f7f3eb' : '#cfc7b8', '#b5ac9c');
            } else {
                // 其餘區域使用溫馨原木拼花地板
                const isAlt = (gx + gy) % 2 === 0;
                drawIsoDiamond(gx, gy, 1, 1, isAlt ? '#e8c490' : '#deb67e', '#c99e63');
            }
        }
    }

    // 餐廳大門迎賓紅地毯 (gx: 5~6.5, gy: 10.8~12)
    drawIsoDiamond(5.0, 10.8, 1.6, 1.3, '#d94848', '#ffd447');

    // 4. 繪製 2.5D 立體後牆與壁掛裝飾
    drawIsoBackWalls();

    // 5. 繪製室內草皮遊戲區 (若已解鎖，鋪設在地板上並加白色小柵欄)
    if ((gameState.facilities.grass_zone || 0) > 0) {
        drawIsoDiamond(8.6, 3.6, 2.7, 2.7, '#68c149', '#3d8226');
        // 草皮上的玩具球
        const ballPos = gridToIso(9.5, 5.4);
        ctx.fillStyle = '#ff5964';
        ctx.strokeStyle = '#2c1e16';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(ballPos.x, ballPos.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // 白色可愛矮柵欄
        [8.7, 9.7, 10.7].forEach(fgx => {
            drawIsoBox(fgx, 3.6, 0.25, 0.25, 11, { top: '#ffffff', left: '#dce3eb', right: '#eef2f7' });
        });
    }

    // 6. 收集所有 2.5D 立體物件與動態角色，依照深度 (gx + gy) 排序繪製！
    const depthObjects = [];

    // 廚房爐灶與料理台 (gx: 0.3~2.8, gy: 0.3~1.1)
    depthObjects.push({
        depth: 1.2,
        draw: () => {
            drawIsoBox(0.3, 0.3, 2.6, 0.9, 20, {
                top: '#dce3eb', left: '#8d99ae', right: '#adb5bd'
            });
            // 義式咖啡機
            if ((gameState.facilities.espresso_machine || 0) > 0) {
                drawIsoBox(2.0, 0.4, 0.7, 0.7, 32, {
                    top: '#ff6b6b', left: '#c92a2a', right: '#e03131'
                });
            }
        }
    });

    // L 型出餐吧台與甜點展示櫃
    depthObjects.push({
        depth: 3.6,
        draw: () => {
            // 直向吧台
            drawIsoBox(3.1, 0.4, 0.65, 2.9, 18, {
                top: '#f7d08a', left: '#8c5327', right: '#b06d38'
            });
            // 橫向吧台
            drawIsoBox(0.3, 3.1, 3.45, 0.65, 18, {
                top: '#f7d08a', left: '#8c5327', right: '#b06d38'
            });
            // 吧台上的待送餐點盤子
            readyDishes.slice(0, 4).forEach((d, idx) => {
                const p = gridToIso(3.4, 1.2 + idx * 0.48);
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#2c1e16';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y - 18, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
        }
    });

    // 三層豪華貓跳台 (gx: 10.2, gy: 1.8)
    if ((gameState.facilities.cat_tower || 0) > 0) {
        depthObjects.push({
            depth: 10.2 + 1.8,
            draw: () => {
                drawIsoBox(9.9, 1.5, 0.9, 0.9, 8, { top: '#faedcd', left: '#b08968', right: '#d4a373' });
                drawIsoBox(10.15, 1.75, 0.35, 0.35, 36, { top: '#d4a373', left: '#7f5539', right: '#9c6644' });
                drawIsoBox(9.95, 1.55, 0.75, 0.75, 42, { top: '#fff3b0', left: '#b08968', right: '#ddb892' });
            }
        });
    }

    // 活氧寵物飲水機 (gx: 2.5, gy: 6.2)
    if ((gameState.facilities.pet_fountain || 0) > 0) {
        depthObjects.push({
            depth: 2.5 + 6.2,
            draw: () => {
                drawIsoBox(2.2, 5.9, 0.8, 0.8, 12, { top: '#90e0ef', left: '#0077b6', right: '#0096c7' });
            }
        });
    }

    // 盆栽植物裝飾 (門口兩側與角落)
    [{ gx: 0.6, gy: 10.6 }, { gx: 10.8, gy: 10.6 }, { gx: 8.2, gy: 0.6 }].forEach(pl => {
        depthObjects.push({
            depth: pl.gx + pl.gy,
            draw: () => {
                drawIsoBox(pl.gx, pl.gy, 0.55, 0.55, 10, { top: '#5c3a21', left: '#a85d32', right: '#c97442' });
                const p = gridToIso(pl.gx + 0.25, pl.gy + 0.25);
                ctx.fillStyle = '#40916c';
                ctx.strokeStyle = '#2c1e16';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(p.x, p.y - 16, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        });
    });

    // 餐桌群
    const activeTables = getActiveTables();
    tablesState.forEach(t => {
        const isUnlocked = activeTables.some(at => at.id === t.id);
        depthObjects.push({
            depth: t.gx + t.gy,
            draw: () => drawIsoDiningTable(t, isUnlocked)
        });
    });

    // 員工精靈
    staffEntities.forEach(s => {
        depthObjects.push({
            depth: s.gx + s.gy,
            draw: () => {
                const pos = gridToIso(s.gx, s.gy);
                const frame = Math.floor(s.animPhase) % 2;
                const hop = Math.abs(Math.sin(s.animPhase)) * 2;
                const sprite = getChibiHumanSprite(s.variant, s.facing, frame);

                // 腳底陰影
                ctx.fillStyle = 'rgba(0,0,0,0.22)';
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(Math.round(pos.x), Math.round(pos.y - hop));
                if (s.flipX) ctx.scale(-1, 1);
                ctx.drawImage(sprite, -16, -42, 32, 48);
                ctx.restore();

                // 端盤子圖示
                if (s.carryingDish) {
                    ctx.font = '14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🍽️', pos.x, pos.y - 26 - hop);
                }
                if (s.role === 'chef' && s.cookingOrder) {
                    drawSpeechBubble(pos.x, pos.y - 4, '🍳', '#fff3cd');
                }
            }
        });
    });

    // 駐店毛孩精靈
    mascotEntities.forEach(m => {
        depthObjects.push({
            depth: m.gx + m.gy,
            draw: () => {
                const pos = gridToIso(m.gx, m.gy);
                const frame = Math.floor(m.animPhase) % 2;
                const hop = Math.abs(Math.sin(m.animPhase * 1.2)) * 2;
                const sprite = getChibiPetSprite(m.species, frame);

                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y, 9, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(Math.round(pos.x), Math.round(pos.y - hop));
                if (m.flipX) ctx.scale(-1, 1);
                ctx.drawImage(sprite, -16, -28, 32, 32);
                ctx.restore();

                // 開羅風小名牌
                const shortName = m.name.split('「')[1]?.replace('」', '') || m.name;
                ctx.font = 'bold 10px "DotGothic16", "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(54, 32, 17, 0.85)';
                ctx.fillRect(pos.x - 18, pos.y - 42 - hop, 36, 13);
                ctx.fillStyle = '#ffdf73';
                ctx.fillText(shortName, pos.x, pos.y - 32 - hop);
            }
        });
    });

    // 進店顧客與隨行毛孩
    customers.forEach(c => {
        depthObjects.push({
            depth: c.gx + c.gy,
            draw: () => {
                const pos = gridToIso(c.gx, c.gy);
                const frame = Math.floor(c.animPhase) % 2;
                const hop = (c.state === 'eating' || c.state === 'waiting_food' || c.state === 'ordering')
                    ? 0 : Math.abs(Math.sin(c.animPhase)) * 2;
                const sprite = getChibiHumanSprite(c.variant, c.facing, frame);

                ctx.fillStyle = 'rgba(0,0,0,0.22)';
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(Math.round(pos.x), Math.round(pos.y - hop));
                if (c.flipX) ctx.scale(-1, 1);
                ctx.drawImage(sprite, -16, -42, 32, 48);
                ctx.restore();

                if (c.state === 'waiting') drawSpeechBubble(pos.x, pos.y - 4, '⏳', '#ffe8e8');
                else if (c.state === 'ordering') drawSpeechBubble(pos.x, pos.y - 4, '♪', '#ffffff');
                else if (c.state === 'waiting_food' && c.humanDish) drawSpeechBubble(pos.x, pos.y - 4, c.humanDish.icon, '#fff9eb');
                else if (c.state === 'eating') drawSpeechBubble(pos.x, pos.y - 4, '♥', '#ffe3ec');
            }
        });

        if (c.hasPet) {
            depthObjects.push({
                depth: c.petGx + c.petGy,
                draw: () => {
                    const pPos = gridToIso(c.petGx, c.petGy);
                    const frame = Math.floor(c.animPhase) % 2;
                    const sprite = getChibiPetSprite(c.petType, frame);

                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(pPos.x, pPos.y, 8, 4, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.save();
                    ctx.translate(Math.round(pPos.x), Math.round(pPos.y));
                    if (c.flipX) ctx.scale(-1, 1);
                    ctx.drawImage(sprite, -15, -26, 30, 30);
                    ctx.restore();
                }
            });
        }
    });

    // 店外人行道過路人
    passersby.forEach(p => {
        depthObjects.push({
            depth: p.gx + p.gy,
            draw: () => {
                const pos = gridToIso(p.gx, p.gy);
                const frame = Math.floor(p.animPhase) % 2;
                const hop = Math.abs(Math.sin(p.animPhase)) * 2;
                const sprite = getChibiHumanSprite(p.variant, 'front', frame);

                ctx.save();
                ctx.translate(Math.round(pos.x), Math.round(pos.y - hop));
                if (p.flipX) ctx.scale(-1, 1);
                ctx.drawImage(sprite, -15, -40, 30, 45);
                ctx.restore();

                if (p.hasPet) {
                    const petSprite = getChibiPetSprite(p.petType, frame);
                    ctx.save();
                    ctx.translate(Math.round(pos.x + (p.flipX ? 18 : -18)), Math.round(pos.y + 4));
                    if (p.flipX) ctx.scale(-1, 1);
                    ctx.drawImage(petSprite, -13, -24, 26, 26);
                    ctx.restore();
                }
            }
        });
    });

    // 依等距深度 (gx + gy) 由後往前繪製，確保遮擋關係 100% 精準
    depthObjects.sort((a, b) => a.depth - b.depth);
    depthObjects.forEach(obj => obj.draw());

    // 7. 繪製愛心粒子與飄浮金幣文字
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        if (p.type === 'heart') {
            ctx.font = '14px sans-serif';
            ctx.fillText('♥', p.x, p.y);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(Math.round(p.x - 3), Math.round(p.y - 3), 6, 6);
        }
        ctx.restore();
    });

    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.font = 'bold 14px "DotGothic16", "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#2c1e16';
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });

    ctx.restore();
}

// 點擊畫布互動：撫摸店內駐店毛孩或顧客毛孩獲得 ♥
canvas.addEventListener('click', (e) => {
    audio.init();
    audio.startBGM();
    const rect = canvas.getBoundingClientRect();
    const clickX = ((e.clientX - rect.left) / rect.width) * WORLD_W;
    const clickY = ((e.clientY - rect.top) / rect.height) * WORLD_H;

    for (const m of mascotEntities) {
        const pos = gridToIso(m.gx, m.gy);
        if (Math.hypot(clickX - pos.x, clickY - (pos.y - 12)) < 32) {
            gameState.hearts += 1;
            gameState.dailyStats.hearts += 1;
            spawnHeartParticle(pos.x, pos.y - 14);
            addFloatingText(pos.x, pos.y - 28, '+1♥ 撫摸打氣!', '#ff85b3');
            audio.playPetSound();
            updateTopHUD();
            return;
        }
    }

    for (const c of customers) {
        if (c.hasPet) {
            const pPos = gridToIso(c.petGx, c.petGy);
            if (Math.hypot(clickX - pPos.x, clickY - (pPos.y - 10)) < 28) {
                gameState.hearts += 1;
                gameState.dailyStats.hearts += 1;
                spawnHeartParticle(pPos.x, pPos.y - 12);
                addFloatingText(pPos.x, pPos.y - 24, '+1♥ 好乖!', '#ff85b3');
                audio.playPetSound();
                updateTopHUD();
                return;
            }
        }
    }
});

/**
 * ============================================================================
 * 8. UI 介面更新與分頁渲染 (開羅風經營面板)
 * ============================================================================
 */
function updateTopHUD() {
    document.getElementById('ui-rating').textContent = gameState.rating.toFixed(1);
    document.getElementById('ui-day').textContent = `第 ${gameState.day} 天`;

    const hrs = Math.floor(gameState.timeMinutes / 60);
    const mins = Math.floor(gameState.timeMinutes % 60);
    document.getElementById('ui-clock').textContent =
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

    const badge = document.getElementById('ui-period-badge');
    if (hrs < 11) { badge.textContent = '早午餐'; badge.className = 'bg-amber-200 text-amber-900 px-1.5 rounded text-xs'; }
    else if (hrs < 14) { badge.textContent = '午餐尖峰'; badge.className = 'bg-orange-200 text-orange-900 px-1.5 rounded text-xs'; }
    else if (hrs < 17) { badge.textContent = '下午茶'; badge.className = 'bg-pink-200 text-pink-900 px-1.5 rounded text-xs'; }
    else { badge.textContent = '星光晚餐'; badge.className = 'bg-indigo-200 text-indigo-900 px-1.5 rounded text-xs'; }

    document.getElementById('ui-gold').textContent = gameState.gold.toLocaleString();
    document.getElementById('ui-hearts').textContent = gameState.hearts.toLocaleString();

    const activeTables = getActiveTables();
    const occupiedCount = tablesState.filter(t => t.occupiedBy).length;
    document.getElementById('hud-seats').textContent = `${occupiedCount}/${activeTables.length}`;
    document.getElementById('hud-customers').textContent = customers.length;
    document.getElementById('hud-appeal').textContent = getTotalAppeal();
}

function setGameSpeed(speed) {
    audio.init();
    audio.startBGM();
    gameSpeed = speed;
    [0, 1, 2].forEach(s => {
        const btn = document.getElementById(`btn-speed-${s}`);
        if (!btn) return;
        btn.classList.toggle('kairo-btn-green', s === speed);
    });
}

function switchTab(tabName) {
    currentTab = tabName;
    ['facilities', 'menu', 'staff', 'system'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.classList.toggle('active', t === tabName);
    });
    renderPanel();
}

function renderPanel() {
    const container = document.getElementById('panel-content');
    if (!container) return;
    container.innerHTML = '';

    if (currentTab === 'facilities') {
        FACILITIES_DB.forEach(item => {
            const lv = gameState.facilities[item.id] || 0;
            const isMax = lv >= item.maxLevel;
            const cost = lv === 0 ? item.baseCost : Math.round(item.upgradeCost * Math.pow(1.35, lv - 1));
            const canAfford = gameState.gold >= cost;

            const card = document.createElement('div');
            card.className = 'bg-[#fffdf7] border-2 border-[#8c5a32] rounded p-2.5 flex flex-col justify-between shadow-sm';
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-sm sm:text-base text-[#3e2716]">${item.name}</span>
                        <span class="px-2 py-0.5 rounded text-xs font-bold ${lv > 0 ? 'bg-amber-200 text-amber-900' : 'bg-gray-200 text-gray-600'}">
                            ${lv > 0 ? `Lv.${lv}/${item.maxLevel}` : '未設置'}
                        </span>
                    </div>
                    <p class="text-xs text-[#6e4b32] leading-relaxed mb-2">${item.desc}</p>
                </div>
                <div class="flex items-center justify-between pt-1.5 border-t border-[#e6d5b8]">
                    <span class="text-xs font-bold text-pink-600">✨ 人氣 +${item.appeal + (lv > 0 ? (lv - 1) * 6 : 0)}</span>
                    <button onclick="buyOrUpgradeFacility('${item.id}')" ${isMax || !canAfford ? 'disabled' : ''}
                        class="kairo-btn ${lv === 0 ? 'kairo-btn-green' : 'kairo-btn-orange'} px-3 py-1 text-xs">
                        ${isMax ? '已達最高級' : `${lv === 0 ? '設置' : '升級'} ${cost}G`}
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    } else if (currentTab === 'menu') {
        MENU_DB.forEach(dish => {
            const lv = gameState.menu[dish.id] || 0;
            const isMax = lv >= dish.maxLevel;
            const goldCost = lv === 0 ? dish.unlockGold : Math.round(dish.upgGold * Math.pow(1.3, lv - 1));
            const heartCost = lv === 0 ? dish.unlockHearts : Math.round(dish.upgHearts * Math.pow(1.25, lv - 1));
            const canAfford = gameState.gold >= goldCost && gameState.hearts >= heartCost;
            const currentPrice = getDishPrice(dish);

            const tagHtml = dish.type === 'pet'
                ? '<span class="bg-pink-100 text-pink-800 border border-pink-300 px-1.5 rounded text-[11px]">🐾 寵物鮮食</span>'
                : '<span class="bg-sky-100 text-sky-800 border border-sky-300 px-1.5 rounded text-[11px]">👤 人類餐點</span>';

            const card = document.createElement('div');
            card.className = 'bg-[#fffdf7] border-2 border-[#8c5a32] rounded p-2.5 flex flex-col justify-between shadow-sm';
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-lg">${dish.icon}</span>
                            <span class="font-bold text-sm text-[#3e2716]">${dish.name}</span>
                        </div>
                        ${tagHtml}
                    </div>
                    <p class="text-xs text-[#6e4b32] mb-2">${dish.desc}</p>
                </div>
                <div class="flex items-center justify-between pt-1.5 border-t border-[#e6d5b8]">
                    <div class="text-xs font-bold">
                        <span class="text-amber-700">售價 ${currentPrice}G</span>
                        <span class="text-gray-500 ml-1">${lv > 0 ? `(Lv.${lv})` : '(未研發)'}</span>
                    </div>
                    <button onclick="researchMenu('${dish.id}')" ${isMax || !canAfford ? 'disabled' : ''}
                        class="kairo-btn ${lv === 0 ? 'kairo-btn-blue' : 'kairo-btn-orange'} px-2.5 py-1 text-xs">
                        ${isMax ? '大師級' : `${lv === 0 ? '研發' : '改良'} ${goldCost}G ${heartCost}♥`}
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    } else if (currentTab === 'staff') {
        STAFF_PETS_DB.forEach(sp => {
            const lv = gameState.staffPets[sp.id] || 0;
            const isMax = lv >= sp.maxLevel;
            const cost = lv === 0 ? sp.unlockGold : Math.round(sp.upgGold * Math.pow(1.35, lv - 1));
            const canAfford = gameState.gold >= cost;

            const badgeClass = sp.kind === 'mascot'
                ? 'bg-amber-100 text-amber-900 border-amber-300'
                : 'bg-emerald-100 text-emerald-900 border-emerald-300';

            const card = document.createElement('div');
            card.className = 'bg-[#fffdf7] border-2 border-[#8c5a32] rounded p-2.5 flex flex-col justify-between shadow-sm';
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xl">${sp.avatar}</span>
                            <span class="font-bold text-sm text-[#3e2716]">${sp.name}</span>
                        </div>
                        <span class="border px-1.5 rounded text-[11px] font-bold ${badgeClass}">${sp.role}</span>
                    </div>
                    <p class="text-xs text-[#6e4b32] mb-2">${sp.desc}</p>
                </div>
                <div class="flex items-center justify-between pt-1.5 border-t border-[#e6d5b8]">
                    <span class="text-xs font-bold text-[#4a2c16]">${lv > 0 ? `等級 Lv.${lv}/${sp.maxLevel}` : '尚未加入'}</span>
                    <button onclick="hireOrTrainStaffPet('${sp.id}')" ${isMax || !canAfford ? 'disabled' : ''}
                        class="kairo-btn ${lv === 0 ? 'kairo-btn-green' : 'kairo-btn-orange'} px-3 py-1 text-xs">
                        ${isMax ? '已滿級' : `${lv === 0 ? (sp.kind === 'mascot' ? '領養駐店' : '招募') : '特訓升級'} ${cost}G`}
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    } else if (currentTab === 'system') {
        container.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';
        container.innerHTML = `
            <div class="bg-[#fffdf7] border-2 border-[#8c5a32] rounded p-3 space-y-2">
                <h4 class="font-bold text-sm text-[#3e2716] border-b border-[#e6d5b8] pb-1">📖 開羅經營小秘訣</h4>
                <ul class="text-xs text-[#4a2c16] space-y-1.5 list-disc pl-4">
                    <li><b>雙軌菜單</b>：帶毛孩的飼主會同時點「人類餐點」與「寵物鮮食」，雙倍營收！</li>
                    <li><b>駐店毛孩</b>：領養「豆豆」與「橘子」在店內巡邏，會自動產生 ♥ 愛心研究點並增加小費。</li>
                    <li><b>互動打氣</b>：直接點擊餐廳畫面中的狗狗或貓咪，可以撫摸牠們獲得額外愛心喔！</li>
                </ul>
            </div>
            <div class="bg-[#fffdf7] border-2 border-[#8c5a32] rounded p-3 flex flex-col justify-between space-y-3">
                <div>
                    <h4 class="font-bold text-sm text-[#3e2716] border-b border-[#e6d5b8] pb-1 mb-2">💾 遊戲存檔管理</h4>
                    <p class="text-xs text-[#6e4b32]">系統會在每天營業結束時自動存檔，你也可以隨時手動儲存。</p>
                </div>
                <div class="flex flex-col sm:flex-row gap-2">
                    <button onclick="saveGame(true)" class="kairo-btn kairo-btn-green flex-1 py-2 text-xs">
                        💾 立即手動存檔
                    </button>
                    <button id="btn-reset-confirm" onclick="resetGameProgress()" class="kairo-btn flex-1 py-2 text-xs text-red-700">
                        🗑️ 重置存檔（重新開始）
                    </button>
                </div>
            </div>
        `;
        return;
    }

    container.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5';
}

/**
 * ============================================================================
 * 9. 購買、研發與每日結算操作邏輯
 * ============================================================================
 */
function buyOrUpgradeFacility(id) {
    const item = FACILITIES_DB.find(f => f.id === id);
    if (!item) return;
    const lv = gameState.facilities[id] || 0;
    if (lv >= item.maxLevel) return;

    const cost = lv === 0 ? item.baseCost : Math.round(item.upgradeCost * Math.pow(1.35, lv - 1));
    if (gameState.gold < cost) return;

    gameState.gold -= cost;
    gameState.facilities[id] = lv + 1;
    gameState.rating = Math.min(5.0, +(gameState.rating + 0.08).toFixed(2));

    audio.playUpgrade();
    showToast(`✨ ${item.name} 升至 Lv.${lv + 1}！`);
    setNews(`店內新裝修！「${item.name}」等級提升，餐廳人氣大幅上升！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

function researchMenu(id) {
    const dish = MENU_DB.find(m => m.id === id);
    if (!dish) return;
    const lv = gameState.menu[id] || 0;
    if (lv >= dish.maxLevel) return;

    const goldCost = lv === 0 ? dish.unlockGold : Math.round(dish.upgGold * Math.pow(1.3, lv - 1));
    const heartCost = lv === 0 ? dish.unlockHearts : Math.round(dish.upgHearts * Math.pow(1.25, lv - 1));

    if (gameState.gold < goldCost || gameState.hearts < heartCost) return;

    gameState.gold -= goldCost;
    gameState.hearts -= heartCost;
    gameState.menu[id] = lv + 1;
    gameState.rating = Math.min(5.0, +(gameState.rating + 0.06).toFixed(2));

    audio.playUpgrade();
    showToast(`🍽️ 「${dish.name}」研發成功 (Lv.${lv + 1})！`);
    setNews(`新菜單好評如潮！「${dish.name}」現在售價 ${getDishPrice(dish)}G！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

function hireOrTrainStaffPet(id) {
    const sp = STAFF_PETS_DB.find(s => s.id === id);
    if (!sp) return;
    const lv = gameState.staffPets[id] || 0;
    if (lv >= sp.maxLevel) return;

    const cost = lv === 0 ? sp.unlockGold : Math.round(sp.upgGold * Math.pow(1.35, lv - 1));
    if (gameState.gold < cost) return;

    gameState.gold -= cost;
    gameState.staffPets[id] = lv + 1;

    syncDynamicEntities();
    if (sp.kind === 'mascot') audio.playPetSound();
    else audio.playUpgrade();

    showToast(`${sp.avatar} ${sp.name} 達到 Lv.${lv + 1}！`);
    setNews(`${sp.name} 幹勁十足，毛孩星光餐廳的服務品質更上一層樓！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

function triggerEndOfDay() {
    isEndOfDayModalOpen = true;
    saveGame(false);

    document.getElementById('eod-title').textContent = `🌙 第 ${gameState.day} 天 營業結算報告`;
    document.getElementById('eod-customers').textContent = `${gameState.dailyStats.customers} 組`;
    document.getElementById('eod-pets').textContent = `${gameState.dailyStats.pets} 隻`;
    document.getElementById('eod-revenue').textContent = `+${gameState.dailyStats.revenue.toLocaleString()}G`;
    document.getElementById('eod-hearts').textContent = `+${gameState.dailyStats.hearts}♥`;
    document.getElementById('eod-rating').textContent = `★ ${gameState.rating.toFixed(1)}`;

    const commentEl = document.getElementById('eod-comment');
    if (gameState.dailyStats.revenue >= 1500) {
        commentEl.textContent = '🌟 評語：高朋滿座的奇蹟！整條街的飼主都在討論這家超棒的毛孩餐廳！';
    } else if (gameState.dailyStats.revenue >= 600) {
        commentEl.textContent = '✨ 評語：營運非常穩健！試著多研發幾道寵物鮮食來提高客單價吧！';
    } else {
        commentEl.textContent = '💡 評語：溫馨的小店正穩步成長，擴建座位與草皮遊戲區能吸引更多客人喔！';
    }

    const modal = document.getElementById('eod-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function startNextDay() {
    gameState.day += 1;
    gameState.timeMinutes = 9 * 60;
    gameState.dailyStats = { revenue: 0, customers: 0, pets: 0, hearts: 0 };

    customers = [];
    kitchenOrders = [];
    readyDishes = [];
    tablesState.forEach(t => {
        t.occupiedBy = null;
        t.dirty = false;
        t.cleanProgress = 0;
    });

    isEndOfDayModalOpen = false;
    const modal = document.getElementById('eod-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');

    audio.playUpgrade();
    setNews(`☀️ 第 ${gameState.day} 天開始營業囉！祝今天也客似雲來！`);
    saveGame(false);
    updateTopHUD();
    renderPanel();
}

function openStatsModal() {
    const body = document.getElementById('stats-body');
    const unlockedMenuCount = Object.values(gameState.menu).filter(v => v > 0).length;
    const unlockedFacCount = Object.values(gameState.facilities).filter(v => v > 0).length;

    body.innerHTML = `
        <div class="flex justify-between py-1 border-b border-[#e6d5b8]"><span>📅 累計營業天數</span><b>${gameState.day} 天</b></div>
        <div class="flex justify-between py-1 border-b border-[#e6d5b8]"><span>💰 累計總營業額</span><b class="text-amber-700">${gameState.totalRevenue.toLocaleString()}G</b></div>
        <div class="flex justify-between py-1 border-b border-[#e6d5b8]"><span>👥 累計接待顧客</span><b>${gameState.totalCustomers} 組</b></div>
        <div class="flex justify-between py-1 border-b border-[#e6d5b8]"><span>🐶 累計服務毛孩</span><b class="text-orange-700">${gameState.totalPetsServed} 隻</b></div>
        <div class="flex justify-between py-1 border-b border-[#e6d5b8]"><span>🍽️ 已研發菜單數</span><b>${unlockedMenuCount} / ${MENU_DB.length} 道</b></div>
        <div class="flex justify-between py-1"><span>🏠 已設置設施數</span><b>${unlockedFacCount} / ${FACILITIES_DB.length} 項</b></div>
    `;
    const modal = document.getElementById('stats-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeStatsModal() {
    const modal = document.getElementById('stats-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

/**
 * ============================================================================
 * 10. 遊戲主動畫迴圈與啟動入口
 * ============================================================================
 */
let lastFrameTime = performance.now();
let uiSyncTimer = 0;

function gameLoop(now) {
    const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    updateSimulation(dt);
    renderScene();

    uiSyncTimer += dt;
    if (uiSyncTimer >= 0.25) {
        uiSyncTimer = 0;
        updateTopHUD();
    }

    requestAnimationFrame(gameLoop);
}

window.onload = function () {
    resizeCanvas();
    initEntities();
    updateTopHUD();
    renderPanel();
    requestAnimationFrame(gameLoop);
};
</script>
