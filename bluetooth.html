        function getTodayDateStr(dateObj = new Date()) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // 初始化 Firebase
        try {
            firebase.initializeApp({ databaseURL: FIREBASE_DB_URL.trim() });
            database = firebase.database();
        } catch(e) {
            console.error("Firebase 初始化失敗:", e);
        }

        // 啟動 LIFF 並抓取真實 LINE 身分
        async function initLIFF() {
            const statusEl = document.getElementById('liff-status');
            try {
                if (LIFF_ID && LIFF_ID.length > 5) {
                    await liff.init({ liffId: LIFF_ID });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        lineUserId = profile.userId;
                        lineDisplayName = profile.displayName || "LINE 同學";
                        statusEl.innerText = `👤 已認證：${lineDisplayName}`;
                    } else {
                        liff.login();
                    }
                } else {
                    setupFallbackIdentity();
                }
            } catch (err) {
                console.warn("LIFF 啟用失敗，切換為瀏覽器相容模式:", err);
                setupFallbackIdentity();
            }
        }

        function setupFallbackIdentity() {
            let localDevId = localStorage.getItem('device_fingerprint_id');
            if (!localDevId) {
                localDevId = 'DEV_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('device_fingerprint_id', localDevId);
            }
            lineUserId = localDevId;
            document.getElementById('liff-status').innerText = "📡 網頁已連線至安全基地台";
        }

        async function fetchRosterFromFirebase() {
            if (!database) return;
            try {
                const snap = await database.ref('movie_club_settings/rawStudentsList').once('value');
                const raw = snap.val();
                if (raw && typeof raw === 'string') {
                    const parsed = [];
                    raw.split('\n').forEach(line => {
                        const parts = line.trim().split(/[\t,\s]+/);
                        if (parts.length >= 2) {
                            parsed.push({ id: parts[0].trim(), name: parts[1].trim() });
                        }
                    });
                    if (parsed.length > 0) {
                        currentStudents = parsed;
                    }
                }
            } catch(e) {
                console.warn("無法取得雲端名單，繼續使用預設名單備援", e);
            }
        }

        function bindInputHelpers() {
            const idInput = document.getElementById('student-id');
            const hintEl = document.getElementById('student-name-hint');
            
            // 自動帶入先前儲存的學號
            const savedId = localStorage.getItem('movie_club_pref_sid');
            if (savedId) {
                idInput.value = savedId;
                document.getElementById('remember-id').checked = true;
                const match = currentStudents.find(s => s.id === savedId);
                if (match) {
                    hintEl.innerText = `✓ ${match.name}`;
                    hintEl.className = "text-xs font-bold text-emerald-600 truncate max-w-[150px]";
                }
            }

            idInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (val.length === 8) {
                    const match = currentStudents.find(s => s.id === val);
                    if (match) {
                        hintEl.innerText = `✓ ${match.name}`;
                        hintEl.className = "text-xs font-bold text-emerald-600 truncate max-w-[150px]";
                    } else {
                        hintEl.innerText = "❌ 查無此學號";
                        hintEl.className = "text-xs font-bold text-rose-500 truncate max-w-[150px]";
                    }
                } else {
                    hintEl.innerText = "";
                }
            });
        }

        async function executeCheckIn() {
            const idInput = document.getElementById('student-id');
            const otpInput = document.getElementById('otp-code');
            const rememberChk = document.getElementById('remember-id');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            const sid = idInput.value.trim();
            const otp = otpInput.value.replace(/\D/g, '').trim();

            if (!sid || sid.length !== 8) {
                displayNotice("請填寫完整的 8 碼學生學號！", "error");
                idInput.focus();
                return;
            }

            if (!otp || otp.length !== 4) {
                displayNotice("請輸入大螢幕上顯示的 4 碼快閃口令！", "error");
                otpInput.focus();
                return;
            }

            // 按鈕進入載入模式
            submitBtn.disabled = true;
            btnText.innerText = "正在驗證並處理打卡...";
            btnSpinner.classList.remove('hidden');

            try {
                // 1. 同步最新名單並檢驗
                await fetchRosterFromFirebase();
                const student = currentStudents.find(s => s.id === sid);
                if (!student) {
                    displayNotice(`❌ 簽到失敗：學號 [${sid}] 不在選課名單中！`, "error");
                    resetButtonState();
                    return;
                }

                // 2. 比對動態驗證碼 (探測 current_otp_code, prev_otp_code 及替代路徑)
                const [curSnap, prevSnap, altSnap] = await Promise.all([
                    database.ref('current_otp_code').once('value'),
                    database.ref('prev_otp_code').once('value'),
                    database.ref('movie_club_rollcall/current_code').once('value')
                ]);

                const cVal = curSnap.exists() ? String(curSnap.val()).trim() : "";
                const pVal = prevSnap.exists() ? String(prevSnap.val()).trim() : "";
                const aVal = altSnap.exists() ? String(altSnap.val()).trim() : "";
                const validOtps = [cVal, pVal, aVal].filter(x => x !== "");

                if (validOtps.length === 0) {
                    displayNotice("⚠️ 驗證失敗：前方投影幕看板未開啟，請提醒老師開啟看板！", "error");
                    resetButtonState();
                    return;
                }

                if (!validOtps.includes(otp)) {
                    displayNotice(`❌ 快閃口令錯誤或已逾期！請抬頭查看大螢幕最新口令。`, "error");
                    otpInput.value = "";
                    otpInput.focus();
                    resetButtonState();
                    return;
                }

                // 3. 一機一號防代簽檢測
                const bindRef = database.ref(`movie_club_bindings/${lineUserId}`);
                const bindSnap = await bindRef.once('value');
                const boundId = bindSnap.val();

                if (boundId && String(boundId).trim() !== sid) {
                    displayNotice(`❌ 代簽失敗：這部裝置已綁定學號 [${boundId}]，無法替他人簽到！`, "error");
                    resetButtonState();
                    return;
                } else if (!boundId) {
                    await bindRef.set(sid);
                }

                // 4. 寫入 Firebase 出席資料庫
                const todayStr = getTodayDateStr();
                const nowTimeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                await database.ref(`movie_club_rollcall/${todayStr}/${sid}`).set(1);

                // 5. 處理本地記憶學號
                if (rememberChk.checked) {
                    localStorage.setItem('movie_club_pref_sid', sid);
                } else {
                    localStorage.removeItem('movie_club_pref_sid');
                }

                let lineNotified = false;

                // 🌟 核心修復：單軌主動推播（僅呼叫後端發送官方收據，不使用 liff.sendMessages，避免觸發對話框二次誤判）
                if (GAS_WEB_APP_URL && lineUserId && lineUserId.startsWith("U")) {
                    try {
                        await fetch(GAS_WEB_APP_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                action: "push_checkin",
                                userId: lineUserId,
                                studentId: sid,
                                studentName: student.name,
                                checkinTime: `${todayStr} ${nowTimeStr}`
                            })
                        });
                        lineNotified = true;
                    } catch (pushErr) {
                        console.warn("GAS 推播請求失敗:", pushErr);
                    }
                }

                // 6. 渲染簽到完成介面
                document.getElementById('form-section').classList.add('hidden');
                const successScreen = document.getElementById('success-screen');
                successScreen.classList.remove('hidden');
                successScreen.classList.add('flex');

                document.getElementById('res-name').innerText = student.name;
                document.getElementById('res-id').innerText = sid;
                document.getElementById('res-time').innerText = `${todayStr} ${nowTimeStr}`;
                document.getElementById('res-notify-status').innerText = lineNotified ? "已送達聊天室" : "雲端已登記打卡";

                // 自動關閉視窗返回聊天室
                setTimeout(() => {
                    if (window.liff && liff.isInClient && liff.isInClient()) {
                        liff.closeWindow();
                    }
                }, 1800);

            } catch (err) {
                console.error("簽到過程發生錯誤:", err);
                displayNotice("⚠️ 連線異常，請檢查網路環境或稍候重試！", "error");
                resetButtonState();
            }
        }

        function resetButtonState() {
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            submitBtn.disabled = false;
            btnText.innerText = "確認簽到並接收 LINE 通知";
            btnSpinner.classList.add('hidden');
        }

        function displayNotice(text, type) {
            const el = document.getElementById('status-msg');
            el.classList.remove('hidden');
            el.innerHTML = text;
            if (type === "error") {
                el.className = "p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all bg-rose-50 text-rose-700 border border-rose-200";
            } else {
                el.className = "p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all bg-emerald-50 text-emerald-700 border border-emerald-200";
            }
        }

        window.onload = async () => {
            await initLIFF();
            await fetchRosterFromFirebase();
            bindInputHelpers();
        };
    </script>
</body>
</html>
