<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電影欣賞社</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebase Compatibility SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden relative transition-all duration-300">
        
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-white/5 rounded-full pointer-events-none"></div>
            <div class="absolute -left-6 -top-6 w-24 h-24 bg-white/5 rounded-full pointer-events-none"></div>
            
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md text-xs font-semibold text-blue-200 mb-2">
                <span>🎬 電影欣賞社</span>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>即時打卡安檢</span>
            </div>
            <h1 class="text-2xl font-black tracking-tight">實時簽到系統</h1>
            <p class="text-xs text-blue-200/90 mt-1" id="liff-status">正在連線至認證伺服器...</p>
        </div>

        <!-- Check-in Form Body -->
        <div class="p-6 space-y-5" id="form-section">
            <div>
                <label for="student-id" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                    學生學號 (8 碼)
                </label>
                <input 
                    type="tel" 
                    id="student-id" 
                    maxlength="8" 
                    placeholder="例如：11401011" 
                    class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-xl font-black tracking-widest text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:bg-white focus:border-indigo-600 focus:outline-none transition-all shadow-inner"
                >
                <div class="flex items-center justify-between mt-2 px-1">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-500 select-none">
                        <input type="checkbox" id="remember-id" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                        <span>記住此學號 (下次免輸入)</span>
                    </label>
                    <span id="student-name-hint" class="text-xs font-bold truncate max-w-[150px]"></span>
                </div>
            </div>

            <div>
                <label for="otp-code" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                    大螢幕 4 位快閃口令
                </label>
                <input 
                    type="tel" 
                    id="otp-code" 
                    maxlength="4" 
                    placeholder="0000" 
                    class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl font-black tracking-widest text-indigo-950 placeholder:text-slate-300 focus:bg-white focus:border-indigo-600 focus:outline-none transition-all shadow-inner uppercase"
                >
                <p class="text-[11px] text-slate-400 text-center mt-1.5">
                    💡 請抬頭查看前方大螢幕上顯示的動態口令
                </p>
            </div>

            <!-- Feedback Notice -->
            <div id="status-msg" class="hidden p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all"></div>

            <!-- Submit Button -->
            <button 
                id="submit-btn" 
                onclick="executeCheckIn()" 
                class="w-full py-4 bg-gradient-to-r from-indigo-700 to-blue-700 hover:from-indigo-800 hover:to-blue-800 text-white font-extrabold text-base rounded-2xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2"
            >
                <span id="btn-text">確認簽到並接收 LINE 通知</span>
                <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            </button>
        </div>

        <!-- Success Result Overlay -->
        <div id="success-screen" class="hidden p-8 text-center flex-col items-center justify-center space-y-4">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl shadow-inner animate-pop">
                ✓
            </div>
            <h2 class="text-2xl font-black text-slate-800">簽到成功！</h2>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 w-full text-left space-y-2 text-xs text-slate-600">
                <div class="flex justify-between"><span>學生姓名：</span><strong class="text-slate-900 font-bold" id="res-name">-</strong></div>
                <div class="flex justify-between"><span>學生學號：</span><strong class="text-slate-900 font-mono" id="res-id">-</strong></div>
                <div class="flex justify-between"><span>簽到時間：</span><strong class="text-slate-900" id="res-time">-</strong></div>
                <div class="flex justify-between"><span>LINE 訊息通知：</span><span class="text-emerald-600 font-bold" id="res-notify-status">已同步發送</span></div>
            </div>
            <p class="text-xs text-slate-400">視窗即將自動關閉返回聊天室...</p>
        </div>

        <!-- Security Footer -->
        <div class="bg-slate-50 border-t border-slate-100 px-6 py-3.5 text-center">
            <p class="text-[11px] text-slate-400 font-medium">※ 一機限綁定簽到一組學號，嚴禁代簽</p>
        </div>
    </div>

    <script>
        // 🌟 核心參數設定
        const LIFF_ID = "2010768591-SwfwcK3q"; 
        const FIREBASE_DB_URL = "https://movie-76596-default-rtdb.asia-southeast1.firebasedatabase.app/";
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzf-cXjOr3neShtkf5tnMyTbOayb2xAL4FOzNnGu2Ts5Swamx1n8WHA24DO3d5x7A_H3w/exec";
        
        // 備援預設名單（若 Firebase 尚未設定或離線時使用）
        const defaultStudents = [
            { id: "11401011", name: "測試學生" }
        ];

        let database = null;
        let lineUserId = "";
        let lineDisplayName = "";
        let currentStudents = [...defaultStudents];

        function getTodayDateStr(dateObj = new Date()) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // 初始化 Firebase
        try {
            firebase.initializeApp({ databaseURL: FIREBASE_DB_URL.trim() });
            database = firebase.database();
        } catch(e) {
            console.error("Firebase 初始化失敗:", e);
        }

        // 啟動 LIFF 並抓取真實 LINE 身分
        async function initLIFF() {
            const statusEl = document.getElementById('liff-status');
            try {
                if (LIFF_ID && LIFF_ID.length > 5) {
                    await liff.init({ liffId: LIFF_ID });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        lineUserId = profile.userId;
                        lineDisplayName = profile.displayName || "LINE 同學";
                        statusEl.innerText = `👤 已認證：${lineDisplayName}`;
                    } else {
                        liff.login();
                    }
                } else {
                    setupFallbackIdentity();
                }
            } catch (err) {
                console.warn("LIFF 啟用失敗，切換為瀏覽器相容模式:", err);
                setupFallbackIdentity();
            }
        }

        function setupFallbackIdentity() {
            let localDevId = localStorage.getItem('device_fingerprint_id');
            if (!localDevId) {
                localDevId = 'DEV_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('device_fingerprint_id', localDevId);
            }
            lineUserId = localDevId;
            document.getElementById('liff-status').innerText = "📡 網頁已連線至安全基地台";
        }

        async function fetchRosterFromFirebase() {
            if (!database) return;
            try {
                const snap = await database.ref('movie_club_settings/rawStudentsList').once('value');
                const raw = snap.val();
                if (raw && typeof raw === 'string') {
                    const parsed = [];
                    raw.split('\n').forEach(line => {
                        const parts = line.trim().split(/[\t,\s]+/);
                        if (parts.length >= 2) {
                            parsed.push({ id: parts[0].trim(), name: parts[1].trim() });
                        }
                    });
                    if (parsed.length > 0) {
                        currentStudents = parsed;
                    }
                }
            } catch(e) {
                console.warn("無法取得雲端名單，繼續使用預設名單備援", e);
            }
        }

        function bindInputHelpers() {
            const idInput = document.getElementById('student-id');
            const hintEl = document.getElementById('student-name-hint');
            
            // 自動帶入先前儲存的學號
            const savedId = localStorage.getItem('movie_club_pref_sid');
            if (savedId) {
                idInput.value = savedId;
                document.getElementById('remember-id').checked = true;
                const match = currentStudents.find(s => s.id === savedId);
                if (match) {
                    hintEl.innerText = `✓ ${match.name}`;
                    hintEl.className = "text-xs font-bold text-emerald-600 truncate max-w-[150px]";
                }
            }

            idInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (val.length === 8) {
                    const match = currentStudents.find(s => s.id === val);
                    if (match) {
                        hintEl.innerText = `✓ ${match.name}`;
                        hintEl.className = "text-xs font-bold text-emerald-600 truncate max-w-[150px]";
                    } else {
                        hintEl.innerText = "❌ 查無此學號";
                        hintEl.className = "text-xs font-bold text-rose-500 truncate max-w-[150px]";
                    }
                } else {
                    hintEl.innerText = "";
                }
            });
        }

        async function executeCheckIn() {
            const idInput = document.getElementById('student-id');
            const otpInput = document.getElementById('otp-code');
            const rememberChk = document.getElementById('remember-id');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            const sid = idInput.value.trim();
            const otp = otpInput.value.replace(/\D/g, '').trim();

            if (!sid || sid.length !== 8) {
                displayNotice("請填寫完整的 8 碼學生學號！", "error");
                idInput.focus();
                return;
            }

            if (!otp || otp.length !== 4) {
                displayNotice("請輸入大螢幕上顯示的 4 碼快閃口令！", "error");
                otpInput.focus();
                return;
            }

            // 按鈕進入載入模式
            submitBtn.disabled = true;
            btnText.innerText = "正在驗證並處理打卡...";
            btnSpinner.classList.remove('hidden');

            try {
                // 1. 同步最新名單並檢驗
                await fetchRosterFromFirebase();
                const student = currentStudents.find(s => s.id === sid);
                if (!student) {
                    displayNotice(`❌ 簽到失敗：學號 [${sid}] 不在選課名單中！`, "error");
                    resetButtonState();
                    return;
                }

                // 2. 比對動態驗證碼 (探測 current_otp_code, prev_otp_code 及替代路徑)
                const [curSnap, prevSnap, altSnap] = await Promise.all([
                    database.ref('current_otp_code').once('value'),
                    database.ref('prev_otp_code').once('value'),
                    database.ref('movie_club_rollcall/current_code').once('value')
                ]);

                const cVal = curSnap.exists() ? String(curSnap.val()).trim() : "";
                const pVal = prevSnap.exists() ? String(prevSnap.val()).trim() : "";
                const aVal = altSnap.exists() ? String(altSnap.val()).trim() : "";
                const validOtps = [cVal, pVal, aVal].filter(x => x !== "");

                if (validOtps.length === 0) {
                    displayNotice("⚠️ 驗證失敗：前方投影幕看板未開啟，請提醒老師開啟看板！", "error");
                    resetButtonState();
                    return;
                }

                if (!validOtps.includes(otp)) {
                    displayNotice(`❌ 快閃口令錯誤或已逾期！請抬頭查看大螢幕最新口令。`, "error");
                    otpInput.value = "";
                    otpInput.focus();
                    resetButtonState();
                    return;
                }

                // 3. 一機一號防代簽檢測
                const bindRef = database.ref(`movie_club_bindings/${lineUserId}`);
                const bindSnap = await bindRef.once('value');
                const boundId = bindSnap.val();

                if (boundId && String(boundId).trim() !== sid) {
                    displayNotice(`❌ 代簽失敗：這部裝置已綁定學號 [${boundId}]，無法替他人簽到！`, "error");
                    resetButtonState();
                    return;
                } else if (!boundId) {
                    await bindRef.set(sid);
                }

                // 4. 寫入 Firebase 出席資料庫
                const todayStr = getTodayDateStr();
                const nowTimeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                await database.ref(`movie_club_rollcall/${todayStr}/${sid}`).set(1);

                // 5. 處理本地記憶學號
                if (rememberChk.checked) {
                    localStorage.setItem('movie_club_pref_sid', sid);
                } else {
                    localStorage.removeItem('movie_club_pref_sid');
                }

                let lineNotified = false;

                // 6. 單軌主動推播
                if (GAS_WEB_APP_URL && lineUserId && lineUserId.startsWith("U")) {
                    try {
                        await fetch(GAS_WEB_APP_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                action: "push_checkin",
                                userId: lineUserId,
                                studentId: sid,
                                studentName: student.name,
                                checkinTime: `${todayStr} ${nowTimeStr}`
                            })
                        });
                        lineNotified = true;
                    } catch (pushErr) {
                        console.warn("GAS 推播請求失敗:", pushErr);
                    }
                }

                // 7. 渲染簽到完成介面
                document.getElementById('form-section').classList.add('hidden');
                const successScreen = document.getElementById('success-screen');
                successScreen.classList.remove('hidden');
                successScreen.classList.add('flex');

                document.getElementById('res-name').innerText = student.name;
                document.getElementById('res-id').innerText = sid;
                document.getElementById('res-time').innerText = `${todayStr} ${nowTimeStr}`;
                document.getElementById('res-notify-status').innerText = lineNotified ? "已送達聊天室" : "雲端已登記打卡";

                // 自動關閉視窗返回聊天室
                setTimeout(() => {
                    if (window.liff && liff.isInClient && liff.isInClient()) {
                        liff.closeWindow();
                    }
                }, 1800);

            } catch (err) {
                console.error("簽到過程發生錯誤:", err);
                displayNotice("⚠️ 連線異常，請檢查網路環境或稍候重試！", "error");
                resetButtonState();
            }
        }

        function resetButtonState() {
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            submitBtn.disabled = false;
            btnText.innerText = "確認簽到並接收 LINE 通知";
            btnSpinner.classList.add('hidden');
        }

        function displayNotice(text, type) {
            const el = document.getElementById('status-msg');
            el.classList.remove('hidden');
            el.innerHTML = text;
            if (type === "error") {
                el.className = "p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all bg-rose-50 text-rose-700 border border-rose-200";
            } else {
                el.className = "p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all bg-emerald-50 text-emerald-700 border border-emerald-200";
            }
        }

        window.onload = async () => {
            await initLIFF();
            await fetchRosterFromFirebase();
            bindInputHelpers();
        };
    </script>
</body>
</html>
