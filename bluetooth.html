            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: white; 
            border-radius: 16px; 
            padding: 24px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        h2 { 
            margin: 0 0 8px 0; 
            color: #2b4c7e; 
            text-align: center; 
            font-size: 22px;
        }
        .info { 
            font-size: 13px; 
            color: #666; 
            text-align: center; 
            margin-bottom: 20px; 
        }
        .form-group { margin-bottom: 16px; }
        label { 
            display: block; 
            font-size: 14px; 
            font-weight: bold; 
            margin-bottom: 6px; 
            color: #333; 
        }
        input { 
            width: 100%; 
            padding: 14px; 
            font-size: 18px; 
            border: 2px solid #badcfa; 
            border-radius: 8px; 
            outline: none; 
            text-align: center;
            font-weight: bold;

        input:focus { border-color: #2b4c7e; }
        .btn {

            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px;

            transition: background 0.2s;
        }
        .btn:active { background: #1f3659; }
        .btn:disabled { background: #b0bec5; cursor: not-allowed; }
        .result-box { 
            margin-top: 15px; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            text-align: center; 
            font-size: 13px;
            display: none; 
            line-height: 1.5;
            word-break: break-all;
        }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>

        let currentStudents = [...defaultStudents];

        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function initLIFF() {
            try {
                if (MY_LIFF_ID && MY_LIFF_ID !== "2010768591-SwfwcK3q") {
                    await liff.init({ liffId: MY_LIFF_ID });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        currentLineUserId = profile.userId;
                        document.getElementById('user-info').innerText = `已綁定 LINE：${profile.displayName}`;
                    } else {
                        liff.login();
                    }
                } else {
                    useBrowserFallbackIdentity();
                }
            } catch (err) {
                useBrowserFallbackIdentity();
            }
        }

        function useBrowserFallbackIdentity() {
            currentLineUserId = localStorage.getItem('device_uuid') || ('DEV_' + Math.random().toString(36).substr(2, 9));
            localStorage.setItem('device_uuid', currentLineUserId);
            document.getElementById('user-info').innerText = "已連線至點名基地台";
        }

        async function fetchLatestStudents() {
            try {
                const snapshot = await db.ref('movie_club_settings/rawStudentsList').once('value');
                const raw = snapshot.val();
                if (raw && typeof raw === 'string') {
                    const list = [];
                    raw.split('\n').forEach(line => {
                        const parts = line.trim().split(/[\t,\s]+/);
                        if (parts.length >= 2) {
                            list.push({ id: parts[0].trim(), name: parts[1].trim() });
                        }
                    });
                    if (list.length > 0) currentStudents = list;
                }
            } catch (e) {
                console.warn("使用預設名單備援", e);
            }
        }

        async function executeCheckIn() {
            const sidInput = document.getElementById('student-id').value.trim();
            // 自動轉換半形並移除非數字字元
            const otpInput = document.getElementById('otp-code').value.replace(/\D/g, '').trim();
            const btn = document.getElementById('submit-btn');

            if (!sidInput || sidInput.length !== 8) {
                showResult("⚠️ 請填寫完整的 8 位學號！", "error");
                return;
            }
            if (!otpInput || otpInput.length !== 4) {
                showResult("⚠️ 請填寫大螢幕上的 4 位口令！", "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "驗證中...";

            await fetchLatestStudents();

            // 1. 比對學號
            const student = currentStudents.find(s => s.id === sidInput);
            if (!student) {
                showResult(`❌ 簽到失敗！學號 [${sidInput}] 不在名單中。`, "error");
                btn.disabled = false;
                btn.innerText = "確認簽到";
                return;
            }

            // 2. 探測並驗證口令
            try {
                const [curSnap, prevSnap, altSnap] = await Promise.all([
                    db.ref('current_otp_code').once('value'),
                    db.ref('prev_otp_code').once('value'),
                    db.ref('movie_club_rollcall/current_code').once('value')
                ]);

                // 強制純文字提取
                const curCode = curSnap.exists() ? String(curSnap.val()).trim() : "";
                const prevCode = prevSnap.exists() ? String(prevSnap.val()).trim() : "";
                const altCode = altSnap.exists() ? String(altSnap.val()).trim() : "";

                const validList = [curCode, prevCode, altCode].filter(c => c !== "");

                // 若雲端目前沒有任何口令，代表大螢幕看板未開啟
                if (validList.length === 0) {
                    showResult("⚠️ 驗證失敗：前方大螢幕看板尚未開啟連線，請提醒老師開啟看板！", "error");
                    btn.disabled = false;
                    btn.innerText = "確認簽到";
                    return;
                }

                // 比對驗證碼
                if (!validList.includes(otpInput)) {
                    showResult(`❌ 快閃口令錯誤或已失效！<br>(您輸入：${otpInput}，雲端最新：${curCode || altCode})`, "error");
                    btn.disabled = false;
                    btn.innerText = "確認簽到";
                    return;
                }

                // 3. 一機一號防代簽檢測
                const bindSnap = await db.ref(`movie_club_bindings/${currentLineUserId}`).once('value');
                const boundId = bindSnap.val();
                if (boundId && String(boundId).trim() !== sidInput) {
                    showResult(`❌ 代簽失敗！這台手機已綁定學號 [${boundId}]。`, "error");
                    btn.disabled = false;
                    btn.innerText = "確認簽到";
                    return;
                } else if (!boundId) {
                    await db.ref(`movie_club_bindings/${currentLineUserId}`).set(sidInput);
                }

                // 4. 寫入今日簽到紀錄
                const todayStr = getTodayStr();
                await db.ref(`movie_club_rollcall/${todayStr}/${sidInput}`).set(1);

                showResult(`🎉 簽到成功！【${student.name}】已完成點名。`, "success");
                btn.innerText = "✅ 簽到已完成";

                // 自動關閉視窗
                setTimeout(() => {
                    if (window.liff && liff.isInClient && liff.isInClient()) {
                        liff.closeWindow();
                    }
                }, 2000);

            } catch (err) {
                console.error(err);
                showResult("⚠️ 連線異常，請確認網路環境或 Firebase 規則是否開放！", "error");
                btn.disabled = false;
                btn.innerText = "確認簽到";
            }
        }

        function showResult(msg, type) {
            const box = document.getElementById('result-box');
            box.style.display = 'block';
            box.className = `result-box ${type}`;
            box.innerHTML = msg;
        }

        window.onload = () => {
            initLIFF();
            fetchLatestStudents();
        };
