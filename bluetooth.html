<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電影欣賞社 - 學生簽到系統</title>
    <style>
        :root {
            --primary: #2b4c7e;
            --primary-dark: #1b3254;
            --success: #2e7d32;
            --danger: #d32f2f;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .checkin-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 28px 24px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            color: var(--primary);
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .form-control:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(43, 76, 126, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
            background-color: var(--primary-dark);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            line-height: 1.5;
        }

        .status-message.success {
            background-color: #e8f5e9;
            color: var(--success);
            border: 1px solid #c8e6c9;
            display: block;
        }

        .status-message.error {
            background-color: #ffebee;
            color: var(--danger);
            border: 1px solid #ffcdd2;
            display: block;
        }

        .status-message.loading {
            background-color: #e2e8f0;
            color: #475569;
            display: block;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="checkin-card">
        <div class="header">
            <h1>🎬 電影欣賞社</h1>
            <p>課堂即時簽到認證</p>
        </div>

        <form id="checkin-form" onsubmit="handleCheckin(event)">
            <div class="form-group">
                <label for="student-id">學生學號 (8 碼)</label>
                <input type="text" id="student-id" class="form-control" placeholder="例如：11401011" maxlength="8" inputmode="numeric" required autofocus>
            </div>

            <div class="form-group">
                <label for="otp-code">投影幕動態快閃口令 (4 碼)</label>
                <input type="text" id="otp-code" class="form-control" placeholder="請見教室大螢幕" maxlength="4" inputmode="numeric" required>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">立即簽到</button>
        </form>

        <div id="status-box" class="status-message"></div>

        <div class="footer">
            點名結果將即時同步至雲端看板
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://movie-76596-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 格式化今日日期 (YYYY-MM-DD，依台北時間)
        function getTaipeiTodayString() {
            const now = new Date();
            const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
            const taipeiTime = new Date(utcTime + (3600000 * 8));
            const y = taipeiTime.getFullYear();
            const m = String(taipeiTime.getMonth() + 1).padStart(2, '0');
            const d = String(taipeiTime.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function handleCheckin(event) {
            event.preventDefault();

            const studentIdInput = document.getElementById('student-id');
            const otpInput = document.getElementById('otp-code');
            const submitBtn = document.getElementById('submit-btn');
            const statusBox = document.getElementById('status-box');

            const sid = studentIdInput.value.trim();
            const enteredOtp = otpInput.value.trim();

            if (!/^\d{8}$/.test(sid)) {
                showStatus("⚠️ 請輸入正確的 8 碼數字學號", "error");
                return;
            }

            if (!/^\d{4}$/.test(enteredOtp)) {
                showStatus("⚠️ 請輸入螢幕上的 4 碼數字口令", "error");
                return;
            }

            submitBtn.disabled = true;
            showStatus("⏳ 正在驗證口令並寫入出席紀錄...", "loading");

            try {
                // 1. 抓取大螢幕目前口令 (同時相容 current_otp_code 與舊節點)
                let validOtp = null;
                const otpSnapshot = await database.ref('current_otp_code').get();
                
                if (otpSnapshot.exists()) {
                    validOtp = String(otpSnapshot.val()).trim();
                } else {
                    const fallbackSnap = await database.ref('movie_club_rollcall/current_code').get();
                    if (fallbackSnap.exists()) {
                        validOtp = String(fallbackSnap.val()).trim();
                    }
                }

                if (!validOtp) {
                    showStatus("❌ 教室大螢幕尚未啟動或連線中斷，請向現場老師反映", "error");
                    submitBtn.disabled = false;
                    return;
                }

                if (enteredOtp !== validOtp) {
                    showStatus("❌ 口令錯誤或已更新！請看大螢幕輸入最新口令", "error");
                    submitBtn.disabled = false;
                    otpInput.value = "";
                    otpInput.focus();
                    return;
                }

                // 2. 寫入 Firebase (純淨寫入：路徑為 movie_club_rollcall/YYYY-MM-DD/學號)
                const todayKey = getTaipeiTodayString();
                const studentRecordRef = database.ref(`movie_club_rollcall/${todayKey}/${sid}`);

                await studentRecordRef.set(1);

                // 3. 成功反饋 (不發送任何可能導致反向覆蓋的無效請求)
                showStatus(`✅ 簽到成功！學號 [${sid}] 出席已確認記錄。`, "success");
                otpInput.value = "";
                studentIdInput.disabled = true;
                otpInput.disabled = true;
                submitBtn.innerText = "已完成簽到";

            } catch (err) {
                console.error("簽到失敗:", err);
                showStatus(`❌ 簽到寫入失敗：${err.message || "連線異常"}`, "error");
                submitBtn.disabled = false;
            }
        }

        function showStatus(msg, type) {
            const statusBox = document.getElementById('status-box');
            statusBox.className = `status-message ${type}`;
            statusBox.innerText = msg;
        }
    </script>
</body>
</html>
