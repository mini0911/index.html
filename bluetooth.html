<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電影欣賞社</title>
    <!-- Tailwind CSS for sleek responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK & Firebase Compatibility SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @keyframes checkmarkPop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-check {
            animation: checkmarkPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden relative transition-all duration-300">
        <!-- Top Visual Header -->
        <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-white/5 rounded-full pointer-events-none"></div>
            <div class="absolute -left-6 -top-6 w-24 h-24 bg-white/5 rounded-full pointer-events-none"></div>
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md text-xs font-semibold text-blue-200 mb-2">
                <span>🎬 電影欣賞社</span>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>即時打卡通道</span>
            </div>
            <h1 class="text-2xl font-black tracking-tight">課堂實時簽到</h1>
            <p class="text-xs text-blue-200/90 mt-1" id="liff-status">正在連線至 LINE 基地台...</p>
        </div>

        <!-- Form Section -->
        <div class="p-6 space-y-5" id="form-section">
            <div>
                <label for="student-id" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                    學生學號 (8 碼)
                </label>
                <div class="relative">
                    <input 
                        type="tel" 
                        id="student-id" 
                        maxlength="8" 
                        placeholder="請輸入學號，例：11401011" 
                        class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-lg font-black tracking-widest text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:bg-white focus:border-indigo-600 focus:outline-none transition-all shadow-inner"
                    >
                </div>
                <div class="flex items-center justify-between mt-2 px-1">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-500">
                        <input type="checkbox" id="remember-id" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                        <span>記住此學號 (下次免輸入)</span>
                    </label>
                    <span id="student-name-hint" class="text-xs font-bold text-indigo-600 truncate max-w-[150px]"></span>
                </div>
            </div>

            <div>
                <label for="otp-code" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                    前方大螢幕快閃口令 (4 碼)
                </label>
                <div class="relative">
                    <input 
                        type="tel" 
                        id="otp-code" 
                        maxlength="4" 
                        placeholder="0000" 
                        class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl font-black tracking-widest text-indigo-900 placeholder:text-slate-300 focus:bg-white focus:border-indigo-600 focus:outline-none transition-all shadow-inner uppercase"
                    >
                </div>
                <p class="text-[11px] text-slate-400 text-center mt-1.5">
                    💡 請抬頭查看投影幕上隨機變換的 4 位數驗證碼
                </p>
            </div>

            <!-- Feedback Message Banner -->
            <div id="status-msg" class="hidden p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all"></div>

            <!-- Submit Button -->
            <button 
                id="submit-btn" 
                onclick="handleCheckIn()" 
                class="w-full py-4 bg-gradient-to-r from-indigo-700 to-blue-700 hover:from-indigo-800 hover:to-blue-800 text-white font-extrabold text-base rounded-2xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2"
            >
                <span id="btn-text">確認簽到並回報 LINE</span>
                <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            </button>
        </div>

        <!-- Success Animation Overlay (Hidden initially) -->
        <div id="success-screen" class="hidden p-8 text-center flex-col items-center justify-center space-y-4">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl shadow-inner animate-check">
                ✓
            </div>
            <h2 class="text-2xl font-black text-slate-800">簽到成功！</h2>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 w-full text-left space-y-1.5 text-xs text-slate-600">
                <div class="flex justify-between"><span>學生姓名：</span><strong class="text-slate-900 font-bold" id="res-name">-</strong></div>
                <div class="flex justify-between"><span>學生學號：</span><strong class="text-slate-900 font-mono" id="res-id">-</strong></div>
                <div class="flex justify-between"><span>簽到時間：</span><strong class="text-slate-900" id="res-time">-</strong></div>
                <div class="flex justify-between"><span>對話框通知：</span><span class="text-emerald-600 font-bold" id="res-line-status">已同步回報</span></div>
            </div>
            <p class="text-xs text-slate-400">視窗即將自動關閉返回 LINE 聊天室...</p>
        </div>

        <!-- Footer Notice -->
        <div class="bg-slate-50 border-t border-slate-100 px-6 py-3.5 text-center">
            <p class="text-[11px] text-slate-400 font-medium">※ 一機限簽一組學號，系統已啟用設備指紋安全稽核</p>
        </div>
    </div>

    <script>
        // 🌟 核心參數配置（請依專案設定填入）
        const LIFF_ID = "2010768591-SwfwcK3q";
        const FIREBASE_DB_URL = "https://movie-76596-default-rtdb.asia-southeast1.firebasedatabase.app/";

        // 預設備用學生數據
        const defaultStudents = [
          {"id":"11401011","name":"李浩凱"},{"id":"11401014","name":"林士閎"},{"id":"11401024","name":"陳宥廷"},
          {"id":"11401025","name":"陳柏安"},{"id":"11401026","name":"陳韋勛"},{"id":"11401027","name":"陳楷霖"},
          {"id":"11401032","name":"劉諶叡"},{"id":"11402023","name":"許盛鈞"},{"id":"11402101","name":"林芝羽"},
          {"id":"11402103","name":"陳姿瑜"},{"id":"11402113","name":"邱羿翰"},{"id":"11404006","name":"王子維"},
          {"id":"11404009","name":"王鈞毅"},{"id":"11404010","name":"何俊廷"},{"id":"11404011","name":"吳彥霆"},
          {"id":"11404029","name":"陳昱傑"},{"id":"11404110","name":"周杰陽"},{"id":"11404112","name":"林和穎"},
          {"id":"11404113","name":"林柏安"},{"id":"11404115","name":"柯品均"},{"id":"11404117","name":"胡俊英"},
          {"id":"11404120","name":"張維哲"},{"id":"11404124","name":"陳庭翊"},{"id":"11404126","name":"黃禹翔"},
          {"id":"11404130","name":"鄭宇恩"},{"id":"11405011","name":"吳展旭"},{"id":"11405016","name":"林知炫"},
          {"id":"11405110","name":"江孟哲"},{"id":"11405114","name":"李泓儀"},{"id":"11405116","name":"林弘裕"},
          {"id":"11405120","name":"施劭儒"},{"id":"11405124","name":"陳一愷"},{"id":"11405127","name":"廖廷軒"},
          {"id":"11406031","name":"鄭可謙"},{"id":"11406106","name":"劉軒辰"},{"id":"11406107","name":"鄭恩旻"},
          {"id":"11406110","name":"王子豪"},{"id":"11406117","name":"林小平"},{"id":"11406122","name":"勒卡而・旮巴Lkal・Kapa"},
          {"id":"11407022","name":"曾泓維"},{"id":"11407024","name":"黃佑恩"},{"id":"11407025","name":"黃靖捷"},
          {"id":"11407106","name":"林宥安"},{"id":"11407107","name":"林桓安"},{"id":"11407108","name":"林泰澄"},
          {"id":"11407118","name":"陳雋淇"},{"id":"11407121","name":"黃澤楷"},{"id":"11407124","name":"葉宥宏"},
          {"id":"11407126","name":"蔡承勳"},{"id":"11407130","name":"蕭禎賢"},{"id":"11408006","name":"朱昱安"},
          {"id":"11408008","name":"吳岱霖"},{"id":"11408016","name":"區少升"},{"id":"11408020","name":"陳品諺"},
          {"id":"11408026","name":"黃稚鈞"},{"id":"11408108","name":"林肯成"},{"id":"11408121","name":"彭暐瀚"},
          {"id":"11408122","name":"游俊恩"},{"id":"11408136","name":"魏丞宏"},{"id":"11409007","name":"周品曦"},
          {"id":"11409021","name":"陳秉鉉"},{"id":"11409022","name":"陳冠愷"},{"id":"11409029","name":"黃鈺淳"},
          {"id":"11409031","name":"黎家齊"},{"id":"11409104","name":"吳紘宇"},{"id":"11409108","name":"林佑勳"},
          {"id":"11409118","name":"陳柏廷"},{"id":"11409123","name":"勤正浩"},{"id":"11409124","name":"楊峻瑋"},
          {"id":"11409132","name":"鄭家佑"},{"id":"11410031","name":"劉威彥"},{"id":"11410119","name":"陳沅祥"},
          {"id":"11410127","name":"楊善閔"},{"id":"11410131","name":"謝孝霆"},{"id":"11410134","name":"蘇寅"},
          {"id":"11501001","name":"余明霖"}
        ];

        let database = null;
        let currentUserId = "";
        let currentStudents = [...defaultStudents];

        // 格式化當日 YYYY-MM-DD
        function getFormattedDate(d = new Date()) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // 初始化 Firebase
        try {
            firebase.initializeApp({ databaseURL: FIREBASE_DB_URL.trim() });
            database = firebase.database();
        } catch(e) {
            console.error("Firebase 初始化失敗:", e);
        }

        // 初始化 LIFF
        async function initializeLiff() {
            const statusEl = document.getElementById('liff-status');
            try {
                if (LIFF_ID && LIFF_ID !== "2010768591-SwfwcK3q") {
                    await liff.init({ liffId: LIFF_ID });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        currentUserId = profile.userId;
                        statusEl.innerText = `👤 認證身分：${profile.displayName}`;
                    } else {
                        liff.login();
                    }
                } else {
                    fallbackDeviceIdentity();
                }
            } catch (err) {
                console.warn("LIFF 載入失敗，降級為獨立模式:", err);
                fallbackDeviceIdentity();
            }
        }

        function fallbackDeviceIdentity() {
            let localDevId = localStorage.getItem('device_fingerprint');
            if (!localDevId) {
                localDevId = 'DEV_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('device_fingerprint', localDevId);
            }
            currentUserId = localDevId;
            document.getElementById('liff-status').innerText = "📡 已連線至社團安全基地台";
        }

        // 取得雲端最新學生名單
        async function syncCloudStudents() {
            if (!database) return;
            try {
                const snap = await database.ref('movie_club_settings/rawStudentsList').once('value');
                const raw = snap.val();
                if (raw && typeof raw === 'string') {
                    const parsed = [];
                    raw.split('\n').forEach(line => {
                        const parts = line.trim().split(/[\t,\s]+/);
                        if (parts.length >= 2) {
                            parsed.push({ id: parts[0].trim(), name: parts[1].trim() });
                        }
                    });
                    if (parsed.length > 0) {
                        currentStudents = parsed;
                    }
                }
            } catch(e) {
                console.warn("無法取得雲端名單，沿用預設名單", e);
            }
        }

        // 即時比對並提示學生姓名
        function bindStudentInputEvents() {
            const idInput = document.getElementById('student-id');
            const hintEl = document.getElementById('student-name-hint');
            
            // 讀取本地儲存學號
            const savedId = localStorage.getItem('movie_club_saved_id');
            if (savedId) {
                idInput.value = savedId;
                document.getElementById('remember-id').checked = true;
                const match = currentStudents.find(s => s.id === savedId);
                if (match) hintEl.innerText = `✓ ${match.name}`;
            }

            idInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (val.length === 8) {
                    const match = currentStudents.find(s => s.id === val);
                    if (match) {
                        hintEl.innerText = `✓ ${match.name}`;
                        hintEl.className = "text-xs font-bold text-emerald-600 truncate max-w-[150px]";
                    } else {
                        hintEl.innerText = "❌ 查無此學號";
                        hintEl.className = "text-xs font-bold text-rose-500 truncate max-w-[150px]";
                    }
                } else {
                    hintEl.innerText = "";
                }
            });
        }

        // 核心打卡與訊息推播作業
        async function handleCheckIn() {
            const idInput = document.getElementById('student-id');
            const otpInput = document.getElementById('otp-code');
            const rememberChk = document.getElementById('remember-id');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            const sid = idInput.value.trim();
            const otp = otpInput.value.replace(/\D/g, '').trim();

            if (!sid || sid.length !== 8) {
                showStatus("請輸入完整的 8 位數學生學號！", "error");
                idInput.focus();
                return;
            }

            if (!otp || otp.length !== 4) {
                showStatus("請輸入大螢幕上顯示的 4 位數快閃口令！", "error");
                otpInput.focus();
                return;
            }

            // 切換按鈕載入狀態
            submitBtn.disabled = true;
            btnText.innerText = "驗證核對中...";
            btnSpinner.classList.remove('hidden');

            try {
                // 1. 同步雲端名單並比對學號
                await syncCloudStudents();
                const student = currentStudents.find(s => s.id === sid);
                if (!student) {
                    showStatus(`❌ 簽到失敗：學號 [${sid}] 不在名單內，請核對輸入！`, "error");
                    resetButton();
                    return;
                }

                // 2. 獲取並比對動態驗證碼 (探測雙期與替代路徑)
                const [curSnap, prevSnap, altSnap] = await Promise.all([
                    database.ref('current_otp_code').once('value'),
                    database.ref('prev_otp_code').once('value'),
                    database.ref('movie_club_rollcall/current_code').once('value')
                ]);

                const cVal = curSnap.exists() ? String(curSnap.val()).trim() : "";
                const pVal = prevSnap.exists() ? String(prevSnap.val()).trim() : "";
                const aVal = altSnap.exists() ? String(altSnap.val()).trim() : "";
                const validOtps = [cVal, pVal, aVal].filter(x => x !== "");

                if (validOtps.length === 0) {
                    showStatus("⚠️ 驗證失敗：前方投影幕看板未開啟，請提醒老師開啟看板！", "error");
                    resetButton();
                    return;
                }

                if (!validOtps.includes(otp)) {
                    showStatus(`❌ 快閃口令錯誤或已失效！請重新查看前方大螢幕。`, "error");
                    otpInput.value = "";
                    otpInput.focus();
                    resetButton();
                    return;
                }

                // 3. 一機一號防代簽安全檢測
                const bindRef = database.ref(`movie_club_bindings/${currentUserId}`);
                const bindSnap = await bindRef.once('value');
                const boundId = bindSnap.val();

                if (boundId && String(boundId).trim() !== sid) {
                    showStatus(`❌ 代簽失敗：這部裝置已綁定學號 [${boundId}]，無法替他人簽到！`, "error");
                    resetButton();
                    return;
                } else if (!boundId) {
                    await bindRef.set(sid);
                }

                // 4. 寫入 Firebase 出席節點
                const todayStr = getFormattedDate();
                await database.ref(`movie_club_rollcall/${todayStr}/${sid}`).set(1);

                // 5. 處理記住學號
                if (rememberChk.checked) {
                    localStorage.setItem('movie_club_saved_id', sid);
                } else {
                    localStorage.removeItem('movie_club_saved_id');
                }

                // 6. 🚀 關鍵功能：在 LINE 對話框自動發送回覆訊息 (若在 LIFF 環境中)
                let messageSent = false;
                const nowTimeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

                if (window.liff && liff.isInClient && liff.isInClient()) {
                    try {
                        await liff.sendMessages([
                            {
                                type: "text",
                                text: `🎉【電影欣賞社】簽到完成！\n━━━━━━━━━━━━━━\n👤 學生姓名：${student.name}\n🆔 學生學號：${sid}\n📅 簽到日期：${todayStr}\n⏰ 打卡時間：${nowTimeStr}\n━━━━━━━━━━━━━━\n快閃安檢已通過，祝您觀影愉快！`
                            }
                        ]);
                        messageSent = true;
                    } catch (msgErr) {
                        console.warn("無法發送 LINE 對話訊息 (請確認 LIFF 是否開啟 chat_message.write 權限):", msgErr);
                    }
                }

                // 7. 切換至成功畫面並延遲關閉
                document.getElementById('form-section').classList.add('hidden');
                const successScreen = document.getElementById('success-screen');
                successScreen.classList.remove('hidden');
                successScreen.classList.add('flex');

                document.getElementById('res-name').innerText = student.name;
                document.getElementById('res-id').innerText = sid;
                document.getElementById('res-time').innerText = `${todayStr} ${nowTimeStr}`;
                document.getElementById('res-line-status').innerText = messageSent ? "已傳送至聊天室" : "已完成雲端打卡";

                setTimeout(() => {
                    if (window.liff && liff.isInClient && liff.isInClient()) {
                        liff.closeWindow();
                    }
                }, 2200);

            } catch (err) {
                console.error("簽到過程異常:", err);
                showStatus("⚠️ 網路通訊異常，請稍後再試一次！", "error");
                resetButton();
            }
        }

        function resetButton() {
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            submitBtn.disabled = false;
            btnText.innerText = "確認簽到並回報 LINE";
            btnSpinner.classList.add('hidden');
        }

        function showStatus(text, type) {
            const el = document.getElementById('status-msg');
            el.classList.remove('hidden');
            el.innerHTML = text;
            if (type === "error") {
                el.className = "p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all bg-rose-50 text-rose-700 border border-rose-200";
            } else {
                el.className = "p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all bg-emerald-50 text-emerald-700 border border-emerald-200";
            }
        }

        window.onload = async () => {
            await initializeLiff();
            await syncCloudStudents();
            bindStudentInputEvents();
        };
    </script>
</body>
</html>
