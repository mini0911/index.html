        body { 
            background: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: white;

            margin-bottom: 20px; 
        }
        .form-group { margin-bottom: 16px; }
        label { 
            display: block; 
            font-size: 14px; 
            font-weight: bold; 
            margin-bottom: 6px; 
            color: #333; 
        }
        input { 
            width: 100%; 
            padding: 14px; 
            font-size: 18px; 
            border: 2px solid #badcfa; 
            border-radius: 8px; 
            outline: none; 
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }
        input:focus { border-color: #2b4c7e; }
        .btn { 
            width: 100%; 
            background: #2b4c7e; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn:active { background: #1f3659; }
        .btn:disabled { background: #b0bec5; cursor: not-allowed; }
        .result-box { 
            margin-top: 15px; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            text-align: center; 
            font-size: 13px;
            display: none; 
            line-height: 1.5;
            word-break: break-all;
        }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>

        <div class="result-box" id="result-box"></div>
    </div>
