<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電影欣賞社</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebase Compatibility SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden relative transition-all duration-300">
        
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-white/5 rounded-full pointer-events-none"></div>
            <div class="absolute -left-6 -top-6 w-24 h-24 bg-white/5 rounded-full pointer-events-none"></div>
            
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md text-xs font-semibold text-blue-200 mb-2">
                <span>🎬 電影欣賞社</span>
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>即時打卡安檢</span>
            </div>
            <h1 class="text-2xl font-black tracking-tight">實時簽到系統</h1>
            <p class="text-xs text-blue-200/90 mt-1" id="liff-status">正在連線至認證伺服器...</p>
        </div>

        <!-- Check-in Form Body -->
        <div class="p-6 space-y-5" id="form-section">
            <div>
                <label for="student-id" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                    學生學號 (8 碼)
                </label>
                <input 
                    type="tel" 
                    id="student-id" 
                    maxlength="8" 
                    placeholder="例如：11401011" 
                    class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-xl font-black tracking-widest text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:bg-white focus:border-indigo-600 focus:outline-none transition-all shadow-inner"
                >
                <div class="flex items-center justify-between mt-2 px-1">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-500 select-none">
                        <input type="checkbox" id="remember-id" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                        <span>記住此學號 (下次免輸入)</span>
                    </label>
                    <span id="student-name-hint" class="text-xs font-bold truncate max-w-[150px]"></span>
                </div>
            </div>

            <div>
                <label for="otp-code" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                    大螢幕 4 位快閃口令
                </label>
                <input 
                    type="tel" 
                    id="otp-code" 
                    maxlength="4" 
                    placeholder="0000" 
                    class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl font-black tracking-widest text-indigo-950 placeholder:text-slate-300 focus:bg-white focus:border-indigo-600 focus:outline-none transition-all shadow-inner uppercase"
                >
                <p class="text-[11px] text-slate-400 text-center mt-1.5">
                    💡 請抬頭查看前方大螢幕上顯示的動態口令
                </p>
            </div>

            <!-- Feedback Notice -->
            <div id="status-msg" class="hidden p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed transition-all"></div>

            <!-- Submit Button -->
            <button 
                id="submit-btn" 
                onclick="executeCheckIn()" 
                class="w-full py-4 bg-gradient-to-r from-indigo-700 to-blue-700 hover:from-indigo-800 hover:to-blue-800 text-white font-extrabold text-base rounded-2xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2"
            >
                <span id="btn-text">確認簽到並接收 LINE 通知</span>
                <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            </button>
        </div>

        <!-- Success Result Overlay -->
        <div id="success-screen" class="hidden p-8 text-center flex-col items-center justify-center space-y-4">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl shadow-inner animate-pop">
                ✓
            </div>
            <h2 class="text-2xl font-black text-slate-800">簽到成功！</h2>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 w-full text-left space-y-2 text-xs text-slate-600">
                <div class="flex justify-between"><span>學生姓名：</span><strong class="text-slate-900 font-bold" id="res-name">-</strong></div>
                <div class="flex justify-between"><span>學生學號：</span><strong class="text-slate-900 font-mono" id="res-id">-</strong></div>
                <div class="flex justify-between"><span>簽到時間：</span><strong class="text-slate-900" id="res-time">-</strong></div>
                <div class="flex justify-between"><span>LINE 訊息通知：</span><span class="text-emerald-600 font-bold" id="res-notify-status">已同步發送</span></div>
            </div>
            <p class="text-xs text-slate-400">視窗即將自動關閉返回聊天室...</p>
        </div>

        <!-- Security Footer -->
        <div class="bg-slate-50 border-t border-slate-100 px-6 py-3.5 text-center">
            <p class="text-[11px] text-slate-400 font-medium">※ 一機限綁定簽到一組學號，嚴禁代簽</p>
        </div>
    </div>

    <script>
        // 🌟 核心參數設定
        const LIFF_ID = "2010768591-SwfwcK3q"; 
        const FIREBASE_DB_URL = "https://movie-76596-default-rtdb.asia-southeast1.firebasedatabase.app/";
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzf-cXjOr3neShtkf5tnMyTbOayb2xAL4FOzNnGu2Ts5Swamx1n8WHA24DO3d5x7A_H3w/exec";

        // 預
